# Capture cards and cameras. A capture card has no modes of its own (its HDMI source decides), so its profile holds
# the preferences camlink.py applies to whatever the card offers: the tallest picture up to the cap, then the
# cheapest format, never a fixed mode table.
schema = 1

[[device]]
id = "cam-link-4k"
class = "capture-card"
label = "Elgato Cam Link 4K"
summary = "UVC capture card; its audio is capture only and never a call microphone"
[device.match]
# 0067 is the revision both studio hosts report (recorded in tests/fixtures/hardware); 0066 is the first revision.
usb = ["0fd9:0067", "0fd9:0066"]
names = ["Cam Link 4K"]
[device.capture]
max_height = 1080
max_height_4k = 2160
formats = ["YUYV", "UYVY", "NV12", "YU12", "MJPG", "H264"]
microphone = false

[[device]]
id = "canon-eos-50d"
class = "camera"
label = "Canon EOS 50D"
summary = "Live view over USB through the gphoto2 bridge into the v4l2loopback camera"
[device.match]
usb = ["04a9:319b"]
names = ["Canon EOS 50D"]
