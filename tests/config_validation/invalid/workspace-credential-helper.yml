---
# The workspace credential helper switched on without the values it needs, and
# values that would not be safe in its shell script or /etc/gitconfig.
# expect: workspace_git_auth_helper_enabled is true, so workspace_git_host
# expect: empty: workspace_external_auth_provider (docs
# expect: workspace_git_host must be empty or a host name with an optional :port
# expect: got "https://***@git.example.org/group"
# expect: workspace_external_auth_provider and workspace_git_auth_username may use only letters
# expect: workspace_external_auth_binary must be a command name on PATH
# expect: workspace_login_env keys and workspace_login_env_unset entries must be environment variable names
# expect: got ["BAD-NAME", "1TOKEN"]
# expect: workspace_login_env values must be single-line strings or numbers
workstation_profile: workspace
workspace_git_auth_helper_enabled: true
workspace_git_host: https://researcher:SENTINEL-host-password@git.example.org/group
workspace_external_auth_provider: ""
workspace_git_auth_username: "o auth"
workspace_external_auth_binary: "coder; rm -rf ~"
workspace_login_env:
  "BAD-NAME": value
  GOOD_NAME: "two\nlines"
workspace_login_env_unset: ["1TOKEN"]
