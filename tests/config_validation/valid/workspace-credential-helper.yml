---
# A workspace with the opt-in credential helper configured completely
# (docs/workspace-providers.md). Placeholder values only.
workstation_profile: workspace
hardware_profile: generic
workspace_git_auth_helper_enabled: true
workspace_git_host: git.example.org:8443
workspace_external_auth_provider: primary-git
workspace_external_auth_binary: /usr/local/bin/coder
workspace_git_auth_username: oauth2
workspace_login_env:
  GITLAB_HOST: git.example.org
  WORKSPACE_TIMEOUT: 30
workspace_login_env_unset: [GITLAB_TOKEN]
