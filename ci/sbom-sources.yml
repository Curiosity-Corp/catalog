    declared_in: [roles/developer_workstation/tasks/hardware-drivers.yml]
    pinned: true

# URLs in the roles that nothing is installed from, each with the reason.
not_dependencies:
  - url: https://github.com/Curiosity-Corp/catalog.git
    reason: this collection's own repository (ansible_pull_repo)
  - url: http://openbox.org/3.4/rc
    reason: XML namespace of the Openbox configuration
  - url: https://example.org
    reason: placeholder kiosk start page
  - url: https://host.example.org/path
    reason: example value quoted in a configuration validation message (tasks/validate-config.yml, catalog#31)
  - url: https://coder.example.org
    reason: example value quoted in a configuration validation message (tasks/validate-config.yml, catalog#31)
  - url: https://portal.example.org
    reason: example value quoted in a configuration validation message (tasks/validate-config.yml, catalog#31)
  - url: https://jellyfin.example.org
    reason: example value quoted in a configuration validation message (tasks/validate-config.yml, catalog#31)
  - url: https://suite.example.org/catalog/v1/catalog.json
    reason: example value quoted in a configuration validation message (tasks/validate-config.yml, catalog#142)
  - url: https://watch.
    reason: site media links built from media_folder_web_domain
  - url: https://request.
    reason: site media links built from media_folder_web_domain
  - url: https://books.
    reason: site media links built from media_folder_web_domain
  - url: https://music.
    reason: site media links built from media_folder_web_domain
  - url: https://integrate.api.nvidia.com/v1
