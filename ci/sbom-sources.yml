---
# Where the roles install from: the runtime half of the release SBOM
# (catalog#21, docs/sbom.md). `catalog-tools sbom` turns every entry into a
# CycloneDX component and refuses to run while this file and the roles
# disagree:
#
#   - every http(s) URL in roles/*/{defaults,tasks,vars,handlers} must start
#     with an entry's `url`, `url_var` value, `keys` or `covers`, or with a
#     `not_dependencies` prefix;
#   - every package-manager module the tasks call must be named by an entry's
#     `modules`;
#   - and every entry must still match something (no stale entries).
#
# kind (what the SBOM calls it, property curiosity:component-kind):
#   runtime-package-source  a repository or registry packages are installed
#                           from (APT repository, Snap Store, npm, PyPI ...)
#   runtime-package         one artifact downloaded directly (release asset,
#                           wheel, model, git checkout)
#   external-installer      a vendor script or installer the role runs
#
# url: a literal URL prefix as written in the role ({{ ... }} cuts it off).
# reference_url: informational only (a registry the modules use by default).
# url_var / version_var / sha256_var: role default variables; the tool reads
# their values, so a version bump in the defaults reaches the SBOM unaided.
# pinned: true when the role checks a version or checksum; false when it
# takes whatever the vendor serves ("latest").

sources:
  # --- Distribution and package-manager registries --------------------------
  - name: distribution-apt-archive
    kind: runtime-package-source
    source: apt-repository
    description: The host distribution's own APT archive (Ubuntu or Debian).
    modules: [ansible.builtin.apt]
    declared_in: [roles/developer_workstation/tasks/packages.yml, roles/workstation_storage/tasks/main.yml]
    pinned: false
  - name: snap-store
    kind: runtime-package-source
    source: snap-store
    reference_url: https://snapcraft.io/store
    modules: [community.general.snap]
    declared_in: [roles/developer_workstation/tasks/slack-desktop.yml, roles/developer_workstation/tasks/repos.yml]
    pinned: false
  - name: npm-registry
    kind: runtime-package-source
    source: npm-registry
    reference_url: https://registry.npmjs.org/
    modules: [community.general.npm]
    declared_in: [roles/developer_workstation/tasks/node-packages.yml, roles/developer_workstation/tasks/ai-assistants.yml]
    pinned: false
  - name: pypi
    kind: runtime-package-source
    source: pypi
    reference_url: https://pypi.org/simple/
    modules: [community.general.pipx, ansible.builtin.pip]
    declared_in: [roles/developer_workstation/tasks/python-tools.yml, roles/developer_workstation/tasks/science-venv.yml]
    pinned: false
  - name: flathub
    kind: runtime-package-source
    source: flatpak-remote
    url_var: workstation_flatpak_flathub_url
    modules: [community.general.flatpak]
    declared_in: [roles/developer_workstation/tasks/flatpak.yml]
    pinned: false

