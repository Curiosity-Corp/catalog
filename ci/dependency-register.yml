---
# The dependency lifecycle and ownership register (catalog#51,
# docs/dependency-register.md): for every upstream the collection depends on,
# who maintains it, its licence, our owner role, how updates arrive and are
# verified, its support or end-of-life dates as read from the vendor's own page
# (support.evidence, support.checked), and the replacement plan.
#
# The list of dependencies is not curated here: `catalog-tools register check`
# reads it from ci/sbom-sources.yml, galaxy.yml, ci/requirements.{in,yml},
# apt_vendor_repos and latest_github_repositories, and fails when a declaration
# is missing from this file or an entry's `declarations` no longer match.
# `catalog-tools register alerts` lists abandoned, moved, ending and
# unverified dependencies and an overdue review; `--strict` (tag and scheduled
# pipelines) fails on any alert without an alert_tracked_in issue.
#
# verification: package-manager-signature | vendor-repository-signature |
#   vendor-signature | pinned-checksum | tls-only
# support.status: maintained | archived | moved | unmaintained | end-of-life
# Dates are YYYY-MM-DD, or YYYY-MM for "the end of that month" when the vendor
# publishes only a month.
reviewed: '2026-11-26'
review_interval_days: 31
warn_days: 180
owner_roles:
  role-maintainer: A Maintainer (GOVERNANCE.md) who reviews changes to the role that installs the dependency.
  ci-maintainer: A Maintainer (GOVERNANCE.md) who reviews CI and ci/ changes; Renovate proposes the bumps.
  release-approver: The Release approver (GOVERNANCE.md), who checks the register at release time.
entries:
  - name: distribution-apt-archive
    upstream: Canonical (Ubuntu) and the Debian project
    source: https://ubuntu.com/about/release-cycle
    declarations:
      source:distribution-apt-archive: ansible.builtin.apt
    licence: various (each package carries its own licence)
    licence_source: https://ubuntu.com/legal/intellectual-property-policy
    owner: role-maintainer
    update_channel: 'APT: the role''s scheduled update run (unattended upgrades or the update tag) installs
      the newest version the repository serves'
    verification: package-manager-signature
    security_critical: true
    support:
      status: maintained
      evidence: https://ubuntu.com/about/release-cycle
      checked: '2026-11-26'
      ends:
        - scope: Ubuntu 22.04 LTS standard security maintenance
          date: 2027-05
        - scope: Ubuntu 24.04 LTS standard security maintenance
          date: 2029-05
        - scope: Ubuntu 26.04 LTS standard security maintenance
          date: 2031-05
        - scope: Debian 12 full support (security team; LTS follows until 2028-06-30)
          date: '2026-07-11'
          evidence: https://www.debian.org/releases/bookworm/
        - scope: Debian 12 Long Term Support
          date: '2028-06-30'
          evidence: https://www.debian.org/releases/bookworm/
        - scope: Debian 13 full support (LTS follows until 2030-06-30)
          date: '2028-08-09'
          evidence: https://www.debian.org/releases/trixie/
    replacement: Move hosts to the next supported LTS before standard support ends (docs/compatibility.md
      lists the supported releases).
    alert_tracked_in: https://git.developerdojo.org/Curiosity-Corp/catalog/-/issues/171
  - name: snap-store
    upstream: Canonical
    source: https://snapcraft.io/store
    declarations:
      source:snap-store: https://snapcraft.io/store
    licence: 'n/a: a registry service; each snap carries its own licence'
    licence_source: https://snapcraft.io/store
    owner: role-maintainer
    update_channel: snapd refreshes installed snaps on its own schedule from the stable channel
    verification: package-manager-signature
    security_critical: false
    support:
      status: maintained
      evidence: https://snapcraft.io/docs/refresh-awareness
      checked: '2026-11-26'
    replacement: Install the vendor's APT package or Flatpak instead; each snap the role installs has
      one.
  - name: npm-registry
    upstream: npm, Inc. (GitHub)
    source: https://www.npmjs.com/
    declarations:
      source:npm-registry: https://registry.npmjs.org/
    licence: 'n/a: a registry service; each package carries its own licence'
    licence_source: https://docs.npmjs.com/policies/npm-license
    owner: role-maintainer
    update_channel: community.general.npm installs the latest published version on each run
    verification: tls-only
    security_critical: false
    support:
      status: maintained
      evidence: https://docs.npmjs.com/
      checked: '2026-11-26'
    replacement: Use each tool's standalone installer or distribution package.
