---
namespace: curiosity
name: workstation
version: 0.1.0
readme: README.md
authors:
  - Curiosity Research Corporation
description: >-
  Safe, idempotent Ansible automation for maintaining Linux workstations and
  research VMs so students and researchers can spend more time on their work.
license:
  - Apache-2.0
tags:
  - linux
  - workstation
  - desktop
  - research
  - science
  - security
  - updates
  - virtualization
repository: https://github.com/Curiosity-Corp/catalog
issues: https://github.com/Curiosity-Corp/catalog/issues
homepage: https://github.com/Curiosity-Corp/catalog
documentation: https://github.com/Curiosity-Corp/catalog#readme
dependencies:
  community.general: ">=12.0.0"
build_ignore:
  - .git
  - .gitlab
  - .github
  - .gitignore
  - .gitattributes
  - .editorconfig
  - .ansible-lint
  - .gitlab-ci.yml
  - .ansible
  - .ansible_async
  - .pytest_cache
  - __pycache__
  - .mypy_cache
  - .ci-venv
  - .research-profile
  - research-profile-report.md
  # config-validation CI job report and run logs (catalog#31), not collection content.
  - config-validation
  - docs/evidence
  # Unresolved provenance, left out of the artifact until resolved (catalog#48,
  # THIRD_PARTY.md): screenshots of third-party apps and a live camera frame.
  # No role task reads them.
  - roles/developer_workstation/files/streamstack/docs/evidence
  - tests
  - scripts
  - Makefile
  - "*.tar.gz"
  - collection.cdx.json
  - ci/schemas
  - .venv
  - tools
  - reference.generated.md
  - tools-fmt.patch
  - catalog-tools
  - platform-packages
  - evidence
  - .apt-probe
  # CI job artifacts the `collection` job downloads into its workspace; the
  # third_party scan found their logs inside the built tarball (catalog#48).
  - quickstart-check-preview
  - debian-quickstart
