# Optional host-local overrides for the example playbook.
#
# Keep machine names, internal DNS names, certificates, credentials, and
# personal identity data in /etc/ansible/local-vars.yml or another secret
# store. This tracked file intentionally contains no organization topology.
#
# Example:
# dev_user: researcher
# dev_user_home: /home/researcher
# workstation_profile: desktop
# custom_ca_certificates:
#   - name: lab-registry
#     src: /etc/ansible/private/lab-registry.crt
