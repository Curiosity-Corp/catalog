---
- name: Curiosity Computer - Developer Workstation
  hosts: localhost
  connection: local
  become: true
  # A failed task must not drop handlers that earlier tasks notified: the next
  # run sees those files unchanged and never notifies again, so for example a
  # DNS-over-TLS drop-in stayed written but never loaded by systemd-networkd.
  force_handlers: true
  roles:
    - developer_workstation
    - workstation_storage
  post_tasks:
    # Only a run that converged every role reaches this point.
    - name: Stamp a completed converge
      ansible.builtin.include_role:
        name: developer_workstation
        tasks_from: converge-stamp.yml
      when: workstation_converge_stamp_enabled | default(fleetd_enabled | default(false)) | bool
