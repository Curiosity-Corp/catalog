[package]
name = "catalog-tools"
version = "0.1.0"
description = "Tools for the curiosity.workstation Ansible collection: the variable and tag reference generator, the redacted diagnostic bundle and the release SBOM."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
regex = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_norway = "0.9.42"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
tempfile = "3.20"
