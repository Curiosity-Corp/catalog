---
# Types, choices and secret marking of the role's public variables
# (catalog#31). defaults/main.yml stays the source of every default; this file
# only says what shape a value must have, so it carries no defaults.
#
# Ansible checks this spec automatically before the role's first task, and
# tasks/validate-config.yml checks it again after /etc/ansible/local-vars.yml
# is loaded, then adds the rules a spec cannot express (URLs, paths, checksums
# and options that need each other). docs/configuration.md#validation explains
# the messages.
#
# Covered: every supported, experimental and private-hook variable of
# docs/reference.md, including the ones whose default is a template (listed
# last). authd_archive_distribution, fleetd_notation_url and
# fleetd_package_file are left out: their defaults need host facts, which the
# check runs without (tests/test_argument_specs.py NOT_IN_SPEC). Most internal
# variables are left out; the claude_native_* release settings are typed
# because an operator mirroring the release may override them.
# tests/test_argument_specs.py fails when a public variable has no entry.
#
# Retired variables (catalog#171) stay out of the spec: a host that still sets
# one gets only the role's "no longer used" warning, never a validation error.
#
# `no_log: true` marks a secret (docs/reference.md safety impact "secret"):
# Ansible prints $REDACTED$ instead of its value in every validation message.
# Only strings carry it; a boolean flag named like a secret holds no secret.
#
# Adding a public variable: add it here with its type (and choices when it is
# an enumeration, no_log when it is a secret) in the same change.
argument_specs:
