<!doctype html><meta charset=utf-8><title>StreamStack device check</title>
<body style="font:14px sans-serif;background:#111;color:#eee;margin:16px">
<h3 id=h>StreamStack device check</h3><video id=v autoplay muted playsinline width=640 height=360></video>
<pre id=log></pre>
<script>
window.result = null;
(async () => {
  const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
  const r = {ua: navigator.userAgent};
  try {
    const md = navigator.mediaDevices;
    // Labels stay hidden until one capture succeeds, so unlock them with audio first (the camera may be held).
    await md.getUserMedia({audio: true}).then(s => s.getTracks().forEach(t => t.stop())).catch(e => { r.unlock = String(e); });
    let all = await md.enumerateDevices();
    if (!all.some(d => d.kind === 'videoinput' && d.label)) {
      // Firefox hides camera labels until a camera capture has succeeded; the first camera it offers unlocks them.
      await md.getUserMedia({video: true}).then(s => s.getTracks().forEach(t => t.stop())).catch(e => { r.unlockVideo = String(e); });
      all = await md.enumerateDevices();
    }
    r.devices = all.map(d => d.kind + ': ' + d.label);
    r.hasCam = all.some(d => d.kind === 'videoinput' && d.label.includes('StreamStack Camera'));
    r.hasMic = all.some(d => d.kind === 'audioinput' && d.label.includes('StreamStack Mic'));
    const cam = all.find(d => d.kind === 'videoinput' && d.label.includes('StreamStack Camera'));
    const mic = all.find(d => d.kind === 'audioinput' && d.label.includes('StreamStack Mic'));
    const stream = await md.getUserMedia({
      video: Object.assign({width: 1280, height: 720}, cam ? {deviceId: {exact: cam.deviceId}} : {}),
      audio: mic ? {deviceId: {exact: mic.deviceId}, echoCancellation: false, noiseSuppression: false, autoGainControl: false} : true,
    });
    r.tracks = stream.getTracks().map(t => t.kind + ':' + t.label);
    r.videoSettings = stream.getVideoTracks()[0].getSettings();
    r.audioSettings = stream.getAudioTracks()[0].getSettings();
    const v = document.getElementById('v'); v.srcObject = stream;
    await new Promise(res => v.onloadeddata = res);
    await new Promise(res => setTimeout(res, 1500));
    const c = document.createElement('canvas'); c.width = 160; c.height = 90;
    const g = c.getContext('2d'); g.drawImage(v, 0, 0, 160, 90);
    const px = g.getImageData(0, 0, 160, 90).data; let sum = 0, sq = 0, n = px.length / 4;
    for (let i = 0; i < px.length; i += 4) { const y = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2]; sum += y; sq += y * y; }
    r.frame = {w: v.videoWidth, h: v.videoHeight, meanLuma: +(sum / n).toFixed(1), lumaStd: +Math.sqrt(sq / n - (sum / n) ** 2).toFixed(1)};
    const ac = new AudioContext(); await ac.resume();
    const an = ac.createAnalyser(); an.fftSize = 2048; ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks())).connect(an);
    const buf = new Float32Array(an.fftSize); let peak = 0, rmsSum = 0, k = 0;
    const end = performance.now() + 3000;
    while (performance.now() < end) {
      await new Promise(res => setTimeout(res, 100)); an.getFloatTimeDomainData(buf);
      let s = 0, p = 0; for (const x of buf) { s += x * x; p = Math.max(p, Math.abs(x)); }
      rmsSum += Math.sqrt(s / buf.length); peak = Math.max(peak, p); k++;
    }
    r.audio = {sampleRate: ac.sampleRate, meanRms: +(rmsSum / k).toFixed(6), peak: +peak.toFixed(5), digitalZero: peak === 0};
    r.ok = true;
    log(JSON.stringify(r, null, 1));
    document.getElementById('h').textContent = 'StreamStack Camera + StreamStack Mic: open';
  } catch (e) {
    r.ok = false; r.error = e.name + ': ' + e.message; log(JSON.stringify(r, null, 1));
    document.getElementById('h').textContent = 'getUserMedia failed: ' + r.error;
  }
  window.result = r;
  if (location.protocol === 'http:') {
    // Served by firefoxcheck.py: hand the result and the preview frame back to it.
    const c2 = document.createElement('canvas'); c2.width = 1280; c2.height = 720;
    try { c2.getContext('2d').drawImage(document.getElementById('v'), 0, 0, 1280, 720); r.png = c2.toDataURL('image/png'); } catch (e) { r.png = ''; }
    await fetch('/report', {method: 'POST', body: JSON.stringify(r)});
  }
})();
</script>
