---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: python:3.13-slim

stages:
  - test
  - e2e
  - security
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.venv:
  before_script:
    # The shared runner is non-root: tools go into a disposable virtualenv.
    - python -m venv .ci-venv
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
    - python -m pip install --upgrade pip

lint:
  extends: .venv
  stage: test
  script:
    - python -m pip install "ruff>=0.6"
    - ruff check src tests tools
    - ruff format --check src tests tools

test:
  extends: .venv
  stage: test
  parallel:
    matrix:
      - PYTHON_IMAGE: ["python:3.10-slim", "python:3.13-slim"]
  image: $PYTHON_IMAGE
  script:
    - python -m pip install -e ".[dev,auto,framing,bench]"
    # The real-backend framing tests need the face model; they skip, not fail, when the download is unreachable.
    - python -m streamstack framing --fetch || echo "face model not fetched; real-backend framing tests will skip"
    - python -m pytest --cov=streamstack --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Console browser tests against the demo rig. The Playwright image carries the browsers and runs non-root; it
# ships no python3-venv and an externally-managed Python, so tools go into the user site. The pip package must
# match the image tag exactly or the browser builds differ.
e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright/python:v1.64.1-noble
  variables:
    E2E_ARTIFACTS: $CI_PROJECT_DIR/e2e-artifacts
    E2E_TIMEOUT_SCALE: "3"
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  before_script:
    - python3 -m pip install --user -e ".[e2e]" "playwright==1.64.0"
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - python3 -m pytest tests/e2e --junitxml=e2e-report.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - e2e-artifacts/
    reports:
      junit: e2e-report.xml

audit:
  extends: .venv
  stage: security
  script:
    - python -m pip install pip-audit
    - python -m pip install ".[auto,framing]"
    - pip-audit --skip-editable

package:
  extends: .venv
  stage: package
  script:
    - python -m pip install build
    - python -m build
    - python -m pip install dist/*.whl
    - streamstack --version
    - streamstack call-settings >/dev/null
    - python -c "from streamstack.config import data_dir; assert (data_dir() / 'obs/scenes.json').is_file()"
    # the wheel must carry the Console frontend and its server must import from the installed copy
    - python -c "from streamstack.config import data_dir; d = data_dir() / 'console'; assert all((d / f).is_file() for f in ('index.html', 'app.js', 'pages/index.js', 'components/index.js'))"
    - python -c "import streamstack.console.server, streamstack.console.launcher; from streamstack.console.rig import Rig; r = Rig.demo(); r.start(); assert r.snapshot()['demo']; r.stop()"
    - cd dist && sha256sum * | tee SHA256SUMS
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
