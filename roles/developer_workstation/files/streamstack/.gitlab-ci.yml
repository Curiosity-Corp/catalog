# StreamStack CI: the org-standard launch-sequence python-package pipeline, plus StreamStack's own gates.
#
# The template (DroidOpsInc/launch-sequence `pipelines/python-package.yml`, pinned to a release tag; Renovate
# bumps it) owns the stages, the workflow rules and every assurance plane:
#
#   preflight        lint, test (below), changelog-check (MRs), release-verify (tags)
#   source-security  sast (semgrep + gitleaks; gitleaks blocks on every pipeline), e2e and e2e-lighting (below)
#   supply-chain     lockfile-verify (no runtime dependencies: asserted), dependency-scan, scorecard
#   build            python-build (wheel + sdist, dist/SHA256SUMS, twine check, tag == package version), package
#   supply-chain-vex python-sbom (CycloneDX of what the wheel installs, with the PYTHON_SBOM_EXTRAS extras)
#   artifact-security / policy-gate   python-vuln-scan (grype), python-license, pip-audit, test-py311
#   attest           python-sign (Notation + Azure Key Vault over the dist and SBOM checksums; main and tags)
#   artifact-promote python-publish (the project's PyPI registry; tags only; also the signed manifest,
#                    signature and SBOM into the Generic Package Registry)
#   release-create   release-notes (CHANGELOG section of the tag), release-assets, release (GitLab Release)
#   pipeline-attestation  in-toto statement over dist/SHA256SUMS
#
# The DeepFilterNet LADSPA plugin (issue #91, docs/audio-chain.md) is built from a pinned upstream release by
# BuildKit on the K8s runners (dfn-ladspa-image, recipe images/dfn-ladspa/: licence policy, CycloneDX SBOM, load-and-run
# smoke test), copied out of the image and published with its checksum to the Generic Package Registry
# (dfn-ladspa-package), then fetched back through the same path `streamstack chain install-plugin` uses and run
# (dfn-ladspa-verify). It runs on main when the recipe or the pin changes, never on merge requests: BuildKit dispatch
# needs the protected ci-dispatch runner.
#
# Release: `scripts/release.py prepare`, merge, then tag vX.Y.Z. See docs/release.md. The tag pipeline repeats
# every gate before anything is published. python-sign and release-evidence run on the ci-dispatch runner, which
# serves PROTECTED tags only: keep `v*` a protected tag pattern.
#
# Pipeline tiers (launch-sequence#145): the cheap gates (lint, test, sast, lockfile, e2e, package) run on merge
# request pipelines too; the heavy ones (build, SBOM, scans, signing) run on main and tags only.

include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: v0.2.14
    file:
      - '/pipelines/python-package.yml'
      # .build:buildkit for dfn-ladspa-image (python-package.yml has no image build).
      - '/jobs/build-buildkit.yml'

# A merge to main must never cancel the main pipeline still running for the previous merge. Otherwise, while
# merges land faster than a pipeline runs (CI is slow: infrastructure#639), main never finishes a pipeline,
# its last finished one stays red and every merge-train ship waits on a main that is green in fact. Main
# pipelines run to the end; merge request pipelines keep cancelling their superseded runs.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - when: always

variables:
  # A Gitaly 500 or a runner that cannot reach GitLab fails the fetch, not the code: retry it
  # (infrastructure#639). These attempts cover only source checkout, artifacts and caches.
  GET_SOURCES_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"
  RESTORE_CACHE_ATTEMPTS: "3"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # The release host is configuration, never code (streamstack.registry, scripts/install-release.sh): in a pipeline of
  # the project it is the server the pipeline runs on.
  STREAMSTACK_GITLAB_HOST: $CI_SERVER_HOST
  # gitleaks blocks on every pipeline, not only on tags: v0.0.18's tag failed on a finding that every merge request
  # pipeline had only warned about. A leak is cheaper to fix before the tag is cut.
  GITLEAKS_STRICT: "true"
  # --- launch-sequence python-package inputs ---
  PREFLIGHT_REQUIRED_TOOLS: "uv uvx python3"
  PREFLIGHT_COMMANDS: >-
    uvx --from "ruff>=0.6" ruff check src tests tools scripts &&
    uvx --from "ruff>=0.6" ruff format --check src tests tools scripts
  # The wheel has no runtime dependencies (the distribution provides python3-gi, ffmpeg), so
  # there is nothing to lock; this fails the day one is added without a lockfile policy.
  LOCKFILE_COMMANDS: >-
    python3 -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb'));
    assert d['project']['dependencies'] == [], 'runtime dependencies need a lockfile'"
  # Unit tests on the template's Python (3.13); test-py311 below covers the oldest supported Python.
  TEST_COMMANDS: |
    set -eu
    uv venv --quiet .ci-venv
    . .ci-venv/bin/activate
    uv pip install --quiet -e ".[dev,framing,bench,deck,whip,shortcuts,calendar]"
    # The real-backend framing tests need the face model; they skip, not fail, when the download is unreachable.
    python -m streamstack framing --fetch || echo "face model not fetched; real-backend framing tests will skip"
    python -m pytest --cov=streamstack --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  # The SBOM, the grype scan and the licence gate cover what a user installs with the extras.
  PYTHON_SBOM_EXTRAS: "framing whip shortcuts calendar"
  PYTHON_SBOM_MC_TYPE: "application"
  # The DeepFilterNet plugin package: version = upstream version + build revision. tests/test_dfn_ladspa_ci.py
  # keeps this equal to audiochain/plugin.py and images/dfn-ladspa/Dockerfile.
  DFN_LADSPA_VERSION: "0.5.6-1"
  DFN_LADSPA_IMAGE: "harbor.focuscell.org/apps/streamstack-dfn-ladspa"

# Lint and test only get their reports here; the template owns their image, stage and rules.
test:
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Cheap-tier rules for StreamStack's own jobs: merge request pipelines and the full tier (main, tags).
.rules-gate:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
    - !reference [.ls-tier:full, rules]

.venv:
  before_script:
    # The shared runner is non-root: tools go into a disposable virtualenv.
    - python -m venv .ci-venv
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
    - python -m pip install --upgrade pip

# The oldest supported Python (requires-python >= 3.11).
test-py311:
  extends: .venv
  stage: artifact-security
  needs: []
  image: python:3.11-slim
  interruptible: true
  rules: !reference [.rules-gate, rules]
  script:
    - python -m pip install -e ".[dev,framing,bench,deck,whip,stills,shortcuts]"
    - python -m streamstack framing --fetch || echo "face model not fetched; real-backend framing tests will skip"
    - python -m pytest --junitxml=report-py311.xml
  artifacts:
    when: always
    reports:
      junit: report-py311.xml

# Console browser tests against the demo rig. The Playwright image carries the browsers and runs non-root; it
# ships no python3-venv and an externally-managed Python, so tools go into the user site. The pip package must
# match the image tag exactly or the browser builds differ.
#
# Sharded (issue #172): the serial suite took 900-2100 s and, on runners with fsync stalls (infrastructure#639),
# hit the 3600 s job timeout. `parallel: 4` runs four jobs ("e2e 1/4".."e2e 4/4"); each collects the whole suite and
# keeps its duration-balanced quarter (tests/e2e/sharding.py reads CI_NODE_INDEX / CI_NODE_TOTAL and the per-test
# seconds in tests/e2e/timings.json; a test missing from that file still runs, at the median weight). Each shard
# writes its own e2e-report-N.xml and the test report merges them. tests/test_e2e_sharding.py proves every test is in
# exactly one shard. Refresh the weights when the suite changes much: take the JUnit files of the shards of one to
# three green pipelines (`glab api projects/2122/jobs/<id>/artifacts/e2e-report-N.xml`, or a pipeline's
# `.../pipelines/<id>/test_report`) and run `python3 scripts/e2e_timings.py <files> [::: <next run's files>]`.
# Nothing else `needs:` e2e by name; if one ever does, list the shards or use `needs: [{job: e2e, parallel: ...}]`.
e2e:
  stage: source-security
  needs: []
  parallel: 4
  image: mcr.microsoft.com/playwright/python:v1.64.1-noble
  interruptible: true
  rules: !reference [.rules-gate, rules]
  variables:
    E2E_ARTIFACTS: $CI_PROJECT_DIR/e2e-artifacts
    E2E_TIMEOUT_SCALE: "3"
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  before_script:
    - python3 -m pip install --user -e ".[e2e]" "playwright==1.64.0"
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - python3 -m pytest tests/e2e --junitxml="e2e-report-${CI_NODE_INDEX}.xml"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - e2e-artifacts/
    reports:
      junit: e2e-report-*.xml

# The lighting engine races a person's hand on a light, and the daylight schedule moves with the hour. This gate
# soaks both lighting e2e files three times at each of three simulated hours (night, noon, the evening transition),
# on the demo rig's pinned clock (scripts/e2e_lighting_soak.py), one job per hour. On merge requests it runs when
# anything it exercises changes; on main and tags always.
e2e-lighting:
  stage: source-security
  needs: []
  image: mcr.microsoft.com/playwright/python:v1.64.1-noble
  interruptible: true
  parallel:
    matrix:
      - SOAK_HOUR: ["03:30", "12:00", "18:30"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/streamstack/lightauto.py
        - src/streamstack/lightplan.py
        - src/streamstack/lighting.py
        - src/streamstack/director/daylight.py
        - src/streamstack/console/lighting.py
        - src/streamstack/console/lightauto.py
        - src/streamstack/data/console/core/actions.js
        - src/streamstack/data/console/pages/lighting.js
        - tests/e2e/conftest.py
        - tests/e2e/support.py
        - tests/e2e/test_page_lighting*.py
        - scripts/e2e_lighting_soak.py
        - .gitlab-ci.yml
      interruptible: true
    - !reference [.ls-tier:full, rules]
  variables:
    E2E_ARTIFACTS: $CI_PROJECT_DIR/e2e-artifacts
    E2E_TIMEOUT_SCALE: "3"
    E2E_BROWSERS: chromium
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  before_script:
    - python3 -m pip install --user -e ".[e2e]" "playwright==1.64.0"
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - python3 scripts/e2e_lighting_soak.py --hours "$SOAK_HOUR" --repeat 3
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - e2e-artifacts/

# A second advisory source beside grype (which scans the SBOM): the PyPA database over the installed extras.
pip-audit:
  extends: .venv
  stage: artifact-security
  needs: []
  image: python:3.13-slim
  interruptible: true
  rules: !reference [.rules-gate, rules]
  script:
    - python -m pip install pip-audit
    - python -m pip install ".[framing,whip]"
    - pip-audit --skip-editable

# What the wheel must carry and do once installed. It builds into smoke-dist/, never dist/: python-sign and
# python-publish download the artifacts of every earlier job and must find only python-build's files in dist/.
package:
  extends: .venv
  stage: build
  needs: []
  image: python:3.13-slim
  interruptible: true
  rules: !reference [.rules-gate, rules]
  script:
    - python -m pip install build
    - python -m build --outdir smoke-dist
    - python -m pip install smoke-dist/*.whl
    - streamstack --version
    - streamstack call-settings >/dev/null
    - python -c "from streamstack.config import data_dir; assert (data_dir() / 'presets').is_dir()"
    # the wheel must carry the Console frontend and its server must import from the installed copy
    - python -c "from streamstack.config import data_dir; d = data_dir() / 'console'; assert all((d / f).is_file() for f in ('index.html', 'app.js', 'pages/index.js', 'components/index.js'))"
    - python -c "import streamstack.console.server, streamstack.console.launcher; from streamstack.console.rig import Rig; r = Rig.demo(); r.start(); assert r.snapshot()['demo']; r.stop()"
    # the install's own self-check (version, packaged files, the four commands); the tray needs python3-gi, so it only warns here
    - streamstack verify-install

# =============================================================================
# DeepFilterNet LADSPA plugin (issue #91)
# =============================================================================

.dfn-ladspa-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        # Only what builds the plugin. plugin.py (it holds the client pin) and this file change on unrelated commits.
        - images/dfn-ladspa/**/*
    # A rebuild by hand (web or API pipeline on main), e.g. after a registry cleanup.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $DFN_LADSPA_REBUILD == "1"

# These three jobs are a rebuild/verify of a version that is already published and pinned in the client, so an
# outage of the base-image proxy (Harbor dockerhub-proxy answered 502 on pipeline 96222) or a differing rebuild must
# not turn main red: they are allowed to fail and show as warnings. Run by hand (DFN_LADSPA_REBUILD=1) to see them.
#
# BuildKit builds the pinned upstream source (sha256-checked), runs the licence policy and the smoke test inside the
# build, and attaches an SBOM and a Notation signature to the image like every launch-sequence image. A rust build with
# fat LTO needs more than the template's default pod.
dfn-ladspa-image:
  extends: .build:buildkit
  allow_failure: true
  stage: build
  tags: [ci-dispatch]
  needs: []
  interruptible: false
  variables:
    IMAGE_NAME: streamstack-dfn-ladspa
    HARBOR_PROJECT: apps
    CONTEXT_DIR: images/dfn-ladspa
    PUSH_LATEST: "false"
    BUILD_CPU_REQUEST: "2"
    BUILD_CPU_LIMIT: "8"
    BUILD_MEMORY_REQUEST: "4Gi"
    BUILD_MEMORY_LIMIT: "12Gi"
    BUILD_EPHEMERAL_STORAGE_REQUEST: "4Gi"
    BUILD_EPHEMERAL_STORAGE_LIMIT: "20Gi"
    BUILD_TIMEOUT: "3600"
  rules: !reference [.dfn-ladspa-rules, rules]

# The plugin, its checksum, SBOM and licence list go from the image into the project's Generic Package Registry as
# streamstack-ladspa/<version>. A published version is never overwritten: an already published version passes when it
# is the build the client pins in plugin.py and fails otherwise (raise the build revision in the Dockerfile, plugin.py
# and DFN_LADSPA_VERSION above). SHA256SUMS goes up
# last, so a package that has it is complete.
dfn-ladspa-package:
  stage: artifact-promote
  allow_failure: true
  needs:
    - job: dfn-ladspa-image
  image:
    name: ${DFN_LADSPA_IMAGE}:${CI_COMMIT_SHORT_SHA}
    entrypoint: [""]
  interruptible: false
  rules: !reference [.dfn-ladspa-rules, rules]
  script:
    - cd /opt/dfn-ladspa
    - sha256sum -c SHA256SUMS
    - cat BUILD-INFO.txt
    - BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/streamstack-ladspa/${DFN_LADSPA_VERSION}"
    - |
      FRESH="$(sed -n 's/^\([0-9a-f]\{64\}\)  libdeep_filter_ladspa\.so$/\1/p' SHA256SUMS)"
      PIN="$(sed -n 's/^PINNED_SHA256: str | None = "\([0-9a-f]\{64\}\)".*/\1/p' "${CI_PROJECT_DIR}/src/streamstack/audiochain/plugin.py")"
      echo "fresh build sha256: ${FRESH}"
      if curl -fsS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" -o /tmp/published.sums "${BASE}/SHA256SUMS"; then
        PUBLISHED="$(sed -n 's/^\([0-9a-f]\{64\}\)  libdeep_filter_ladspa\.so$/\1/p' /tmp/published.sums)"
        echo "published sha256:   ${PUBLISHED}"
        echo "client pin:         ${PIN:-none}"
        if [ -n "${PIN}" ] && [ "${PUBLISHED}" != "${PIN}" ]; then
          echo "streamstack-ladspa ${DFN_LADSPA_VERSION} is published, but not as the build the client pins. Never overwrite a published version: raise the build revision (Dockerfile, plugin.py, DFN_LADSPA_VERSION)." >&2
          exit 1
        fi
        if [ -z "${PIN}" ] && [ "${PUBLISHED}" != "${FRESH}" ]; then
          echo "streamstack-ladspa ${DFN_LADSPA_VERSION} is published with different bytes and the client pins none. Raise the build revision." >&2
          exit 1
        fi
        [ "${PUBLISHED}" = "${FRESH}" ] && echo "The fresh build is byte-identical (reproducible)." || echo "The fresh build differs from the published one; the published version stays (it is what the client pins)."
        exit 0
      fi
    - |
      for f in libdeep_filter_ladspa.so libdeep_filter_ladspa.cdx.json LICENSES.json BUILD-INFO.txt LICENSE LICENSE-MIT LICENSE-APACHE SHA256SUMS; do
        curl -fsS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${BASE}/${f}"; echo
      done
    - echo "published ${BASE}/libdeep_filter_ladspa.so"
    - mkdir -p "${CI_PROJECT_DIR}/dfn-ladspa" && cp -r /opt/dfn-ladspa/. "${CI_PROJECT_DIR}/dfn-ladspa/"
  artifacts:
    paths:
      - dfn-ladspa/
    expire_in: 90 days

# The install path, end to end, on what was just published: fetch with the job token through
# audiochain/plugin.py (checksum, ELF and label checks), then load and run the installed file.
dfn-ladspa-verify:
  stage: artifact-promote
  allow_failure: true
  needs:
    - job: dfn-ladspa-package
      artifacts: false
  image: python:3.13-slim
  interruptible: false
  rules: !reference [.dfn-ladspa-rules, rules]
  variables:
    PYTHONPATH: src
    STREAMSTACK_GITLAB_HOST: $CI_SERVER_HOST
    STREAMSTACK_PROJECT_ID: $CI_PROJECT_ID
  script:
    - python -c "from pathlib import Path; from streamstack.audiochain import plugin; print(plugin.install_deepfilternet(dest=Path('installed')))"
    - python images/dfn-ladspa/smoke.py installed/libdeep_filter_ladspa.so

# =============================================================================
# The Debian package and the signed apt repository (issues #99, #101)
# =============================================================================
#
#   deb-build    (build)           scripts/build_deb.py: a reproducible .deb from `make install`, its provenance
#                                  statement (in-toto, SLSA v1) and DEB-SHA256SUMS; smoke-runs the extracted launcher;
#                                  runs tests/test_apt_repo.py with the real apt-get (signature, tamper, update, rollback)
#   apt-index    (supply-chain-vex) pulls every published .deb, adds this build, writes Packages and Release
#   deb-sign     (attest)          a Kubernetes Job (scripts/ci/deb-sign.sh): Notation over DEB-SHA256SUMS and the
#                                  OpenPGP repository key from Key Vault over Release (InRelease, Release.gpg)
#   apt-publish  (artifact-promote, tags) verifies the whole repository the way apt does, then publishes it to the
#                                  Generic Package Registry package streamstack-apt/stable and the package files to
#                                  streamstack-release/<version>
#
# deb-sign is a warning on main until it has been seen green there (it needs the ci-dispatch runner and Key Vault); on
# a tag it is required, because a release without its signatures must not be published.

.deb-full-rules:
  rules:
    - !reference [.ls-tier:full, rules]

deb-build:
  extends: .venv
  stage: build
  needs: []
  # bookworm, not the default trixie: Debian 13 verifies apt signatures with sqv and ships no gpgv, which is what the
  # Ubuntu and Debian 12 hosts this repository serves use; the tests need the real gpgv and apt-get (REQUIRE_APT_TOOLS)
  image: python:3.13-bookworm
  interruptible: true
  rules: !reference [.rules-gate, rules]
  variables:
    REQUIRE_APT_TOOLS: "1"
  script:
    - python scripts/build_deb.py --out deb-dist
    - dpkg-deb --info deb-dist/streamstack_*_all.deb
    # the whole listing, never `| head`: an early-closed pipe kills dpkg-deb under pipefail
    - dpkg-deb --contents deb-dist/streamstack_*_all.deb > deb-dist/contents.txt
    - wc -l deb-dist/contents.txt
    # the package must carry a working launcher: extract it (no root needed) and run it
    - dpkg-deb --extract deb-dist/streamstack_*_all.deb deb-root
    - deb-root/usr/bin/streamstack --version
    - python scripts/deb_provenance.py deb-dist/DEB-SHA256SUMS > deb-dist/deb-provenance.intoto.json
    # the manifest Notation signs covers the package and where it came from
    - (cd deb-dist && sha256sum deb-provenance.intoto.json >> DEB-SHA256SUMS && sha256sum -c DEB-SHA256SUMS)
    - python -m pip install pytest
    # tests/conftest.py imports the package, which this job does not install: run from the source tree
    - PYTHONPATH=src python -m pytest tests/test_apt_repo.py -q --junitxml=report-apt.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - deb-dist/
    reports:
      junit: report-apt.xml

apt-index:
  stage: supply-chain-vex
  needs:
    - job: deb-build
      artifacts: true
  image: python:3.13
  interruptible: true
  rules: !reference [.deb-full-rules, rules]
  script:
    # every published release stays in the repository (that is what makes a rollback possible), then this build joins
    - python scripts/apt_repo.py pull apt-repo
    - cp deb-dist/streamstack_*_all.deb apt-repo/
    - python scripts/apt_repo.py index apt-repo
    - ls -l apt-repo
  artifacts:
    expire_in: 14 days
    paths:
      - apt-repo/

deb-sign:
  stage: attest
  tags: [ci-dispatch] # calls the Kubernetes API: only the ci-dispatcher runner serves it
  timeout: 30m
  interruptible: false
  image: ${IMAGE_REGISTRY}/dockerhub-proxy/alpine/k8s:1.31.13
  needs:
    - job: deb-build
      artifacts: true
    - job: apt-index
      artifacts: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      allow_failure: true
  script:
    - sh scripts/ci/deb-sign.sh deb-dist/DEB-SHA256SUMS apt-repo/Release deb-signed
  artifacts:
    expire_in: 14 days
    paths:
      - deb-signed/

apt-publish:
  stage: artifact-promote
  needs:
    - job: deb-build
      artifacts: true
    - job: apt-index
      artifacts: true
    - job: deb-sign
      artifacts: true
  # bookworm, like deb-build: `apt_repo.py verify` needs gpgv, which the trixie-based python:3.13 image lacks
  image: python:3.13-bookworm
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cp deb-signed/InRelease deb-signed/Release.gpg apt-repo/
    # what apt will check, checked before anything is uploaded
    - python scripts/apt_repo.py verify apt-repo --keyring packaging/apt-public.asc
    - python scripts/apt_repo.py publish apt-repo --extra packaging/apt-public.asc
    # the package files of this release beside the wheel: one place, one URL scheme
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/streamstack-release/${VERSION}"
      python scripts/apt_repo.py put --base "${BASE}" "deb-dist/streamstack_${VERSION}_all.deb" deb-dist/DEB-SHA256SUMS deb-dist/deb-provenance.intoto.json deb-signed/DEB-SHA256SUMS.cose.sig

# =============================================================================
# Release (tag vX.Y.Z only)
# =============================================================================

# Merge requests do not edit CHANGELOG.md (every merge conflicted every other open MR): each adds a
# changelog.d/<issue>.<type>.md fragment that `scripts/release.py prepare` compiles. This job fails an MR that edits
# CHANGELOG.md, or changes src/ without a fragment, unless it carries the skip-changelog label or a Skip-Changelog
# trailer. It needs git history (the full python image, not the uv slim one); release commits are exempt.
changelog-check:
  stage: preflight
  needs: []
  image: python:3.13
  interruptible: true
  # a seconds-long check: a hung runner must fail fast and retry, not hold the merge train for an hour (#146)
  timeout: 10m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  variables:
    GIT_DEPTH: "100"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python3 scripts/release.py check-fragments

# Fail before building: the tag, streamstack.__version__ and CHANGELOG.md must agree, and the version must be a
# 0.0.x patch release unless the owner approved a minor (RELEASE_OWNER_APPROVED_MINOR=true on the pipeline).
#
# It needs git (`--require-main-ancestor` runs `git merge-base`), so it runs on the full python image like
# changelog-check, never on the uv slim ${PYTHON_IMAGE}, which has no git: that made v0.0.17's tag pipeline fail
# with "No such file or directory: 'git'" and burned the tag. tests/test_ci_release_verify.py guards it.
release-verify:
  stage: preflight
  needs: []
  image: python:3.13
  interruptible: false
  variables:
    GIT_DEPTH: "100"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python3 scripts/release.py check-tag "$CI_COMMIT_TAG" --require-main-ancestor

# The same gate before the tag exists. v0.0.14 (fragments left in the tree) and v0.0.17 (no git in the image) were
# only found by their tag pipelines, which cannot be re-run on the same tag. The release MR (title
# `chore(release): X.Y.Z`) runs release-verify's image and `check-tag` against its SOURCE head, the commit the tag
# will name (not the merged-result commit, which also carries fragments merged ahead of it). `--require-main-ancestor`
# cannot hold before the merge; the checkout itself proves git works, and the tag job repeats that check.
release-verify-mr:
  extends: release-verify
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore\(release\): [0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - 'VERSION="${CI_MERGE_REQUEST_TITLE#chore(release): }"'
    - git checkout --quiet --detach "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    - python3 scripts/release.py check-tag "v${VERSION}"

python-build:
  needs:
    - job: lint
      artifacts: false
    - job: test
      optional: true
      artifacts: false
    - job: release-verify
      optional: true
      artifacts: false

# The GitLab Release body is the tag's CHANGELOG section, not generated commit text.
git-cliff:
  rules:
    - when: never

release-notes:
  stage: release-create
  needs: []
  image: ${PYTHON_IMAGE}
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python3 scripts/release.py notes "$CI_COMMIT_TAG" | tee changelog-entry.md
  artifacts:
    paths:
      - changelog-entry.md

# The wheel and sdist (already on the PyPI registry) also go to the Generic Package Registry beside the signed
# manifest, signature and SBOM, so one place (and one download URL scheme) holds a whole release.
release-assets:
  extends: .python:base
  stage: release-create
  interruptible: false
  needs:
    - job: python-publish
      artifacts: false
    - job: python-build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python3 scripts/release.py upload-assets "$CI_COMMIT_TAG" --dist "${PYTHON_DIST_DIR}"

release:
  needs:
    - job: python-publish
      artifacts: false
    - job: release-notes
      artifacts: true
    - job: release-assets
      artifacts: false
    - job: apt-publish
      artifacts: false
  before_script:
    - !reference [.release:create, before_script]
    - |
      # One link per line: the files of this release in the Generic Package Registry.
      VERSION="${CI_COMMIT_TAG#v}"
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/streamstack-release/${VERSION}"
      RELEASE_ASSETS_LINKS="$(printf '%s\n' \
        "{\"name\":\"Wheel\",\"url\":\"${BASE}/streamstack-${VERSION}-py3-none-any.whl\",\"link_type\":\"package\"}" \
        "{\"name\":\"Source distribution\",\"url\":\"${BASE}/streamstack-${VERSION}.tar.gz\",\"link_type\":\"package\"}" \
        "{\"name\":\"SBOM (CycloneDX)\",\"url\":\"${BASE}/python-sbom.cdx.json\",\"link_type\":\"other\"}" \
        "{\"name\":\"Signed checksum manifest\",\"url\":\"${BASE}/RELEASE-SHA256SUMS\",\"link_type\":\"other\"}" \
        "{\"name\":\"Signature (Notation COSE)\",\"url\":\"${BASE}/RELEASE-SHA256SUMS.cose.sig\",\"link_type\":\"other\"}" \
        "{\"name\":\"Debian package\",\"url\":\"${BASE}/streamstack_${VERSION}_all.deb\",\"link_type\":\"package\"}" \
        "{\"name\":\"Package checksums and provenance (signed: DEB-SHA256SUMS.cose.sig)\",\"url\":\"${BASE}/DEB-SHA256SUMS\",\"link_type\":\"other\"}" \
        "{\"name\":\"Package provenance (in-toto)\",\"url\":\"${BASE}/deb-provenance.intoto.json\",\"link_type\":\"other\"}" \
        "{\"name\":\"Package signature (Notation COSE)\",\"url\":\"${BASE}/DEB-SHA256SUMS.cose.sig\",\"link_type\":\"other\"}" \
        "{\"name\":\"Package registry\",\"url\":\"${CI_PROJECT_URL}/-/packages\",\"link_type\":\"package\"}")"
      export RELEASE_ASSETS_LINKS
