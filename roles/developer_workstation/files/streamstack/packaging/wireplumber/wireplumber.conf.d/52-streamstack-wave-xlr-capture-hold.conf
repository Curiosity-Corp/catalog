# StreamStack: keep the Elgato Wave XLR (0fd9:007d) capture node always running (issue #126).
#
# The Wave XLR is a full-speed USB device whose capture and playback endpoints share one USB link. A reported Linux
# ordering bug: when a playback stream opens before the capture stream, the microphone delivers bit-exact zeros for
# the life of that capture stream (right sample count, no errors). Capture first, playback later is fine. Keeping the
# capture node always processing makes it the one that is already started. See docs/hardware/dm313red.md.
#
# Cost: the capture endpoint streams continuously (mono S24_3LE 48 kHz, about 144 kB/s of USB) and the device is never
# idle. The call privacy mute stays in the voice chain.
#
# This file is StreamStack's own (written from the three properties' documented meaning). It is matched by node name,
# touches nothing else, and leaves the workstation role's 50-curiosity-streamstack-alsa.conf alone: where both set
# node.pause-on-idle they agree (false).
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input\.usb-Elgato_Systems_Elgato_Wave_XLR_.*"
      }
    ]
    actions = {
      update-props = {
        node.always-process = true
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
