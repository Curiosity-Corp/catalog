# StreamStack virtual cameras (docs/adr/0004-virtual-camera-and-mic.md).
#   /dev/video42  "Canon EOS 50D"       the raw camera bridge (OBS and the engine read it)
#   /dev/video43  "StreamStack Camera"  the program picture Teams, Zoom and browsers read
# exclusive_caps=1  the node advertises Video Capture only while a producer feeds it; Chrome, Teams and Zoom skip
#                   nodes that claim capture and output at the same time
# card_label        the name every call app shows; fixed here, not by the producer
# video_nr          fixed numbers; StreamStack also finds the nodes by name, but docs and units say 42 and 43
# max_buffers=2     the engine's latency budget (docs/native-video-engine.md)
# Keep this line identical to the curiosity workstation role (ansible catalog) so the two never drift.
options v4l2loopback devices=2 video_nr=42,43 card_label="Canon EOS 50D,StreamStack Camera" exclusive_caps=1,1 max_buffers=2
