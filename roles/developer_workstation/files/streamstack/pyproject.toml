[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstack"
dynamic = ["version"]
description = "Camera, lighting and voice for Teams, Zoom and streams on Linux, with an optional Claude auto-cinematographer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Runtime pieces come from the distribution: python3-gi (tray), python3-websocket
# (auto mode), OBS Studio, Easy Effects, ffmpeg, v4l-utils, pulseaudio-utils.
dependencies = []
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.optional-dependencies]
auto = ["websocket-client>=1.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
e2e = ["pytest>=8", "playwright>=1.64"]

[project.scripts]
streamstack = "streamstack.cli:main"
streamstack-auto = "streamstack.auto:main"
streamstack-console = "streamstack.console.launcher:main"
streamstack-tray = "streamstack.tray:main"

[tool.setuptools.dynamic]
version = { attr = "streamstack.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamstack = ["data/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603", "S607",  # running local tools (ffmpeg, pactl, v4l2-ctl) is the point
    "S108",          # /tmp fallback for XDG_RUNTIME_DIR is intentional
    "S310",          # urllib to the fixed Anthropic API endpoint
    "S606",          # exec of ffplay and the bridge command replaces this process on purpose
    "SIM105",
    "B008",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["streamstack", "support"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
