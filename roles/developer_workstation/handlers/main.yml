---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Update font cache
  ansible.builtin.command: fc-cache -f
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload systemd-logind
  ansible.builtin.command: systemctl kill -s HUP systemd-logind
  changed_when: true

- name: Apply TLP power policy
  ansible.builtin.command: tlp start
  changed_when: true

- name: Regenerate Netplan after laptop wired-link policy changes
  ansible.builtin.command:
    argv:
      - netplan
      - generate
  changed_when: true
  notify: Reload systemd-networkd after laptop Netplan policy changes

- name: Reload systemd-networkd after laptop Netplan policy changes
  ansible.builtin.command:
    argv:
      - networkctl
      - reload
  changed_when: true

- name: Restart Sunshine user service
  ansible.builtin.shell: |
    set -e
    uid=$(id -u "{{ dev_user }}")
    runuser -u "{{ dev_user }}" -- env \
      XDG_RUNTIME_DIR="/run/user/$uid" \
      DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
      systemctl --user daemon-reload
    runuser -u "{{ dev_user }}" -- env \
      XDG_RUNTIME_DIR="/run/user/$uid" \
      DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
      systemctl --user restart sunshine.service
  changed_when: true
  failed_when: false

- name: Restart earlyoom
  ansible.builtin.systemd:
    name: earlyoom
    state: restarted

- name: Validate rsyslog configuration before restart
  ansible.builtin.command:
    argv: [rsyslogd, -N1]
  changed_when: false
  when: _curiosity_rsyslog_conf.stat.exists | default(false)
  listen: Restart rsyslog

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when: _curiosity_rsyslog_conf.stat.exists | default(false)
  listen: Restart rsyslog

- name: Restart logrotate timer
  ansible.builtin.systemd:
    name: logrotate.timer
    state: restarted

- name: Restart ziti-edge-tunnel
  ansible.builtin.systemd:
    name: "{{ ziti_service_name }}"
    state: restarted

- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Validate sshd configuration
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: true

- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Apply console tuning now
  ansible.builtin.systemd:
    name: curiosity-console-tuning.service
    state: restarted
  when: console_tuning_apply_now | default(true) | bool

- name: Save console-setup font cache
  # Copies the configured font into /etc/console-setup; touches no display.
  # A missing/failed setupcon must not fail the pull.
  ansible.builtin.command: setupcon --save-only
  changed_when: true
  failed_when: false
  when: _console_tuning_console_setup.stat.exists | default(false)

- name: Restart curiosity tmp-pressure timer
  ansible.builtin.systemd:
    name: curiosity-tmp-pressure.timer
    state: restarted
    daemon_reload: true
