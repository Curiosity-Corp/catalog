---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Update font cache
  ansible.builtin.command: fc-cache -f
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload systemd-logind
  ansible.builtin.command: systemctl kill -s HUP systemd-logind
  changed_when: true

- name: Apply TLP power policy
  ansible.builtin.command: tlp start
  changed_when: true

- name: Regenerate Netplan after laptop wired-link policy changes
  ansible.builtin.command:
    argv:
      - netplan
      - generate
  changed_when: true
  notify: Reload systemd-networkd after laptop Netplan policy changes

- name: Reload systemd-networkd after laptop Netplan policy changes
  ansible.builtin.command:
    argv:
      - networkctl
      - reload
  changed_when: true

- name: Restart Sunshine user service
  ansible.builtin.shell: |
    set -e
    uid=$(id -u "{{ dev_user }}")
    runuser -u "{{ dev_user }}" -- env \
      XDG_RUNTIME_DIR="/run/user/$uid" \
      DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
      systemctl --user daemon-reload
    runuser -u "{{ dev_user }}" -- env \
      XDG_RUNTIME_DIR="/run/user/$uid" \
      DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
      systemctl --user restart sunshine.service
  changed_when: true
  failed_when: false

- name: Restart earlyoom
  ansible.builtin.systemd:
    name: earlyoom
    state: restarted

- name: Validate rsyslog configuration before restart
  ansible.builtin.command:
    argv: [rsyslogd, -N1]
  changed_when: false
  when: _curiosity_rsyslog_conf.stat.exists | default(false)
  listen: Restart rsyslog

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when: _curiosity_rsyslog_conf.stat.exists | default(false)
  listen: Restart rsyslog

- name: Restart logrotate timer
  ansible.builtin.systemd:
    name: logrotate.timer
    state: restarted

# A tunnel restart closes every ssh session carried over Ziti, so it only runs
# while no ssh connection is live; otherwise it stays pending (see
# files/curiosity-ziti-safe-restart) and the pending task in ziti.yml applies it.
# The script module runs it from the role, so no host needs it installed first.
- name: Restart ziti-edge-tunnel
  ansible.builtin.script:
    cmd: curiosity-ziti-safe-restart
  environment:
    ZITI_SAFE_UNIT: "{{ ziti_service_name }}"
  register: _ziti_safe_restart
  changed_when: "'restarted' in _ziti_safe_restart.stdout"

- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Reload systemd-networkd
  ansible.builtin.command:
    argv:
      - networkctl
      - reload
  changed_when: true

- name: Restart avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    state: restarted

- name: Restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted

- name: Validate sshd configuration
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: true

- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Apply console tuning now
  ansible.builtin.systemd:
    name: curiosity-console-tuning.service
    state: restarted
  when: console_tuning_apply_now | default(true) | bool

- name: Save console-setup font cache
  # Copies the configured font into /etc/console-setup; touches no display.
  # A missing/failed setupcon must not fail the pull.
  ansible.builtin.command: setupcon --save-only
  changed_when: true
  failed_when: false
  when: _console_tuning_console_setup.stat.exists | default(false)

- name: Restart curiosity tmp-pressure timer
  ansible.builtin.systemd:
    name: curiosity-tmp-pressure.timer
    state: restarted
    daemon_reload: true

- name: Restart curiosity ziti-health timer
  ansible.builtin.systemd:
    name: curiosity-ziti-health.timer
    state: restarted
    daemon_reload: true

- name: Regenerate Netplan after managed WiFi change
  ansible.builtin.command:
    argv:
      - netplan
      - generate
  changed_when: true

# Applies a changed tmp_hygiene_nr_inodes to the running tmpfs; the drop-in
# makes it permanent. Only a tmpfs /tmp mount point is remounted.
- name: Check that /tmp is a tmpfs mount point before remounting
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, FSTYPE, --mountpoint, /tmp]
  register: _tmp_hygiene_tmp_fstype
  changed_when: false
  failed_when: _tmp_hygiene_tmp_fstype.rc not in [0, 1]
  listen: Remount /tmp with the managed inode cap

- name: Remount /tmp with the managed inode cap
  ansible.builtin.command:
    argv: [mount, -o, "remount,nr_inodes={{ _tmp_hygiene_nr_inodes }}", /tmp]
  register: _tmp_hygiene_remount
  changed_when: _tmp_hygiene_remount.rc == 0
  # tmpfs refuses a cap below the inodes already in use; the drop-in still
  # applies from the next boot, so report it instead of failing the pull.
  failed_when: false
  when: _tmp_hygiene_tmp_fstype.stdout | trim == 'tmpfs'
  listen: Remount /tmp with the managed inode cap

- name: Warn when the live /tmp inode cap could not be changed
  ansible.builtin.debug:
    msg: >-
      mount -o remount,nr_inodes={{ _tmp_hygiene_nr_inodes }} /tmp failed
      (rc {{ _tmp_hygiene_remount.rc }}: {{ _tmp_hygiene_remount.stderr | trim }});
      the new cap applies from the next boot.
  when:
    - _tmp_hygiene_remount is not skipped
    - _tmp_hygiene_remount.rc != 0
  listen: Remount /tmp with the managed inode cap

- name: Restart the display guard
  ansible.builtin.systemd:
    name: curiosity-display-guard.service
    state: restarted
    daemon_reload: true
