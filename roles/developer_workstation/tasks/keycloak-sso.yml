---
# =============================================================================
# Keycloak SSO via authd + authd-oidc broker
# =============================================================================
# Enables Keycloak OIDC login on Ubuntu workstations.
# Users sign in at GDM with their Keycloak email using device code flow.
# Replaces the sunset Entra ID (authd-msentraid) setup.
# =============================================================================

- name: Require Keycloak connection settings when SSO is enabled
  ansible.builtin.assert:
    that:
      - keycloak_host | default('') | length > 0
      - keycloak_realm | default('') | length > 0
      - keycloak_desktop_client_id | default('') | length > 0
    fail_msg: >-
      Set keycloak_host, keycloak_realm, and keycloak_desktop_client_id in
      host/group vars before enabling keycloak_sso_enabled.

- name: Configure authd archive
  ansible.builtin.include_tasks: authd-repo.yml

- name: Install authd
  ansible.builtin.apt:
    name: authd
    state: present
    update_cache: "{{ _authd_ppa.changed }}"

- name: Remove authd-msentraid snap (sunset)
  community.general.snap:
    name: authd-msentraid
    state: absent

- name: Check if authd-oidc snap is already installed
  ansible.builtin.command:
    argv:
      - snap
      - list
      - authd-oidc
  register: _authd_oidc_snap
  changed_when: false
  failed_when: _authd_oidc_snap.rc not in [0, 1]

- name: Install authd-oidc snap
  ansible.builtin.command:
    argv:
      - snap
      - install
      - authd-oidc
  when: _authd_oidc_snap.rc != 0
  changed_when: true

- name: Configure authd-oidc broker for Keycloak
  ansible.builtin.copy:
    dest: /var/snap/authd-oidc/current/broker.conf
    content: |
      [oidc]
      issuer = https://{{ keycloak_host }}/realms/{{ keycloak_realm }}
      client_id = {{ keycloak_desktop_client_id }}

      [users]
      home_base_dir = /home
      allowed_users = {{ keycloak_allowed_users }}
    owner: root
    group: root
    mode: "0644"
  register: _broker_conf

- name: Create authd broker discovery directory
  ansible.builtin.file:
    path: /etc/authd/brokers.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Register authd-oidc broker with authd
  ansible.builtin.copy:
    src: /snap/authd-oidc/current/conf/authd/oidc.conf
    dest: /etc/authd/brokers.d/oidc.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  register: _broker_registered

- name: Restart authd to discover OIDC broker
  ansible.builtin.systemd:
    name: authd
    state: restarted
  when: _broker_registered is changed or _broker_conf is changed

- name: Ensure authd service is enabled and running
  ansible.builtin.systemd:
    name: authd
    enabled: true
    state: started

- name: Restart authd-oidc broker  # noqa: no-handler
  ansible.builtin.command: snap restart authd-oidc
  when: _broker_conf is changed
  changed_when: true
