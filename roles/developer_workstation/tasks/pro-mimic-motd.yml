---
# =============================================================================
# Pro-free-mimic: MOTD security visibility (update notices + pull status)
# =============================================================================
# Logins should show (a) pending security updates via update-notifier,
# (b) the last ansible-pull convergence status, and (c) nothing from
# Canonical's motd-news feed (off by default — fleet logins do not phone
# home). Every MOTD helper exits 0 and degrades to silence when its inputs
# are missing so a failed status read can never break logins.
# =============================================================================

- name: Install update-notifier MOTD integration
  ansible.builtin.apt:
    name: update-notifier-common
    state: present

- name: Deploy ansible-pull status MOTD helper
  ansible.builtin.copy:
    dest: /etc/update-motd.d/98-curiosity-pull-status
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by Ansible — developer-workstation role (pro-free-mimic).
      # Shows the last ansible-pull convergence status at login. Never fails.
      STATUS_FILE=/var/lib/curiosity/ansible-pull-status.json
      if [ -r "$STATUS_FILE" ] && command -v python3 >/dev/null 2>&1; then
        python3 -c '
      import json, sys
      try:
          s = json.load(open("/var/lib/curiosity/ansible-pull-status.json"))
          print("Last ansible-pull: {} (profile {}/{}, reboot-required: {})".format(
              s.get("recorded_at", "unknown"),
              s.get("workstation_profile", "?"),
              s.get("hardware_profile", "?"),
              s.get("reboot_required", "?")))
      except Exception:
          pass
      ' 2>/dev/null || true
      fi
      exit 0

- name: Disable MOTD news feed by default
  ansible.builtin.lineinfile:
    path: /etc/default/motd-news
    regexp: '^ENABLED='
    line: "ENABLED={{ '1' if (pro_mimic_motd_news_enabled | default(false) | bool) else '0' }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
