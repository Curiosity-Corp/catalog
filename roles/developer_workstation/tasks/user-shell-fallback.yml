---
# =============================================================================
# Shell RC fallback (pre-chezmoi)
# =============================================================================
# Populates .bashrc / .zshrc / .bash_aliases for users who have not opted in
# to chezmoi-managed dotfiles. Included only when user_dotfiles_repo is
# empty — when a dotfiles repo is configured, chezmoi owns these files.
#
# A user's external dotfiles repository may provide equivalent content; keep
# this fallback useful and self-contained for first-time installations.
# =============================================================================

# -----------------------------------------------------------------------------
# Ensure dotfiles exist before any lineinfile/blockinfile tasks run.
# On fresh installs the user may be created without skel content (e.g.
# useradd --no-create-home, or home created before skel was applied).
# Seed .bashrc from /etc/skel/.bashrc so it starts with distro defaults;
# touch .zshrc if absent so Oh My Zsh tasks don't abort on a missing file.
# Both tasks are idempotent: they are no-ops when the file already exists.
# -----------------------------------------------------------------------------
- name: Seed .bashrc from /etc/skel if absent
  ansible.builtin.copy:
    src: /etc/skel/.bashrc
    dest: "{{ dev_user_home }}/.bashrc"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    force: false

- name: Ensure .zshrc exists for shell-fallback tasks
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.zshrc"
    state: touch
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Disable Oh My Zsh theme (using starship instead)
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    regexp: '^ZSH_THEME='
    line: 'ZSH_THEME=""'

- name: Configure Oh My Zsh plugins
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    regexp: '^plugins=\('
    line: 'plugins=(git kubectl helm terraform aws npm node rust golang zsh-autosuggestions zsh-syntax-highlighting)'

# --- fzf shell integration (keybindings + completion) ---
- name: Add fzf keybindings to .bashrc (Ctrl+R history, Ctrl+T file finder)
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - fzf"
    block: |
      [ -f /usr/share/doc/fzf/examples/key-bindings.bash ] && source /usr/share/doc/fzf/examples/key-bindings.bash
      [ -f /usr/share/doc/fzf/examples/completion.bash ] && source /usr/share/doc/fzf/examples/completion.bash
      export FZF_DEFAULT_OPTS='--height 40% --layout=reverse --border'

- name: Add fzf keybindings to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED - fzf"
    block: |
      [ -f /usr/share/doc/fzf/examples/key-bindings.zsh ] && source /usr/share/doc/fzf/examples/key-bindings.zsh
      [ -f /usr/share/doc/fzf/examples/completion.zsh ] && source /usr/share/doc/fzf/examples/completion.zsh
      export FZF_DEFAULT_OPTS='--height 40% --layout=reverse --border'

# --- Starship prompt ---
- name: Add starship init to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.bashrc"
    line: 'eval "$(starship init bash)"'
    regexp: 'starship init bash'
    create: true
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: '0644'

- name: Add starship init to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    line: 'eval "$(starship init zsh)"'
    regexp: 'starship init zsh'
    create: true
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: '0644'

# --- Direnv hooks ---
- name: Add direnv hook to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.bashrc"
    line: 'eval "$(direnv hook bash)"'
    regexp: 'direnv hook bash'

- name: Add direnv hook to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    line: 'eval "$(direnv hook zsh)"'
    regexp: 'direnv hook zsh'

# --- Zoxide ---
- name: Add zoxide init to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.bashrc"
    line: 'eval "$(zoxide init bash)"'
    regexp: 'zoxide init bash'

- name: Add zoxide init to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    line: 'eval "$(zoxide init zsh)"'
    regexp: 'zoxide init zsh'

# --- PATH additions ---
- name: Add PATH additions to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.bashrc"
    line: 'export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/go/bin:$HOME/.krew/bin:/usr/local/go/bin:$PATH"'
    regexp: 'krew/bin'

- name: Add PATH additions to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    line: 'export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/go/bin:$HOME/.krew/bin:/usr/local/go/bin:$PATH"'
    regexp: 'krew/bin'

# --- SOPS ---
- name: Set SOPS_AGE_KEY_FILE in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.bashrc"
    line: 'export SOPS_AGE_KEY_FILE="$HOME/.keys/age.key"'
    regexp: '^export SOPS_AGE_KEY_FILE='

- name: Set SOPS_AGE_KEY_FILE in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    line: 'export SOPS_AGE_KEY_FILE="$HOME/.keys/age.key"'
    regexp: '^export SOPS_AGE_KEY_FILE='

# --- Editor ---
- name: Set EDITOR in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.bashrc"
    line: 'export EDITOR="{{ preferred_editor }}"'
    regexp: '^export EDITOR='

- name: Set EDITOR in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.zshrc"
    line: 'export EDITOR="{{ preferred_editor }}"'
    regexp: '^export EDITOR='

# --- Aliases file ---
- name: Create comprehensive .bash_aliases
  ansible.builtin.copy:
    content: |
      # =============================================================================
      # Developer Workstation Aliases
      # =============================================================================
      # Managed by Ansible - local changes will be overwritten
      # =============================================================================

      # --- Kubernetes aliases ---
      alias k='kubectl'
      alias kx='kubectx'
      alias kn='kubens'
      alias kgp='kubectl get pods'
      alias kgpa='kubectl get pods -A'
      alias kgd='kubectl get deployments'
      alias kgs='kubectl get services'
      alias kgn='kubectl get nodes'
      alias kgi='kubectl get ingress'
      alias kgns='kubectl get namespaces'
      alias kgcm='kubectl get configmaps'
      alias kgsec='kubectl get secrets'
      alias kgpv='kubectl get pv'
      alias kgpvc='kubectl get pvc'
      alias kgsc='kubectl get storageclass'
      alias kge='kubectl get events --sort-by=.lastTimestamp'
      alias kdp='kubectl describe pod'
      alias kdd='kubectl describe deployment'
      alias kds='kubectl describe service'
      alias kdn='kubectl describe node'
      alias kl='kubectl logs'
      alias klf='kubectl logs -f'
      alias kex='kubectl exec -it'
      alias kaf='kubectl apply -f'
      alias kdf='kubectl delete -f'
      alias kak='kubectl apply -k'
      alias kdk='kubectl delete -k'
      alias ktop='kubectl top pods'
      alias ktopn='kubectl top nodes'
      alias kctx='kubectl config current-context'
      alias kns='kubectl config view --minify --output jsonpath="{..namespace}"'
      alias krew='kubectl krew'

      # --- Git aliases ---
      alias g='git'
      alias gs='git status'
      alias ga='git add'
      alias gaa='git add -A'
      alias gc='git commit'
      alias gcm='git commit -m'
      alias gca='git commit --amend'
      alias gp='git push'
      alias gpf='git push --force-with-lease'
      alias gpl='git pull'
      alias gf='git fetch'
      alias gfa='git fetch --all'
      alias gb='git branch'
      alias gba='git branch -a'
      alias gco='git checkout'
      alias gcb='git checkout -b'
      alias gsw='git switch'
      alias gswc='git switch -c'
      alias gd='git diff'
      alias gds='git diff --staged'
      alias gl='git log --oneline'
      alias gla='git log --oneline --all --graph'
      alias glg='git log --graph --pretty=format:"%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset" --abbrev-commit'
      alias gst='git stash'
      alias gstp='git stash pop'
      alias gstl='git stash list'
      alias grb='git rebase'
      alias grbi='git rebase -i'
      alias gm='git merge'
      alias gcp='git cherry-pick'
      alias grs='git reset'
      alias grsh='git reset --hard'
      alias gclean='git clean -fd'

      # --- Infrastructure aliases ---
      alias tf='terraform'
      alias tfi='terraform init'
      alias tfp='terraform plan'
      alias tfa='terraform apply'
      alias tfd='terraform destroy'
      alias tfv='terraform validate'
      alias tfo='terraform output'
      alias tfs='terraform state'
      alias pk='packer'
      alias ans='ansible'
      alias ansp='ansible-playbook'

      # --- Containers (podman as docker drop-in) ---
      alias docker='podman'
      alias docker-compose='podman compose'

      # --- Modern replacements ---
      # NOTE: Do not use 'alias cmd=replacement 2>/dev/null || command cmd'
      # pattern. Bash aliases are simple text substitution — arguments only
      # attach to the LAST command in the chain, not the first. This causes
      # 'cat file' to run 'bat --paging=never' with NO file arg (hangs on
      # stdin) then falls through to 'command cat file'. Use plain aliases
      # since these tools are installed by this role.
      alias cat='bat --paging=never'
      alias ls='eza --icons'
      alias ll='eza -alh --icons'
      alias la='eza -a --icons'
      alias lt='eza --tree --icons'
      alias grep='grep --color=auto'
      alias diff='delta'
      alias du='dust'
      alias df='duf'
      alias top='btop'

      # --- Network/system aliases ---
      alias ports='ss -tlnp'
      alias myip='curl -s ifconfig.me'
      alias localip='hostname -I | awk "{print \$1}"'
      alias ping='ping -c 5'
      alias speedtest='curl -s https://raw.githubusercontent.com/sivel/speedtest-cli/master/speedtest.py | python3 -'
      alias weather='curl wttr.in'
      alias h='history'
      alias hg='history | grep'
      alias j='jobs -l'
      alias path='echo $PATH | tr ":" "\n"'
      alias now='date +"%Y-%m-%d %H:%M:%S"'
      alias week='date +%V'
      alias reload='source ~/.bashrc'
      alias cls='clear'
      alias ..='cd ..'
      alias ...='cd ../..'
      alias ....='cd ../../..'

      # --- File operations ---
      alias cp='cp -iv'
      alias mv='mv -iv'
      alias mkdir='mkdir -pv'
      alias rm='rm -Iv'
      alias chmod='chmod -v'
      alias chown='chown -v'
    dest: "{{ dev_user_home }}/.bash_aliases"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: '0644'

# --- nvm shell init ---
- name: Add nvm init to .bashrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - nvm"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

- name: Add nvm init to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED - nvm"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

# --- pyenv shell init ---
- name: Add pyenv init to .bashrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - pyenv"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      [[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"

- name: Add pyenv init to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED - pyenv"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      [[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"

# --- SDKMAN shell init ---
- name: Add SDKMAN init to .bashrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - sdkman"
    block: |
      export SDKMAN_DIR="$HOME/.sdkman"
      [[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && source "$SDKMAN_DIR/bin/sdkman-init.sh"

- name: Add SDKMAN init to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED - sdkman"
    block: |
      export SDKMAN_DIR="$HOME/.sdkman"
      [[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && source "$SDKMAN_DIR/bin/sdkman-init.sh"

# --- Source aliases (AFTER tool inits) ---
# Aliases must be sourced after nvm/pyenv/sdkman because alias cat='bat ...'
# causes sdkman-init.sh's `cat FILE` to invoke bat in a PTY subshell, which
# can hang. We use a blockinfile to guarantee correct placement.
- name: Remove default Ubuntu .bash_aliases source block (moved after tool inits)
  ansible.builtin.replace:
    path: "{{ dev_user_home }}/.bashrc"
    regexp: '^if \[ -f ~/\.bash_aliases \]; then\n.*bash_aliases.*\nfi\n?'
    replace: ''

- name: Source .bash_aliases after tool inits in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - aliases"
    insertafter: "END ANSIBLE MANAGED - sdkman"
    block: |
      [ -f ~/.bash_aliases ] && source ~/.bash_aliases

# --- Fix ownership of role-managed files ---
- name: Fix ownership of role-managed dotfiles
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
  loop:
    - "{{ dev_user_home }}/.bashrc"
    - "{{ dev_user_home }}/.zshrc"
    - "{{ dev_user_home }}/.bash_aliases"
  failed_when: false
