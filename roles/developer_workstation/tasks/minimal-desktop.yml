---
# =============================================================================
# Minimal Desktop (Openbox + LightDM + Firefox)
# =============================================================================
# Lightweight GUI environment for machines that only need a browser and
# terminal. Replaces GNOME/GDM with Openbox/LightDM, picom compositor,
# tint2 panel, dunst notifications, and rofi launcher.
#
# Enable with: -e minimal_desktop_enabled=true
# Mutually exclusive with display_config_enabled (GDM/GNOME).
# =============================================================================

- name: Install minimal desktop packages
  ansible.builtin.include_tasks:
    file: minimal-desktop-packages.yml
    apply:
      tags: [minimal-desktop, packages]
  tags: [minimal-desktop, packages]

- name: Configure PAM-aware graphical and TTY locking
  ansible.builtin.include_tasks:
    file: minimal-desktop-locking.yml
    apply:
      tags: [minimal-desktop, locking]
  tags: [minimal-desktop, locking]
  when: workstation_profile != 'byod-kiosk'

- name: Configure LightDM greeter
  ansible.builtin.include_tasks:
    file: minimal-desktop-lightdm.yml
    apply:
      tags: [minimal-desktop, lightdm]
  tags: [minimal-desktop, lightdm]

- name: Guard display packages against corrupted cached files
  ansible.builtin.include_tasks:
    file: minimal-desktop-integrity.yml
    apply:
      tags: [minimal-desktop, lightdm, integrity]
  tags: [minimal-desktop, lightdm, integrity]

- name: Install the display setup helper and its LightDM hook
  ansible.builtin.include_tasks:
    file: minimal-desktop-display-setup.yml
    apply:
      tags: [minimal-desktop, lightdm, display]
  tags: [minimal-desktop, lightdm, display]

- name: Install the Openbox session target for systemd --user
  ansible.builtin.copy:
    src: minimal-desktop/openbox-session.target
    dest: /etc/systemd/user/openbox-session.target
    owner: root
    group: root
    mode: "0644"
  tags: [minimal-desktop, openbox]

- name: Deploy Openbox configuration
  ansible.builtin.include_tasks:
    file: minimal-desktop-openbox.yml
    apply:
      tags: [minimal-desktop, openbox]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, openbox]

- name: Configure pinned per-user VT sessions
  ansible.builtin.include_tasks:
    file: minimal-desktop-pinned-vt.yml
    apply:
      tags: [minimal-desktop, pinned-vt]
  tags: [minimal-desktop, pinned-vt]

- name: Validate optional FocusPass screen lock settings
  ansible.builtin.include_tasks:
    file: minimal-desktop-focuspass-preflight.yml
    apply:
      tags: [minimal-desktop, locking, focuspass]
  tags: [minimal-desktop, locking, focuspass]
  when:
    - workstation_profile != 'byod-kiosk'
    - focuspass_screenlock_enabled | default(false) | bool

- name: Install optional FocusPass screen lock package
  ansible.builtin.include_tasks:
    file: minimal-desktop-focuspass.yml
    apply:
      tags: [minimal-desktop, locking, focuspass]
  tags: [minimal-desktop, locking, focuspass]
  when:
    - workstation_profile != 'byod-kiosk'
    - focuspass_screenlock_enabled | default(false) | bool
    # Check mode validates inputs above but skips downloading/installing.
    - not ansible_check_mode

- name: Deploy picom compositor config
  ansible.builtin.include_tasks:
    file: minimal-desktop-picom.yml
    apply:
      tags: [minimal-desktop, picom]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, picom]

- name: Install the tint2 volume status helper
  ansible.builtin.copy:
    src: minimal-desktop/tint2-volume-status
    dest: /usr/local/bin/tint2-volume-status
    owner: root
    group: root
    mode: "0755"
  tags: [minimal-desktop, tint2]

- name: Render the display scale X resources
  ansible.builtin.include_tasks:
    file: minimal-desktop-display-scale.yml
    apply:
      tags: [minimal-desktop, display]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, display]

- name: Deploy tint2 panel config
  ansible.builtin.include_tasks:
    file: minimal-desktop-tint2.yml
    apply:
      tags: [minimal-desktop, tint2]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, tint2]

- name: Hide XDG autostart entries the Openbox autostart already starts
  ansible.builtin.include_tasks:
    file: minimal-desktop-xdg-autostart.yml
    apply:
      tags: [minimal-desktop, openbox, xdg-autostart]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, openbox, xdg-autostart]
  when: workstation_profile != 'byod-kiosk'

- name: Deploy dunst notification config
  ansible.builtin.include_tasks:
    file: minimal-desktop-dunst.yml
    apply:
      tags: [minimal-desktop, dunst]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, dunst]

- name: Deploy rofi launcher config
  ansible.builtin.include_tasks:
    file: minimal-desktop-rofi.yml
    apply:
      tags: [minimal-desktop, rofi]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, rofi]

- name: Deploy touchpad configuration (tap-to-click, natural scroll)
  ansible.builtin.include_tasks:
    file: minimal-desktop-touchpad.yml
    apply:
      tags: [minimal-desktop, touchpad]
  tags: [minimal-desktop, touchpad]

- name: Configure GTK dark theme
  ansible.builtin.include_tasks:
    file: minimal-desktop-gtk-theme.yml
    apply:
      tags: [minimal-desktop, gtk]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, gtk]

- name: Deploy Firefox performance profile
  ansible.builtin.include_tasks:
    file: minimal-desktop-firefox.yml
    apply:
      tags: [minimal-desktop, firefox]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, firefox]
  when: minimal_desktop_firefox_tweaks | default(true)
