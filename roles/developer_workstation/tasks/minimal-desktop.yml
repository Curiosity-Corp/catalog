---
# =============================================================================
# Minimal Desktop (Openbox + LightDM + Firefox)
# =============================================================================
# Lightweight GUI environment for machines that only need a browser and
# terminal. Replaces GNOME/GDM with Openbox/LightDM, picom compositor,
# tint2 panel, dunst notifications, and rofi launcher.
#
# Enable with: -e minimal_desktop_enabled=true
# Mutually exclusive with display_config_enabled (GDM/GNOME).
# =============================================================================

- name: Install minimal desktop packages
  ansible.builtin.include_tasks: minimal-desktop-packages.yml
  tags: [minimal-desktop, packages]

- name: Configure PAM-aware graphical and TTY locking
  ansible.builtin.include_tasks: minimal-desktop-locking.yml
  tags: [minimal-desktop, locking]
  when: workstation_profile != 'byod-kiosk'

- name: Configure LightDM greeter
  ansible.builtin.include_tasks: minimal-desktop-lightdm.yml
  tags: [minimal-desktop, lightdm]

- name: Install the display setup helper and its LightDM hook
  ansible.builtin.include_tasks: minimal-desktop-display-setup.yml
  tags: [minimal-desktop, lightdm, display]

- name: Deploy Openbox configuration
  ansible.builtin.include_tasks: minimal-desktop-openbox.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, openbox]

- name: Configure pinned per-user VT sessions
  ansible.builtin.include_tasks: minimal-desktop-pinned-vt.yml
  tags: [minimal-desktop, pinned-vt]

- name: Validate optional FocusPass screen lock settings
  ansible.builtin.include_tasks: minimal-desktop-focuspass-preflight.yml
  tags: [minimal-desktop, locking, focuspass]
  when:
    - workstation_profile != 'byod-kiosk'
    - focuspass_screenlock_enabled | default(false) | bool

- name: Install optional FocusPass screen lock package
  ansible.builtin.include_tasks: minimal-desktop-focuspass.yml
  tags: [minimal-desktop, locking, focuspass]
  when:
    - workstation_profile != 'byod-kiosk'
    - focuspass_screenlock_enabled | default(false) | bool
    # Check mode validates inputs above but skips downloading/installing.
    - not ansible_check_mode

- name: Deploy picom compositor config
  ansible.builtin.include_tasks: minimal-desktop-picom.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, picom]

- name: Deploy tint2 panel config
  ansible.builtin.include_tasks: minimal-desktop-tint2.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, tint2]

- name: Deploy dunst notification config
  ansible.builtin.include_tasks: minimal-desktop-dunst.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, dunst]

- name: Deploy rofi launcher config
  ansible.builtin.include_tasks: minimal-desktop-rofi.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, rofi]

- name: Deploy touchpad configuration (tap-to-click, natural scroll)
  ansible.builtin.include_tasks: minimal-desktop-touchpad.yml
  tags: [minimal-desktop, touchpad]

- name: Configure GTK dark theme
  ansible.builtin.include_tasks: minimal-desktop-gtk-theme.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, gtk]

- name: Deploy Firefox performance profile
  ansible.builtin.include_tasks: minimal-desktop-firefox.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [minimal-desktop, firefox]
  when: minimal_desktop_firefox_tweaks | default(true)
