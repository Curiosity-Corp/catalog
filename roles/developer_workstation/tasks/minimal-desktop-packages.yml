---
# =============================================================================
# Minimal Desktop — Package Installation
# =============================================================================

- name: Install minimal desktop packages  # noqa: args
  ansible.builtin.apt:
    name:
      # Window manager and display manager
      - openbox
      - obconf
      - lightdm
      - lightdm-gtk-greeter
      - accountsservice
      # Compositor
      - picom
      # Panel and launcher
      - tint2
      - rofi
      # Notifications
      - dunst
      # Terminal and file manager
      - lxterminal
      - xterm
      - pcmanfm
      # Wallpaper and appearance
      - lxappearance
      - arc-theme
      - adwaita-icon-theme
      # System tray applets
      - network-manager-gnome
      - pavucontrol
      - arandr
      - flameshot
      - xfce4-power-manager
      # X11 utilities
      - x11-xserver-utils
      - xdotool
      # NSS cert tools (import internal CAs into Firefox snap cert store)
      - libnss3-tools
    state: present
    update_cache: true
