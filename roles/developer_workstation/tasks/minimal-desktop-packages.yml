---
# =============================================================================
# Minimal Desktop — Package Installation
# =============================================================================

- name: Install minimal desktop packages  # noqa: args
  ansible.builtin.apt:
    name:
      # Window manager and display manager
      - openbox
      - obconf
      - lightdm
      - lightdm-gtk-greeter
      # Compositor
      - picom
      # Panel and launcher
      - tint2
      - rofi
      # Notifications
      - dunst
      # Terminal and file manager
      - lxterminal
      - xterm
      - pcmanfm
      # Wallpaper and appearance
      - nitrogen
      - lxappearance
      - arc-theme
      - adwaita-icon-theme
      # Provides /usr/share/backgrounds/warty-final-ubuntu.png, the vendor
      # default referenced by 01_ubuntu.conf in the greeter conf.d. Our managed
      # greeter config uses a solid color, but the file must still resolve so
      # seat0-greeter.log stays free of missing-background warnings (e.g. on
      # first boot before converge manages the greeter config).
      - ubuntu-wallpapers
      # System tray applets
      - volumeicon-alsa
      - network-manager-gnome
      # Bluetooth stack + tray applet (logged-in session tray, non-kiosk)
      - bluez
      - blueman
      # Current-session X11 lock and a separate lock command for text TTYs.
      - i3lock
      - xss-lock
      - vlock
      # X11 utilities
      - x11-xserver-utils
      - xdotool
      # NSS cert tools (import internal CAs into Firefox snap cert store)
      - libnss3-tools
    state: present
    update_cache: true

- name: Remove Light Locker from the LightDM/Openbox session
  ansible.builtin.apt:
    name: light-locker
    state: absent
