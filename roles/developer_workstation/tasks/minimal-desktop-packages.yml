---
# =============================================================================
# Minimal Desktop — Package Installation
# =============================================================================

- name: Install minimal desktop packages  # noqa: args
  ansible.builtin.apt:
    name:
      # Window manager and display manager
      - openbox
      - obconf
      - lightdm
      - lightdm-gtk-greeter
      # Compositor
      - picom
      # Panel and launcher
      - tint2
      - rofi
      # Notifications
      - dunst
      # Terminal and file manager
      - lxterminal
      - xterm
      - pcmanfm
      # Wallpaper and appearance
      - feh
      - lxappearance
      - arc-theme
      - adwaita-icon-theme
      # System tray applets
      - pasystray
      - pavucontrol
      - network-manager-gnome
      # tint2 helpers: pactl for the volume executor, zenity for the clock
      # calendar, arandr for the top layout's launcher
      - pulseaudio-utils
      - zenity
      - arandr
      # Screenshots (PrtSc capture and annotation)
      - flameshot
      # X11 utilities
      - x11-xserver-utils
      - xdotool
      # xprop, used by openbox-zone to read the EWMH work area
      - x11-utils
      # NSS cert tools (import internal CAs into Firefox snap cert store)
      - libnss3-tools
    state: present
    update_cache: true

# Six-zone window snapping (Super+Alt+1..6 in the managed rc.xml). System-wide
# so every managed Openbox user gets the same binding target.
- name: Install openbox-zone window snapping helper
  ansible.builtin.copy:
    src: minimal-desktop/openbox-zone
    dest: /usr/local/bin/openbox-zone
    owner: root
    group: root
    mode: "0755"

# openbox-xdg-autostart needs PyXDG; once installed it runs every entry in
# /etc/xdg/autostart and ~/.config/autostart, including lxpolkit (the PolicyKit
# authentication agent; policykit-1-gnome was dropped from Debian trixie).
# The byod-kiosk session replaces the Openbox autostart with one browser and
# must not pick up desktop helpers, so it keeps XDG autostart disabled.
- name: Install XDG autostart support and the PolicyKit authentication agent
  ansible.builtin.apt:
    name:
      - python3-xdg
      - lxpolkit
    state: present
    update_cache: false
  when: workstation_profile != 'byod-kiosk'

- name: Install the Ubuntu greeter wallpaper asset
  ansible.builtin.apt:
    name: ubuntu-wallpapers
    state: present
    update_cache: false
  when: ansible_distribution == 'Ubuntu'

- name: Install PAM-aware locking tools for standard Openbox sessions
  ansible.builtin.apt:
    name:
      - xscreensaver
      - vlock
    state: present
    update_cache: false
  when: workstation_profile != 'byod-kiosk'

- name: Remove the single-prompt i3lock and its xss-lock launcher
  ansible.builtin.apt:
    name:
      - i3lock
      - xss-lock
    state: absent
    autoremove: false
  when: workstation_profile != 'byod-kiosk'

- name: Install Bluetooth tray support for standard Openbox sessions
  ansible.builtin.apt:
    name:
      - bluez
      - blueman
    state: present
    update_cache: false
  when: workstation_profile != 'byod-kiosk'

- name: Remove Light Locker from the LightDM/Openbox session
  ansible.builtin.apt:
    name: light-locker
    state: absent
