---
# =============================================================================
# Ansible-Pull Systemd Timer
# =============================================================================
# Sets up periodic ansible-pull runs for ongoing workstation updates.
# Variables come from defaults/main.yml:
#   ansible_pull_repo, ansible_pull_branch, ansible_pull_playbook,
#   ansible_pull_interval, ansible_pull_dir
# =============================================================================

- name: Create ansible-pull wrapper
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      extra_args=()
      if [[ -n "{{ ansible_pull_extra_vars }}" ]]; then
        # shellcheck disable=SC2206
        extra_args=({{ ansible_pull_extra_vars }})
      fi

      verify_args=()
      if [[ "{{ ansible_pull_verify_commit | bool }}" == "True" ]]; then
        verify_args+=(--verify-commit)
      fi

      # Reuse the dev user's existing gh credential when present. Keep it in
      # an ephemeral mode-0600 vars file so it is not exposed in process
      # arguments or persisted in the catalog checkout.
      github_vars_file=""
      if command -v gh >/dev/null 2>&1; then
        github_token="$(sudo -u "{{ dev_user }}" env HOME="{{ dev_user_home }}" GH_CONFIG_DIR="{{ dev_user_home }}/.config/gh" gh auth token --hostname github.com 2>/dev/null || true)"
        if [[ -n "${github_token}" ]]; then
          github_vars_file="$(mktemp /run/curiosity-github-vars.XXXXXX)"
          chmod 0600 "${github_vars_file}"
          printf 'github_api_token: %s\n' "${github_token}" >"${github_vars_file}"
          extra_args+=("-e" "@${github_vars_file}")
          trap 'rm -f "${github_vars_file}"' EXIT
        fi
      fi

      exec /usr/bin/ansible-pull \
        -U {{ ansible_pull_repo }} \
        -C {{ ansible_pull_branch }} \
        -d {{ ansible_pull_dir }} \
        "${verify_args[@]}" \
        {{ ansible_pull_playbook }} \
        -e dev_user={{ dev_user }} \
        -e dev_user_home={{ dev_user_home }} \
        -e workstation_profile={{ workstation_profile }} \
        -e hardware_profile={{ hardware_profile }} \
        "${extra_args[@]}"
    dest: /usr/local/sbin/curiosity-ansible-pull
    mode: "0755"

- name: Create ansible-pull service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Ansible Pull - Developer Workstation Updates
      After=network-online.target
      Wants=network-online.target
      StartLimitIntervalSec=1h
      StartLimitBurst=3

      [Service]
      Type=oneshot
      Environment=HOME=/root
      Environment=ANSIBLE_INVALID_TASK_ATTRIBUTE_FAILED=False
      ExecStart=/usr/bin/flock -n /var/lock/ansible-pull.lock \
        /usr/local/sbin/curiosity-ansible-pull
      TimeoutStartSec=3600
      StandardOutput=journal
      StandardError=journal
    dest: /etc/systemd/system/ansible-pull.service
    mode: '0644'
  notify: Reload systemd

- name: Create ansible-pull timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Run ansible-pull periodically

      [Timer]
      OnBootSec=5min
      OnCalendar=*-*-* 02:00:00
      RandomizedDelaySec={{ workstation_update_ring_randomized_delay_seconds[workstation_update_ring] }}
      Persistent=true
      AccuracySec=5min

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/ansible-pull.timer
    mode: '0644'
  notify: Reload systemd

- name: Enable ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    enabled: true
    state: started
    daemon_reload: true
