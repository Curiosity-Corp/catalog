---
# =============================================================================
# Ansible-Pull Systemd Timer
# =============================================================================
# Sets up periodic ansible-pull runs for ongoing workstation updates.
# Variables come from defaults/main.yml:
#   ansible_pull_repo, ansible_pull_branch, ansible_pull_playbook,
#   ansible_pull_interval, ansible_pull_dir
# =============================================================================

- name: Create ansible-pull wrapper
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      extra_args=()
      if [[ -n "{{ ansible_pull_extra_vars }}" ]]; then
        # shellcheck disable=SC2206
        extra_args=({{ ansible_pull_extra_vars }})
      fi

      verify_args=()
      if [[ "{{ ansible_pull_verify_commit | bool }}" == "True" ]]; then
        verify_args+=(--verify-commit)
      fi

      local_only=false
      if [[ -d "{{ ansible_pull_dir }}/.git" ]]; then
        # A reviewed local compatibility branch may be ahead of public main.
        # Never let ansible-pull --force discard it, and do not merge public
        # main into it implicitly.  Once public main contains the reviewed
        # commit, the normal pull path resumes automatically.
        if ! git -C "{{ ansible_pull_dir }}" diff --quiet ||
           [[ -n "$(git -C "{{ ansible_pull_dir }}" status --porcelain)" ]]; then
          local_only=true
        elif ! git -C "{{ ansible_pull_dir }}" fetch --quiet origin "{{ ansible_pull_branch }}"; then
          local_only=true
        elif ! git -C "{{ ansible_pull_dir }}" merge-base --is-ancestor \
             "$(git -C "{{ ansible_pull_dir }}" rev-parse HEAD)" \
             "$(git -C "{{ ansible_pull_dir }}" rev-parse "origin/{{ ansible_pull_branch }}")"; then
          local_only=true
        fi
      fi

      if [[ "$local_only" == "true" ]]; then
        echo "Reviewed local catalog checkout is active; running it without replacing or merging it."
        cd "{{ ansible_pull_dir }}"
        exec /usr/bin/ansible-playbook \
          -i localhost, \
          -c local \
          {{ ansible_pull_playbook }} \
          -e dev_user={{ dev_user }} \
          -e dev_user_home={{ dev_user_home }} \
          -e workstation_profile={{ workstation_profile }} \
          -e hardware_profile={{ hardware_profile }} \
          "${extra_args[@]}"
      fi

      exec /usr/bin/ansible-pull \
        -U {{ ansible_pull_repo }} \
        -C {{ ansible_pull_branch }} \
        -d {{ ansible_pull_dir }} \
        "${verify_args[@]}" \
        {{ ansible_pull_playbook }} \
        -e dev_user={{ dev_user }} \
        -e dev_user_home={{ dev_user_home }} \
        -e workstation_profile={{ workstation_profile }} \
        -e hardware_profile={{ hardware_profile }} \
        "${extra_args[@]}"
    dest: /usr/local/sbin/curiosity-ansible-pull
    mode: "0755"

- name: Create ansible-pull service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Ansible Pull - Developer Workstation Updates
      After=network-online.target
      Wants=network-online.target
      StartLimitIntervalSec=1h
      StartLimitBurst=3

      [Service]
      Type=oneshot
      Environment=HOME=/root
      Environment=ANSIBLE_INVALID_TASK_ATTRIBUTE_FAILED=False
      ExecStart=/usr/bin/flock -n /var/lock/ansible-pull.lock \
        /usr/local/sbin/curiosity-ansible-pull
      TimeoutStartSec=3600
      StandardOutput=journal
      StandardError=journal
    dest: /etc/systemd/system/ansible-pull.service
    mode: '0644'
  notify: Reload systemd

- name: Create ansible-pull timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Run ansible-pull periodically

      [Timer]
      OnBootSec=5min
      OnCalendar=*-*-* 02:00:00
      RandomizedDelaySec={{ workstation_update_ring_randomized_delay_seconds[workstation_update_ring] }}
      Persistent=true
      AccuracySec=5min

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/ansible-pull.timer
    mode: '0644'
  notify: Reload systemd

- name: Enable ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    enabled: true
    state: started
    daemon_reload: true
