---
# =============================================================================
# Ansible-Pull Systemd Timer
# =============================================================================
# Sets up periodic ansible-pull runs for ongoing workstation updates.
# Variables come from defaults/main.yml:
#   ansible_pull_repo, ansible_pull_branch, ansible_pull_playbook,
#   ansible_pull_interval, ansible_pull_dir, workstation_ansible_pull_memory_high,
#   ansible_pull_poll_enabled, ansible_pull_poll_schedule, ansible_pull_state_dir
#
# ansible-pull.timer is the full converge (02:00 and after boot). The poll
# (ansible-pull-poll.timer, catalog#159) starts the same ansible-pull.service
# as soon as the catalog branch has moved past the commit of the last
# successful run, so a merge does not wait up to a day for its hosts.
# =============================================================================

- name: Validate the ansible-pull poll settings
  ansible.builtin.assert:
    that:
      - ansible_pull_poll_schedule | default('') | trim | length > 0
      - ansible_pull_state_dir | default('') is match('^/')
    fail_msg: >-
      ansible_pull_poll_schedule must be a systemd OnCalendar value and
      ansible_pull_state_dir an absolute path when ansible_pull_poll_enabled
      is true.
    quiet: true
  when: ansible_pull_poll_enabled | bool

- name: Validate the ansible-pull credential settings
  ansible.builtin.assert:
    that:
      - ansible_pull_repo is not match('^[A-Za-z][A-Za-z0-9+.-]*://[^/]*@')
      - ansible_pull_credentials_file | default('') == '' or ansible_pull_credentials_file is match('^/')
    fail_msg: >-
      ansible_pull_repo must not embed credentials; put them in the root-only
      file named by ansible_pull_credentials_file (an absolute path).
    quiet: true

- name: Check the ansible-pull credential file
  ansible.builtin.stat:
    path: "{{ ansible_pull_credentials_file }}"
    get_checksum: false
  register: _ansible_pull_credentials
  when: ansible_pull_credentials_file | default('') | length > 0

- name: Require a root-only ansible-pull credential file
  ansible.builtin.assert:
    that:
      - _ansible_pull_credentials.stat.exists
      - _ansible_pull_credentials.stat.uid == 0
      - _ansible_pull_credentials.stat.mode in ['0600', '0400']
    fail_msg: >-
      {{ ansible_pull_credentials_file }} must exist, be owned by root and have
      mode 0600 or 0400. The site bootstrap writes it from the secret manager;
      this role never reads or writes it.
    quiet: true
  when: ansible_pull_credentials_file | default('') | length > 0

- name: Create ansible-pull wrapper
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      # Managed by curiosity developer_workstation (tasks/ansible-pull-timer.yml).
      #
      #   curiosity-ansible-pull              converge now (ansible-pull.service:
      #                                       the 02:00 timer, boot, a manual
      #                                       start, the poll below)
      #   curiosity-ansible-pull --if-behind  start ansible-pull.service only when
      #                                       the catalog branch has moved past
      #                                       the commit of the last successful
      #                                       run (ansible-pull-poll.service)
      set -euo pipefail

      if_behind=false
      case "${1:-}" in
        "") ;;
        --if-behind) if_behind=true ;;
        *) echo "usage: curiosity-ansible-pull [--if-behind]" >&2; exit 2 ;;
      esac

      state_dir={{ ansible_pull_state_dir | quote }}
      # Commit of the last run that finished successfully.
      applied="$state_dir/applied-commit"
      # Commit the poll last started a run for. The poll starts a run once per
      # commit; when that run fails, the next commit or the 02:00 run retries,
      # so a broken commit cannot restart a full converge every poll.
      poll_started="$state_dir/poll-started-commit"

      # A private catalog: the deploy credential sits in a root-only
      # git-credential-store file that the site's bootstrap writes from its
      # secret manager (catalog#116). The empty helper clears every helper
      # inherited from root's git config: a host-wide "store" erases its line
      # on any 401, transient or not, after which every pull ran anonymously
      # and applied the stale checkout for good. The helper below answers
      # only "get", so nothing can erase or copy the file, and it is scoped to
      # the catalog URL. Nothing secret reaches argv or the journal.
      cred={{ ansible_pull_credentials_file | quote }}
      if [[ -n $cred ]]; then
        if [[ ! -r $cred ]]; then
          echo "curiosity-ansible-pull: credential file $cred is missing or unreadable; the site bootstrap writes it" >&2
          exit 1
        fi
        export GIT_CONFIG_COUNT=3
        export GIT_CONFIG_KEY_0="credential.{{ ansible_pull_repo }}.helper"
        export GIT_CONFIG_VALUE_0=
        export GIT_CONFIG_KEY_1="credential.{{ ansible_pull_repo }}.helper"
        export GIT_CONFIG_VALUE_1="!f() { if [ \"\$1\" = get ]; then git credential-store --file=\"$cred\" get; fi; }; f"
        export GIT_CONFIG_KEY_2="credential.{{ ansible_pull_repo }}.useHttpPath"
        export GIT_CONFIG_VALUE_2=true
      fi

      if $if_behind; then
        state=$(systemctl show -P ActiveState ansible-pull.service)
        if [[ $state == activating || $state == active || $state == deactivating ]] ||
           ! flock -n /var/lock/ansible-pull.lock true; then
          echo "curiosity-ansible-pull: a run is in progress; it applies the newest commit itself"
          exit 0
        fi
        if [[ ! -d "{{ ansible_pull_dir }}/.git" ]]; then
          echo "curiosity-ansible-pull: no catalog checkout at {{ ansible_pull_dir }} yet; starting the first run"
          systemctl start --no-block ansible-pull.service
          exit 0
        fi
        # A reviewed local checkout (local changes, or commits the branch does
        # not contain) is applied by the full run only, never by the poll.
        if [[ -n "$(git -C "{{ ansible_pull_dir }}" status --porcelain)" ]]; then
          echo "curiosity-ansible-pull: {{ ansible_pull_dir }} has local changes; the 02:00 run applies it, the poll does not"
          exit 0
        fi
        if ! heads=$(git -C "{{ ansible_pull_dir }}" ls-remote --exit-code origin "refs/heads/{{ ansible_pull_branch }}"); then
          echo "curiosity-ansible-pull: cannot read {{ ansible_pull_branch }} from the catalog remote" >&2
          exit 1
        fi
        remote=${heads%%[[:space:]]*}
        last=none
        if [[ -r $applied ]]; then
          last=$(<"$applied")
        fi
        if [[ $remote == "$last" ]]; then
          echo "curiosity-ansible-pull: {{ ansible_pull_branch }} is at $remote, already applied"
          exit 0
        fi
        started=none
        if [[ -r $poll_started ]]; then
          started=$(<"$poll_started")
        fi
        if [[ $remote == "$started" ]]; then
          echo "curiosity-ansible-pull: {{ ansible_pull_branch }} is at $remote; the run the poll started for it did not succeed, so the 02:00 run retries it"
          exit 0
        fi
        if ! git -C "{{ ansible_pull_dir }}" fetch --quiet origin "{{ ansible_pull_branch }}"; then
          echo "curiosity-ansible-pull: cannot fetch {{ ansible_pull_branch }} from the catalog remote" >&2
          exit 1
        fi
        if ! git -C "{{ ansible_pull_dir }}" merge-base --is-ancestor HEAD "$remote"; then
          echo "curiosity-ansible-pull: {{ ansible_pull_dir }} holds commits {{ ansible_pull_branch }} does not contain; the 02:00 run applies it, the poll does not"
          exit 0
        fi
        # The update ring: canary converges at once, later rings wait until
        # the commit has been on the branch for the ring's observation window.
        min_age={{ workstation_update_ring_min_age_seconds[workstation_update_ring] | int }}
        committed=$(git -C "{{ ansible_pull_dir }}" log -1 --format=%ct "$remote")
        age=$(( $(date +%s) - committed ))
        if (( age < min_age )); then
          echo "curiosity-ansible-pull: ring {{ workstation_update_ring }} waits until $remote is ${min_age}s old (it is ${age}s)"
          exit 0
        fi
        echo "curiosity-ansible-pull: {{ ansible_pull_branch }} is at $remote, last applied $last; starting ansible-pull.service"
        if ! systemctl start --no-block ansible-pull.service; then
          echo "curiosity-ansible-pull: ansible-pull.service did not start; the next poll tries again" >&2
          exit 1
        fi
        mkdir -p "$state_dir"
        echo "$remote" >"$poll_started.tmp"
        mv -f "$poll_started.tmp" "$poll_started"
        exit 0
      fi

      extra_args=()
      if [[ -n "{{ ansible_pull_extra_vars }}" ]]; then
        # shellcheck disable=SC2206
        extra_args=({{ ansible_pull_extra_vars }})
      fi

      verify_args=()
      if [[ "{{ ansible_pull_verify_commit | bool }}" == "True" ]]; then
        verify_args+=(--verify-commit)
      fi

      local_only=false
      if [[ -d "{{ ansible_pull_dir }}/.git" ]]; then
        # A reviewed local compatibility branch may be ahead of public main.
        # Never let ansible-pull --force discard it, and do not merge public
        # main into it implicitly.  Once public main contains the reviewed
        # commit, the normal pull path resumes automatically.
        if ! git -C "{{ ansible_pull_dir }}" diff --quiet ||
           [[ -n "$(git -C "{{ ansible_pull_dir }}" status --porcelain)" ]]; then
          local_only=true
        elif ! git -C "{{ ansible_pull_dir }}" fetch --quiet origin "{{ ansible_pull_branch }}"; then
          # Never re-apply the old checkout silently (catalog#116): a failed
          # fetch fails the run, so it shows in systemctl --failed and the
          # journal. ansible_pull_force_on_update_failure opts a host into
          # running its known-good checkout instead.
          if [[ "{{ ansible_pull_force_on_update_failure | bool }}" != "True" ]]; then
            echo "curiosity-ansible-pull: cannot fetch {{ ansible_pull_branch }} from the catalog remote; not re-applying the checkout at $(git -C "{{ ansible_pull_dir }}" rev-parse --short HEAD)" >&2
            exit 1
          fi
          echo "curiosity-ansible-pull: cannot fetch {{ ansible_pull_branch }}; ansible_pull_force_on_update_failure runs the checkout as it is" >&2
          local_only=true
        elif ! git -C "{{ ansible_pull_dir }}" merge-base --is-ancestor \
             "$(git -C "{{ ansible_pull_dir }}" rev-parse HEAD)" \
             "$(git -C "{{ ansible_pull_dir }}" rev-parse "origin/{{ ansible_pull_branch }}")"; then
          local_only=true
        fi
      fi

      if [[ "$local_only" == "true" ]]; then
        echo "Reviewed local catalog checkout is active; running it without replacing or merging it."
        cd "{{ ansible_pull_dir }}"
        exec /usr/bin/ansible-playbook \
          -i localhost, \
          -c local \
          {{ ansible_pull_playbook }} \
          -e dev_user={{ dev_user }} \
          -e dev_user_home={{ dev_user_home }} \
          -e workstation_profile={{ workstation_profile }} \
          -e hardware_profile={{ hardware_profile }} \
          "${extra_args[@]}"
      fi

      /usr/bin/ansible-pull \
        -U {{ ansible_pull_repo }} \
        -C {{ ansible_pull_branch }} \
        -d {{ ansible_pull_dir }} \
        "${verify_args[@]}" \
        {{ ansible_pull_playbook }} \
        -e dev_user={{ dev_user }} \
        -e dev_user_home={{ dev_user_home }} \
        -e workstation_profile={{ workstation_profile }} \
        -e hardware_profile={{ hardware_profile }} \
        "${extra_args[@]}"

      # Reached only when the run succeeded (set -e): the poll compares the
      # branch with this commit.
      mkdir -p "$state_dir"
      git -C "{{ ansible_pull_dir }}" rev-parse HEAD >"$applied.tmp"
      mv -f "$applied.tmp" "$applied"
      echo "curiosity-ansible-pull: applied $(<"$applied")"
    dest: /usr/local/sbin/curiosity-ansible-pull
    mode: "0755"

- name: Create ansible-pull service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Ansible Pull - Developer Workstation Updates
      After=network-online.target
      Wants=network-online.target
      StartLimitIntervalSec=1h
      StartLimitBurst=3

      [Service]
      Type=oneshot
      Environment=HOME=/root
      Environment=ANSIBLE_INVALID_TASK_ATTRIBUTE_FAILED=False
      ExecStart=/usr/bin/flock -n /var/lock/ansible-pull.lock \
        /usr/local/sbin/curiosity-ansible-pull
      TimeoutStartSec=3600
      MemoryHigh={{ workstation_ansible_pull_memory_high }}
      StandardOutput=journal
      StandardError=journal
    dest: /etc/systemd/system/ansible-pull.service
    mode: '0644'
  notify: Reload systemd

- name: Create ansible-pull timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Run ansible-pull periodically

      [Timer]
      OnBootSec=5min
      OnCalendar=*-*-* 02:00:00
      RandomizedDelaySec={{ workstation_update_ring_randomized_delay_seconds[workstation_update_ring] }}
      Persistent=true
      AccuracySec=5min

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/ansible-pull.timer
    mode: '0644'
  notify: Reload systemd

- name: Enable ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Create ansible-pull poll service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Start ansible-pull when the catalog branch has moved
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      Environment=HOME=/root
      ExecStart=/usr/local/sbin/curiosity-ansible-pull --if-behind
      Nice=10
      TimeoutStartSec=10min
      StandardOutput=journal
      StandardError=journal
    dest: /etc/systemd/system/ansible-pull-poll.service
    mode: '0644'
  notify: Reload systemd
  when: ansible_pull_poll_enabled | bool

- name: Create ansible-pull poll timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Poll the catalog branch for a merged change

      [Timer]
      OnCalendar={{ ansible_pull_poll_schedule }}
      RandomizedDelaySec=60
      AccuracySec=1min

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/ansible-pull-poll.timer
    mode: '0644'
  notify: Reload systemd
  when: ansible_pull_poll_enabled | bool

- name: Enable ansible-pull poll timer
  ansible.builtin.systemd:
    name: ansible-pull-poll.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_pull_poll_enabled | bool

- name: Check for a retired ansible-pull poll timer
  ansible.builtin.stat:
    path: /etc/systemd/system/ansible-pull-poll.timer
  register: _ansible_pull_poll_timer_unit
  when: not (ansible_pull_poll_enabled | bool)

- name: Stop and disable the retired ansible-pull poll timer
  ansible.builtin.systemd:
    name: ansible-pull-poll.timer
    enabled: false
    state: stopped
  when:
    - not (ansible_pull_poll_enabled | bool)
    - _ansible_pull_poll_timer_unit.stat.exists

- name: Remove the retired ansible-pull poll units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - ansible-pull-poll.timer
    - ansible-pull-poll.service
  notify: Reload systemd
  when: not (ansible_pull_poll_enabled | bool)
