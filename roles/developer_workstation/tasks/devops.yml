---
# =============================================================================
# DevOps utilities (upstream latest releases)
# =============================================================================

# --- rclone ---
- name: Resolve latest rclone version
  ansible.builtin.uri:
    url: https://downloads.rclone.org/version.txt
    return_content: true
  register: _rclone_version_response
  changed_when: false

- name: Set latest rclone version
  ansible.builtin.set_fact:
    _rclone_latest_version: "{{ _rclone_version_response.content | trim | regex_replace('^rclone ', '') }}"

- name: Download latest rclone
  ansible.builtin.get_url:
    url: "https://downloads.rclone.org/{{ _rclone_latest_version }}/rclone-{{ _rclone_latest_version }}-linux-amd64.zip"
    dest: "{{ workstation_update_artifact_cache_dir }}/rclone-{{ _rclone_latest_version }}.archive"
    checksum: "sha256:https://downloads.rclone.org/{{ _rclone_latest_version }}/SHA256SUMS"
    mode: "0644"
    force: false

- name: Clear previous rclone extraction directory
  ansible.builtin.file:
    path: /var/tmp/curiosity-rclone
    state: absent

- name: Recreate rclone extraction directory
  ansible.builtin.file:
    path: /var/tmp/curiosity-rclone
    state: directory
    mode: "0755"

- name: Extract latest rclone
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/rclone-{{ _rclone_latest_version }}.archive"
    dest: /var/tmp/curiosity-rclone
    remote_src: true

- name: Find latest rclone binary
  ansible.builtin.find:
    paths: /var/tmp/curiosity-rclone
    patterns: [rclone]
    recurse: true
    file_type: file
  register: _rclone_binary

- name: Install latest rclone
  ansible.builtin.copy:
    src: "{{ _rclone_binary.files[0].path }}"
    dest: /usr/local/bin/rclone
    mode: "0755"
    remote_src: true
  when: _rclone_binary.matched | int > 0

# --- grpcurl ---
# grpcurl's release assets predate GitHub's per-asset digest metadata. Build
# the current module from Go's checksum database instead of accepting an
# unverifiable release binary. languages.yml runs first in the transaction.
- name: Ensure the user's Go binary directory exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/go/bin"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Update grpcurl from the latest Go module
  ansible.builtin.command: /usr/local/go/bin/go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    GOBIN: "{{ dev_user_home }}/go/bin"
    PATH: "{{ dev_user_home }}/go/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: true

- name: Atomically install grpcurl built from the verified Go module
  ansible.builtin.copy:
    src: "{{ dev_user_home }}/go/bin/grpcurl"
    dest: /usr/local/bin/grpcurl
    remote_src: true
    mode: "0755"

# --- mmctl (Mattermost administration/client CLI) ---
# Install mmctl from the official Mattermost server distribution. The
# standalone mmctl archive has no published digest; the server distribution
# includes the same client at mattermost/bin/mmctl and publishes a SHA-256
# sidecar, so the artifact is verified before anything is executed or copied
# into PATH.
- name: Resolve the current mmctl release and host architecture
  ansible.builtin.set_fact:
    _mmctl_release_version: "{{ latest_github_releases.mattermost.tag_name | regex_replace('^v', '') }}"
    _mmctl_architecture: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '') }}

- name: Require a supported mmctl release architecture
  ansible.builtin.assert:
    that: _mmctl_architecture | length > 0
    fail_msg: "Mattermost mmctl has no managed Linux artifact for {{ ansible_architecture }}"

- name: Read the official Mattermost package SHA-256 sidecar
  ansible.builtin.uri:
    url: "https://releases.mattermost.com/{{ _mmctl_release_version }}/mattermost-{{ _mmctl_release_version }}-linux-{{ _mmctl_architecture }}.tar.gz.sha256"
    return_content: true
  register: _mmctl_checksum_response
  changed_when: false

- name: Set the verified Mattermost package checksum
  ansible.builtin.set_fact:
    _mmctl_package_checksum: >-
      {{ _mmctl_checksum_response.content
         | regex_search('(?i)[0-9a-f]{64}')
         | lower }}

- name: Require a valid Mattermost package checksum
  ansible.builtin.assert:
    that:
      - _mmctl_package_checksum is match('^[0-9a-f]{64}$')
    fail_msg: "Mattermost did not publish a valid SHA-256 for {{ _mmctl_release_version }}"

- name: Download the current official Mattermost server distribution
  ansible.builtin.get_url:
    url: "https://releases.mattermost.com/{{ _mmctl_release_version }}/mattermost-{{ _mmctl_release_version }}-linux-{{ _mmctl_architecture }}.tar.gz"
    dest: "{{ workstation_update_artifact_cache_dir }}/mattermost-{{ _mmctl_release_version }}-linux-{{ _mmctl_architecture }}.tar.gz"
    checksum: "sha256:{{ _mmctl_package_checksum }}"
    mode: "0644"
    force: false

- name: Remove stale mmctl extraction directory
  ansible.builtin.file:
    path: "/var/tmp/curiosity-mmctl-{{ _mmctl_release_version }}-{{ _mmctl_architecture }}"
    state: absent

- name: Stage, verify, and install the checked Mattermost mmctl binary
  block:
    - name: Create the mmctl release extraction directory
      ansible.builtin.file:
        path: "/var/tmp/curiosity-mmctl-{{ _mmctl_release_version }}-{{ _mmctl_architecture }}"
        state: directory
        mode: "0755"

    - name: Extract mmctl from the verified Mattermost distribution
      ansible.builtin.unarchive:
        src: "{{ workstation_update_artifact_cache_dir }}/mattermost-{{ _mmctl_release_version }}-linux-{{ _mmctl_architecture }}.tar.gz"
        dest: "/var/tmp/curiosity-mmctl-{{ _mmctl_release_version }}-{{ _mmctl_architecture }}"
        remote_src: true
        include: [mattermost/bin/mmctl]
        creates: "/var/tmp/curiosity-mmctl-{{ _mmctl_release_version }}-{{ _mmctl_architecture }}/mattermost/bin/mmctl"

    - name: Verify mmctl reports the discovered Mattermost release
      ansible.builtin.command:
        argv:
          - "/var/tmp/curiosity-mmctl-{{ _mmctl_release_version }}-{{ _mmctl_architecture }}/mattermost/bin/mmctl"
          - version
      become: true
      become_user: "{{ dev_user }}"
      environment:
        HOME: "{{ dev_user_home }}"
      register: _mmctl_version_check
      changed_when: false
      failed_when: >-
        _mmctl_version_check.rc != 0 or
        _mmctl_release_version not in (_mmctl_version_check.stdout | default(''))

    - name: Install the version-checked mmctl release
      ansible.builtin.copy:
        src: "/var/tmp/curiosity-mmctl-{{ _mmctl_release_version }}-{{ _mmctl_architecture }}/mattermost/bin/mmctl"
        dest: /usr/local/bin/mmctl
        remote_src: true
        mode: "0755"
  always:
    - name: Remove the mmctl extraction directory
      ansible.builtin.file:
        path: "/var/tmp/curiosity-mmctl-{{ _mmctl_release_version }}-{{ _mmctl_architecture }}"
        state: absent

# --- OpenTofu ---
- name: Download latest OpenTofu
  ansible.builtin.get_url:
    url: >-
      {{
        (latest_github_releases.tofu.assets
        | selectattr('name', 'match', '^tofu_.*_linux_amd64[.]zip$')
        | first).browser_download_url
      }}
    dest: "{{ workstation_update_artifact_cache_dir }}/tofu-{{ (latest_github_releases.tofu.assets | selectattr('name', 'match', '^tofu_.*_linux_amd64[.]zip$') | first).digest | regex_replace('^sha256:', '') }}.archive"
    checksum: >-
      {{ (latest_github_releases.tofu.assets
          | selectattr('name', 'match', '^tofu_.*_linux_amd64[.]zip$')
          | first).digest }}
    mode: "0644"
    force: false

- name: Install latest OpenTofu
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/tofu-{{ (latest_github_releases.tofu.assets | selectattr('name', 'match', '^tofu_.*_linux_amd64[.]zip$') | first).digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [tofu]

# --- crane (container registry tool) ---
- name: Download latest crane bundle
  ansible.builtin.get_url:
    url: "{{ (latest_github_releases.crane.assets | selectattr('name', 'equalto', 'go-containerregistry_Linux_x86_64.tar.gz') | first).browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/crane-{{ (latest_github_releases.crane.assets | selectattr('name', 'equalto', 'go-containerregistry_Linux_x86_64.tar.gz') | first).digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ (latest_github_releases.crane.assets | selectattr('name', 'equalto', 'go-containerregistry_Linux_x86_64.tar.gz') | first).digest }}"
    mode: "0644"
    force: false

- name: Install latest crane
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/crane-{{ (latest_github_releases.crane.assets | selectattr('name', 'equalto', 'go-containerregistry_Linux_x86_64.tar.gz') | first).digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [crane]

# --- act (GitHub Actions local runner) ---
- name: Download latest act
  ansible.builtin.get_url:
    url: "{{ (latest_github_releases.act.assets | selectattr('name', 'equalto', 'act_Linux_x86_64.tar.gz') | first).browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/act-{{ (latest_github_releases.act.assets | selectattr('name', 'equalto', 'act_Linux_x86_64.tar.gz') | first).digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ (latest_github_releases.act.assets | selectattr('name', 'equalto', 'act_Linux_x86_64.tar.gz') | first).digest }}"
    mode: "0644"
    force: false

- name: Install latest act
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/act-{{ (latest_github_releases.act.assets | selectattr('name', 'equalto', 'act_Linux_x86_64.tar.gz') | first).digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [act]

# --- HashiCorp tools ---
- name: Query latest Terraform release
  ansible.builtin.uri:
    url: https://checkpoint-api.hashicorp.com/v1/check/terraform
    return_content: true
  register: _terraform_checkpoint
  changed_when: false

- name: Query latest Vault release
  ansible.builtin.uri:
    url: https://checkpoint-api.hashicorp.com/v1/check/vault
    return_content: true
  register: _vault_checkpoint
  changed_when: false

- name: Query latest Packer release
  ansible.builtin.uri:
    url: https://checkpoint-api.hashicorp.com/v1/check/packer
    return_content: true
  register: _packer_checkpoint
  changed_when: false

- name: Set latest HashiCorp release versions
  ansible.builtin.set_fact:
    terraform_latest_version: "{{ _terraform_checkpoint.json.current_version }}"
    vault_latest_version: "{{ _vault_checkpoint.json.current_version }}"
    packer_latest_version: "{{ _packer_checkpoint.json.current_version }}"

- name: Download latest Terraform
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_latest_version }}/terraform_{{ terraform_latest_version }}_linux_amd64.zip"
    dest: "{{ workstation_update_artifact_cache_dir }}/terraform-{{ terraform_latest_version }}.archive"
    checksum: "sha256:https://releases.hashicorp.com/terraform/{{ terraform_latest_version }}/terraform_{{ terraform_latest_version }}_SHA256SUMS"
    mode: "0644"
    force: false

- name: Install latest Terraform
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/terraform-{{ terraform_latest_version }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [terraform]

- name: Download latest Vault
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/vault/{{ vault_latest_version }}/vault_{{ vault_latest_version }}_linux_amd64.zip"
    dest: "{{ workstation_update_artifact_cache_dir }}/vault-{{ vault_latest_version }}.archive"
    checksum: "sha256:https://releases.hashicorp.com/vault/{{ vault_latest_version }}/vault_{{ vault_latest_version }}_SHA256SUMS"
    mode: "0644"
    force: false

- name: Install latest Vault
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/vault-{{ vault_latest_version }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [vault]

- name: Download latest Packer
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/packer/{{ packer_latest_version }}/packer_{{ packer_latest_version }}_linux_amd64.zip"
    dest: "{{ workstation_update_artifact_cache_dir }}/packer-{{ packer_latest_version }}.archive"
    checksum: "sha256:https://releases.hashicorp.com/packer/{{ packer_latest_version }}/packer_{{ packer_latest_version }}_SHA256SUMS"
    mode: "0644"
    force: false

- name: Install latest Packer
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/packer-{{ packer_latest_version }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [packer]
