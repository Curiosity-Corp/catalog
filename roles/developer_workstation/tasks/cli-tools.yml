---
# =============================================================================
# Modern CLI Tools (upstream latest releases)
# =============================================================================
# Every release source is resolved from its upstream latest release metadata.
# There are intentionally no checked-in release versions in this task.
# =============================================================================

- name: Define latest CLI archive sources
  ansible.builtin.set_fact:
    latest_cli_archives:
      - name: lazygit
        asset: >-
          {{
            latest_github_releases.lazygit.assets
            | selectattr('name', 'match', '^lazygit_.*_linux_x86_64\\.tar\\.gz$')
            | first
          }}
        include: [lazygit]
        extra_opts: []
      - name: delta
        asset: >-
          {{
            latest_github_releases.delta.assets
            | selectattr('name', 'match', '^delta-.*-x86_64-unknown-linux-gnu\\.tar\\.gz$')
            | first
          }}
        include: ["*/delta"]
        extra_opts: [--strip-components=1]
      - name: zoxide
        asset: >-
          {{
            latest_github_releases.zoxide.assets
            | selectattr('name', 'match', '^zoxide-.*-x86_64-unknown-linux-musl\\.tar\\.gz$')
            | first
          }}
        include: [zoxide]
        extra_opts: []
      - name: dust
        asset: >-
          {{
            latest_github_releases.dust.assets
            | selectattr('name', 'match', '^dust-v.*-x86_64-unknown-linux-gnu\\.tar\\.gz$')
            | first
          }}
        include: ["*/dust"]
        extra_opts: [--strip-components=1]
      - name: duf
        asset: >-
          {{
            latest_github_releases.duf.assets
            | selectattr('name', 'match', '^duf_.*_linux_x86_64\\.tar\\.gz$')
            | first
          }}
        include: [duf]
        extra_opts: []
      - name: glow
        asset: >-
          {{
            latest_github_releases.glow.assets
            | selectattr('name', 'match', '^glow_.*_Linux_x86_64\\.tar\\.gz$')
            | first
          }}
        include: ["*/glow"]
        extra_opts: [--strip-components=1]
      - name: just
        asset: >-
          {{
            latest_github_releases.just.assets
            | selectattr('name', 'match', '^just-.*-x86_64-unknown-linux-musl\\.tar\\.gz$')
            | first
          }}
        include: [just]
        extra_opts: []
      - name: watchexec
        asset: >-
          {{
            latest_github_releases.watchexec.assets
            | selectattr('name', 'match', '^watchexec-.*-x86_64-unknown-linux-gnu\\.tar\\.xz$')
            | first
          }}
        include: ["*/watchexec"]
        extra_opts: [--strip-components=1]
      - name: hyperfine
        asset: >-
          {{
            latest_github_releases.hyperfine.assets
            | selectattr('name', 'match', '^hyperfine-v.*-x86_64-unknown-linux-gnu\\.tar\\.gz$')
            | first
          }}
        include: ["*/hyperfine"]
        extra_opts: [--strip-components=1]
      - name: gum
        asset: >-
          {{
            latest_github_releases.gum.assets
            | selectattr('name', 'match', '^gum_.*_Linux_x86_64\\.tar\\.gz$')
            | first
          }}
        include: ["*/gum"]
        extra_opts: [--strip-components=1]

      # These projects publish stable "latest/download" asset names.
      - name: starship
        asset: >-
          {{ latest_github_releases.starship.assets
             | selectattr('name', 'equalto', 'starship-x86_64-unknown-linux-gnu.tar.gz')
             | first }}
        include: [starship]
        extra_opts: []
      - name: talhelper
        asset: >-
          {{ latest_github_releases.talhelper.assets
             | selectattr('name', 'equalto', 'talhelper_linux_amd64.tar.gz')
             | first }}
        include: [talhelper]
        extra_opts: []

- name: Assert latest CLI asset resolution
  ansible.builtin.assert:
    that:
      - item.asset | default({}) | length > 0
      - item.asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')
    fail_msg: "No current Linux asset matched for {{ item.name }}"
  loop: "{{ latest_cli_archives }}"
  loop_control:
    label: "{{ item.name }}"

- name: Download latest CLI archives
  ansible.builtin.get_url:
    url: "{{ item.asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/{{ item.name }}-{{ item.asset.digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ item.asset.digest }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: "{{ latest_cli_archives }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install latest CLI archives
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/{{ item.name }}-{{ item.asset.digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: "{{ item.include }}"
    extra_opts: "{{ item.extra_opts | default([]) }}"
  loop: "{{ latest_cli_archives }}"
  loop_control:
    label: "{{ item.name }}"

- name: Define latest direct CLI binaries
  ansible.builtin.set_fact:
    latest_cli_direct:
      - name: yq
        asset: >-
          {{ latest_github_releases.yq.assets
             | selectattr('name', 'equalto', 'yq_linux_amd64') | first }}
        dest: /usr/local/bin/yq
      - name: chezmoi
        asset: >-
          {{ latest_github_releases.chezmoi.assets
             | selectattr('name', 'equalto', 'chezmoi-linux-amd64') | first }}
        dest: /usr/local/bin/chezmoi

- name: Assert latest direct CLI asset resolution
  ansible.builtin.assert:
    that:
      - item.asset | default({}) | length > 0
      - item.asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')
    fail_msg: "No verified current direct CLI asset matched for {{ item.name }}"
  loop: "{{ latest_cli_direct }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install latest direct CLI binaries
  ansible.builtin.get_url:
    url: "{{ item.asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/{{ item.name }}-{{ item.asset.digest | regex_replace('^sha256:', '') }}.binary"
    checksum: "{{ item.asset.digest }}"
    mode: "0644"
    force: false
  loop: "{{ latest_cli_direct }}"
  loop_control:
    label: "{{ item.name }}"

- name: Atomically install latest direct CLI binaries
  ansible.builtin.copy:
    src: "{{ workstation_update_artifact_cache_dir }}/{{ item.name }}-{{ item.asset.digest | regex_replace('^sha256:', '') }}.binary"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: "0755"
  loop: "{{ latest_cli_direct }}"
  loop_control:
    label: "{{ item.name }}"

- name: Resolve latest golangci-lint Linux archive
  ansible.builtin.set_fact:
    _latest_golangci_lint_asset: >-
      {{
        latest_github_releases.golangci_lint.assets
        | selectattr('name', 'match', '^golangci-lint-.*-linux-amd64\\.tar\\.gz$')
        | first
      }}

- name: Require latest golangci-lint Linux archive
  ansible.builtin.assert:
    that:
      - _latest_golangci_lint_asset | default({}) | length > 0
      - _latest_golangci_lint_asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')
    fail_msg: "golangci-lint did not publish a current Linux amd64 archive"

- name: Download latest golangci-lint
  ansible.builtin.get_url:
    url: "{{ _latest_golangci_lint_asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/golangci-lint-{{ _latest_golangci_lint_asset.digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ _latest_golangci_lint_asset.digest }}"
    mode: "0644"
    force: false

- name: Install latest golangci-lint
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/golangci-lint-{{ _latest_golangci_lint_asset.digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: ["*/golangci-lint"]
    extra_opts: [--strip-components=1]

- name: Remove user shadows for catalog-managed CLI binaries
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ dev_user_home }}/go/bin/golangci-lint"
    - "{{ dev_user_home }}/go/bin/gum"
    - "{{ dev_user_home }}/go/bin/talhelper"

- name: Download latest filebrowser for workspace profile
  ansible.builtin.get_url:
    url: >-
      {{
        (latest_github_releases.filebrowser.assets
          | selectattr('name', 'equalto', 'linux-amd64-filebrowser.tar.gz')
          | first).browser_download_url
      }}
    dest: "{{ workstation_update_artifact_cache_dir }}/filebrowser-{{ (latest_github_releases.filebrowser.assets | selectattr('name', 'equalto', 'linux-amd64-filebrowser.tar.gz') | first).digest | regex_replace('^sha256:', '') }}.archive"
    checksum: >-
      {{ (latest_github_releases.filebrowser.assets
          | selectattr('name', 'equalto', 'linux-amd64-filebrowser.tar.gz')
          | first).digest }}
    mode: "0644"
    force: false
  when: workstation_profile == 'workspace'

- name: Install latest filebrowser for workspace profile
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/filebrowser-{{ (latest_github_releases.filebrowser.assets | selectattr('name', 'equalto', 'linux-amd64-filebrowser.tar.gz') | first).digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [filebrowser]
  when: workstation_profile == 'workspace'
