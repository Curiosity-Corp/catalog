---
# =============================================================================
# Minimal Desktop — Dunst Notification Configuration
# =============================================================================

- name: Ensure dunst config directory exists
  ansible.builtin.file:
    path: "{{ dw_user.home }}/.config/dunst"
    state: directory
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0755"

- name: Deploy dunst config (dark theme, compact)
  ansible.builtin.copy:
    src: minimal-desktop/dunstrc
    dest: "{{ dw_user.home }}/.config/dunst/dunstrc"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"
