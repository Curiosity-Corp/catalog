---
# =============================================================================
# Logitech G604 button profile
# =============================================================================
# Wheel tilt left/right become copy/paste and thumb button 3 toggles the
# Litra lightbar. Included only when `logitech_g604_enabled` is true (the
# hardware profile's `logitech_g604` flag). The mapping is applied by
# /usr/local/bin/curiosity-g604, which the Openbox autostart starts; it detects
# the mouse at run time, so the profile applies only while a G604 is attached.
# =============================================================================

- name: Validate the Logitech G604 button settings
  ansible.builtin.assert:
    that:
      - logitech_g604_copy_button | string is match('^[0-9]+$')
      - logitech_g604_paste_button | string is match('^[0-9]+$')
      - logitech_g604_lightbar_keycode | string is match('^[0-9]+$')
      - logitech_g604_desktop_prev_keycode | string is match('^[0-9]+$')
      - logitech_g604_desktop_next_keycode | string is match('^[0-9]+$')
      - logitech_g604_back_keycode | string is match('^[0-9]+$')
      - logitech_g604_forward_keycode | string is match('^[0-9]+$')
      - logitech_g604_dpi | string is match('^[0-9]+$')
      - logitech_g604_mic_keycode | string is match('^[0-9]+$')
      - logitech_g604_zone_keycode | string is match('^[0-9]+$')
      - logitech_g604_screenshot_keycode | string is match('^[0-9]+$')
      - logitech_g604_lightbar_command | length > 0
      - logitech_g604_lightbar_command is not search('["\']')
      - logitech_g604_copy_button | int != logitech_g604_paste_button | int
    fail_msg: >-
      The G604 copy and paste buttons must be different X button numbers, the
      lightbar keycode a number, and the lightbar command non-empty without
      quotes.

- name: Install the G604 button tooling
  ansible.builtin.apt:
    name:
      - xbindkeys
      - xdotool
      - xinput
      - ratbagd
    state: present

- name: Ensure /etc/curiosity exists
  ansible.builtin.file:
    path: /etc/curiosity
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the G604 xbindkeys profile
  ansible.builtin.template:
    src: curiosity-g604-xbindkeys.rc.j2
    dest: /etc/curiosity/g604-xbindkeys.rc
    owner: root
    group: root
    mode: "0644"

- name: Render the G604 thumb button settings
  ansible.builtin.copy:
    dest: /etc/curiosity/g604.env
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the curiosity workstation role (Logitech G604 button profile).
      CURIOSITY_G604_LIGHTBAR_KEYCODE={{ logitech_g604_lightbar_keycode | int }}
      CURIOSITY_G604_LIGHTBAR_COMMAND='{{ logitech_g604_lightbar_command }}'
      CURIOSITY_G604_DESKTOP_PREV_KEYCODE={{ logitech_g604_desktop_prev_keycode | int }}
      CURIOSITY_G604_DESKTOP_NEXT_KEYCODE={{ logitech_g604_desktop_next_keycode | int }}
      CURIOSITY_G604_BACK_KEYCODE={{ logitech_g604_back_keycode | int }}
      CURIOSITY_G604_FORWARD_KEYCODE={{ logitech_g604_forward_keycode | int }}
      CURIOSITY_G604_MIC_KEYCODE={{ logitech_g604_mic_keycode | int }}
      CURIOSITY_G604_ZONE_KEYCODE={{ logitech_g604_zone_keycode | int }}
      CURIOSITY_G604_SCREENSHOT_KEYCODE={{ logitech_g604_screenshot_keycode | int }}
      CURIOSITY_G604_SCREENSHOT_COMMAND='{{ logitech_g604_screenshot_command }}'

- name: Install the G604 profile launcher
  ansible.builtin.copy:
    src: curiosity-g604
    dest: /usr/local/bin/curiosity-g604
    owner: root
    group: root
    mode: "0755"

# XDG autostart so the launcher runs in any Openbox session, not only the
# catalog-managed minimal desktop (whose autostart also starts it; the
# launcher's per-DISPLAY lock keeps one copy). GNOME/Wayland is excluded.
- name: Autostart the G604 profile launcher in Openbox sessions
  ansible.builtin.copy:
    src: curiosity-g604.desktop
    dest: /etc/xdg/autostart/curiosity-g604.desktop
    owner: root
    group: root
    mode: "0644"

- name: Install the microphone mute toggle
  ansible.builtin.copy:
    src: curiosity-mic-mute
    dest: /usr/local/bin/curiosity-mic-mute
    owner: root
    group: root
    mode: "0755"

- name: Install the previous/next desktop switcher
  ansible.builtin.copy:
    src: curiosity-desktop
    dest: /usr/local/bin/curiosity-desktop
    owner: root
    group: root
    mode: "0755"

# The top two buttons are DPI up/down inside the mouse and send nothing to the
# computer until the onboard profile reassigns them. libratbag (ratbagd)
# writes that profile; the settings live in the mouse, so this only runs when a
# G604 is attached and only writes a button that differs.
- name: Reassign the G604 top and back buttons to F13/F14/KEY_4/KEY_5/KEY_6 in the onboard profile
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dev=$(ratbagctl list | awk '/Logitech G604/ { sub(":", "", $1); print $1; exit }')
      [ -n "$dev" ] || { echo "no G604 attached"; exit 0; }
      changed=
      # Button macros only make sense where the launcher consumes them (an
      # X11 Openbox session); elsewhere the thumb buttons would type digits.
      if [ "{{ logitech_g604_onboard_buttons | bool | lower }}" = true ]; then
        for pair in "9 KEY_F13" "10 KEY_F14" "5 KEY_6" "3 KEY_4" "4 KEY_5"; do
          set -- $pair
          current=$(ratbagctl "$dev" profile 0 button "$1" get)
          if [[ "$current" != *"$2'" ]]; then
            ratbagctl "$dev" profile 0 button "$1" action set macro "$2"
            changed=yes
          fi
        done
      fi
      # Pointer speed: make the onboard resolution the one with this DPI.
      want={{ logitech_g604_dpi | int }}
      idx=$(ratbagctl "$dev" profile 0 get | awk -v dpi="${want}dpi" '$2 == dpi || $2 == dpi":" || $3 == dpi { sub(":", "", $1); print $1; exit }')
      # The mouse can report another (disabled) profile as active, in which
      # case resolution changes in profile 0 do nothing: activate profile 0.
      if ! ratbagctl "$dev" info | grep -q "^Profile 0: (active)"; then
        ratbagctl "$dev" profile active set 0
        changed=yes
      fi
      if [ -n "$idx" ]; then
        if ! ratbagctl "$dev" profile 0 resolution "$idx" get | grep -q "(active) (default)"; then
          ratbagctl "$dev" profile 0 resolution active set "$idx"
          ratbagctl "$dev" profile 0 resolution default set "$idx"
          changed=yes
        fi
      fi
      [ -z "$changed" ] || echo CHANGED
    executable: /bin/bash
  register: _g604_onboard
  changed_when: "'CHANGED' in _g604_onboard.stdout"
  failed_when: false

# Solaar (installed for the Logitech receiver) remembers its own DPI per device
# and re-applies it whenever it starts or the mouse reconnects, overriding the
# onboard profile's speed above. The guard marks that setting "ignore" in the
# user's Solaar config. It must run while Solaar is closed (a running Solaar
# writes its in-memory copy back), so each user's Solaar autostart entry, which
# overrides the packaged /etc/xdg/autostart/solaar.desktop of the same name,
# runs the guard first and then starts Solaar exactly as the package does.
- name: Install the Solaar G604 DPI guard
  ansible.builtin.copy:
    src: curiosity-solaar-g604-dpi
    dest: /usr/local/bin/curiosity-solaar-g604-dpi
    owner: root
    group: root
    mode: "0755"

- name: Ensure each user's autostart directory exists
  ansible.builtin.file:
    path: "{{ dw_user.home }}/.config/autostart"
    state: directory
    owner: "{{ dw_user.name }}"
    mode: "0755"
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"

- name: Start Solaar through the G604 DPI guard at login
  ansible.builtin.copy:
    dest: "{{ dw_user.home }}/.config/autostart/solaar.desktop"
    owner: "{{ dw_user.name }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      # Managed by the curiosity workstation role (Logitech G604 profile):
      # keep Solaar from overriding the onboard {{ logitech_g604_dpi | int }} DPI, then start it.
      Type=Application
      Name=Solaar
      Comment=Logitech Unifying Receiver peripherals manager
      Icon=solaar
      Exec=sh -c 'curiosity-solaar-g604-dpi "$HOME/.config/solaar/config.yaml" {{ logitech_g604_dpi | int }}; exec solaar --window=hide'
      StartupNotify=false
      NoDisplay=true
      X-GNOME-Autostart-enabled=true
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
