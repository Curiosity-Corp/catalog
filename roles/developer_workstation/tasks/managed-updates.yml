---
# =============================================================================
# Software update transaction
# =============================================================================
# This include is intentionally the only place that mutates managed software
# after upstream release discovery. The caller wraps it in block/rescue/always
# so a failed health gate can restore the pre-pull snapshot and still emit a
# local run manifest.
# =============================================================================

- name: Include daily system package updates
  ansible.builtin.include_tasks: system-updates.yml
  tags: [updates, packages]
  when:
    - apt_upgrade_enabled | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include Coder CLI installation
  ansible.builtin.include_tasks: coder-cli.yml
  tags: [coder]
  when:
    - coder_cli_enabled | default(false)
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include cloud CLI installation
  ansible.builtin.include_tasks: cloud-clis.yml
  tags: [cloud]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - cloud_clis_enabled | default(true)
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include Kubernetes tools
  ansible.builtin.include_tasks: kubernetes.yml
  tags: [kubernetes]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include language runtimes
  ansible.builtin.include_tasks: languages.yml
  tags: [languages]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include DevOps utilities
  ansible.builtin.include_tasks: devops.yml
  tags: [devops]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include Python tools
  ansible.builtin.include_tasks: python-tools.yml
  tags: [python]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include scientific Python and data-science tools
  ansible.builtin.include_tasks: science-tools.yml
  tags: [science, data-science]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include modern CLI tools
  ansible.builtin.include_tasks: cli-tools.yml
  tags: [cli]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include testing frameworks
  ansible.builtin.include_tasks: testing.yml
  tags: [testing]
  when:
    - >-
      workstation_profile in ['desktop', 'workspace'] or
      (thin_client_playwright_enabled | default(false))
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include Microsoft 365 CLI
  ansible.builtin.include_tasks: m365-cli.yml
  tags: [m365]
  when:
    - workstation_profile in ['desktop', 'workspace']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include missionctl
  ansible.builtin.include_tasks: missionctl.yml
  tags: [missionctl]
  when:
    - workstation_profile == 'thin-client'
    - missionctl_enabled | default(false)
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include security tools
  ansible.builtin.include_tasks: security.yml
  tags: [security]
  when:
    - workstation_profile == 'desktop'
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include free/open-source maintenance stack
  ansible.builtin.include_tasks: maintenance.yml
  tags: [maintenance]
  when:
    - workstation_profile == 'desktop'
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include self-healing tasks
  ansible.builtin.include_tasks: self-healing.yml
  tags: [self-healing]
  when:
    - workstation_profile == 'desktop'
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include VS Code extensions
  ansible.builtin.include_tasks: vscode-extensions.yml
  tags: [vscode, extensions]
  when:
    - workstation_profile == 'desktop'
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include collaboration tools
  ansible.builtin.include_tasks: collaboration.yml
  tags: [collaboration]
  when:
    - workstation_profile == 'desktop'
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include WeeChat TUI chat client
  ansible.builtin.include_tasks: weechat.yml
  tags: [weechat, chat]
  when:
    - workstation_profile != 'thin-client'
    - weechat_enabled | default(false)
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include hardware-specific drivers and userspace tools
  ansible.builtin.include_tasks: hardware-drivers.yml
  tags: [hardware]
  when:
    - workstation_profile in ['desktop', 'thin-client', 'byod-kiosk']
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)

- name: Include fonts
  ansible.builtin.include_tasks: fonts.yml
  tags: [fonts]
  when:
    - workstation_profile == 'desktop'
    - workstation_update_install_allowed | default(true)

- name: Include Sunshine remote streaming
  ansible.builtin.include_tasks: streaming.yml
  tags: [streaming, sunshine]
  when:
    - workstation_profile == 'desktop'
    - sunshine_enabled | default(false)
    - workstation_release_discovery_available | default(true)
    - workstation_update_install_allowed | default(true)
