    apply:
      tags: [weechat, chat]
  tags: [weechat, chat]
  when:
    - workstation_profile != 'thin-client'
    - weechat_enabled | default(false)
    - workstation_update_install_allowed | default(true)

- name: Include hardware-specific drivers and userspace tools
  ansible.builtin.include_tasks:
    file: hardware-drivers.yml
    apply:
      tags: [hardware]
  tags: [hardware]
  when:
    - workstation_profile in ['desktop', 'thin-client', 'byod-kiosk']
    - workstation_update_install_allowed | default(true)

- name: Include fonts
  ansible.builtin.include_tasks:
    file: fonts.yml
    apply:
      tags: [fonts]
  tags: [fonts]
  when:
    - workstation_profile == 'desktop'
    - workstation_update_install_allowed | default(true)

- name: Include Sunshine remote streaming
  ansible.builtin.include_tasks:
    file: streaming.yml
    apply:
      tags: [streaming, sunshine]
  tags: [streaming, sunshine]
  when:
    - workstation_profile == 'desktop'
    - sunshine_enabled | default(false)
    - workstation_update_install_allowed | default(true)
