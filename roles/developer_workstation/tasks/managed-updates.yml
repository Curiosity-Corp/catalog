    apply:
      tags: [vscode, extensions]
  tags: [vscode, extensions]
  when:
    - workstation_profile == 'desktop'
    - workstation_update_install_allowed | default(true)

- name: Include collaboration tools
  ansible.builtin.include_tasks:
    file: collaboration.yml
    apply:
      tags: [collaboration]
  tags: [collaboration]
  when:
    - workstation_profile == 'desktop'
