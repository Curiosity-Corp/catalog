- name: Include missionctl
  ansible.builtin.include_tasks:
    file: missionctl.yml
    apply:
      tags: [missionctl]
  tags: [missionctl]
  when:
    - workstation_profile == 'thin-client'
    - missionctl_enabled | default(false)
    - workstation_update_install_allowed | default(true)

- name: Include security tools
  ansible.builtin.include_tasks:
    file: security.yml
    apply:
      tags: [security]
  tags: [security]
  when:
    - workstation_profile == 'desktop'
    - workstation_update_install_allowed | default(true)

- name: Include free/open-source maintenance stack
  ansible.builtin.include_tasks:
    file: maintenance.yml
    apply:
      tags: [maintenance]
  tags: [maintenance]
  when:
    - workstation_profile == 'desktop'
    - workstation_update_install_allowed | default(true)

- name: Include self-healing tasks
  ansible.builtin.include_tasks:
