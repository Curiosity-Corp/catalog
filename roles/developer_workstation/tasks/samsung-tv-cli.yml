---
# =============================================================================
# Samsung TV remote-control CLI (curiosity-tv)
# =============================================================================
# Controls the Samsung Tizen TV used as this workstation's monitor without the
# physical remote: power (Wake-on-LAN and KEY_POWER), keys, volume, apps, the
# TV browser and text entry. Included only when `samsung_tv_cli_enabled` is
# true (the hardware profile's `samsung_tv_cli` flag). The WebSocket pairing
# token is not managed here; the tool reads it from $CURIOSITY_TV_TOKEN, the
# user's 0600 cache or Azure Key Vault (`az`, from the cloud CLI baseline).
# =============================================================================

# The tool runs on the system interpreter (/usr/bin/python3), so the
# websocket-client library comes from the distribution package.
- name: Install the Samsung TV CLI dependencies
  ansible.builtin.apt:
    name:
      - python3-websocket
    state: present

- name: Create the Curiosity shared library directory
  ansible.builtin.file:
    path: /usr/local/lib/curiosity
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the shared TV locator module
  ansible.builtin.copy:
    src: curiosity_tv_locate.py
    dest: /usr/local/lib/curiosity/curiosity_tv_locate.py
    owner: root
    group: root
    mode: "0644"

- name: Install the Samsung TV remote-control CLI
  ansible.builtin.copy:
    src: curiosity-tv
    dest: /usr/local/bin/curiosity-tv
    owner: root
    group: root
    mode: "0755"

- name: Validate the Samsung TV Key Vault names
  ansible.builtin.assert:
    that:
      - samsung_tv_key_vault == '' or samsung_tv_key_vault is match('^[A-Za-z0-9][A-Za-z0-9-]*$')
      - samsung_tv_key_vault_secret is match('^[A-Za-z0-9][A-Za-z0-9-]*$')
    fail_msg: samsung_tv_key_vault and samsung_tv_key_vault_secret must be Azure Key Vault names (letters, digits, hyphens).

- name: Ensure /etc/curiosity exists
  ansible.builtin.file:
    path: /etc/curiosity
    state: directory
    owner: root
    group: root
    mode: "0755"

# Names only: the token value is never written by the role.
- name: Render the Samsung TV Key Vault settings
  ansible.builtin.copy:
    dest: /etc/curiosity/samsung-tv.env
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the curiosity workstation role (curiosity-tv). Names only.
      CURIOSITY_TV_KEY_VAULT={{ samsung_tv_key_vault }}
      CURIOSITY_TV_KEY_VAULT_SECRET={{ samsung_tv_key_vault_secret }}
