---
# =============================================================================
# Minimal Desktop — Openbox Configuration
# =============================================================================

- name: Ensure Openbox config directory exists
  ansible.builtin.file:
    path: "{{ dw_user.home }}/.config/openbox"
    state: directory
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0755"

- name: Deploy Openbox rc.xml (keybindings, theme, window rules)
  ansible.builtin.copy:
    src: minimal-desktop/rc.xml
    dest: "{{ dw_user.home }}/.config/openbox/rc.xml"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"

- name: Apply the double-click interval to Openbox rc.xml
  ansible.builtin.replace:
    path: "{{ dw_user.home }}/.config/openbox/rc.xml"
    regexp: '<doubleClickTime>[0-9]+</doubleClickTime>'
    replace: "<doubleClickTime>{{ minimal_desktop_double_click_ms }}</doubleClickTime>"

# A template so opt-in apps add their entries (Jellyfin, jellyfin-desktop.yml;
# the Media submenu, media-folder.yml). Openbox reads it at its next start or
# "Reconfigure Openbox"; the role does not touch a running session.
- name: Deploy Openbox menu.xml
  ansible.builtin.template:
    src: minimal-desktop-menu.xml.j2
    dest: "{{ dw_user.home }}/.config/openbox/menu.xml"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"

- name: Deploy Openbox autostart
  ansible.builtin.copy:
    src: minimal-desktop/autostart
    dest: "{{ dw_user.home }}/.config/openbox/autostart"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0755"

- name: Ensure Onyx-Large theme directory exists
  ansible.builtin.file:
    path: "{{ dw_user.home }}/.themes/Onyx-Large/openbox-3"
    state: directory
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0755"

- name: Deploy Onyx-Large theme (bigger titlebars)
  ansible.builtin.copy:
    src: minimal-desktop/onyx-large-themerc
    dest: "{{ dw_user.home }}/.themes/Onyx-Large/openbox-3/themerc"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"
