---
- name: Deploy hyper-workspace helper script
  ansible.builtin.copy:
    src: hyper-workspace
    dest: /usr/local/bin/hyper-workspace
    mode: "0755"
    owner: root
    group: root

- name: Add tmux configuration for hyper-workspace
  ansible.builtin.blockinfile:
    path: "{{ dev_user_home }}/.tmux.conf"
    create: true
    mode: "0644"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    marker: "# {mark} ANSIBLE MANAGED: hyper-workspace tmux config"
    block: |
      # -- hyper-workspace requirements --
      set -g history-limit 100000
      set -g base-index 1
      set -g renumber-windows on
      set -g status-position top
      set -g mouse on
      set -g set-remain-on-exit on
      set-option -g automatic-rename off
      set-option -g allow-rename off
      set-window-option -g automatic-rename off
      set-window-option -g allow-rename off

      # Window selection — Alt+number
      bind -n M-1 select-window -t 1
      bind -n M-2 select-window -t 2
      bind -n M-3 select-window -t 3
      bind -n M-4 select-window -t 4
      bind -n M-5 select-window -t 5
      bind -n M-6 select-window -t 6
      bind -n M-7 select-window -t 7
      bind -n M-8 select-window -t 8

      # Window navigation — Alt+Left/Right
      bind -n M-Left previous-window
      bind -n M-Right next-window

- name: Remove old claude-workspace script (renamed to hyper-workspace)
  ansible.builtin.file:
    path: /usr/local/bin/claude-workspace
    state: absent
