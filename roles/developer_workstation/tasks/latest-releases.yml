---
# =============================================================================
# Upstream release discovery
# =============================================================================
# The lab deliberately has no application release pins. Query the upstream
# release APIs once per ansible-pull and let each installer select its native
# Linux asset from the current release.
# =============================================================================

- name: Resolve an available GitHub API token without exposing it in task output
  ansible.builtin.set_fact:
    _github_api_token: >-
      {{ github_api_token | default('', true) | trim
         or lookup('ansible.builtin.env', 'GITHUB_TOKEN') | trim
         or lookup('ansible.builtin.env', 'GH_TOKEN') | trim }}
  no_log: true

- name: Resolve GitHub CLI token for release discovery
  ansible.builtin.command:
    argv:
      - gh
      - auth
      - token
      - --hostname
      - github.com
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  register: _github_cli_token
  changed_when: false
  failed_when: false
  no_log: true
  when: _github_api_token | length == 0

- name: Prefer the authenticated GitHub CLI token when available
  ansible.builtin.set_fact:
    _github_api_token: >-
      {{ _github_api_token | default('', true) | trim
         or (_github_cli_token.stdout | default('') | trim) }}
  no_log: true

- name: Query latest GitHub releases for binary applications
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ item.value }}/releases/latest"
    headers: >-
      {{
        {
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'User-Agent': 'curiosity-catalog-workstation-updater'
        }
        | combine(
            ({'Authorization': 'Bearer ' ~ _github_api_token}
             if (_github_api_token | default('') | length > 0) else {})
          )
      }}
    return_content: true
    status_code: [200]
  loop: "{{ latest_github_repositories | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value }})"
  register: _latest_release_queries
  retries: 3
  delay: 2
  until: (_latest_release_queries.status | default(0)) == 200
  failed_when: false
  changed_when: false
  # The request headers may contain a GitHub token.  Ansible's module
  # invocation logging is enabled on some workstation images, so suppress
  # both the request arguments and the registered response from task output.
  no_log: true

- name: Index latest GitHub release metadata
  ansible.builtin.set_fact:
    latest_github_releases: >-
      {{ latest_github_releases | default({}) |
         combine({item.item.key: item.json}) }}
  loop: "{{ _latest_release_queries.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.status | default(0) == 200
    - item.json.tag_name is defined

- name: Identify release sources without a binary-bearing latest release
  ansible.builtin.set_fact:
    _release_sources_needing_fallback: >-
      {{ _release_sources_needing_fallback | default([]) + [item.item] }}
  loop: "{{ _latest_release_queries.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.status | default(0) != 200 or
      (item.json.assets | default([]) | length) == 0

- name: Query recent GitHub releases for sources without binary-bearing latest releases
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ item.value }}/releases?per_page=20"
    headers: >-
      {{
        {
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'User-Agent': 'curiosity-catalog-workstation-updater'
        }
        | combine(
            ({'Authorization': 'Bearer ' ~ _github_api_token}
             if (_github_api_token | default('') | length > 0) else {})
          )
      }}
    return_content: true
    status_code: [200]
  loop: "{{ _release_sources_needing_fallback | default([]) }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value }})"
  register: _github_release_fallback_queries
  retries: 3
  delay: 2
  until: (_github_release_fallback_queries.status | default(0)) == 200
  failed_when: false
  changed_when: false
  # The fallback request has the same optional bearer header as the primary
  # request, so keep its arguments and response out of task logging as well.
  no_log: true

- name: Index newest stable GitHub release with binary assets
  ansible.builtin.set_fact:
    latest_github_releases: >-
      {{ latest_github_releases | default({}) |
         combine({item.item.key: (
           item.json
           | selectattr('draft', 'equalto', false)
           | selectattr('prerelease', 'equalto', false)
           | selectattr('assets', 'defined')
           | selectattr('assets')
           | first
         )}) }}
  loop: "{{ _github_release_fallback_queries.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.status | default(0) == 200
    - >-
      (
        item.json
        | selectattr('draft', 'equalto', false)
        | selectattr('prerelease', 'equalto', false)
        | selectattr('assets', 'defined')
        | selectattr('assets')
        | list
        | length
      ) > 0

- name: Require latest metadata for every binary release source
  ansible.builtin.assert:
    that:
      - item in (latest_github_releases | default({}))
      - (latest_github_releases[item].assets | default([]) | length) > 0
    fail_msg: >-
      Could not resolve a current upstream release for {{ item }}. The lab
      refuses to fall back to a stale version or silently keep an old binary.
  loop: "{{ latest_github_repositories.keys() | list }}"

- name: Build the compact upstream release manifest
  ansible.builtin.set_fact:
    latest_github_release_summary: >-
      {{ latest_github_release_summary | default({}) | combine({
        item.key: {
          'repository': latest_github_repositories[item.key],
          'tag_name': item.value.tag_name,
          'name': item.value.name | default(item.value.tag_name),
          'published_at': item.value.published_at | default(''),
          'html_url': item.value.html_url | default(''),
          'assets': item.value.assets | map(attribute='name') | list
        }
      }) }}
  loop: "{{ latest_github_releases | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Index verified GitHub asset digests without duplicating release payloads
  ansible.builtin.set_fact:
    latest_github_asset_checksums: >-
      {{ latest_github_asset_checksums | default({}) | combine(
        dict(
          (
            item.value.assets
            | selectattr('browser_download_url', 'defined')
            | selectattr('digest', 'defined')
            | selectattr('digest', 'match', '^sha256:[0-9a-f]{64}$')
            | map(attribute='browser_download_url')
            | list
          )
          | zip(
            item.value.assets
            | selectattr('browser_download_url', 'defined')
            | selectattr('digest', 'defined')
            | selectattr('digest', 'match', '^sha256:[0-9a-f]{64}$')
            | map(attribute='digest')
            | list
          )
        )
      ) }}
  loop: "{{ latest_github_releases | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Require GitHub asset digests for verification
  ansible.builtin.assert:
    that:
      - latest_github_asset_checksums | default({}) | length > 0
    fail_msg: >-
      GitHub returned no SHA-256 asset digests. The workstation refuses to
      install release artifacts without a verifiable digest.

- name: Persist the verified upstream release manifest locally
  ansible.builtin.copy:
    content: >-
      {{
        {
          'schema': 'curiosity.workstation.upstream/v1',
          'resolved_at': ansible_date_time.iso8601,
          'catalog_commit': workstation_catalog_commit,
          'releases': latest_github_release_summary,
          'asset_checksums': latest_github_asset_checksums
        } | to_nice_json
      }}
    dest: "{{ workstation_update_state_dir }}/observations/{{ workstation_update_run_id }}-upstream.json"
    owner: root
    group: root
    mode: "0600"
