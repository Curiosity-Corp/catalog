---
# Optional x11vnc mirroring of the physical LightDM/Openbox X11 display.
# The desktop stack is configured first by minimal-desktop.yml. This option
# leaves account authentication, screen locking and display layout intact.

- name: Create x11vnc systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/x11vnc.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=x11vnc VNC Server (mirrors physical display)
      After=display-manager.service
      Requires=display-manager.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/x11vnc -display :0 -auth guess -forever -loop -noxdamage -repeat -shared -rfbport 5900
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=graphical.target
  notify: Reload systemd

- name: Enable x11vnc service
  ansible.builtin.systemd:
    name: x11vnc
    enabled: true
    daemon_reload: true
