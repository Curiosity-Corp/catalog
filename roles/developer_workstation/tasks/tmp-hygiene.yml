---
# =============================================================================
# /tmp hygiene: age-based cleanup plus hourly pressure relief
# =============================================================================
# Included from main.yml on systemd-based desktop/thin-client/kiosk profiles
# outside containers. Everything is declarative and uses native tooling:
#
#   * /etc/tmpfiles.d/00-curiosity-tmp.conf gives /tmp an age, so the stock
#     systemd-tmpfiles-clean.timer does the daily cleaning (no custom cleaner);
#   * curiosity-tmp-pressure.{service,timer} run the same cleanup early when
#     the tmpfs holding /tmp is nearly full, optionally followed by one
#     shorter-age pass that is scoped to /tmp and keeps every package-declared
#     exclusion;
#   * a tmp.mount drop-in raises the tmpfs inode cap (nr_inodes), sized from
#     RAM by default, and the running /tmp is remounted with it.
#
# It never deletes by name pattern and never touches systemd-private-*
# directories of running services. When tmp_hygiene_enabled is false (or the
# pressure sub-feature is off) the files it previously managed are removed.
# =============================================================================

- name: Apply /tmp hygiene policy
  when: tmp_hygiene_enabled | bool
  block:
    - name: Validate /tmp hygiene inputs
      ansible.builtin.assert:
        that:
          - tmp_hygiene_max_age is string
          - tmp_hygiene_max_age is match('^[1-9][0-9]*(m|h|d|w)$')
          - tmp_hygiene_pressure_threshold | string is match('^[0-9]+$')
          - tmp_hygiene_pressure_threshold | int >= 1
          - tmp_hygiene_pressure_threshold | int <= 100
          - tmp_hygiene_pressure_inode_threshold | string is match('^[0-9]+$')
          - tmp_hygiene_pressure_inode_threshold | int >= 1
          - tmp_hygiene_pressure_inode_threshold | int <= 100
          - tmp_hygiene_nr_inodes | string is match('^(auto|[1-9][0-9]*[kmg]?)?$')
          - tmp_hygiene_pressure_age is string
          - tmp_hygiene_pressure_age == '' or tmp_hygiene_pressure_age is match('^[1-9][0-9]*(m|h|d|w)$')
          - tmp_hygiene_pressure_interval is string
          - tmp_hygiene_pressure_interval is match('^[1-9][0-9]*(min|m|h|d)$')
          - tmp_hygiene_exclusions is sequence
          - tmp_hygiene_exclusions is not string
          - tmp_hygiene_extra_exclusions is sequence
          - tmp_hygiene_extra_exclusions is not string
          - >-
            (tmp_hygiene_exclusions + tmp_hygiene_extra_exclusions)
            | reject('match', '^[xX] /tmp/[^ ]+$') | list | length == 0
          - >-
            (tmp_hygiene_exclusions + tmp_hygiene_extra_exclusions)
            | select('search', '[.][.]') | list | length == 0
        fail_msg: >-
          tmp_hygiene_max_age and tmp_hygiene_pressure_age must be a systemd
          time span such as 3d (units m, h, d, w; the age may be empty only for
          tmp_hygiene_pressure_age), tmp_hygiene_pressure_threshold and
          tmp_hygiene_pressure_inode_threshold must be 1-100,
          tmp_hygiene_nr_inodes must be auto, empty or a count such as 4m,
          tmp_hygiene_pressure_interval must look like 1h, and every exclusion
          must be a tmpfiles.d 'x' or 'X' line for a path under /tmp (no spaces,
          no '..').

    - name: Install /tmp age-based cleanup drop-in
      # Read by the vendor systemd-tmpfiles-clean.timer; no custom cleaner.
      ansible.builtin.template:
        src: curiosity-tmp-hygiene.tmpfiles.conf.j2
        dest: "{{ tmp_hygiene_tmpfiles_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Ensure the native tmpfiles clean timer is enabled
      ansible.builtin.systemd:
        name: systemd-tmpfiles-clean.timer
        enabled: true
        state: started

- name: Remove the /tmp age-based cleanup drop-in when /tmp hygiene is off
  ansible.builtin.file:
    path: "{{ tmp_hygiene_tmpfiles_path }}"
    state: absent
  when: not (tmp_hygiene_enabled | bool)

# ---- Inode cap ----
# systemd mounts /tmp with nr_inodes=1m. Many tiny files (agent session trees,
# pytest directories, virtualenvs) exhaust that with most blocks still free.
# An inode costs memory only once a file exists, so a high cap is cheap.
# `auto` is the tmpfs size (50% of RAM) divided by 4 KiB, which is the kernel's
# own tmpfs default: every non-empty file takes at least one page, so inodes
# and blocks run out at about the same point. Bounded to 1m (no drop-in) .. 16m.

- name: Resolve the /tmp inode cap
  ansible.builtin.set_fact:
    _tmp_hygiene_nr_inodes: >-
      {%- set requested = tmp_hygiene_nr_inodes | string | trim -%}
      {%- if requested == 'auto' -%}
      {%- set kib = [((ansible_memtotal_mb | int) * 128 / 1024) | round | int, 16384] | min -%}
      {{- '' if kib <= 1024 else ((kib // 1024) ~ 'm' if kib % 1024 == 0 else kib ~ 'k') -}}
      {%- else -%}
      {{- requested -}}
      {%- endif -%}
  when: tmp_hygiene_enabled | bool

- name: Derive the tmp.mount options for the inode cap
  when:
    - tmp_hygiene_enabled | bool
    - _tmp_hygiene_nr_inodes | string | length > 0
  block:
    # The unit that defines tmp.mount: the vendor file, an admin override in
    # /etc, or the fstab generator's unit. Empty when tmp.mount does not exist.
    - name: Find the unit file that defines tmp.mount
      ansible.builtin.command:
        argv: [systemctl, show, --property=FragmentPath, --value, tmp.mount]
      register: _tmp_hygiene_tmp_mount_fragment
      changed_when: false

    - name: Read the unit file that defines tmp.mount
      ansible.builtin.slurp:
        src: "{{ _tmp_hygiene_tmp_mount_fragment.stdout | trim }}"
      register: _tmp_hygiene_tmp_mount_unit
      when:
        - _tmp_hygiene_tmp_mount_fragment.stdout | trim is match('^/')
        - _tmp_hygiene_tmp_mount_fragment.stdout | trim != '/dev/null'

    # Only a tmpfs tmp.mount whose last Options= line is a plain option list
    # (no line continuation) is managed; nr_inodes would break any other type.
    - name: Record the tmp.mount type and options
      ansible.builtin.set_fact:
        _tmp_hygiene_tmp_mount_options: "{{ _tmp_hygiene_unit_options }}"
        _tmp_hygiene_tmp_mount_derivable: >-
          {{ (_tmp_hygiene_unit_lines | select('match', 'Type=') | map('regex_replace', '^Type=\s*', '')
              | list | last | default('')) == 'tmpfs'
             and _tmp_hygiene_unit_options is match('^[^\s\\]*$') }}
      vars:
        _tmp_hygiene_unit_lines: >-
          {{ (_tmp_hygiene_tmp_mount_unit.content | b64decode).splitlines() | map('trim') | list
             if _tmp_hygiene_tmp_mount_unit.content is defined else [] }}
        _tmp_hygiene_unit_options: >-
          {{ _tmp_hygiene_unit_lines | select('match', 'Options=') | map('regex_replace', '^Options=\s*', '')
             | list | last | default('') }}

    - name: Report a tmp.mount the inode cap cannot manage
      ansible.builtin.debug:
        msg: >-
          tmp.mount is defined by '{{ _tmp_hygiene_tmp_mount_fragment.stdout | trim }}',
          which is missing, not a tmpfs or has an Options= line that cannot be
          rewritten safely; leaving the /tmp inode cap at its current value.
      when: not (_tmp_hygiene_tmp_mount_derivable | bool)

- name: Install the /tmp inode cap drop-in
  ansible.builtin.template:
    src: curiosity-tmp-inodes.mount.conf.j2
    dest: "{{ tmp_hygiene_nr_inodes_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - tmp_hygiene_enabled | bool
    - _tmp_hygiene_nr_inodes | string | length > 0
    - _tmp_hygiene_tmp_mount_derivable | bool
  notify:
    - Reload systemd
    - Remount /tmp with the managed inode cap

# The running mount keeps its current cap until the next boot; lowering it
# live could fail while the inodes are in use.
- name: Remove the /tmp inode cap drop-in when it is not wanted
  ansible.builtin.file:
    path: "{{ tmp_hygiene_nr_inodes_dropin_path }}"
    state: absent
  when: >-
    not ((tmp_hygiene_enabled | bool)
         and (_tmp_hygiene_nr_inodes | default('') | string | length > 0)
         and (_tmp_hygiene_tmp_mount_derivable | default(false) | bool))
  notify: Reload systemd

# ---- Pressure relief ----

- name: Apply /tmp pressure relief
  when:
    - tmp_hygiene_enabled | bool
    - tmp_hygiene_pressure_enabled | bool
  block:
    - name: Ensure the Curiosity configuration directory exists
      ansible.builtin.file:
        path: /etc/curiosity
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install /tmp pressure helper
      ansible.builtin.copy:
        src: curiosity-tmp-pressure
        dest: "{{ tmp_hygiene_pressure_script_path }}"
        owner: root
        group: root
        mode: "0755"

    # Deliberately outside /etc/tmpfiles.d so the daily timer never reads it.
    - name: Write the shorter-age pressure pass configuration
      ansible.builtin.template:
        src: curiosity-tmp-pressure.tmpfiles.conf.j2
        dest: "{{ tmp_hygiene_pressure_config_path }}"
        owner: root
        group: root
        mode: "0644"
      when: tmp_hygiene_pressure_age | length > 0

    - name: Remove the shorter-age pressure pass configuration when it is disabled
      ansible.builtin.file:
        path: "{{ tmp_hygiene_pressure_config_path }}"
        state: absent
      when: tmp_hygiene_pressure_age | length == 0

    - name: Install /tmp pressure systemd service
      ansible.builtin.template:
        src: curiosity-tmp-pressure.service.j2
        dest: /etc/systemd/system/curiosity-tmp-pressure.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install /tmp pressure systemd timer
      ansible.builtin.template:
        src: curiosity-tmp-pressure.timer.j2
        dest: /etc/systemd/system/curiosity-tmp-pressure.timer
        owner: root
        group: root
        mode: "0644"
      notify: Restart curiosity tmp-pressure timer

    - name: Enable /tmp pressure timer
      ansible.builtin.systemd:
        name: curiosity-tmp-pressure.timer
        enabled: true
        state: started
        daemon_reload: true

- name: Retire /tmp pressure relief when it is not wanted
  when: not ((tmp_hygiene_enabled | bool) and (tmp_hygiene_pressure_enabled | bool))
  block:
    - name: Check for a previously managed /tmp pressure timer
      ansible.builtin.stat:
        path: /etc/systemd/system/curiosity-tmp-pressure.timer
      register: _tmp_hygiene_pressure_timer

    - name: Stop and disable the /tmp pressure timer
      ansible.builtin.systemd:
        name: curiosity-tmp-pressure.timer
        enabled: false
        state: stopped
        daemon_reload: true
      when: _tmp_hygiene_pressure_timer.stat.exists

    - name: Remove managed /tmp pressure files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/curiosity-tmp-pressure.timer
        - /etc/systemd/system/curiosity-tmp-pressure.service
        - "{{ tmp_hygiene_pressure_script_path }}"
        - "{{ tmp_hygiene_pressure_config_path }}"
      notify: Reload systemd
