---
# =============================================================================
# Install the standalone Codex CLI from the resolved openai/codex release
# =============================================================================
# Included by codex-standalone.yml inside a block whose rescue turns a failure
# here into a warning. Every task fails closed on its own, so this file is
# also safe to run alone (tests/test_verified_download*.py do).
# Needs latest_github_releases.codex from latest-releases.yml.
# =============================================================================

# The installer comes from the latest openai/codex GitHub release (the same
# install.sh chatgpt.com/codex/install.sh serves), verified against the digest
# GitHub records for the asset, and installs that same release; the script
# then checks every binary it fetches against the release digests (catalog#171).
- name: Select the Codex installer from the latest release
  ansible.builtin.set_fact:
    _codex_installer_asset: >-
      {{ latest_github_releases.codex.assets | default([])
         | selectattr('name', 'equalto', 'install.sh') | first | default({}) }}
    _codex_release_version: >-
      {{ (codex_standalone_release == 'latest')
         | ternary(latest_github_releases.codex.tag_name | default('') | regex_replace('^rust-v', ''),
                   codex_standalone_release) }}
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Require a verified Codex installer
  ansible.builtin.assert:
    that:
      - _codex_installer_asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')
      - _codex_release_version is match('^[0-9]+[.][0-9]+[.][0-9]+')
    fail_msg: >-
      {%- set _codex_release = (latest_github_releases | default({})).codex | default({}) -%}
      {{ (('The resolved openai/codex release ' ~ _codex_release.tag_name ~ ' has no install.sh asset with a SHA-256 digest')
          if (_codex_release.tag_name | default('') | length > 0)
          else 'No openai/codex release was resolved in this run (latest-releases.yml did not run first)')
         ~ '; refusing to run an unverified installer.' }}
    quiet: true
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Download and verify the Codex standalone installer
  ansible.builtin.include_tasks:
    file: verified-download.yml
    apply:
      become: true
      become_user: "{{ dev_user }}"
  vars:
    verified_download_name: codex-install.sh
    verified_download_url: "{{ _codex_installer_asset.browser_download_url }}"
    verified_download_sha256: "{{ _codex_installer_asset.digest }}"
    verified_download_cache_dir: "{{ dev_user_home }}/.cache/curiosity-corp/downloads"
    verified_download_mode: "0700"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Install standalone Codex CLI
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ verified_download_path }}"
  environment:
    HOME: "{{ dev_user_home }}"
    CODEX_RELEASE: "{{ _codex_release_version }}"
    CODEX_NON_INTERACTIVE: "true"
    CODEX_INSTALL_DIR: "{{ codex_standalone_install_dir }}"
    CODEX_HOME: "{{ codex_standalone_home_dir }}"
  register: _codex_standalone_install
  failed_when: _codex_standalone_install.rc != 0
  changed_when: _codex_standalone_install.rc == 0
  become: true
  become_user: "{{ dev_user }}"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Verify standalone Codex launcher
  ansible.builtin.command: "{{ codex_standalone_install_dir }}/codex --version"
  register: _codex_standalone_verify
  changed_when: false
  failed_when: _codex_standalone_verify.rc != 0
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: codex_standalone_enabled | default(true)

- name: Clean up Codex standalone installer
  ansible.builtin.file:
    path: "{{ verified_download_path }}"
    state: absent
  become: true
  become_user: "{{ dev_user }}"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0
