---
# =============================================================================
# Minimal Desktop — Picom Compositor Configuration
# =============================================================================

- name: Ensure picom config directory exists
  ansible.builtin.file:
    path: "{{ dw_user.home }}/.config/picom"
    state: directory
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0755"

- name: Deploy picom config (GLX, Intel-optimized, no shadows/blur)
  ansible.builtin.copy:
    src: minimal-desktop/picom.conf
    dest: "{{ dw_user.home }}/.config/picom/picom.conf"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"
