---
# =============================================================================
# Kubernetes & GitOps tools (upstream latest releases)
# =============================================================================

# --- kubectl ---
- name: Resolve latest kubectl release
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: _kubectl_latest
  changed_when: false

- name: Install latest kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ _kubectl_latest.content | trim }}/bin/linux/amd64/kubectl"
    dest: "{{ workstation_update_artifact_cache_dir }}/kubectl-{{ _kubectl_latest.content | trim }}"
    checksum: "sha256:https://dl.k8s.io/release/{{ _kubectl_latest.content | trim }}/bin/linux/amd64/kubectl.sha256"
    mode: "0755"
    force: false

- name: Atomically install latest kubectl
  ansible.builtin.copy:
    src: "{{ workstation_update_artifact_cache_dir }}/kubectl-{{ _kubectl_latest.content | trim }}"
    dest: /usr/local/bin/kubectl
    remote_src: true
    mode: "0755"

# --- Helm ---
- name: Resolve latest Helm artifact checksum
  ansible.builtin.uri:
    url: "https://get.helm.sh/helm-{{ latest_github_releases.helm.tag_name }}-linux-amd64.tar.gz.sha256sum"
    return_content: true
  register: _helm_checksum_response
  changed_when: false

- name: Normalize latest Helm artifact checksum
  ansible.builtin.set_fact:
    _helm_sha256: >-
      {{ (_helm_checksum_response.content
          | regex_search('[0-9a-fA-F]{64}'))
          | default('', true) | lower }}

- name: Require a valid latest Helm artifact checksum
  ansible.builtin.assert:
    that:
      - _helm_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Helm returned no usable SHA-256 checksum for
      {{ latest_github_releases.helm.tag_name }}; refusing to install an
      unverifiable archive.

- name: Check cached Helm artifact integrity
  ansible.builtin.stat:
    path: "{{ workstation_update_artifact_cache_dir }}/helm-{{ latest_github_releases.helm.tag_name }}.archive"
    checksum_algorithm: sha256
  register: _helm_cached_artifact

- name: Remove an invalid cached Helm artifact
  ansible.builtin.file:
    path: "{{ workstation_update_artifact_cache_dir }}/helm-{{ latest_github_releases.helm.tag_name }}.archive"
    state: absent
  when:
    - _helm_cached_artifact.stat.exists | default(false)
    - _helm_cached_artifact.stat.checksum | default('') != _helm_sha256

- name: Download latest Helm
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ latest_github_releases.helm.tag_name }}-linux-amd64.tar.gz"
    dest: "{{ workstation_update_artifact_cache_dir }}/helm-{{ latest_github_releases.helm.tag_name }}.archive"
    checksum: "sha256:{{ _helm_sha256 }}"
    mode: "0644"
    force: false

- name: Install latest Helm
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/helm-{{ latest_github_releases.helm.tag_name }}.archive"
    dest: /usr/local/bin
    remote_src: true
    # Helm's Linux archive has a stable top-level member. An exact member
    # avoids Ansible's tar handler treating `*/helm` as a literal filename
    # when it does not enable tar wildcard matching.
    include: ["linux-amd64/helm"]
    extra_opts: [--strip-components=1]

# --- Kustomize ---
- name: Download latest Kustomize
  ansible.builtin.get_url:
    url: >-
      {{
        (latest_github_releases.kustomize.assets
        | selectattr('name', 'match', '^kustomize_v.*_linux_amd64[.]tar[.]gz$')
        | first).browser_download_url
      }}
    dest: "{{ workstation_update_artifact_cache_dir }}/kustomize-{{ (latest_github_releases.kustomize.assets | selectattr('name', 'match', '^kustomize_v.*_linux_amd64[.]tar[.]gz$') | first).digest | regex_replace('^sha256:', '') }}.archive"
    checksum: >-
      {{ (latest_github_releases.kustomize.assets
          | selectattr('name', 'match', '^kustomize_v.*_linux_amd64[.]tar[.]gz$')
          | first).digest }}
    mode: "0644"
    force: false

- name: Install latest Kustomize
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/kustomize-{{ (latest_github_releases.kustomize.assets | selectattr('name', 'match', '^kustomize_v.*_linux_amd64[.]tar[.]gz$') | first).digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [kustomize]

