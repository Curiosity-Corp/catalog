# --- Krew (kubectl plugin manager) ---
- name: Resolve latest verified Krew asset
  ansible.builtin.set_fact:
    _krew_latest_asset: >-
      {{ latest_github_releases.krew.assets
         | selectattr('name', 'equalto', 'krew-linux_amd64.tar.gz') | first }}

- name: Require a verified Krew asset
  ansible.builtin.assert:
    that:
      - _krew_latest_asset | default({}) | length > 0
      - _krew_latest_asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')

- name: Download latest Krew release into the verified cache
  ansible.builtin.get_url:
    url: "{{ _krew_latest_asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/krew-{{ _krew_latest_asset.digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ _krew_latest_asset.digest }}"
    mode: "0644"
    force: false

- name: Create Krew staging directory
  ansible.builtin.file:
    path: "/tmp/curiosity-krew-{{ _krew_latest_asset.digest | regex_replace('^sha256:', '') }}"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0750"
  become: true

- name: Extract verified Krew installer
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/krew-{{ _krew_latest_asset.digest | regex_replace('^sha256:', '') }}.archive"
    dest: "/tmp/curiosity-krew-{{ _krew_latest_asset.digest | regex_replace('^sha256:', '') }}"
    remote_src: true
    include: [krew-linux_amd64]

- name: Make the verified Krew installer executable
  ansible.builtin.file:
    path: "/tmp/curiosity-krew-{{ _krew_latest_asset.digest | regex_replace('^sha256:', '') }}/krew-linux_amd64"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Install Krew if absent
  ansible.builtin.command:
    argv:
      - "/tmp/curiosity-krew-{{ _krew_latest_asset.digest | regex_replace('^sha256:', '') }}/krew-linux_amd64"
      - install
      - krew
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  args:
    creates: "{{ dev_user_home }}/.krew/bin/kubectl-krew"

- name: Remove Krew staging directory
  ansible.builtin.file:
    path: "/tmp/curiosity-krew-{{ _krew_latest_asset.digest | regex_replace('^sha256:', '') }}"
    state: absent

- name: Update Krew plugin index
  ansible.builtin.command: "{{ dev_user_home }}/.krew/bin/kubectl-krew update"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "{{ dev_user_home }}/.krew/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: true
  failed_when: false

- name: Update Krew itself
  ansible.builtin.command: "{{ dev_user_home }}/.krew/bin/kubectl-krew upgrade"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "{{ dev_user_home }}/.krew/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: true
  failed_when: false

