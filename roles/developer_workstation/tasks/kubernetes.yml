- name: Require a verified Flux CLI asset
  ansible.builtin.assert:
    that:
      - _flux_latest_asset | default({}) | length > 0
      - _flux_latest_asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')

- name: Download latest Flux CLI
  ansible.builtin.get_url:
    url: "{{ _flux_latest_asset.browser_download_url }}"
