---
# =============================================================================
# Converge one vendor APT keyring to the vendor-published content
# =============================================================================
# Included once per vendor from the repos*.yml files. The key is fetched on
# every run (never guarded by `creates:`), so a vendor key rotation reaches
# every host instead of leaving the first-seen keyring in place forever.
#
# Inputs (set with `vars:` on the include):
#   apt_keyring_name         Short vendor id; names the staging files.
#   apt_keyring_url          Vendor-published key (binary or ASCII-armored).
#   apt_keyring_dest         Destination path referenced by signed-by=.
#                            *.asc is installed armored, anything else is
#                            installed as a binary (dearmored) keyring.
#   apt_keyring_fingerprint  Optional. When set, the downloaded key must
#                            contain this fingerprint or the run fails.
#
# The destination is only rewritten, and `Update apt cache` only notified,
# when the vendor content differs from what is installed.
# =============================================================================

- name: Ensure APT keyring directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ apt_keyring_staging_dir }}"
    - "{{ apt_keyring_dest | dirname }}"

- name: Download vendor APT signing key for {{ apt_keyring_name }}
  ansible.builtin.get_url:
    url: "{{ apt_keyring_url }}"
    dest: "{{ apt_keyring_staging_dir }}/{{ apt_keyring_name }}.download"
    mode: "0644"
    force: true
    timeout: 30
  register: _apt_keyring_download
  retries: 3
  delay: 5
  until: _apt_keyring_download is succeeded

- name: Detect ASCII armor in the downloaded key for {{ apt_keyring_name }}
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --text
      - --fixed-strings
      - "--regexp=-----BEGIN PGP PUBLIC KEY BLOCK-----"
      - "{{ apt_keyring_staging_dir }}/{{ apt_keyring_name }}.download"
  register: _apt_keyring_armor
  changed_when: false
  failed_when: _apt_keyring_armor.rc not in [0, 1]

- name: Require an armored download for an armored keyring path for {{ apt_keyring_name }}
  ansible.builtin.assert:
    that: _apt_keyring_armor.rc == 0
    fail_msg: >-
      {{ apt_keyring_url }} is not ASCII-armored but {{ apt_keyring_dest }}
      is an armored keyring path
  when: apt_keyring_dest.endswith('.asc')

- name: Dearmor the downloaded key for {{ apt_keyring_name }}
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - "{{ apt_keyring_staging_dir }}/{{ apt_keyring_name }}.keyring"
      - "{{ apt_keyring_staging_dir }}/{{ apt_keyring_name }}.download"
  changed_when: false
  when:
    - not apt_keyring_dest.endswith('.asc')
    - _apt_keyring_armor.rc == 0

- name: Select the keyring content to install for {{ apt_keyring_name }}
  ansible.builtin.set_fact:
    _apt_keyring_candidate: >-
      {{ apt_keyring_staging_dir }}/{{ apt_keyring_name }}.{{
        'keyring' if (not apt_keyring_dest.endswith('.asc') and _apt_keyring_armor.rc == 0)
        else 'download'
      }}

- name: Inspect the keyring content for {{ apt_keyring_name }}
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ _apt_keyring_candidate }}"
  register: _apt_keyring_info
  changed_when: false
  failed_when: false

- name: Require a valid key before replacing the installed keyring for {{ apt_keyring_name }}
  ansible.builtin.assert:
    that:
      - _apt_keyring_info.rc == 0
      - _apt_keyring_info.stdout_lines | select('match', '^pub:') | list | length > 0
      - >-
        (apt_keyring_fingerprint | default('')) | length == 0
        or (_apt_keyring_info.stdout_lines
            | select('match', '^fpr:.*:' ~ apt_keyring_fingerprint ~ ':')
            | list | length > 0)
    fail_msg: >-
      {{ apt_keyring_url }} did not yield a valid OpenPGP key{{
        (' with fingerprint ' ~ apt_keyring_fingerprint)
        if (apt_keyring_fingerprint | default('')) | length > 0 else ''
      }}; {{ apt_keyring_dest }} was left unchanged

- name: Install the APT keyring for {{ apt_keyring_name }}
  ansible.builtin.copy:
    src: "{{ _apt_keyring_candidate }}"
    dest: "{{ apt_keyring_dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache
