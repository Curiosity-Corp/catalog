---
# =============================================================================
# APT Repository Setup (Thin Client Profile)
# =============================================================================
# Access appliances only need native browser access, OpenZiti, and optional
# Node.js for local Playwright smoke tests.
# =============================================================================

# --- Remove Cloudflare APT repo before any apt cache refresh ---
# Cloudflare can lag the host's Ubuntu release, causing apt update to fail.
# The stale repo must be removed before the first apt operation to prevent the
# nightly ansible-pull from deadlocking.
- name: Remove stale Cloudflare APT repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
  notify: Update apt cache

- name: Ensure thin-client repository prerequisites are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - gnupg
    state: present
    update_cache: true

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- Retired Claude Desktop repository ---
- name: Remove retired Claude Desktop repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/claude-desktop.list
    state: absent
  notify: Update apt cache

- name: Remove retired Claude Desktop archive keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/claude-desktop-archive-keyring.gpg
    state: absent
  notify: Update apt cache

# --- OpenZiti (ziti-edge-tunnel) ---
- name: Remove pre-existing OpenZiti repo config (conflicting signed-by)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/openziti-release.list
    state: absent
  notify: Update apt cache

- name: Converge openziti APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: openziti
    apt_keyring_url: "https://get.openziti.io/tun/package-repos.gpg"
    apt_keyring_dest: /usr/share/keyrings/openziti-archive-keyring.gpg
    apt_keyring_fingerprint: "{{ openziti_key_fingerprint }}"

- name: Add OpenZiti repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/usr/share/keyrings/openziti-archive-keyring.gpg]
      https://packages.openziti.org/zitipax-openziti-deb-stable debian main
    filename: openziti
    state: present
  notify: Update apt cache

# --- Mozilla Firefox (non-snap, required for OpenZiti tun compatibility) ---
- name: Converge mozilla APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: mozilla
    apt_keyring_url: "https://packages.mozilla.org/apt/repo-signing-key.gpg"
    apt_keyring_dest: /etc/apt/keyrings/packages.mozilla.org.asc

- name: Add Mozilla APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc]
      https://packages.mozilla.org/apt mozilla main
    filename: mozilla
    state: present
  notify: Update apt cache

- name: Pin Mozilla Firefox over Ubuntu snap stub
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: firefox*
      Pin: origin packages.mozilla.org
      Pin-Priority: 1001
    mode: "0644"

- name: Remove snap Firefox if present
  community.general.snap:
    name: firefox
    state: absent
  failed_when: false

# --- Node.js (optional, only for local Playwright on thin clients) ---
- name: Converge nodesource APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: nodesource
    apt_keyring_url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    apt_keyring_dest: /etc/apt/keyrings/nodesource.gpg
    apt_keyring_fingerprint: "{{ nodesource_key_fingerprint }}"
  when: thin_client_playwright_enabled | default(false)

- name: Add NodeSource Node.js 24 repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main"
    filename: nodesource
    state: present
  notify: Update apt cache
  when: thin_client_playwright_enabled | default(false)

- name: Flush handlers to update apt cache
  ansible.builtin.meta: flush_handlers
