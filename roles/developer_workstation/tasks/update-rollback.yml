---
# =============================================================================
# Failed update rollback
# =============================================================================

- name: Record the failed transaction details
  ansible.builtin.set_fact:
    workstation_update_status: rolled_back
    workstation_update_failure:
      task: "{{ ansible_failed_task.name | default('unknown task') }}"
      message: "{{ ansible_failed_result.msg | default('update transaction failed') }}"
      recorded_at: "{{ ansible_date_time.iso8601 }}"

# Record what the failed update left on disk before it is restored, so the
# manifest's `after` inventory names the digest of every artifact that failed
# the health gate. Without this a rolled-back run has an empty `after` list and
# the failed artifact cannot be identified later. An inventory the health gate
# already built is kept.
- name: Capture the failed managed artifacts' digests before restoring
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
    checksum_algorithm: sha256
  loop: "{{ workstation_update_managed_paths | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: _workstation_failed_paths
  when: workstation_update_after_inventory | default([]) | length == 0

- name: Record the failed artifact inventory for the manifest
  ansible.builtin.set_fact:
    workstation_update_after_inventory: >-
      {{ workstation_update_after_inventory | default([]) + [
        {
          'path': item.item,
          'exists': item.stat.exists | default(false),
          'checksum': item.stat.checksum | default('')
        }
      ] }}
  loop: "{{ _workstation_failed_paths.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when: item.stat is defined

- name: Check for the pre-update Go tree snapshot
  ansible.builtin.stat:
    path: "{{ workstation_update_snapshot_dir }}/go-tree.tar.gz"
  register: _go_tree_snapshot

- name: Remove the failed Go installation before restoration
  ansible.builtin.file:
    path: /usr/local/go
    state: absent
  when: _go_tree_snapshot.stat.exists | default(false)

- name: Restore the pre-update Go tree
  ansible.builtin.unarchive:
    src: "{{ workstation_update_snapshot_dir }}/go-tree.tar.gz"
    dest: /usr/local
    remote_src: true
  when: _go_tree_snapshot.stat.exists | default(false)

- name: Restore managed binaries from the pre-update snapshot
  ansible.builtin.copy:
    src: "{{ workstation_update_snapshot_dir }}/{{ item.path | basename }}"
    dest: "{{ item.path }}"
    remote_src: true
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ workstation_update_before_inventory | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - item.exists | default(false)
    - item.regular | default(true)
    - item.link_target | default('') | length == 0
    - item.path not in (workstation_update_rollback_excluded_paths | default([]))

- name: Restore managed launcher symlinks from the pre-update inventory
  ansible.builtin.file:
    src: "{{ item.link_target }}"
    dest: "{{ item.path }}"
    state: link
    force: true
  loop: "{{ workstation_update_before_inventory | default([]) }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.link_target | default('') }}"
  when:
    - item.exists | default(false)
    - item.link_target | default('') | length > 0
    - item.path not in (workstation_update_rollback_excluded_paths | default([]))

- name: Remove binaries created by the failed transaction
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ workstation_update_before_inventory | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - not (item.exists | default(false))
    - item.path not in (workstation_update_non_removable_paths | default([]))
    - item.path not in (workstation_update_rollback_excluded_paths | default([]))

- name: Persist a short-lived update quarantine marker
  ansible.builtin.copy:
    content: >-
      {{
        {
          'schema': 'curiosity.workstation.update-quarantine/v1',
          'run_id': workstation_update_run_id,
          'status': workstation_update_status,
          'retry_after_seconds': workstation_update_quarantine_seconds,
          'failure': workstation_update_failure
        } | to_nice_json
      }}

    dest: "{{ workstation_update_state_dir }}/quarantine.json"
    owner: root
    group: root
    mode: "0600"

- name: Fail the pull after rollback so the local service reports failure
  ansible.builtin.fail:
    msg: >-
      Workstation update transaction failed and was rolled back:
      {{ workstation_update_failure.message }}
