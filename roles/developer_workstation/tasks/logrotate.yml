---
# =============================================================================
# Log Rotation Hardening
# =============================================================================
# Prevents unbounded syslog growth from high-verbosity daemons (e.g.
# ziti-edge-tunnel flooding via imuxsock → rsyslog → /var/log/syslog).
#
# Strategy:
#   1. dpkg-divert the package-owned logrotate stanzas aside so our
#      replacements own the canonical paths without duplicate-entry errors.
#   2. Deploy replacement stanzas: daily + maxsize caps instead of weekly.
#   3. rsyslog imuxsock rate-limit to throttle socket floods at ingestion.
#   4. Hourly logrotate.timer so maxsize enforcement fires within the hour.
#   5. ziti-edge-tunnel service drop-in: lower log verbosity to suppress noise.
#
# NOTE: dpkg-divert is idempotent — re-running when already diverted is safe.
# The diverted paths live alongside the originals; only the canonical paths
# are used by logrotate. On package upgrade dpkg will update the .dpkg-dist
# copy, which we can review but which does not affect live rotation policy.
# =============================================================================

# -----------------------------------------------------------------------------
# Remove orphan logrotate drop-ins from pre-refactor rollout
# (zz- prefix naming scheme replaced by dpkg-divert ownership model)
# -----------------------------------------------------------------------------
- name: Remove orphan logrotate drop-ins from pre-refactor rollout
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/logrotate.d/zz-curiosity-rsyslog-override
    - /etc/logrotate.d/zz-curiosity-ziti-tunnel-override
  tags: [logrotate, logging, cleanup]

# -----------------------------------------------------------------------------
# Divert package-owned rsyslog logrotate stanza
# -----------------------------------------------------------------------------
- name: Divert /etc/logrotate.d/rsyslog to .dpkg-dist
  ansible.builtin.command:
    cmd: >-
      dpkg-divert --local --divert /etc/logrotate.d/rsyslog.dpkg-dist
      --rename /etc/logrotate.d/rsyslog
  register: _divert_rsyslog
  changed_when: "'Adding' in _divert_rsyslog.stdout"
  tags: [logrotate, logging]

# -----------------------------------------------------------------------------
# Divert package-owned ziti-tunnel logrotate stanza
# -----------------------------------------------------------------------------
- name: Divert /etc/logrotate.d/ziti-tunnel to .dpkg-dist
  ansible.builtin.command:
    cmd: >-
      dpkg-divert --local --divert /etc/logrotate.d/ziti-tunnel.dpkg-dist
      --rename /etc/logrotate.d/ziti-tunnel
  register: _divert_ziti
  changed_when: "'Adding' in _divert_ziti.stdout"
  tags: [logrotate, logging]

# -----------------------------------------------------------------------------
# Deploy replacement rsyslog logrotate stanza
# -----------------------------------------------------------------------------
- name: Deploy rsyslog logrotate stanza
  ansible.builtin.template:
    src: curiosity-rsyslog-logrotate.j2
    dest: /etc/logrotate.d/rsyslog
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/logrotate -d %s"
  tags: [logrotate, logging]

# -----------------------------------------------------------------------------
# Deploy replacement ziti-tunnel logrotate stanza
# -----------------------------------------------------------------------------
- name: Deploy ziti-tunnel logrotate stanza
  ansible.builtin.template:
    src: curiosity-ziti-tunnel-logrotate.j2
    dest: /etc/logrotate.d/ziti-tunnel
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/logrotate -d %s"
  tags: [logrotate, logging]

# -----------------------------------------------------------------------------
# rsyslog: imuxsock rate-limit drop-in
# -----------------------------------------------------------------------------
- name: Ensure /etc/rsyslog.d exists (rsyslog may be present but not yet configured)
  ansible.builtin.file:
    path: /etc/rsyslog.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [logrotate, logging]

# -----------------------------------------------------------------------------
# rsyslog: remove bare imuxsock load so the drop-in owns the single load
# -----------------------------------------------------------------------------
# The package-owned /etc/rsyslog.conf already loads imuxsock bare
# (module(load="imuxsock")). Loading it a second time from our drop-in fails
# closed ("module 'imuxsock' already in this config", parameters not known),
# which rsyslogd -N1 reports and which leaves the rate limiter unapplied.
# This drop-in therefore owns the single parameterized imuxsock load, and the
# bare load is removed here. Verified on rsyslog 8.2512.0: bare line removed
# plus this drop-in validates clean under rsyslogd -N1; the duplicate load
# reproduces the parse errors. Guarded on the file existing so machines
# without rsyslog (this role creates /etc/rsyslog.d unconditionally) still
# converge.
- name: Check for package-owned rsyslog.conf
  ansible.builtin.stat:
    path: /etc/rsyslog.conf
  register: _curiosity_rsyslog_conf
  tags: [logrotate, logging]

- name: Remove bare imuxsock load from rsyslog.conf (drop-in owns the single load)
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^module\(load="imuxsock"\)\s*(#.*)?$'
    state: absent
  when: _curiosity_rsyslog_conf.stat.exists
  notify: Restart rsyslog
  tags: [logrotate, logging]

- name: Deploy rsyslog imuxsock rate-limit config
  ansible.builtin.template:
    src: 10-curiosity-ratelimit.conf.j2
    dest: /etc/rsyslog.d/10-curiosity-ratelimit.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
  tags: [logrotate, logging]

# -----------------------------------------------------------------------------
# logrotate.timer: hourly drop-in
# -----------------------------------------------------------------------------
- name: Ensure logrotate.timer drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [logrotate, logging]

- name: Deploy logrotate.timer hourly drop-in
  ansible.builtin.copy:
    src: logrotate-hourly-timer.conf
    dest: /etc/systemd/system/logrotate.timer.d/hourly.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart logrotate timer
  tags: [logrotate, logging]

# -----------------------------------------------------------------------------
# ziti-edge-tunnel: log verbosity drop-in
# -----------------------------------------------------------------------------
# The package unit uses ZITI_VERBOSE=info and accepts env overrides via
# EnvironmentFile=-/opt/openziti/etc/ziti-edge-tunnel.env.
# We use a systemd Service drop-in to override ZITI_VERBOSE to 'error',
# which suppresses the continuous debug chatter that flooded /var/log/syslog.
# Confirmed mechanism: systemctl cat ziti-edge-tunnel shows:
#   Environment="ZITI_VERBOSE=info"
#   ExecStart=... --verbose=${ZITI_VERBOSE} ...
- name: Ensure ziti-edge-tunnel service drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ ziti_service_name }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [logrotate, logging]

- name: Deploy ziti-edge-tunnel log-verbosity drop-in
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ ziti_service_name }}.d/log-verbosity.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Environment="ZITI_VERBOSE=error"
  notify:
    - Reload systemd
    - Restart ziti-edge-tunnel
  tags: [logrotate, logging]
