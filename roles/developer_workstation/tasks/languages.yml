---
# =============================================================================
# Language Runtimes (non-APT)
# =============================================================================
# Go: latest from go.dev          | Deno: latest GitHub release
# Rust: via rustup for dev_user   | Bun: latest GitHub release
# nvm: Node version manager       | Composer: self-updating package manager
# pyenv: Python version manager   |
# =============================================================================

# --- Go ---
- name: Get installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_current
  changed_when: false
  failed_when: false

- name: Get latest Go version
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: go_version

- name: Get latest Go release metadata
  ansible.builtin.uri:
    url: https://go.dev/dl/?mode=json
    return_content: true
  register: _go_release_metadata
  changed_when: false

- name: Set Go update state
  ansible.builtin.set_fact:
    go_latest_release: "{{ go_version.content.split('\n')[0] }}"
    go_needs_update: >-
      {{ go_current.rc != 0 or go_version.content.split('\n')[0] not in go_current.stdout }}

- name: Inspect the existing Go tree before replacement
  ansible.builtin.stat:
    path: /usr/local/go
  register: _go_tree_before_update
  when: go_needs_update

- name: Snapshot the existing Go tree before replacement
  ansible.builtin.command:
    argv:
      - tar
      - -czf
      - "{{ workstation_update_snapshot_dir }}/go-tree.tar.gz"
      - -C
      - /usr/local
      - go
  args:
    creates: "{{ workstation_update_snapshot_dir }}/go-tree.tar.gz"
  changed_when: true
  when:
    - go_needs_update
    - _go_tree_before_update.stat.isdir | default(false)

- name: Resolve the latest Go Linux amd64 archive
  ansible.builtin.set_fact:
    _go_latest_asset: >-
      {{ (_go_release_metadata.json
          | selectattr('version', 'equalto', go_latest_release)
          | map(attribute='files')
          | first
          | selectattr('filename', 'equalto', go_latest_release ~ '.linux-amd64.tar.gz')
          | first) }}

- name: Require a verified latest Go archive
  ansible.builtin.assert:
    that:
      - _go_latest_asset | default({}) | length > 0
      - _go_latest_asset.sha256 | default('') is match('^[0-9a-f]{64}$')
    fail_msg: "No verified Linux amd64 Go archive was found for {{ go_latest_release }}"
  when: go_needs_update

- name: Download latest Go release
  ansible.builtin.get_url:
    url: "https://go.dev/dl/{{ _go_latest_asset.filename }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/{{ _go_latest_asset.filename }}"
    checksum: "sha256:{{ _go_latest_asset.sha256 }}"
    mode: "0644"
    force: false
  when: go_needs_update

- name: Remove the existing Go tree before extraction
  ansible.builtin.file:
    path: /usr/local/go
    state: absent
  when:
    - go_needs_update
    - _go_tree_before_update.stat.isdir | default(false)

- name: Install latest Go
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/{{ _go_latest_asset.filename }}"
    dest: /usr/local
    remote_src: true
  when: go_needs_update

- name: Set Go PATH
  ansible.builtin.copy:
    content: 'export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin'
    dest: /etc/profile.d/golang.sh
    mode: '0644'

# --- Rust ---
- name: Install current rustup package from the signed APT channel  # noqa package-latest
  ansible.builtin.apt:
    name: rustup
    state: latest

- name: Ensure the user has the stable Rust toolchain
  ansible.builtin.command: /usr/bin/rustup toolchain install stable
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  register: _rust_toolchain_install
  changed_when: >-
    'already installed' not in (_rust_toolchain_install.stdout | default('') | lower)

- name: Update Rust stable toolchain
  ansible.builtin.command: rustup update stable
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "{{ dev_user_home }}/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
  register: _rust_update
  changed_when: >-
    'up to date' not in (_rust_update.stdout | default('') | lower)
  failed_when: false

- name: Update rustup itself
  ansible.builtin.command: rustup self update
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "{{ dev_user_home }}/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
  register: _rustup_update
  changed_when: >-
    'up to date' not in (_rustup_update.stdout | default('') | lower)
  failed_when: false

# --- nvm (Node Version Manager) ---
- name: Install or update nvm from its Git repository
  ansible.builtin.git:
    repo: https://github.com/nvm-sh/nvm.git
    dest: "{{ dev_user_home }}/.nvm"
    depth: 1
    version: master
    force: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

# --- pyenv ---
- name: Inspect the existing pyenv directory
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.pyenv"
  register: _pyenv_root

- name: Check whether pyenv is already a Git checkout
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.pyenv/.git"
  register: _pyenv_git_dir

- name: List entries in a partial pyenv directory
  ansible.builtin.find:
    paths: "{{ dev_user_home }}/.pyenv"
    recurse: false
    file_type: any
  register: _pyenv_entries
  when: _pyenv_root.stat.isdir | default(false)

- name: Set pyenv bootstrap mode
  ansible.builtin.set_fact:
    _pyenv_partial_directory: >-
      {{ _pyenv_root.stat.isdir | default(false)
         and not (_pyenv_git_dir.stat.exists | default(false))
         and (_pyenv_entries.matched | default(0) | int) > 0 }}

- name: Install pyenv into an empty or missing directory
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "{{ dev_user_home }}/.pyenv"
    depth: 1
    version: master
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when:
    - not (_pyenv_git_dir.stat.exists | default(false))
    - not _pyenv_partial_directory

- name: Remove stale pyenv staging checkout
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.pyenv.catalog-staging"
    state: absent
  become: true
  when: _pyenv_partial_directory

- name: Clone pyenv for merging into a partial directory
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "{{ dev_user_home }}/.pyenv.catalog-staging"
    depth: 1
    version: master
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: _pyenv_partial_directory

- name: Merge pyenv into the existing user directory
  ansible.builtin.copy:
    src: "{{ dev_user_home }}/.pyenv.catalog-staging/"
    dest: "{{ dev_user_home }}/.pyenv/"
    remote_src: true
    mode: preserve
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
  become: true
  when: _pyenv_partial_directory

- name: Remove pyenv staging checkout
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.pyenv.catalog-staging"
    state: absent
  become: true
  when: _pyenv_partial_directory

- name: Update an existing pyenv Git checkout
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "{{ dev_user_home }}/.pyenv"
    depth: 1
    version: master
    force: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: _pyenv_git_dir.stat.exists | default(false)

# --- Deno ---
- name: Get installed Deno version
  ansible.builtin.command: deno --version
  register: deno_current
  changed_when: false
  failed_when: false

- name: Set Deno latest release state
  ansible.builtin.set_fact:
    deno_latest_release: "{{ latest_github_releases.deno.tag_name }}"
    deno_latest_asset: >-
      {{ latest_github_releases.deno.assets
         | selectattr('name', 'equalto', 'deno-x86_64-unknown-linux-gnu.zip') | first }}
    deno_needs_update: >-
      {{ deno_current.rc != 0 or
         (latest_github_releases.deno.tag_name | regex_replace('^v', '')) not in deno_current.stdout }}

- name: Download latest Deno
  ansible.builtin.get_url:
    url: "{{ deno_latest_asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/deno-{{ deno_latest_asset.digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ deno_latest_asset.digest }}"
    mode: "0644"
    force: false
  when: deno_needs_update

- name: Install latest Deno
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/deno-{{ deno_latest_asset.digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/local/bin
    remote_src: true
    include: [deno]
  when: deno_needs_update

# --- Bun ---
- name: Get installed Bun version
  ansible.builtin.command: bun --version
  register: bun_current
  changed_when: false
  failed_when: false

- name: Set Bun latest release state
  ansible.builtin.set_fact:
    bun_latest_version: "{{ latest_github_releases.bun.tag_name | regex_replace('^bun-v', '') }}"
    bun_latest_asset: >-
      {{ latest_github_releases.bun.assets
         | selectattr('name', 'equalto', 'bun-linux-x64.zip') | first }}
    bun_needs_update: >-
      {{ bun_current.rc != 0 or
         (latest_github_releases.bun.tag_name | regex_replace('^bun-v', '')) not in bun_current.stdout }}

- name: Download latest Bun
  ansible.builtin.get_url:
    url: "{{ bun_latest_asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/bun-{{ bun_latest_asset.digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ bun_latest_asset.digest }}"
    mode: "0644"
    force: false
  when: bun_needs_update

- name: Extract latest Bun
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/bun-{{ bun_latest_asset.digest | regex_replace('^sha256:', '') }}.archive"
    dest: /tmp
    remote_src: true
  when: bun_needs_update

- name: Install latest Bun binary
  ansible.builtin.copy:
    src: /tmp/bun-linux-x64/bun
    dest: /usr/local/bin/bun
    mode: "0755"
    remote_src: true
  when: bun_needs_update

- name: Clean up Bun temp files
  ansible.builtin.file:
    path: /tmp/bun-linux-x64
    state: absent
  when: bun_needs_update

- name: Ensure Bun's bunx alias is available
  ansible.builtin.file:
    src: /usr/local/bin/bun
    dest: /usr/local/bin/bunx
    state: link
    force: true

# --- PHP Composer ---
- name: Check Composer version
  ansible.builtin.command: /usr/local/bin/composer --version
  register: composer_current
  changed_when: false
  failed_when: false

- name: Resolve Composer installer signature
  ansible.builtin.uri:
    url: https://composer.github.io/installer.sig
    return_content: true
  register: _composer_installer_signature
  changed_when: false
  when: composer_current.rc != 0

- name: Download verified Composer installer
  ansible.builtin.get_url:
    url: https://getcomposer.org/installer
    dest: "{{ workstation_update_artifact_cache_dir }}/composer-installer.php"
    checksum: "sha384:{{ _composer_installer_signature.content | trim }}"
    mode: "0644"
    force: false
  when: composer_current.rc != 0

- name: Install Composer (PHP package manager)
  ansible.builtin.command:
    argv:
      - php
      - "{{ workstation_update_artifact_cache_dir }}/composer-installer.php"
      - --install-dir=/usr/local/bin
      - --filename=composer
  when: composer_current.rc != 0
  changed_when: true

- name: Update Composer to latest stable
  ansible.builtin.command:
    cmd: /usr/local/bin/composer self-update --stable --no-interaction --no-progress
  register: _composer_update
  changed_when: >-
    'already using the latest version' not in
    (_composer_update.stdout | default('') | lower)
  when: composer_current.rc == 0
  failed_when: false

# --- SDKMAN (JVM version manager) ---
- name: Inspect the existing SDKMAN directory
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.sdkman"
  register: _sdkman_root

- name: Check for an existing SDKMAN Git checkout
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.sdkman/.git"
  register: _sdkman_git_dir

- name: Set the SDKMAN source-discovery patch marker path
  ansible.builtin.set_fact:
    _sdkman_source_patch_marker: "{{ dev_user_home }}/.cache/curiosity-corp/sdkman-init.sha256"

- name: Inspect the SDKMAN init source and role-owned patch marker
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.sdkman/src/main/bash/sdkman-init.sh"
    checksum_algorithm: sha256
  register: _sdkman_init_source
  when: _sdkman_git_dir.stat.exists | default(false)

- name: Inspect the SDKMAN source-discovery patch marker
  ansible.builtin.stat:
    path: "{{ _sdkman_source_patch_marker }}"
  register: _sdkman_source_patch_marker_stat

- name: Read the SDKMAN source-discovery patch marker
  ansible.builtin.slurp:
    src: "{{ _sdkman_source_patch_marker }}"
  register: _sdkman_source_patch_marker_content
  when: _sdkman_source_patch_marker_stat.stat.exists | default(false)

- name: Inspect all existing SDKMAN checkout changes before restoring our patch
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ dev_user_home }}/.sdkman"
      - status
      - --porcelain
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  register: _sdkman_git_status_before_restore
  changed_when: false
  failed_when: false
  when: _sdkman_git_dir.stat.exists | default(false)

- name: Set the SDKMAN role-managed patch state
  ansible.builtin.set_fact:
    _sdkman_source_patch_checksum: >-
      {{ (_sdkman_source_patch_marker_content.content | b64decode | trim)
         if (_sdkman_source_patch_marker_stat.stat.exists | default(false))
         else '' }}
    _sdkman_source_patch_exact: >-
      {{ ( _sdkman_git_dir.stat.exists | default(false) | bool )
         and ( _sdkman_init_source.stat.exists | default(false) | bool )
         and (
           _sdkman_init_source.stat.checksum | default('') ==
           (
             (_sdkman_source_patch_marker_content.content | b64decode | trim)
             if (_sdkman_source_patch_marker_stat.stat.exists | default(false))
             else ''
           )
         ) }}

- name: Restore the exact role-managed SDKMAN source patch before updating
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ dev_user_home }}/.sdkman"
      - restore
      - --source=HEAD
      - --
      - src/main/bash/sdkman-init.sh
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  register: _sdkman_source_patch_restore
  changed_when: _sdkman_source_patch_exact | bool
  when:
    - _sdkman_source_patch_exact | bool
    - _sdkman_git_status_before_restore.stdout_lines | default([]) | map('trim') | list == ['M src/main/bash/sdkman-init.sh']

- name: Check whether the existing SDKMAN checkout is dirty
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ dev_user_home }}/.sdkman"
      - status
      - --porcelain
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  register: _sdkman_git_status
  changed_when: false
  failed_when: false
  when: _sdkman_git_dir.stat.exists | default(false)

- name: Set SDKMAN source-update and runtime-repair eligibility
  ansible.builtin.set_fact:
    _sdkman_git_checkout: "{{ _sdkman_git_dir.stat.exists | default(false) }}"
    _sdkman_git_dirty: >-
      {{ (_sdkman_git_status.stdout | default('') | trim | length) > 0 }}
    _sdkman_allow_source_update: >-
      {{ not (_sdkman_root.stat.isdir | default(false)) or
         (_sdkman_git_dir.stat.exists | default(false) and
          (_sdkman_git_status.stdout | default('') | trim | length) == 0) }}
    _sdkman_manage_runtime: true

- name: Install or update SDKMAN from its Git repository
  ansible.builtin.git:
    repo: https://github.com/sdkman/sdkman-cli.git
    dest: "{{ dev_user_home }}/.sdkman"
    depth: 1
    version: master
    force: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when:
    - _sdkman_allow_source_update | bool

- name: Inspect the SDKMAN init source after checkout synchronization
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.sdkman/src/main/bash/sdkman-init.sh"
    checksum_algorithm: sha256
  register: _sdkman_init_source_after_checkout
  when: _sdkman_allow_source_update | bool

- name: Preserve SDKMAN source when it is not a clean Git checkout
  ansible.builtin.debug:
    msg: >-
      Preserving {{ dev_user_home }}/.sdkman because it is an existing
      non-Git installation or contains local changes; launcher and metadata
      repair will continue without replacing user state.
  when:
    - _sdkman_root.stat.isdir | default(false)
    - not (_sdkman_allow_source_update | bool)

- name: Ensure the SDKMAN role-owned state directory exists
  ansible.builtin.file:
    path: "{{ _sdkman_source_patch_marker | dirname }}"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0750"
  become: true
  when: _sdkman_manage_runtime | bool

- name: Ensure SDKMAN runtime directories exist
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.sdkman/{{ item }}"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0750"
  loop:
    - bin
    - candidates
    - etc
    - ext
    - tmp
    - var
  become: true
  when: _sdkman_manage_runtime | bool

- name: Resolve the SDKMAN candidate list
  ansible.builtin.uri:
    url: https://api.sdkman.io/2/candidates/all
    return_content: true
  register: _sdkman_candidates
  changed_when: false
  when: _sdkman_manage_runtime | bool

- name: Set the SDKMAN platform identifier
  ansible.builtin.set_fact:
    _sdkman_platform: >-
      {% if ansible_facts.system == 'Linux' and ansible_facts.architecture == 'x86_64' %}linuxx64
      {% elif ansible_facts.system == 'Linux' and ansible_facts.architecture == 'aarch64' %}linuxarm64
      {% elif ansible_facts.system == 'Darwin' and ansible_facts.architecture == 'x86_64' %}darwinx64
      {% elif ansible_facts.system == 'Darwin' and ansible_facts.architecture == 'arm64' %}darwinarm64
      {% else %}exotic{% endif %}
  when: _sdkman_manage_runtime | bool

- name: Seed SDKMAN candidate metadata
  ansible.builtin.copy:
    content: "{{ _sdkman_candidates.content | trim }}\n"
    dest: "{{ dev_user_home }}/.sdkman/var/candidates"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0640"
  become: true
  when: _sdkman_manage_runtime | bool

- name: Seed SDKMAN platform metadata
  ansible.builtin.copy:
    content: "{{ _sdkman_platform | trim }}\n"
    dest: "{{ dev_user_home }}/.sdkman/var/platform"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0640"
  become: true
  when: _sdkman_manage_runtime | bool

- name: Exclude SDKMAN's own init file from source discovery
  ansible.builtin.replace:
    path: "{{ dev_user_home }}/.sdkman/src/main/bash/sdkman-init.sh"
    regexp: '^scripts=\(\$\(find "\$\{SDKMAN_DIR\}/src" "\$\{SDKMAN_DIR\}/ext" -type f -name ''sdkman-\*\.sh''\)\)$'
    replace: 'scripts=($(find "${SDKMAN_DIR}/src" "${SDKMAN_DIR}/ext" -type f -name ''sdkman-*.sh'' ! -path "${SDKMAN_DIR}/src/main/bash/sdkman-init.sh"))'
  become: true
  become_user: "{{ dev_user }}"
  register: _sdkman_source_patch
  when:
    - _sdkman_allow_source_update | bool
    - _sdkman_init_source_after_checkout.stat.exists | default(false)

- name: Verify SDKMAN source discovery excludes only its recursive init file
  ansible.builtin.command:
    argv:
      - grep
      - -F
      - --
      - '! -path "${SDKMAN_DIR}/src/main/bash/sdkman-init.sh"'
      - "{{ dev_user_home }}/.sdkman/src/main/bash/sdkman-init.sh"
  register: _sdkman_source_patch_check
  changed_when: false
  failed_when: false
  when:
    - _sdkman_allow_source_update | bool
    - _sdkman_init_source_after_checkout.stat.exists | default(false)

- name: Stop if the SDKMAN recursive-source fix no longer matches upstream
  ansible.builtin.assert:
    that:
      - _sdkman_source_patch_check.rc == 0
    fail_msg: >-
      SDKMAN's source discovery changed upstream; update the managed recursion
      exclusion before enabling SDKMAN in this checkout.
  when:
    - _sdkman_allow_source_update | bool
    - _sdkman_init_source_after_checkout.stat.exists | default(false)

- name: Record the SDKMAN source-discovery patch checksum
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.sdkman/src/main/bash/sdkman-init.sh"
    checksum_algorithm: sha256
  register: _sdkman_init_source_after_patch
  when:
    - _sdkman_allow_source_update | bool
    - _sdkman_init_source_after_checkout.stat.exists | default(false)

- name: Record the role-owned SDKMAN source-discovery patch
  ansible.builtin.copy:
    content: "{{ _sdkman_init_source_after_patch.stat.checksum }}\n"
    dest: "{{ _sdkman_source_patch_marker }}"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0640"
  become: true
  when:
    - _sdkman_allow_source_update | bool
    - _sdkman_init_source_after_checkout.stat.exists | default(false)

- name: Install the SDKMAN shell launcher
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      export SDKMAN_DIR="${SDKMAN_DIR:-$HOME/.sdkman}"
      export SDKMAN_CANDIDATES_API="${SDKMAN_CANDIDATES_API:-https://api.sdkman.io/2}"
      export SDKMAN_BROKER_API="${SDKMAN_BROKER_API:-https://api.sdkman.io/2}"
      source "$SDKMAN_DIR/src/main/bash/sdkman-init.sh"
    dest: "{{ dev_user_home }}/.sdkman/bin/sdkman-init.sh"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"
  become: true
  when: _sdkman_manage_runtime | bool

- name: Configure SDKMAN curl timeouts to fail fast when unreachable
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.sdkman/etc/config"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
    mode: "0644"
  loop:
    - { regexp: '^sdkman_curl_connect_timeout=', line: 'sdkman_curl_connect_timeout=2' }
    - { regexp: '^sdkman_curl_max_time=', line: 'sdkman_curl_max_time=3' }
  become: true
  become_user: "{{ dev_user }}"
