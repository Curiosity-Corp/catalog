---
# =============================================================================
# Public configuration validation (catalog#31)
# =============================================================================
# Included by main.yml before the pre-flight checks and before any package,
# file or service task, so a mistyped profile, URL, enum or path stops the run
# with nothing changed. It reads only variables: no command, no file access on
# the host, no facts.
#
# Three layers, each reporting every problem it finds at once:
#
# 1. meta/argument_specs.yml through validate_argument_spec: types and the
#    allowed values of enumerations. Ansible already ran the same spec before
#    the role's first task; this second run sees the values that
#    /etc/ansible/local-vars.yml loaded since.
# 2. Shape and format rules the spec cannot state, applied by name to every
#    string option of the spec: list and mapping options really are lists and
#    mappings (the spec's list type silently splits a string on commas),
#    *_url is an https:// URL, *_sha256 a SHA-256, *_fingerprint an OpenPGP key
#    fingerprint, and path-like names are absolute.
# 3. Rules between variables: an enabled integration that needs another value,
#    and option combinations that cannot work. They use the same profile
#    conditions as the tasks they protect, so a valid configuration is
#    unchanged.
#
# Messages name the variable, show the value it has and say what is allowed.
# Secrets never appear: an option marked no_log in the spec is shown as
# "(hidden: no_log value)", a URL's login part before an @ as ***@, and the
# rules that read a secret run in their own no_log task whose messages never
# quote the value (tests/test_no_log_policy.py).
#
# The task-level checks further down the role stay as a second line of defence.
# docs/configuration.md#validation documents this for operators;
# scripts/config_validation_check.sh and tests/config_validation/ test it.
# =============================================================================

- name: Load the public variable specification
  ansible.builtin.set_fact:
    _config_spec: >-
      {{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml')
          | from_yaml).argument_specs.main.options }}

- name: Validate the types and allowed values of the public variables
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ _config_spec }}"

- name: Find list, mapping, URL, checksum and path values of the wrong shape
  ansible.builtin.set_fact:
    _config_problems: >-
      {%- set ns = namespace(problems=[]) -%}
      {%- for name, spec in _config_spec.items() -%}
      {%- set value = lookup('ansible.builtin.vars', name, default=none) -%}
      {%- if spec.no_log | default(false) -%}
      {%- set shown = '(hidden: no_log value)' -%}
      {%- else -%}
      {%- set shown = value | to_json | regex_replace('://[^/@\s"]*@', '://***@') -%}
      {%- endif -%}
      {%- set text = value | string | trim if value is string else '' -%}
      {%- if value is none -%}
      {%- elif spec.type == 'list' and (value is string or value is mapping or value is not sequence) -%}
      {%- set ns.problems = ns.problems + [name ~ ' must be a list (YAML "- item" lines or [a, b]); got ' ~ shown ~ '.'] -%}
      {%- elif spec.type == 'dict' and value is not mapping -%}
      {%- set ns.problems = ns.problems + [name ~ ' must be a mapping of key: value pairs; got ' ~ shown ~ '.'] -%}
      {%- elif spec.type != 'str' or text | length == 0 -%}
      {%- elif name is match('.*_url$') and name in _config_http_urls -%}
      {%- if text is not match(_config_url_re | replace('https', 'https?')) -%}
      {%- set ns.problems = ns.problems + [name ~ ' must be empty or an http:// or https:// URL without login details before an @, such as https://host.example.org/path; got ' ~ shown ~ '.'] -%}
      {%- endif -%}
      {%- elif name is match('.*_url$') -%}
      {%- if text is not match(_config_url_re) -%}
      {%- set ns.problems = ns.problems + [name ~ ' must be empty or an https:// URL without login details before an @, such as https://host.example.org/path; got ' ~ shown ~ '.'] -%}
      {%- endif -%}
      {%- elif name is match('.*_sha256$') -%}
      {%- if text is not match('^[0-9A-Fa-f]{64}$') -%}
      {%- set ns.problems = ns.problems + [name ~ ' must be empty or a SHA-256 checksum of 64 hexadecimal characters (sha256sum prints it); got ' ~ shown ~ '.'] -%}
      {%- endif -%}
      {%- elif name is match('.*_fingerprint$') -%}
      {%- if text is not match('^([0-9A-Fa-f]{16}|[0-9A-Fa-f]{40})$') -%}
      {%- set ns.problems = ns.problems + [name ~ ' must be empty or an OpenPGP key fingerprint of 40 (or a key id of 16) hexadecimal characters without spaces; got ' ~ shown ~ '.'] -%}
      {%- endif -%}
      {%- elif name is match(_config_path_name_re) and name not in _config_bare_file_names -%}
      {%- if text is not match('^/\S*$') -%}
      {%- set ns.problems = ns.problems + [name ~ ' must be empty or an absolute path without spaces, such as /opt/example; got ' ~ shown ~ '.'] -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.problems }}
  vars:
    _config_url_re: '^https://[^/@\s]+(/\S*)?$'
    # URLs a browser opens on the local network, where plain http is common.
    _config_http_urls: [jellyfin_web_url, kiosk_target_url]
    _config_path_name_re: '.*_(path|dir|home|bin|executable|python|venv|root|file)$'
    # *_file options that hold a file name, not a path.
    _config_bare_file_names: [streamstack_framing_model_file, claude_native_release_key_file]

- name: Find option combinations that cannot work
  ansible.builtin.set_fact:
    _config_problems: >-
      {{ _config_problems
         + (_config_rules | rejectattr('ok') | map(attribute='msg') | list) }}
  vars:
    _hardware_profile_names: "{{ hardware_profiles | default({}) | list }}"
    _ring_ages: "{{ workstation_update_ring_min_age_seconds | default({}) }}"
    _ring_delays: "{{ workstation_update_ring_randomized_delay_seconds | default({}) }}"
    _whole_number_re: '^[0-9]+$'
    # earlyoom: a percent 1-100, or TERM,KILL; quotes, backslashes and line
    # breaks would break the quoting of /etc/default/earlyoom.
    _earlyoom_levels: "{{ [earlyoom_mem_percent | default('8,4'), earlyoom_swap_percent | default('15,8')] | map('string') | list }}"
    _earlyoom_level_re: '^([1-9][0-9]?|100)(,([1-9][0-9]?|100))?$'
    _earlyoom_level_pairs: >-
      {{ _earlyoom_levels | select('match', '^[0-9]+,[0-9]+$')
         | map('split', ',') | map('map', 'int') | map('list') | list }}
    _earlyoom_regex_bad_re: '[''"\\]|\n'
    # The memory-capped browser launcher's entries.
    _bmc_list: >-
      {{ browser_memory_cap_browsers
         if browser_memory_cap_browsers | default([]) is sequence and browser_memory_cap_browsers is not string
         else [] }}
    _bmc_maps: "{{ _bmc_list | select('mapping') | list }}"
    _bmc_names: "{{ _bmc_maps | map(attribute='name', default='') | map('string') | list }}"
    _bmc_highs: "{{ _bmc_maps | map(attribute='memory_high', default='') | map('string') | list }}"
    _bmc_maxes: "{{ _bmc_maps | map(attribute='memory_max', default='') | map('string') | list }}"
    _bmc_size_re: '^([1-9][0-9]*[KMGT]?|([1-9][0-9]?|100)%|infinity)$'
    # [memory_high, memory_max] in bytes, for the entries that give both as sizes.
    _bmc_byte_pairs: >-
      {{ _bmc_highs | zip(_bmc_maxes) | map('join', ' ') | select('match', '^[0-9]+[KMGT]? [0-9]+[KMGT]?$')
         | map('split', ' ') | map('map', 'human_to_bytes') | map('list') | list }}
    # Values the workspace credential helper puts into a shell script and
    # /etc/gitconfig: a host[:port], provider and user names, a command name
    # or absolute path, environment variable names.
    _workspace_host_re: '^([A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?)?$'
    _workspace_name_re: '^[A-Za-z0-9._-]*$'
    _workspace_command_re: '^([A-Za-z0-9._+-]+|/[A-Za-z0-9._+/-]+)?$'
    _env_name_re: '^[A-Za-z_][A-Za-z0-9_]*$'
    _workspace_env: "{{ workspace_login_env if workspace_login_env | default({}) is mapping else {} }}"
    _workspace_env_unset: >-
      {{ workspace_login_env_unset
         if workspace_login_env_unset | default([]) is sequence and workspace_login_env_unset is not string
         else [] }}
    # Names of the settings the enabled credential helper needs that are empty.
    _workspace_helper_unset: >-
      {{ ['workspace_git_host', 'workspace_external_auth_provider',
          'workspace_external_auth_binary', 'workspace_git_auth_username']
         | zip([workspace_git_host | default('', true) | string,
                workspace_external_auth_provider | default('', true) | string,
                workspace_external_auth_binary | default('', true) | string,
                workspace_git_auth_username | default('', true) | string])
         | selectattr('1', 'eq', '') | map('first') | list }}
    # A full systemd unit name: the role writes drop-ins to <name>.d, and
    # systemd reads that directory only when it carries the unit's suffix.
    _ziti_unit_re: '^[A-Za-z0-9:_.@-]+[.]service$'
    _ziti_pin_name_re: '^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
    _ziti_pins: >-
      {{ ziti_etc_hosts_pins
         if ziti_etc_hosts_pins | default([]) is sequence and ziti_etc_hosts_pins is not string
         else [] }}
    # Agent CPU policy (catalog#2): wrapped commands become shell function
    # names in /etc/profile.d, the slice name a systemd unit name.
    _agent_cpu_commands: >-
      {{ agent_cpu_policy_wrapped_commands
         if agent_cpu_policy_wrapped_commands | default([]) is sequence and agent_cpu_policy_wrapped_commands is not string
         else [] }}
    _config_rules:
      - ok: "{{ hardware_profile | default('') in _hardware_profile_names }}"
        msg: >-
          hardware_profile must name an entry of hardware_profiles, one of
          {{ _hardware_profile_names | join(', ') }} (use generic when no
          hardware-specific profile applies); got {{ hardware_profile | default(none) | to_json }}.
      - ok: "{{ ziti_service_name | default('ziti-edge-tunnel.service') | string is match(_ziti_unit_re) }}"
        msg: >-
          ziti_service_name must be the tunnel's full systemd unit name ending in
          .service, such as ziti-edge-tunnel.service (its drop-ins go to
          /etc/systemd/system/<name>.d); got {{ ziti_service_name | default(none) | to_json }}.
      - ok: "{{ _ziti_pins | map('string') | reject('match', _ziti_pin_name_re) | list | length == 0 }}"
        msg: >-
          ziti_etc_hosts_pins entries must be bare host names (letters, digits,
          dot, dash, underscore), such as registry.lab.example.edu; got
          {{ _ziti_pins | map('string') | reject('match', _ziti_pin_name_re) | list | to_json }}.
      - ok: "{{ ziti_pin_resolver | default('100.64.0.2') | string is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$') }}"
        msg: >-
          ziti_pin_resolver must be the tunnel resolver's IPv4 address, such as
          100.64.0.2; got {{ ziti_pin_resolver | default(none) | to_json }}.
      - ok: "{{ ziti_pin_wait | default(120) | string is match(_whole_number_re) }}"
        msg: >-
          ziti_pin_wait must be a whole number of seconds (0 or more); got
          {{ ziti_pin_wait | default(none) | to_json }}.
      - ok: "{{ dev_user_home | default('') | string is match('^/\\S+$') }}"
        msg: >-
          dev_user_home must be the primary account's absolute home directory,
          such as /home/researcher; got {{ dev_user_home | default(none) | to_json }}.
      - ok: >-
          {{ workstation_update_ring | default('') not in ['canary', 'early', 'general']
             or (workstation_update_ring in _ring_ages and workstation_update_ring in _ring_delays) }}
        msg: >-
          workstation_update_ring_min_age_seconds and
          workstation_update_ring_randomized_delay_seconds must each have an
          entry for the selected ring {{ workstation_update_ring | default('') | to_json }}; they
          have {{ _ring_ages | list | to_json }} and {{ _ring_delays | list | to_json }}.
      - ok: >-
          {{ (_ring_ages | dict2items + _ring_delays | dict2items)
             | map(attribute='value') | map('string') | reject('match', _whole_number_re) | list | length == 0 }}
        msg: >-
          workstation_update_ring_min_age_seconds and
          workstation_update_ring_randomized_delay_seconds must map each ring to
          a whole number of seconds (0 or more); got {{ _ring_ages | to_json }} and
          {{ _ring_delays | to_json }}.
      - ok: "{{ workstation_update_snapshot_keep | default(3) | string is match(_whole_number_re) and workstation_update_snapshot_keep | default(3) | int >= 1 }}"
        msg: >-
          workstation_update_snapshot_keep must be a whole number of at least 1
          (the current run's rollback snapshot is always kept); got
          {{ workstation_update_snapshot_keep | default(none) | to_json }}.
      - ok: "{{ workstation_update_quarantine_seconds | default(0) | string is match(_whole_number_re) }}"
        msg: >-
          workstation_update_quarantine_seconds must be a whole number of
          seconds, 0 or more; got {{ workstation_update_quarantine_seconds | default(none) | to_json }}.
      # earlyoom and the memory-capped browser launcher (docs/memory-resilience.md).
      - ok: "{{ _earlyoom_levels | select('match', _earlyoom_level_re) | list | length == 2 }}"
        msg: >-
          earlyoom_mem_percent and earlyoom_swap_percent must each be a whole
          percent from 1 to 100, or a SIGTERM,SIGKILL pair of them such as 8,4;
          got {{ earlyoom_mem_percent | default(none) | to_json }} and
          {{ earlyoom_swap_percent | default(none) | to_json }}.
      - ok: "{{ _earlyoom_level_pairs | map('sort', reverse=true) | list == _earlyoom_level_pairs }}"
        msg: >-
          earlyoom_mem_percent and earlyoom_swap_percent must not put the
          SIGKILL level above the SIGTERM level (8,4, not 4,8); got
          {{ earlyoom_mem_percent | default(none) | to_json }} and
          {{ earlyoom_swap_percent | default(none) | to_json }}.
      - ok: "{{ earlyoom_report_interval | default(300) | string is match(_whole_number_re) }}"
        msg: >-
          earlyoom_report_interval must be a whole number of seconds, 0 (no
          reports) or more; got {{ earlyoom_report_interval | default(none) | to_json }}.
      - ok: >-
          {{ [earlyoom_prefer_regex | default(''), earlyoom_avoid_regex | default('')]
             | map('string') | select('search', _earlyoom_regex_bad_re) | list | length == 0 }}
        msg: >-
          earlyoom_prefer_regex and earlyoom_avoid_regex must not contain quotes,
          backslashes or line breaks (they are passed to earlyoom through
          /etc/default/earlyoom); got {{ earlyoom_prefer_regex | default(none) | to_json }} and
          {{ earlyoom_avoid_regex | default(none) | to_json }}.
      - ok: "{{ browser_memory_cap_slice | default('app-browser.slice') | string is match('^[A-Za-z0-9_.-]+[.]slice$') }}"
        msg: >-
          browser_memory_cap_slice must be a systemd slice name such as
          app-browser.slice; got {{ browser_memory_cap_slice | default(none) | to_json }}.
      - ok: >-
          {{ _bmc_list | length == _bmc_maps | length
             and _bmc_names | select('match', '^[a-z0-9][a-z0-9._-]*$') | list | length == _bmc_maps | length
             and _bmc_names | unique | list | length == _bmc_names | length }}
        msg: >-
          browser_memory_cap_browsers must list mappings, each with a unique
          name of lower-case letters, digits, dot, dash or underscore (the
          launcher is ~/.local/bin/NAME-capped); got
          {{ browser_memory_cap_browsers | default(none) | to_json }}.
      - ok: >-
          {{ _bmc_maps | map(attribute='command', default='') | map('string')
             | select('match', '^/[A-Za-z0-9._+/-]+$') | list | length == _bmc_maps | length
             and _bmc_maps | map(attribute='desktop_id', default='') | map('string')
             | select('match', '^[A-Za-z0-9._-]+[.]desktop$') | list | length == _bmc_maps | length }}
        msg: >-
          each browser_memory_cap_browsers entry needs command (the absolute
          path of the browser's own launcher, such as /usr/bin/brave-browser-stable)
          and desktop_id (a desktop file name such as brave-browser.desktop); got
          {{ _bmc_maps | map(attribute='command', default=none) | list | to_json }} and
          {{ _bmc_maps | map(attribute='desktop_id', default=none) | list | to_json }}.
      - ok: "{{ (_bmc_highs + _bmc_maxes) | select('match', _bmc_size_re) | list | length == (_bmc_highs + _bmc_maxes) | length }}"
        msg: >-
          each browser_memory_cap_browsers entry needs memory_high and
          memory_max as a systemd memory size (16G, 512M), a percentage of RAM
          (25%) or infinity; got memory_high {{ _bmc_highs | to_json }} and
          memory_max {{ _bmc_maxes | to_json }}.
      - ok: "{{ _bmc_byte_pairs | map('sort') | list == _bmc_byte_pairs }}"
        msg: >-
          memory_high of a browser_memory_cap_browsers entry must not be above
          its memory_max (the browser is slowed at memory_high, stopped at
          memory_max); got memory_high {{ _bmc_highs | to_json }} and memory_max
          {{ _bmc_maxes | to_json }}.
      - ok: "{{ agent_cpu_policy_quota | default('auto') | string | trim is match('^(auto|[1-9][0-9]*%)$') }}"
        msg: >-
          agent_cpu_policy_quota must be auto (derived from the CPU count) or a
          systemd CPU percentage, such as 800% for eight CPUs; got
          {{ agent_cpu_policy_quota | default(none) | to_json }}.
      - ok: >-
          {{ agent_cpu_policy_share_percent | default(75) | string is match(_whole_number_re)
             and agent_cpu_policy_share_percent | default(75) | int >= 1
             and agent_cpu_policy_share_percent | default(75) | int <= 100 }}
        msg: >-
          agent_cpu_policy_share_percent must be a whole percent from 1 to 100
          (the share of all CPUs the agents may use); got
          {{ agent_cpu_policy_share_percent | default(none) | to_json }}.
      - ok: >-
          {{ agent_cpu_policy_reserve_cpus | default(1) | string is match(_whole_number_re)
             and agent_cpu_policy_min_quota_percent | default(50) | string is match(_whole_number_re)
             and agent_cpu_policy_min_quota_percent | default(50) | int >= 1 }}
        msg: >-
          agent_cpu_policy_reserve_cpus must be a whole number of CPUs (0 or
          more) and agent_cpu_policy_min_quota_percent a whole percent of one
          CPU of at least 1; got {{ agent_cpu_policy_reserve_cpus | default(none) | to_json }} and
          {{ agent_cpu_policy_min_quota_percent | default(none) | to_json }}.
      - ok: >-
          {{ agent_cpu_policy_weight | default(50) | string is match(_whole_number_re)
             and agent_cpu_policy_weight | default(50) | int >= 1
             and agent_cpu_policy_weight | default(50) | int <= 10000 }}
        msg: >-
          agent_cpu_policy_weight must be a systemd CPUWeight from 1 to 10000
          (100 is systemd's default); got {{ agent_cpu_policy_weight | default(none) | to_json }}.
      - ok: "{{ _agent_cpu_commands | map('string') | reject('match', _env_name_re) | list | length == 0 }}"
        msg: >-
          agent_cpu_policy_wrapped_commands entries become shell function names,
          so each must be a plain identifier (letters, digits and underscore,
          not starting with a digit), such as claude; got
          {{ _agent_cpu_commands | map('string') | reject('match', _env_name_re) | list | to_json }}.
      - ok: "{{ agent_cpu_policy_slice | default('curiosity-agents.slice') | string is match('^[A-Za-z0-9_.@-]+[.]slice$') }}"
        msg: >-
          agent_cpu_policy_slice must be a systemd slice unit name without a
          path, such as curiosity-agents.slice; got
          {{ agent_cpu_policy_slice | default(none) | to_json }}.
      - ok: >-
          {{ catalog_integrity_mode | default('warn') != 'enforce'
             or catalog_signing_key_fingerprint | default('') | string | trim is match('^[0-9A-Fa-f]{40}$') }}
        msg: >-
          catalog_integrity_mode enforce needs catalog_signing_key_fingerprint,
          the 40-character fingerprint of the trusted signing key; got
          {{ catalog_signing_key_fingerprint | default('') | to_json }}. Use warn until the key is provisioned.
      - ok: "{{ not (coder_cli_enabled | default(false) | bool) or coder_deployment_url | default('') | length > 0 }}"
        msg: >-
          coder_cli_enabled is true, so coder_deployment_url must be set to the
          lab's own Coder deployment, such as https://coder.example.org; it is empty.
      - ok: >-
          {{ workstation_profile | default('') != 'workspace'
             or accessibility_packages | default([]) | length == 0 }}
        msg: >-
          accessibility_packages lists {{ accessibility_packages | default([]) | to_json }}, but
          workstation_profile workspace has no desktop session to run them in;
          they install on desktop, thin-client and byod-kiosk. Leave the list
          empty on a workspace.
      - ok: >-
          {{ workstation_profile | default('') != 'workspace'
             or not (workspace_git_auth_helper_enabled | default(false) | bool)
             or _workspace_helper_unset | length == 0 }}
        msg: >-
          workspace_git_auth_helper_enabled is true, so workspace_git_host (the
          git server, such as git.example.org), workspace_external_auth_provider
          (the workspace service's id for its external-auth provider),
          workspace_external_auth_binary and workspace_git_auth_username
          must all be set; empty: {{ _workspace_helper_unset | join(', ') }}
          (docs/workspace-providers.md).
      - ok: "{{ workspace_git_host | default('') | string is match(_workspace_host_re) }}"
        msg: >-
          workspace_git_host must be empty or a host name with an optional
          :port, without scheme, path or login, such as git.example.org; got
          {{ workspace_git_host | default('') | regex_replace('://[^/@\s]*@', '://***@') | to_json }}.
      - ok: >-
          {{ [workspace_external_auth_provider | default(''), workspace_git_auth_username | default('oauth2')]
             | map('string') | reject('match', _workspace_name_re) | list | length == 0 }}
        msg: >-
          workspace_external_auth_provider and workspace_git_auth_username
          may use only letters, digits, dot, dash and underscore; got
          {{ workspace_external_auth_provider | default('') | to_json }} and
          {{ workspace_git_auth_username | default('') | to_json }}.
      - ok: "{{ workspace_external_auth_binary | default('') | string is match(_workspace_command_re) }}"
        msg: >-
          workspace_external_auth_binary must be a command name on PATH, such as
          coder, or an absolute path, without spaces or shell characters; got
          {{ workspace_external_auth_binary | default('') | to_json }}.
      - ok: >-
          {{ (_workspace_env | list + _workspace_env_unset) | map('string')
             | reject('match', _env_name_re) | list | length == 0 }}
        msg: >-
          workspace_login_env keys and workspace_login_env_unset entries must be
          environment variable names (letters, digits and underscore, not
          starting with a digit), such as GITLAB_HOST; got
          {{ (_workspace_env | list + _workspace_env_unset) | map('string') | reject('match', _env_name_re) | list | to_json }}.
      - ok: >-
          {{ _workspace_env | dict2items | map(attribute='value')
             | reject('string') | reject('number') | list | length == 0
             and _workspace_env | dict2items | map(attribute='value') | map('string')
             | select('search', '[\r\n]') | list | length == 0 }}
        msg: >-
          workspace_login_env values must be single-line strings or numbers; got
          {{ _workspace_env | to_json }}.
      - ok: >-
          {{ user_dotfiles_repo | default('') | length == 0
             or user_dotfiles_apply | default('force') != 'review'
             or (user_dotfiles_review_argv | default([]) | length > 0
                 and user_dotfiles_review_argv[0] | string is match('^/')) }}
        msg: >-
          user_dotfiles_apply is review, so user_dotfiles_review_argv must be the
          dotfiles repo's own review gate as an argv list starting with an
          absolute path, such as ["/home/example/.local/bin/dotfiles-review", "sync"];
          got {{ user_dotfiles_review_argv | default([]) | to_json }}.
      - ok: "{{ workstation_profile | default('') != 'byod-kiosk' or kiosk_target_url | default('') | length > 0 }}"
        msg: >-
          workstation_profile byod-kiosk needs kiosk_target_url, the page the
          kiosk opens (such as https://portal.example.org); it is empty.
      - ok: >-
          {{ workstation_profile | default('') != 'thin-client'
             or not (missionctl_enabled | default(false) | bool)
             or (missionctl_install_url | default('') | length > 0
                 and missionctl_install_sha256 | default('') | length > 0) }}
        msg: >-
          missionctl_enabled is true on a thin-client, so missionctl_install_url
          (a direct https:// link to the binary) and missionctl_install_sha256
          (its trusted SHA-256) must both be set; got
          {{ missionctl_install_url | default('') | regex_replace('://[^/@\s]*@', '://***@') | to_json }} and
          {{ missionctl_install_sha256 | default('') | to_json }}.
      - ok: >-
          {{ workstation_profile | default('') == 'byod-kiosk'
             or not (focuspass_screenlock_enabled | default(false) | bool)
             or (focuspass_screenlock_install_url | default('') | length > 0
                 and focuspass_screenlock_install_sha256 | default('') | length > 0) }}
        msg: >-
          focuspass_screenlock_enabled is true, so focuspass_screenlock_install_url
          (an https:// link to the .deb) and focuspass_screenlock_install_sha256
          (its trusted SHA-256) must both be set; got
          {{ focuspass_screenlock_install_url | default('') | regex_replace('://[^/@\s]*@', '://***@') | to_json }} and
          {{ focuspass_screenlock_install_sha256 | default('') | to_json }}.
      - ok: >-
          {{ not (catalog_tools_enabled | default(false) | bool)
             or (catalog_tools_install_url | default('') | length > 0
                 and catalog_tools_install_sha256 | default('') | length > 0) }}
        msg: >-
          catalog_tools_enabled is true, so catalog_tools_install_url (the
          https:// link to a release's catalog-tools asset) and
          catalog_tools_install_sha256 (the SHA-256 in its catalog-tools.sha256)
          must both be set; got
          {{ catalog_tools_install_url | default('') | regex_replace('://[^/@\s]*@', '://***@') | to_json }} and
          {{ catalog_tools_install_sha256 | default('') | to_json }}.
      - ok: >-
          {{ workstation_profile | default('') not in ['desktop', 'thin-client', 'byod-kiosk']
             or not (keycloak_sso_enabled | default(false) | bool)
             or [keycloak_host | default(''), keycloak_realm | default(''), keycloak_desktop_client_id | default('')]
                | map('string') | select('eq', '') | list | length == 0 }}
        msg: >-
          keycloak_sso_enabled is true, so keycloak_host, keycloak_realm and
          keycloak_desktop_client_id must all be set; got
          {{ keycloak_host | default('') | to_json }}, {{ keycloak_realm | default('') | to_json }} and
          {{ keycloak_desktop_client_id | default('') | to_json }}.
      - ok: >-
          {{ workstation_profile | default('') == 'thin-client'
             or not (weechat_enabled | default(false) | bool)
             or not (weechat_teams_enabled | default(false) | bool)
             or weechat_teams_client_id | default('') | length > 0 }}
        msg: >-
          weechat_teams_enabled is true, so weechat_teams_client_id must be set
          to the operator's Teams public client ID; it is empty.
      - ok: >-
          {{ workstation_profile | default('') != 'desktop'
             or not (jellyfin_desktop_enabled | default(false) | bool)
             or jellyfin_web_url | default('') | length > 0 }}
        msg: >-
          jellyfin_desktop_enabled is true, so jellyfin_web_url must be set to
          the Jellyfin server's address, such as https://jellyfin.example.org; it is empty.
      - ok: >-
          {{ not (fleetd_enabled | default(false) | bool)
             or (fleetd_registry_id | default('') | length > 0
                 and fleetd_package_base_url | default('') | length > 0) }}
        msg: >-
          fleetd_enabled is true, so fleetd_registry_id (this device's registry
          id) and fleetd_package_base_url (https, no trailing slash) must both be
          set; got {{ fleetd_registry_id | default('') | to_json }} and
          {{ fleetd_package_base_url | default('') | regex_replace('://[^/@\s]*@', '://***@') | to_json }}.
      - ok: >-
          {{ workstation_profile | default('') not in ['desktop', 'thin-client', 'byod-kiosk']
             or pia_tunnel_apps | default([]) | length == 0
             or not ((hardware_profiles | default({})).get(hardware_profile | default(''), {}).get('pia_vpn', false) | bool) }}
        msg: >-
          hardware profile {{ hardware_profile | default('') | to_json }} sets pia_vpn: true (the
          PIA desktop app split tunnel) and pia_tunnel_apps lists
          {{ pia_tunnel_apps | default([]) | to_json }}. Use one mechanism per host: empty
          pia_tunnel_apps, or a hardware profile without pia_vpn.

# Rules that read a secret. no_log keeps the values out of every output
# (tests/test_no_log_policy.py); only the messages, which name the variable and
# never its value, leave this task.
- name: Find secret-bearing settings that cannot work, without printing them
  ansible.builtin.set_fact:
    _config_hidden_problems: "{{ _config_hidden_rules | rejectattr('ok') | map(attribute='msg') | list }}"
  vars:
    _config_hidden_rules:
      - ok: >-
          {{ workstation_profile | default('') not in ['desktop', 'thin-client', 'byod-kiosk']
             or wifi_ssid | default('') | length == 0
             or wifi_psk | default('') | string | length >= 8 }}
        msg: >-
          wifi_ssid is set, so wifi_psk (the network's passphrase) must have at
          least 8 characters; its value is not shown. Keep it in Ansible Vault
          or protected host variables.
  no_log: true

- name: Stop before any change when the public configuration is invalid
  ansible.builtin.assert:
    that:
      - _config_problems | length == 0
      - _config_hidden_problems | length == 0
    fail_msg: |-
      The public configuration is invalid and nothing on this host was changed.
      Fix these setting(s), then run the role again (docs/configuration.md#validation):
      - {{ (_config_problems + _config_hidden_problems) | join(_config_item_separator) }}
    quiet: true
  vars:
    _config_item_separator: "\n- "
