---
# =============================================================================
# Minimal Desktop — Rofi App Launcher Configuration
# =============================================================================

- name: Ensure rofi config directory exists
  ansible.builtin.file:
    path: "{{ dw_user.home }}/.config/rofi"
    state: directory
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0755"

- name: Deploy rofi config (Arc-Dark theme, drun/run/window modes)
  ansible.builtin.copy:
    src: minimal-desktop/rofi-config.rasi
    dest: "{{ dw_user.home }}/.config/rofi/config.rasi"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"
