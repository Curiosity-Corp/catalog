---
# XScreenSaver's PAM conversation window displays each authentication prompt
# supplied by the host login stack, including a second factor when configured.
- name: Configure per-user screen locking
  ansible.builtin.include_tasks: minimal-desktop-locking-user.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"

- name: Configure XScreenSaver to use the host login authentication prompts
  ansible.builtin.copy:
    dest: /etc/pam.d/xscreensaver
    owner: root
    group: root
    mode: "0644"
    content: |
      # Screen unlock uses the host login authentication factors. XScreenSaver
      # displays each PAM prompt separately, including password and MFA.
      # Account/session hooks are omitted: XScreenSaver 6.08 does not reliably
      # enforce account-stage results and does not open a PAM session.
      auth include login
