---
# =============================================================================
# OpenZiti Edge Tunnel + OIDC Session Hooks
# =============================================================================
# Installs ziti-edge-tunnel, deploys OIDC login/logout/reactivation scripts,
# wires up GNOME screensaver lock/unlock hooks, and adds a profile.d hook
# so OIDC identities authenticate automatically on graphical login.
# =============================================================================

# -----------------------------------------------------------------------------
# Install / Update ziti-edge-tunnel
# -----------------------------------------------------------------------------
- name: Set ziti-edge-tunnel apt distribution
  ansible.builtin.set_fact:
    _ziti_tunnel_apt_distribution: >-
      {{
        {
          'bionic': 'bionic',
          'cosmic': 'bionic',
          'disco': 'bionic',
          'eoan': 'bionic',
          'focal': 'focal',
          'groovy': 'focal',
          'hirsute': 'focal',
          'impish': 'focal',
          'jammy': 'jammy',
          'kinetic': 'jammy',
          'lunar': 'jammy',
          'mantic': 'jammy',
          'noble': 'jammy',
          'oracular': 'jammy',
          'plucky': 'jammy',
          'questing': 'jammy',
          'resolute': 'jammy'
        }.get(ansible_distribution_release, 'jammy')
      }}

- name: Configure ziti-edge-tunnel repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/usr/share/keyrings/openziti-archive-keyring.gpg]
      https://packages.openziti.org/zitipax-openziti-deb-stable
      {{ _ziti_tunnel_apt_distribution }}
      main
    filename: openziti-edge-tunnel
    state: present
    update_cache: true

- name: Install or update ziti-edge-tunnel package  # noqa: package-latest
  ansible.builtin.apt:
    name: ziti-edge-tunnel
    state: latest
    update_cache: true

# -----------------------------------------------------------------------------
# OIDC Login Script
# -----------------------------------------------------------------------------
- name: Deploy OIDC login script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-login.sh
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/usr/bin/env bash
      # ziti-oidc-login.sh — authenticate all OIDC identities via ext-jwt-login
      set -euo pipefail

      IDENTITY_DIR="/opt/openziti/etc/identities"
      PROVIDER="{{ ziti_oidc_provider }}"

      if [[ -z "${PROVIDER}" ]]; then
        logger -t ziti-oidc "No OIDC provider configured; skipping login"
        exit 0
      fi

      shopt -s nullglob
      identities=("${IDENTITY_DIR}"/*-oidc.json)
      shopt -u nullglob

      if [[ -z "${identities[*]:-}" ]]; then
        logger -t ziti-oidc "No OIDC identity files found in ${IDENTITY_DIR}"
        exit 0
      fi

      for id_file in "${identities[@]}"; do
        logger -t ziti-oidc "Starting ext-jwt-login for ${id_file}"
        output=$(ziti-edge-tunnel ext-jwt-login -i "${id_file}" -p "${PROVIDER}" 2>&1) || true

        auth_url=$(echo "${output}" | grep -oP 'https://\S+' | head -n1) || true

        if [[ -n "${auth_url}" ]]; then
          logger -t ziti-oidc "Opening auth URL for ${id_file}"
          DISPLAY=:0 xdg-open "${auth_url}" 2>/dev/null || true
        else
          logger -t ziti-oidc "No auth URL extracted for ${id_file} — output: ${output}"
        fi
      done

# -----------------------------------------------------------------------------
# OIDC Logout Script
# -----------------------------------------------------------------------------
- name: Deploy OIDC logout script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-logout.sh
    mode: "0755"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-logout.sh — deactivate all OIDC identities on screen lock
      set -euo pipefail

      IDENTITY_DIR="/opt/openziti/etc/identities"

      shopt -s nullglob
      identities=("${IDENTITY_DIR}"/*-oidc.json)
      shopt -u nullglob

      for id_file in "${identities[@]}"; do
        id_name=$(basename "${id_file}" .json)
        logger -t ziti-oidc "Deactivating OIDC identity: ${id_name}"
        ziti-edge-tunnel on_off -o off -i "${id_name}" 2>&1 | logger -t ziti-oidc || true
      done

# -----------------------------------------------------------------------------
# OIDC Reactivation Script
# -----------------------------------------------------------------------------
- name: Deploy OIDC reactivation script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-reactivate.sh
    mode: "0755"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-reactivate.sh — reactivate OIDC identities on screen unlock
      set -euo pipefail

      IDENTITY_DIR="/opt/openziti/etc/identities"

      shopt -s nullglob
      identities=("${IDENTITY_DIR}"/*-oidc.json)
      shopt -u nullglob

      for id_file in "${identities[@]}"; do
        id_name=$(basename "${id_file}" .json)
        logger -t ziti-oidc "Reactivating OIDC identity: ${id_name}"
        if ! ziti-edge-tunnel on_off -o on -i "${id_name}" 2>&1 | logger -t ziti-oidc; then
          logger -t ziti-oidc "Reactivation failed for ${id_name}, triggering login flow"
          /usr/local/bin/ziti-oidc-login.sh
        fi
      done

# -----------------------------------------------------------------------------
# Profile.d Hook (graphical session auto-login)
# -----------------------------------------------------------------------------
- name: Deploy profile.d OIDC session hook
  ansible.builtin.copy:
    dest: /etc/profile.d/ziti-oidc-session.sh
    mode: "0644"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-session.sh — trigger OIDC login on graphical session start
      if [[ -n "${DISPLAY:-}" || -n "${WAYLAND_DISPLAY:-}" ]]; then
        ( sleep 5 && /usr/local/bin/ziti-oidc-login.sh ) &
        disown
      fi

# -----------------------------------------------------------------------------
# GNOME Screensaver Monitor (lock/unlock hooks)
# -----------------------------------------------------------------------------
- name: Deploy screensaver monitor script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-screensaver-monitor.sh
    mode: "0755"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-screensaver-monitor.sh — watch GNOME screensaver lock/unlock
      set -euo pipefail

      dbus-monitor --session "type='signal',interface='org.gnome.ScreenSaver'" | \
        while read -r line; do
          case "${line}" in
            *"boolean true"*)
              logger -t ziti-oidc "Screen locked — deactivating OIDC identities"
              /usr/local/bin/ziti-oidc-logout.sh
              ;;
            *"boolean false"*)
              logger -t ziti-oidc "Screen unlocked — reactivating OIDC identities"
              /usr/local/bin/ziti-oidc-reactivate.sh
              ;;
          esac
        done

- name: Deploy screensaver monitor systemd user service
  ansible.builtin.copy:
    dest: /etc/systemd/user/ziti-oidc-screensaver-monitor.service
    mode: "0644"
    owner: root
    group: root
    content: !unsafe |
      [Unit]
      Description=Ziti OIDC screensaver lock/unlock monitor
      After=graphical-session.target
      PartOf=graphical-session.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/ziti-oidc-screensaver-monitor.sh
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=graphical-session.target

- name: Enable screensaver monitor for all desktop users  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl --global enable ziti-oidc-screensaver-monitor.service
  register: _screensaver_monitor_enable
  changed_when: "'Created symlink' in _screensaver_monitor_enable.stdout or 'Created symlink' in _screensaver_monitor_enable.stderr"
  failed_when: _screensaver_monitor_enable.rc != 0

# -----------------------------------------------------------------------------
# Sudoers Rule (password-less OIDC script execution)
# -----------------------------------------------------------------------------
- name: Deploy sudoers rule for OIDC scripts
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ziti-oidc
    mode: "0440"
    owner: root
    group: root
    content: !unsafe |
      # Allow any user to run Ziti OIDC scripts as root without password
      ALL ALL=(root) NOPASSWD: /usr/local/bin/ziti-oidc-login.sh
      ALL ALL=(root) NOPASSWD: /usr/local/bin/ziti-oidc-logout.sh
      ALL ALL=(root) NOPASSWD: /usr/local/bin/ziti-oidc-reactivate.sh
    validate: "visudo -cf %s"

# -----------------------------------------------------------------------------
# Identity directory and file permissions
# -----------------------------------------------------------------------------
# The ziti-edge-tunnel package installs /opt/openziti/etc/identities as
# 0700 root:ziti on some builds, which prevents the ziti service user from
# listing or reading identity files. The tunnel also persists config/backups
# and renews certificates as user=ziti, so the service group needs directory
# write access and group-write access to managed identity files.
- name: Ensure ziti identities directory is group-accessible
  ansible.builtin.file:
    path: /opt/openziti/etc/identities
    state: directory
    owner: root
    group: ziti
    mode: "0770"

# Identity files created by the firstboot enroll_ziti() function are written
# as root:root 0600. The ziti service runs as user=ziti and cannot renew certs
# on files it cannot write. Fix ownership and group-write access so the ziti
# service can manage them without making the identity world-readable.
- name: Fix ownership of existing ziti identity files to root:ziti
  ansible.builtin.shell: |
    find /opt/openziti/etc/identities/ -maxdepth 1 -name '*.json' \
      -exec chown root:ziti {} \; \
      -exec chmod 0660 {} \;
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

# -----------------------------------------------------------------------------
# Enable the configured Ziti service
# -----------------------------------------------------------------------------
# Some operators intentionally mask this unit (e.g. a cert-based always-on
# tunnel identity owns the TUN device instead — see
# a separate operator-managed tunnel service). systemd refuses
# to enable/start a masked unit, which previously made this task fail and
# abort every later task in this file (including the /etc/hosts pin refresh
# below) on any host where edge-tunnel is masked. Query state first and skip
# gracefully rather than fighting a deliberate mask.
- name: Check configured Ziti service mask state  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "systemctl is-enabled {{ ziti_service_name }}"
  register: _ziti_edge_tunnel_enabled_state
  changed_when: false
  failed_when: false

- name: Enable configured Ziti service
  ansible.builtin.systemd:
    name: "{{ ziti_service_name }}"
    enabled: true
    state: started
  when:
    - ziti_manage_service | default(true)
    - _ziti_edge_tunnel_enabled_state.stdout | default('') != 'masked'

# -----------------------------------------------------------------------------
# Guarded tunnel restart
# -----------------------------------------------------------------------------
# Handlers that change tunnel drop-ins call "Restart ziti-edge-tunnel", which
# runs files/curiosity-ziti-safe-restart instead of a bare restart so live ssh
# sessions survive a run; a restart it deferred is applied here once idle.
- name: Apply a deferred Ziti tunnel restart when no ssh connection is live
  ansible.builtin.script:
    cmd: curiosity-ziti-safe-restart --pending
  environment:
    ZITI_SAFE_UNIT: "{{ ziti_service_name }}"
  register: _ziti_safe_restart_pending
  changed_when: "'restarted' in _ziti_safe_restart_pending.stdout"
  when: _ziti_edge_tunnel_enabled_state.stdout | default('') != 'masked'

# -----------------------------------------------------------------------------
# Tunnel health check
# -----------------------------------------------------------------------------
# curiosity-ziti-health.timer restarts the tunnel when an identity is Active but
# not Loaded (or a loaded tunnel cannot resolve the probe host), at most once
# per ziti_health_check_min_interval. See files/curiosity-ziti-health.
- name: Validate Ziti health check inputs
  ansible.builtin.assert:
    that:
      - ziti_health_check_interval is match('^[1-9][0-9]*(s|sec|min|m|h)$')
      - ziti_health_check_identities is sequence
      - ziti_health_check_identities is not string
      - ziti_health_check_probe_hosts is sequence
      - ziti_health_check_probe_hosts is not string
      - ziti_health_check_probe_hosts | select('match', '^[A-Za-z0-9._-]+$') | list | length == ziti_health_check_probe_hosts | length
      - ziti_health_check_identities | select('match', '^[A-Za-z0-9._@-]+$') | list | length == ziti_health_check_identities | length
      - ziti_health_check_grace | int >= 0
      - ziti_health_check_min_interval | int >= 0
      - ziti_health_check_timeout | int >= 1
    quiet: true
  when: ziti_health_check_enabled | bool

- name: Install Ziti health check script
  ansible.builtin.copy:
    src: curiosity-ziti-health
    dest: "{{ ziti_health_check_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: ziti_health_check_enabled | bool

- name: Install Ziti health check systemd service
  ansible.builtin.template:
    src: curiosity-ziti-health.service.j2
    dest: /etc/systemd/system/curiosity-ziti-health.service
    owner: root
    group: root
    mode: "0644"
  when: ziti_health_check_enabled | bool
  notify: Reload systemd

- name: Install Ziti health check systemd timer
  ansible.builtin.template:
    src: curiosity-ziti-health.timer.j2
    dest: /etc/systemd/system/curiosity-ziti-health.timer
    owner: root
    group: root
    mode: "0644"
  when: ziti_health_check_enabled | bool
  notify: Restart curiosity ziti-health timer

- name: Enable Ziti health check timer
  ansible.builtin.systemd:
    name: curiosity-ziti-health.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ziti_health_check_enabled | bool

- name: Stop and disable Ziti health check timer when it is not wanted
  ansible.builtin.systemd:
    name: curiosity-ziti-health.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not (ziti_health_check_enabled | bool)

- name: Remove Ziti health check files when it is not wanted
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/curiosity-ziti-health.timer
    - /etc/systemd/system/curiosity-ziti-health.service
    - "{{ ziti_health_check_script_path }}"
  notify: Reload systemd
  when: not (ziti_health_check_enabled | bool)

# -----------------------------------------------------------------------------
# /etc/hosts pins for Ziti-only hostnames
# -----------------------------------------------------------------------------
# Some Ziti services may require a local resolver pin. Their names are
# intentionally supplied by the operator (host_vars / group_vars / -e, never the
# public defaults); the public role does not know an organization's private DNS
# topology.
#
# files/curiosity-ziti-pins resolves each pinned hostname against Ziti's
# internal resolver (ziti_pin_resolver, 100.64.0.2) and writes an
# ansible-managed block in /etc/hosts. A pin the resolver cannot answer is
# removed, not left stale, and an empty ziti_etc_hosts_pins removes the block.
#
# The tunnel reallocates its overlay addresses when it restarts, so a refresh
# during an Ansible run is not enough: with ziti_pin_lifecycle_enabled the
# tunnel unit gets an ExecStartPost drop-in that starts
# curiosity-ziti-pins.service on every start, and that service re-resolves the
# pins once the identities have loaded. See docs/ziti-pin-lifecycle.md.
#
# First-run note: if the OIDC identity has not yet authenticated, Ziti's
# resolver returns no answer for service hostnames, so no pins are written this
# run; the next tunnel start (or run) fills them in.

- name: Validate Ziti pin inputs
  ansible.builtin.assert:
    that:
      - ziti_etc_hosts_pins is sequence
      - ziti_etc_hosts_pins is not string
      - ziti_etc_hosts_pins | select('match', '^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$') | list | length == ziti_etc_hosts_pins | length
      - ziti_pin_resolver is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - ziti_pin_wait | int >= 0
      - ziti_service_name is match('^[A-Za-z0-9:_.@-]+$')
    quiet: true

- name: Ensure dig is available for Ziti DNS lookups
  ansible.builtin.apt:
    name: dnsutils
    state: present
  when: ziti_etc_hosts_pins | length > 0

- name: Ensure the curiosity configuration directory exists for the Ziti pins
  ansible.builtin.file:
    path: "{{ ziti_pin_env_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ziti_etc_hosts_pins | length > 0

- name: Install Ziti pin refresh script
  ansible.builtin.copy:
    src: curiosity-ziti-pins
    dest: "{{ ziti_pin_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: ziti_etc_hosts_pins | length > 0

- name: Write the host-local Ziti pin list
  ansible.builtin.template:
    src: curiosity-ziti-pins.env.j2
    dest: "{{ ziti_pin_env_path }}"
    owner: root
    group: root
    mode: "0644"
  when: ziti_etc_hosts_pins | length > 0

- name: Install Ziti pin refresh systemd service
  ansible.builtin.template:
    src: curiosity-ziti-pins.service.j2
    dest: /etc/systemd/system/curiosity-ziti-pins.service
    owner: root
    group: root
    mode: "0644"
  when:
    - ziti_etc_hosts_pins | length > 0
    - ziti_pin_lifecycle_enabled | bool
  notify: Reload systemd

- name: Ensure the Ziti tunnel unit drop-in directory exists for the pin refresh
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ ziti_service_name }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - ziti_etc_hosts_pins | length > 0
    - ziti_pin_lifecycle_enabled | bool

# Takes effect at the tunnel's next start. Nothing restarts the tunnel here: a
# restart would close the live ssh sessions that ride it.
- name: Install the Ziti tunnel ExecStartPost drop-in that refreshes the pins
  ansible.builtin.template:
    src: curiosity-ziti-pins.dropin.conf.j2
    dest: "/etc/systemd/system/{{ ziti_service_name }}.d/20-curiosity-ziti-pins.conf"
    owner: root
    group: root
    mode: "0644"
  when:
    - ziti_etc_hosts_pins | length > 0
    - ziti_pin_lifecycle_enabled | bool
  notify: Reload systemd

- name: Remove the Ziti pin lifecycle hooks when they are not wanted
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ ziti_service_name }}.d/20-curiosity-ziti-pins.conf"
    - /etc/systemd/system/curiosity-ziti-pins.service
  notify: Reload systemd
  when: (ziti_etc_hosts_pins | length == 0) or not (ziti_pin_lifecycle_enabled | bool)

- name: Remove the Ziti pin script and list when no pins are configured
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ziti_pin_script_path }}"
    - "{{ ziti_pin_env_path }}"
  when: ziti_etc_hosts_pins | length == 0

# One pass now, so a run converges without waiting for the next tunnel start.
# Pins the resolver cannot answer are dropped rather than left stale.
- name: Refresh the Ziti pins in /etc/hosts
  ansible.builtin.command:
    argv:
      - "{{ ziti_pin_script_path }}"
      - refresh
  environment:
    ZITI_PINS_HOSTS: "{{ ziti_etc_hosts_pins | join(',') }}"
    ZITI_PINS_RESOLVER: "{{ ziti_pin_resolver }}"
  register: _ziti_pin_refresh
  changed_when: "'changed:' in _ziti_pin_refresh.stdout"
  when: ziti_etc_hosts_pins | length > 0

- name: Remove the Ziti pin block from /etc/hosts when no pins are configured
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Ziti DNS pins"
    state: absent
  when: ziti_etc_hosts_pins | length == 0
