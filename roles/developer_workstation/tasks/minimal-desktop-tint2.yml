---
# =============================================================================
# Minimal Desktop — Tint2 Panel Configuration
# =============================================================================
# Included once per item of dev_users with loop_var dw_user. The layout comes
# from the item's optional tint2_layout, else minimal_desktop_tint2_layout.

- name: Select the tint2 panel layout for this user
  ansible.builtin.set_fact:
    _minimal_desktop_tint2_layout: "{{ dw_user.tint2_layout | default(minimal_desktop_tint2_layout) }}"

- name: Validate the tint2 panel layout
  ansible.builtin.assert:
    that:
      - _minimal_desktop_tint2_layout in ['bottom', 'top']
    fail_msg: >-
      Unknown tint2 layout '{{ _minimal_desktop_tint2_layout }}' for
      {{ dw_user.name }}. Set minimal_desktop_tint2_layout or the dev_users
      item's tint2_layout to one of: bottom, top.

- name: Ensure tint2 config directory exists
  ansible.builtin.file:
    path: "{{ dw_user.home }}/.config/tint2"
    state: directory
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0755"

- name: Deploy the selected tint2 panel layout
  ansible.builtin.copy:
    src: "minimal-desktop/tint2/{{ _minimal_desktop_tint2_layout }}.tint2rc"
    dest: "{{ dw_user.home }}/.config/tint2/tint2rc"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"
  when: minimal_desktop_display_scale | float <= 1

# At a display scale above 1 the layout's panel height and launcher icon size
# are multiplied by the scale and rounded to the nearest whole pixel (halves
# away from zero): the top layout's 36 and 25 become 72 and 50 at 2x, 81 and 56
# at 2.25x. tasks/minimal-desktop-display-scale.yml validates the scale.
# Rendering the content keeps the task idempotent.
- name: Read the selected tint2 panel layout and scale its sizes
  ansible.builtin.set_fact:
    _minimal_desktop_tint2_source: "{{ lookup('ansible.builtin.file', 'minimal-desktop/tint2/' ~ _minimal_desktop_tint2_layout ~ '.tint2rc') }}"
    _minimal_desktop_tint2_panel_height: >-
      {{ ((lookup('ansible.builtin.file', 'minimal-desktop/tint2/' ~ _minimal_desktop_tint2_layout ~ '.tint2rc')
      | regex_findall('(?m)^panel_size = 100% ([0-9]+)$') | first | int)
      * (minimal_desktop_display_scale | float)) | round | int }}
    _minimal_desktop_tint2_launcher_size: >-
      {{ ((lookup('ansible.builtin.file', 'minimal-desktop/tint2/' ~ _minimal_desktop_tint2_layout ~ '.tint2rc')
      | regex_findall('(?m)^launcher_icon_size = ([0-9]+)$') | first | default(0) | int)
      * (minimal_desktop_display_scale | float)) | round | int }}
  when: minimal_desktop_display_scale | float > 1

- name: Deploy the selected tint2 panel layout scaled for the display
  ansible.builtin.copy:
    dest: "{{ dw_user.home }}/.config/tint2/tint2rc"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    mode: "0644"
    # The layout has no launcher on the bottom bar; the second substitution then
    # matches nothing.
    content: |
      {{ _minimal_desktop_tint2_source
      | regex_replace('(?m)^panel_size = 100% [0-9]+$', 'panel_size = 100% ' ~ _minimal_desktop_tint2_panel_height)
      | regex_replace('(?m)^launcher_icon_size = [0-9]+$', 'launcher_icon_size = ' ~ _minimal_desktop_tint2_launcher_size) }}
  when: minimal_desktop_display_scale | float > 1
