---
# =============================================================================
# AI Coding Assistants
# =============================================================================
# CLI tools for AI-assisted development, plus provider configuration.
# The package update is user-scoped and explicitly uses npm's latest state so
# existing installs are refreshed on every nightly ansible-pull.
# =============================================================================

- name: Update user-scoped AI coding assistants to latest
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: "{{ npm_global_executable }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  loop: "{{ ai_assistant_packages }}"
  register: _ai_npm_result
  failed_when: _ai_npm_result is failed

- name: Repair user-scoped AI command launchers
  ansible.builtin.file:
    src: "{{ npm_global_prefix }}/lib/node_modules/{{ item.package }}/{{ item.relative_path }}"
    dest: "{{ npm_global_prefix }}/bin/{{ item.command }}"
    state: link
    force: true
  become: true
  become_user: "{{ dev_user }}"
  loop: "{{ ai_assistant_command_links }}"
  loop_control:
    label: "{{ item.command }}"

# =============================================================================
# Standalone Codex CLI: codex-standalone.yml
# =============================================================================
# Codex is installed by codex-standalone.yml, which main.yml includes after
# upstream release discovery because the installer comes from the resolved
# openai/codex release (catalog#178).
# =============================================================================

# catalog#171 retired the installer URL overrides: the Codex installer now comes
# from the openai/codex release with its digest, and Claude Code from its
# signed release manifest. A host that still sets one is told it is ignored.
- name: Warn about retired assistant installer URL variables
  ansible.builtin.debug:
    msg: >-
      {{ item }} is no longer used and is ignored: the role installs only
      installers and binaries it has verified (CHANGELOG, catalog#171).
      Remove it from the host variables.
  loop:
    - codex_standalone_installer_url
    - claude_native_installer_url
  when: lookup('vars', item, default='') | length > 0

# =============================================================================
# Native Claude Code
# =============================================================================
# Claude Code is deliberately NOT part of the npm refresh above. The npm
# package and the official native installer both provide a `claude` command;
# with both present Claude Code reported a duplicate installation on every
# launch and PATH order decided which one ran. The native installer owns
# ~/.local/bin/claude for every dev_users account (claude-code-user.yml),
# every run moves it to claude_native_channel, and the run fails if any
# second `claude` is still reachable. claude_native_users adds accounts that
# get Claude Code and nothing else of the desktop (a person who works over
# ssh, with no seat at this screen); an account in both lists is converged
# once.
# =============================================================================

- name: Remove retired system-wide Claude Code launchers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ claude_retired_system_launchers }}"
  when: claude_native_enabled | default(true)

- name: Validate the Claude Code only accounts
  ansible.builtin.assert:
    that:
      - claude_native_users is sequence
      - claude_native_users is not string
      - claude_native_users | selectattr('name', 'defined') | selectattr('home', 'defined') | list | length == claude_native_users | length
      - claude_native_users | map(attribute='name') | select('match', '^[a-z_][a-z0-9_-]*$') | list | length == claude_native_users | length
      - claude_native_users | map(attribute='home') | select('match', '^/[^ ]+$') | reject('search', '/\\.\\./') | list | length == claude_native_users | length
      - claude_native_users | map(attribute='name') | unique | list | length == claude_native_users | length
    fail_msg: >-
      claude_native_users must be a list of {name, home} with unique POSIX
      user names and absolute home paths, like dev_users; got
      {{ claude_native_users | to_json }}.
    quiet: true
  when: claude_native_enabled | default(true)
  tags: [packages, ai]

- name: Keep a single native Claude Code install for every managed user
  ansible.builtin.include_tasks:
    file: claude-code-user.yml
    apply:
      tags: [packages, ai]
  loop: "{{ dev_users + (claude_native_users | rejectattr('name', 'in', dev_users | map(attribute='name') | list) | list) }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [packages, ai]
  when: claude_native_enabled | default(true)

# =============================================================================
# Optional Qwen Code provider configuration
# =============================================================================
# The secret command is supplied by the operator in protected variables. This
# keeps the public role independent of any particular cloud or secret store.
# =============================================================================

- name: Fetch optional Qwen provider API key
  ansible.builtin.shell: >
    {{ qwen_provider_secret_command }}
  register: _nvidia_api_key
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - qwen_provider_enabled | default(false)
    - qwen_provider_secret_command | default('') | length > 0

- name: Warn if NVIDIA API key could not be fetched
  ansible.builtin.debug:
    msg: >
      WARNING: Could not fetch the configured Qwen provider API key.
      Qwen Code will be installed but not configured with NVIDIA provider.
      Authenticate with 'az login' and re-run to configure.
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) != 0

- name: Create Qwen Code config directory
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.qwen"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0

- name: Write Qwen Code settings (NVIDIA NIM provider)
  ansible.builtin.copy:
    content: |
      {
        "modelProviders": {
          "openai": [
            {
              "id": "{{ qwen_provider_model }}",
              "name": "Configured Qwen provider",
              "baseUrl": "{{ qwen_provider_base_url }}",
              "envKey": "NVIDIA_API_KEY",
              "description": "Qwen3.5-397B-A17B MoE via NVIDIA NIM"
            }
          ]
        }
      }
    dest: "{{ dev_user_home }}/.qwen/settings.json"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0

- name: Write NVIDIA API key to Qwen Code env file
  ansible.builtin.copy:
    content: |
      NVIDIA_API_KEY={{ _nvidia_api_key.stdout }}
    dest: "{{ dev_user_home }}/.qwen/.env"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0
  no_log: true
