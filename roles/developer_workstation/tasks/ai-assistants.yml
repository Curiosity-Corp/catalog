---
# =============================================================================
# AI Coding Assistants
# =============================================================================
# CLI tools for AI-assisted development, plus provider configuration.
# The package update is user-scoped and explicitly uses npm's latest state so
# existing installs are refreshed on every nightly ansible-pull.
# =============================================================================

# npm 12 blocks install-time scripts unless the package is allowlisted. Claude
# Code's postinstall copies its native binary over the bin/claude.exe stub, so
# a blocked script leaves a `claude` that only prints "native binary not
# installed" — after this refresh and after every self-update. Keep the
# allowlist in the user's npmrc, merged with whatever the user added.
- name: Read the npm version for AI assistant updates
  ansible.builtin.command:
    argv: ["{{ npm_global_executable }}", --version]
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _ai_npm_version
  changed_when: false
  failed_when: false

- name: Read the user's npm install-script allowlist
  ansible.builtin.command:
    argv: ["{{ npm_global_executable }}", config, get, allow-scripts, --location=user]
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _ai_allow_scripts
  changed_when: false
  failed_when: false
  when: _ai_npm_version.stdout | default('0') is version('12', '>=')

- name: Allow the AI assistants' install scripts for global npm installs
  ansible.builtin.command:
    argv:
      - "{{ npm_global_executable }}"
      - config
      - set
      - "allow-scripts={{ _ai_allow_scripts_wanted }}"
      - --location=user
  vars:
    _ai_allow_scripts_current: >-
      {{ (_ai_allow_scripts.stdout | default('')).split(',') | map('trim')
         | reject('in', ['', 'undefined', 'null']) | list }}
    _ai_allow_scripts_wanted: "{{ (_ai_allow_scripts_current + ai_assistant_install_scripts) | unique | join(',') }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when:
    - _ai_npm_version.stdout | default('0') is version('12', '>=')
    - ai_assistant_install_scripts | difference(_ai_allow_scripts_current) | length > 0
  changed_when: true

- name: Update user-scoped AI coding assistants to latest
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: "{{ npm_global_executable }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  loop: "{{ ai_assistant_packages }}"
  register: _ai_npm_result
  failed_when: _ai_npm_result is failed

- name: Repair user-scoped AI command launchers
  ansible.builtin.file:
    src: "{{ npm_global_prefix }}/lib/node_modules/{{ item.package }}/{{ item.relative_path }}"
    dest: "{{ npm_global_prefix }}/bin/{{ item.command }}"
    state: link
    force: true
  become: true
  become_user: "{{ dev_user }}"
  loop: "{{ ai_assistant_command_links }}"
  loop_control:
    label: "{{ item.command }}"

# A launcher whose install script was blocked earlier (or by a self-update
# before the allowlist existed) is repaired by running that script now.
- name: Check that the Claude Code launcher runs
  ansible.builtin.command:
    argv: ["{{ npm_global_prefix }}/bin/claude", --version]
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  register: _ai_claude_check
  changed_when: false
  failed_when: false

- name: Finish a Claude Code install whose postinstall npm blocked
  ansible.builtin.command:
    argv: [node, install.cjs]
    chdir: "{{ npm_global_prefix }}/lib/node_modules/@anthropic-ai/claude-code"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "{{ npm_global_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
  when:
    - _ai_claude_check.rc != 0
    - "'@anthropic-ai/claude-code' in ai_assistant_packages"
  changed_when: true

# =============================================================================
# Standalone Codex CLI
# =============================================================================
# Codex is deliberately NOT part of the npm refresh above. The nightly
# registry refresh used to place a second `codex` in ~/.npm-global/bin next to
# the standalone binary, and whichever install PATH reached first was the one
# that ran — so a failed or missing npm copy broke the user's `codex` command
# on every pull. The official standalone installer owns the user-scoped
# launcher, and a user-level codex-auto-update timer keeps the release
# current between ansible-pull runs.
# =============================================================================

- name: Check standalone Codex launcher
  ansible.builtin.command: "{{ codex_standalone_install_dir }}/codex --version"
  register: _codex_standalone_check
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: codex_standalone_enabled | default(true)

- name: Remove legacy npm-managed Codex
  community.general.npm:
    name: "@openai/codex"
    global: true
    state: absent
    executable: "{{ npm_global_executable }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _codex_npm_removal
  failed_when: false
  when: codex_standalone_enabled | default(true)

- name: Download official Codex standalone installer
  ansible.builtin.get_url:
    url: "{{ codex_standalone_installer_url }}"
    dest: /tmp/install-codex.sh
    mode: "0700"
    force: true
  become: true
  become_user: "{{ dev_user }}"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Install standalone Codex CLI
  ansible.builtin.command:
    cmd: /bin/bash /tmp/install-codex.sh
  environment:
    HOME: "{{ dev_user_home }}"
    CODEX_RELEASE: "{{ codex_standalone_release }}"
    CODEX_NON_INTERACTIVE: "true"
    CODEX_INSTALL_DIR: "{{ codex_standalone_install_dir }}"
    CODEX_HOME: "{{ codex_standalone_home_dir }}"
  register: _codex_standalone_install
  failed_when: _codex_standalone_install.rc != 0
  changed_when: _codex_standalone_install.rc == 0
  become: true
  become_user: "{{ dev_user }}"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Verify standalone Codex launcher
  ansible.builtin.command: "{{ codex_standalone_install_dir }}/codex --version"
  register: _codex_standalone_verify
  changed_when: false
  failed_when: _codex_standalone_verify.rc != 0
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: codex_standalone_enabled | default(true)

- name: Clean up Codex standalone installer
  ansible.builtin.file:
    path: /tmp/install-codex.sh
    state: absent
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Stat system-level Codex shim
  ansible.builtin.stat:
    path: /usr/local/bin/codex
  register: _codex_system_shim
  when: codex_standalone_enabled | default(true)

- name: Remove broken system-level Codex symlink
  # Some base images ship a dangling /usr/local/bin/codex (pointing at a
  # /usr/bin/codex that is never installed). In shells without the user bin
  # directories on PATH it shadows the working launcher and makes `codex`
  # fail with "No such file or directory". Only symlinks are removed; a real
  # file is left for the operator to review.
  ansible.builtin.file:
    path: /usr/local/bin/codex
    state: absent
  when:
    - codex_standalone_enabled | default(true)
    - _codex_system_shim.stat.exists
    - _codex_system_shim.stat.islnk

# =============================================================================
# Optional Qwen Code provider configuration
# =============================================================================
# The secret command is supplied by the operator in protected variables. This
# keeps the public role independent of any particular cloud or secret store.
# =============================================================================

- name: Fetch optional Qwen provider API key
  ansible.builtin.shell: >
    {{ qwen_provider_secret_command }}
  register: _nvidia_api_key
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - qwen_provider_enabled | default(false)
    - qwen_provider_secret_command | default('') | length > 0

- name: Warn if NVIDIA API key could not be fetched
  ansible.builtin.debug:
    msg: >
      WARNING: Could not fetch the configured Qwen provider API key.
      Qwen Code will be installed but not configured with NVIDIA provider.
      Authenticate with 'az login' and re-run to configure.
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) != 0

- name: Create Qwen Code config directory
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.qwen"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0

- name: Write Qwen Code settings (NVIDIA NIM provider)
  ansible.builtin.copy:
    content: |
      {
        "modelProviders": {
          "openai": [
            {
              "id": "{{ qwen_provider_model }}",
              "name": "Configured Qwen provider",
              "baseUrl": "{{ qwen_provider_base_url }}",
              "envKey": "NVIDIA_API_KEY",
              "description": "Qwen3.5-397B-A17B MoE via NVIDIA NIM"
            }
          ]
        }
      }
    dest: "{{ dev_user_home }}/.qwen/settings.json"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0

- name: Write NVIDIA API key to Qwen Code env file
  ansible.builtin.copy:
    content: |
      NVIDIA_API_KEY={{ _nvidia_api_key.stdout }}
    dest: "{{ dev_user_home }}/.qwen/.env"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0
  no_log: true
