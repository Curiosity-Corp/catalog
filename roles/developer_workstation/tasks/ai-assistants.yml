---
# =============================================================================
# AI Coding Assistants
# =============================================================================
# CLI tools for AI-assisted development, plus provider configuration.
# The package update is user-scoped and explicitly uses npm's latest state so
# existing installs are refreshed on every nightly ansible-pull.
# =============================================================================

- name: Update user-scoped AI coding assistants to latest
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: "{{ npm_global_executable }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  loop: "{{ ai_assistant_packages }}"
  register: _ai_npm_result
  failed_when: _ai_npm_result is failed

- name: Repair user-scoped AI command launchers
  ansible.builtin.file:
    src: "{{ npm_global_prefix }}/lib/node_modules/{{ item.package }}/{{ item.relative_path }}"
    dest: "{{ npm_global_prefix }}/bin/{{ item.command }}"
    state: link
    force: true
  become: true
  become_user: "{{ dev_user }}"
  loop: "{{ ai_assistant_command_links }}"
  loop_control:
    label: "{{ item.command }}"

# =============================================================================
# Standalone Codex CLI
# =============================================================================
# Codex is deliberately NOT part of the npm refresh above. The nightly
# registry refresh used to place a second `codex` in ~/.npm-global/bin next to
# the standalone binary, and whichever install PATH reached first was the one
# that ran — so a failed or missing npm copy broke the user's `codex` command
# on every pull. The official standalone installer owns the user-scoped
# launcher, and a user-level codex-auto-update timer keeps the release
# current between ansible-pull runs.
# =============================================================================

# catalog#171 retired the installer URL overrides: the Codex installer now comes
# from the openai/codex release with its digest, and Claude Code from its
# signed release manifest. A host that still sets one is told it is ignored.
- name: Warn about retired assistant installer URL variables
  ansible.builtin.debug:
    msg: >-
      {{ item }} is no longer used and is ignored: the role installs only
      installers and binaries it has verified (CHANGELOG, catalog#171).
      Remove it from the host variables.
  loop:
    - codex_standalone_installer_url
    - claude_native_installer_url
  when: lookup('vars', item, default='') | length > 0

- name: Check standalone Codex launcher
  ansible.builtin.command: "{{ codex_standalone_install_dir }}/codex --version"
  register: _codex_standalone_check
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: codex_standalone_enabled | default(true)

- name: Remove legacy npm-managed Codex
  community.general.npm:
    name: "@openai/codex"
    global: true
    state: absent
    executable: "{{ npm_global_executable }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _codex_npm_removal
  failed_when: false
  when: codex_standalone_enabled | default(true)

# The installer comes from the openai/codex GitHub release (the same install.sh
# chatgpt.com/codex/install.sh serves), verified against the digest GitHub
# records for the asset, and installs that same release; the script then checks
# every binary it fetches against the release digests (catalog#171).
#
# This file runs before latest-releases.yml (see main.yml), so the release is
# queried here rather than read from latest_github_releases, which is still
# empty on a host's first converge. The headers and retries are the same as
# latest-releases.yml; a pinned codex_standalone_release reads that tag.
- name: Resolve the Codex release
  ansible.builtin.uri:
    url: >-
      https://api.github.com/repos/{{ latest_github_repositories.codex }}/releases/{{
        (codex_standalone_release == 'latest')
        | ternary('latest', 'tags/rust-v' ~ codex_standalone_release) }}
    headers: >-
      {{
        {
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'User-Agent': 'curiosity-catalog-workstation-updater'
        }
        | combine(
            ({'Authorization': 'Bearer ' ~ _github_api_token}
             if (_github_api_token | default('') | length > 0) else {})
          )
      }}
    return_content: true
    status_code: [200]
  register: _codex_release
  retries: 3
  delay: 2
  until: (_codex_release.status | default(0)) == 200
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Select the Codex installer from the release
  ansible.builtin.set_fact:
    _codex_installer_asset: >-
      {{ _codex_release.json.assets | default([])
         | selectattr('name', 'equalto', 'install.sh') | first | default({}) }}
    _codex_release_version: >-
      {{ _codex_release.json.tag_name | default('') | regex_replace('^rust-v', '') }}
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Require a verified Codex installer
  ansible.builtin.assert:
    that:
      - _codex_installer_asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')
      - _codex_release_version is match('^[0-9]+[.][0-9]+[.][0-9]+')
    fail_msg: >-
      The openai/codex release has no install.sh asset with a SHA-256 digest;
      refusing to run an unverified installer.
    quiet: true
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Download and verify the Codex standalone installer
  ansible.builtin.include_tasks:
    file: verified-download.yml
    apply:
      become: true
      become_user: "{{ dev_user }}"
  vars:
    verified_download_name: codex-install.sh
    verified_download_url: "{{ _codex_installer_asset.browser_download_url }}"
    verified_download_sha256: "{{ _codex_installer_asset.digest }}"
    verified_download_cache_dir: "{{ dev_user_home }}/.cache/curiosity-corp/downloads"
    verified_download_mode: "0700"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Install standalone Codex CLI
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ verified_download_path }}"
  environment:
    HOME: "{{ dev_user_home }}"
    CODEX_RELEASE: "{{ _codex_release_version }}"
    CODEX_NON_INTERACTIVE: "true"
    CODEX_INSTALL_DIR: "{{ codex_standalone_install_dir }}"
    CODEX_HOME: "{{ codex_standalone_home_dir }}"
  register: _codex_standalone_install
  failed_when: _codex_standalone_install.rc != 0
  changed_when: _codex_standalone_install.rc == 0
  become: true
  become_user: "{{ dev_user }}"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Verify standalone Codex launcher
  ansible.builtin.command: "{{ codex_standalone_install_dir }}/codex --version"
  register: _codex_standalone_verify
  changed_when: false
  failed_when: _codex_standalone_verify.rc != 0
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: codex_standalone_enabled | default(true)

- name: Clean up Codex standalone installer
  ansible.builtin.file:
    path: "{{ verified_download_path }}"
    state: absent
  become: true
  become_user: "{{ dev_user }}"
  when:
    - codex_standalone_enabled | default(true)
    - _codex_standalone_check.rc != 0

- name: Stat system-level Codex shim
  ansible.builtin.stat:
    path: /usr/local/bin/codex
  register: _codex_system_shim
  when: codex_standalone_enabled | default(true)

- name: Remove broken system-level Codex symlink
  # Some base images ship a dangling /usr/local/bin/codex (pointing at a
  # /usr/bin/codex that is never installed). In shells without the user bin
  # directories on PATH it shadows the working launcher and makes `codex`
  # fail with "No such file or directory". Only symlinks are removed; a real
  # file is left for the operator to review.
  ansible.builtin.file:
    path: /usr/local/bin/codex
    state: absent
  when:
    - codex_standalone_enabled | default(true)
    - _codex_system_shim.stat.exists
    - _codex_system_shim.stat.islnk

# =============================================================================
# Native Claude Code
# =============================================================================
# Claude Code is deliberately NOT part of the npm refresh above. The npm
# package and the official native installer both provide a `claude` command;
# with both present Claude Code reported a duplicate installation on every
# launch and PATH order decided which one ran. The native installer owns
# ~/.local/bin/claude for every dev_users account (claude-code-user.yml),
# every run moves it to claude_native_channel, and the run fails if any
# second `claude` is still reachable.
# =============================================================================

- name: Remove retired system-wide Claude Code launchers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ claude_retired_system_launchers }}"
  when: claude_native_enabled | default(true)

- name: Keep a single native Claude Code install for every managed user
  ansible.builtin.include_tasks:
    file: claude-code-user.yml
    apply:
      tags: [packages, ai]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  tags: [packages, ai]
  when: claude_native_enabled | default(true)

# =============================================================================
# Optional Qwen Code provider configuration
# =============================================================================
# The secret command is supplied by the operator in protected variables. This
# keeps the public role independent of any particular cloud or secret store.
# =============================================================================

- name: Fetch optional Qwen provider API key
  ansible.builtin.shell: >
    {{ qwen_provider_secret_command }}
  register: _nvidia_api_key
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - qwen_provider_enabled | default(false)
    - qwen_provider_secret_command | default('') | length > 0

- name: Warn if NVIDIA API key could not be fetched
  ansible.builtin.debug:
    msg: >
      WARNING: Could not fetch the configured Qwen provider API key.
      Qwen Code will be installed but not configured with NVIDIA provider.
      Authenticate with 'az login' and re-run to configure.
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) != 0

- name: Create Qwen Code config directory
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.qwen"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0

- name: Write Qwen Code settings (NVIDIA NIM provider)
  ansible.builtin.copy:
    content: |
      {
        "modelProviders": {
          "openai": [
            {
              "id": "{{ qwen_provider_model }}",
              "name": "Configured Qwen provider",
              "baseUrl": "{{ qwen_provider_base_url }}",
              "envKey": "NVIDIA_API_KEY",
              "description": "Qwen3.5-397B-A17B MoE via NVIDIA NIM"
            }
          ]
        }
      }
    dest: "{{ dev_user_home }}/.qwen/settings.json"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0

- name: Write NVIDIA API key to Qwen Code env file
  ansible.builtin.copy:
    content: |
      NVIDIA_API_KEY={{ _nvidia_api_key.stdout }}
    dest: "{{ dev_user_home }}/.qwen/.env"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when:
    - qwen_provider_enabled | default(false)
    - _nvidia_api_key.rc | default(1) == 0
  no_log: true
