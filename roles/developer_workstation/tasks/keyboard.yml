---
# =============================================================================
# Keyboard layout (variables: keyboard_layout, keyboard_model, keyboard_variant,
# keyboard_options; gate: keyboard_manage)
# =============================================================================
# The fleet's physical keyboards are US layout, so the thin-client and
# byod-kiosk profiles write US by default. Raspberry Pi OS and Ubuntu Server
# default to GB (en-GB), producing the classic mismatch where @ produces " at
# the login prompt. Set keyboard_layout (and the other keyboard_* variables) for
# a different physical keyboard, or keyboard_manage: true to manage it on
# another profile. These tasks write /etc/default/keyboard, reconfigure
# keyboard-configuration, and reload the console keymap. Works identically on
# arm64 (Pi 4/5) and x86_64 (T460).
# =============================================================================

- name: Validate keyboard and locale variables
  ansible.builtin.import_tasks: keyboard-locale-validate.yml

- name: Write /etc/default/keyboard
  ansible.builtin.template:
    src: default-keyboard.j2
    dest: /etc/default/keyboard
    owner: root
    group: root
    mode: "0644"

- name: Reconfigure keyboard-configuration (dpkg non-interactive)
  ansible.builtin.command:
    cmd: dpkg-reconfigure -f noninteractive keyboard-configuration
  changed_when: true

- name: Reload console keymap via setupcon
  ansible.builtin.command:
    cmd: setupcon --save-only
  changed_when: true
  failed_when: false

- name: Trigger udev input subsystem to apply new keymap
  ansible.builtin.command:
    cmd: udevadm trigger --subsystem-match=input --action=change
  changed_when: true
