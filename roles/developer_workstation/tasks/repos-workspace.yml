---
# =============================================================================
# APT Repository Setup (Workspace Profile)
# =============================================================================
# Container-safe repository set for Coder workspaces.
# Excludes desktop/browser/enterprise-only repos.
# =============================================================================

# --- Remove Cloudflare APT repo before any apt cache refresh ---
# Cloudflare does not publish packages for Ubuntu 25.10 ("questing"), causing
# apt update to fail. The stale repo must be removed before the first apt
# operation to prevent the nightly ansible-pull from deadlocking.
- name: Remove stale Cloudflare APT repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
  notify: Update apt cache

# --- Retired Claude Desktop repository ---
- name: Remove retired Claude Desktop repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/claude-desktop.list
    state: absent
  notify: Update apt cache

- name: Remove retired Claude Desktop archive keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/claude-desktop-archive-keyring.gpg
    state: absent
  notify: Update apt cache

# --- GitHub CLI ---
- name: Download GitHub CLI GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/githubcli-archive-keyring.gpg

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  notify: Update apt cache

# --- .NET SDK (Microsoft) ---
- name: Download Microsoft GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
        | gpg --dearmor -o /usr/share/keyrings/microsoft-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/microsoft-archive-keyring.gpg

- name: Add Microsoft .NET SDK repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/ubuntu/24.04/prod {{ apt_fallback_release }} main"
    filename: microsoft-dotnet
    state: present
  notify: Update apt cache

# --- Azure CLI ---
- name: Add Microsoft Azure CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/azure-cli/ {{ apt_fallback_release }} main"
    filename: azure-cli
    state: present
  notify: Update apt cache

# --- Google Cloud CLI ---
- name: Download Google Cloud GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
        | gpg --dearmor -o /usr/share/keyrings/cloud-google-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/cloud-google-archive-keyring.gpg

- name: Add Google Cloud CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/cloud-google-archive-keyring.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
    filename: google-cloud-sdk
    state: present
  notify: Update apt cache

# --- MongoDB (mongosh) ---
- name: Discover newest MongoDB APT channel
  ansible.builtin.uri:
    url: >-
      https://s3.amazonaws.com/repo.mongodb.org?list-type=2&prefix=apt/ubuntu/dists/{{ apt_fallback_release }}/mongodb-org/&delimiter=/
    return_content: true
    timeout: 30
    status_code: 200
  register: _mongodb_repo_index
  changed_when: false
  retries: 3
  delay: 5
  until: _mongodb_repo_index.status | default(0) == 200

- name: Set newest MongoDB APT channel
  ansible.builtin.set_fact:
    latest_mongodb_channel: "{{ _mongodb_repo_index.content | regex_findall('<Prefix>apt/ubuntu/dists/' ~ apt_fallback_release ~ '/mongodb-org/([0-9]+\\.[0-9]+)/</Prefix>') | map('float') | sort | last | default('', true) }}"

- name: Set MongoDB signing-key version for the newest channel
  ansible.builtin.set_fact:
    latest_mongodb_key_version: "{{ latest_mongodb_channel | string | regex_replace('^([0-9]+).*$', '\\1.0') }}"

- name: Require a MongoDB APT channel
  ansible.builtin.assert:
    that: latest_mongodb_channel | default('') | string | length > 0
    fail_msg: "MongoDB did not publish a current APT channel"

- name: Download MongoDB GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://pgp.mongodb.com/server-{{ latest_mongodb_key_version }}.asc \
        | gpg --dearmor --yes -o /usr/share/keyrings/mongodb-archive-keyring.gpg
    executable: /bin/bash
  changed_when: false

- name: Add MongoDB repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/mongodb-archive-keyring.gpg] https://repo.mongodb.org/apt/ubuntu {{ apt_fallback_release }}/mongodb-org/{{ latest_mongodb_channel }} multiverse"
    filename: mongodb-org
    state: present
  notify: Update apt cache

# --- Node.js (NodeSource) ---
- name: Download NodeSource repository key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg.key
    mode: "0644"
  register: _nodesource_key_download

- name: Verify NodeSource repository key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - /tmp/nodesource-repo.gpg.key
  register: _nodesource_key_info
  changed_when: false
  failed_when: >-
    nodesource_key_fingerprint not in (_nodesource_key_info.stdout | default(''))

- name: Install NodeSource repository keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - -o
      - /etc/apt/keyrings/nodesource.gpg
      - /tmp/nodesource-repo.gpg.key
  changed_when: _nodesource_key_download.changed
  notify: Update apt cache

- name: Add NodeSource maintained Node.js repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodesource_node_major }}.x nodistro main"
    filename: nodesource
    state: present
  notify: Update apt cache

- name: Flush handlers to update apt cache
  ansible.builtin.meta: flush_handlers
