---
# =============================================================================
# Hardware-Specific Drivers and Packages
# =============================================================================
# Installs packages, udev rules, kernel module options, and userspace tools
# based on hardware_profile.
# Profiles defined in defaults/main.yml. Select via -e hardware_profile=z590
# =============================================================================

- name: "Show hardware profile: {{ hardware_profile }}"
  ansible.builtin.debug:
    msg: "Hardware profile: {{ hardware_profile }} — {{ hardware_profiles[hardware_profile].description }}"

- name: Install hardware-specific packages ({{ hardware_profile }})
  ansible.builtin.apt:
    name: "{{ hardware_profiles[hardware_profile].packages | default([]) }}"
    state: present
  when: hardware_profiles[hardware_profile].packages | default([]) | length > 0

- name: Enable hardware-specific services ({{ hardware_profile }})
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ hardware_profiles[hardware_profile].services | default([]) }}"

# ---- udev rules ----

- name: Install hardware-specific udev rules ({{ hardware_profile }})
  ansible.builtin.copy:
    dest: "/etc/udev/rules.d/{{ item.name }}.rules"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hardware_profiles[hardware_profile].udev_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _udev_rules_result

# Reload alone only affects future events; trigger re-evaluates devices that
# are already plugged in so permissions apply without a replug or reboot.
- name: Reload udev rules  # noqa: no-handler
  ansible.builtin.command: udevadm control --reload
  when: _udev_rules_result is changed
  changed_when: true

- name: Re-apply udev rules to present devices  # noqa: no-handler
  ansible.builtin.command: udevadm trigger
  when: _udev_rules_result is changed
  changed_when: true

# ---- kernel module options and loading ----

- name: Install hardware-specific modprobe options ({{ hardware_profile }})
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/{{ item.name }}.conf"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hardware_profiles[hardware_profile].modprobe_options | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _modprobe_options_result

- name: Load hardware-specific kernel modules at boot ({{ hardware_profile }})
  ansible.builtin.copy:
    dest: /etc/modules-load.d/curiosity-hardware.conf
    content: |
      # Managed by the curiosity workstation role (hardware profile: {{ hardware_profile }})
      {{ hardware_profiles[hardware_profile].kernel_modules | default([]) | join('\n') }}
    owner: root
    group: root
    mode: "0644"
  when: hardware_profiles[hardware_profile].kernel_modules | default([]) | length > 0

# A module that fails to load (for example, the running kernel is older than
# the just-installed module package) must not abort the rest of the converge,
# but it must be reported loudly rather than skipped silently.
- name: Load hardware-specific kernel modules now ({{ hardware_profile }})
  block:
    - name: Load kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ hardware_profiles[hardware_profile].kernel_modules | default([]) }}"
      register: _kernel_modules_result
  rescue:
    - name: Report kernel modules that could not be loaded
      ansible.builtin.debug:
        msg: >-
          ATTENTION: could not load kernel modules for hardware profile
          {{ hardware_profile }}: {{
          ansible_failed_result.results | default([]) | selectattr('failed')
          | map(attribute='msg') | join('; ') | default(ansible_failed_result.msg | default('unknown error'), true)
          }}.
          A reboot into the newest installed kernel is likely required.

# modprobe.d options only apply when a module loads. A module that was
# already loaded keeps its old parameters until it is reloaded or the host
# reboots, so say so instead of silently reporting convergence.
- name: Report modules still running with stale options  # noqa: no-handler
  ansible.builtin.debug:
    msg: >-
      ATTENTION: modprobe options changed but {{ item.item }} was already
      loaded; reload the module or reboot to apply the new parameters.
  loop: "{{ _kernel_modules_result.results | default([]) | rejectattr('changed') | rejectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: _modprobe_options_result is changed

# ---- pipx packages (installed for every managed user) ----

- name: Install hardware-specific pipx packages ({{ hardware_profile }})
  ansible.builtin.include_tasks: hardware-pipx.yml
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  when: hardware_profiles[hardware_profile].pipx_packages | default([]) | length > 0

# ---- Private Internet Access VPN ----
# PIA publishes versioned installers from its download page, so resolve the
# current URL there instead of embedding a release number in the catalog.

- name: Query latest PIA Linux installer page
  ansible.builtin.uri:
    url: https://www.privateinternetaccess.com/download
    return_content: true
  register: _pia_download_page
  changed_when: false
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Select latest PIA Linux installer for the target architecture
  ansible.builtin.set_fact:
    _pia_latest_installers: >-
      {{
        _pia_download_page.content
        | regex_findall('https://installers\\.privateinternetaccess\\.com/download/pia-linux-[^" ]+\\.run')
      }}
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Choose latest PIA Linux installer for the target architecture
  ansible.builtin.set_fact:
    _pia_latest_installer_url: >-
      {{
        (
          _pia_latest_installers
          | select('search', 'pia-linux-arm64-')
          | first
        )
        if ansible_architecture == 'aarch64'
        else (
          _pia_latest_installers
          | reject('search', 'pia-linux-arm')
          | first
        )
      }}
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Require a current PIA Linux installer
  ansible.builtin.assert:
    that: _pia_latest_installer_url | default('') | length > 0
    fail_msg: "PIA did not publish a current installer for {{ ansible_architecture }}"
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Ensure PIA installer cache directory exists
  ansible.builtin.file:
    path: /var/cache/curiosity
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Download latest PIA VPN installer
  ansible.builtin.get_url:
    url: "{{ _pia_latest_installer_url }}"
    dest: "/var/cache/curiosity/{{ _pia_latest_installer_url | basename }}"
    mode: "0755"
    force: false
  register: _pia_installer_download
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Install or update PIA VPN
  ansible.builtin.command: "/var/cache/curiosity/{{ _pia_latest_installer_url | basename }}"
  when:
    - hardware_profiles[hardware_profile].pia_vpn | default(false)
    - _pia_installer_download.changed
  changed_when: true

- name: Enable PIA VPN daemon
  ansible.builtin.systemd:
    name: piavpn
    enabled: true
    state: started
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)
