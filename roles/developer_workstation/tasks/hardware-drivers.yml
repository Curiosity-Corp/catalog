---
# =============================================================================
# Hardware-Specific Drivers and Packages
# =============================================================================
# Installs packages, udev rules, kernel module options, and userspace tools
# based on hardware_profile.
# Profiles defined in defaults/main.yml. Select via -e hardware_profile=z590
# =============================================================================

- name: "Show hardware profile: {{ hardware_profile }}"
  ansible.builtin.debug:
    msg: "Hardware profile: {{ hardware_profile }} — {{ hardware_profiles[hardware_profile].description }}"

- name: Install hardware-specific packages ({{ hardware_profile }})
  ansible.builtin.apt:
    name: "{{ hardware_profiles[hardware_profile].packages | default([]) }}"
    state: present
  when: hardware_profiles[hardware_profile].packages | default([]) | length > 0

- name: Enable hardware-specific services ({{ hardware_profile }})
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ hardware_profiles[hardware_profile].services | default([]) }}"

# ---- udev rules ----

- name: Install hardware-specific udev rules ({{ hardware_profile }})
  ansible.builtin.copy:
    dest: "/etc/udev/rules.d/{{ item.name }}.rules"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hardware_profiles[hardware_profile].udev_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _udev_rules_result

# Reload alone only affects future events; trigger re-evaluates devices that
# are already plugged in so permissions apply without a replug or reboot.
- name: Reload udev rules  # noqa: no-handler
  ansible.builtin.command: udevadm control --reload
  when: _udev_rules_result is changed
  changed_when: true

- name: Re-apply udev rules to present devices  # noqa: no-handler
  ansible.builtin.command: udevadm trigger
  when: _udev_rules_result is changed
  changed_when: true

# ---- kernel module options and loading ----

- name: Install hardware-specific modprobe options ({{ hardware_profile }})
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/{{ item.name }}.conf"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hardware_profiles[hardware_profile].modprobe_options | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _modprobe_options_result

# A file an earlier role version wrote must not outlive the profile entry that
# created it: a stale options line for a parameter the running kernel no longer
# has is logged as an error at every boot.
- name: Remove retired modprobe options
  ansible.builtin.file:
    path: "/etc/modprobe.d/{{ item }}.conf"
    state: absent
  loop: "{{ retired_modprobe_options | default([]) }}"

- name: Load hardware-specific kernel modules at boot ({{ hardware_profile }})
  ansible.builtin.copy:
    dest: /etc/modules-load.d/curiosity-hardware.conf
    content: |
      # Managed by the curiosity workstation role (hardware profile: {{ hardware_profile }})
      {% for module in hardware_profiles[hardware_profile].kernel_modules | default([]) %}
      {{ module }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: hardware_profiles[hardware_profile].kernel_modules | default([]) | length > 0

# A module that fails to load (for example, the running kernel is older than
# the just-installed module package) must not abort the rest of the converge,
# but it must be reported loudly rather than skipped silently.
- name: Load hardware-specific kernel modules now ({{ hardware_profile }})
  block:
    - name: Load kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ hardware_profiles[hardware_profile].kernel_modules | default([]) }}"
      register: _kernel_modules_result
  rescue:
    - name: Report kernel modules that could not be loaded
      ansible.builtin.debug:
        msg: >-
          ATTENTION: could not load kernel modules for hardware profile
          {{ hardware_profile }}: {{
          ansible_failed_result.results | default([]) | selectattr('failed')
          | map(attribute='msg') | join('; ') | default(ansible_failed_result.msg | default('unknown error'), true)
          }}.
          A reboot into the newest installed kernel is likely required.

# modprobe.d options only apply when a module loads. A module that was
# already loaded keeps its old parameters until it is reloaded or the host
# reboots, so say so instead of silently reporting convergence.
- name: Report modules still running with stale options  # noqa: no-handler
  ansible.builtin.debug:
    msg: >-
      ATTENTION: modprobe options changed but {{ item.item }} was already
      loaded; reload the module or reboot to apply the new parameters.
  loop: "{{ _kernel_modules_result.results | default([]) | rejectattr('changed') | rejectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: _modprobe_options_result is changed

# ---- pipx packages (installed for every managed user) ----

- name: Install hardware-specific pipx packages ({{ hardware_profile }})
  ansible.builtin.include_tasks:
    file: hardware-pipx.yml
    apply:
      tags: [hardware]
  loop: "{{ dev_users }}"
  loop_control:
    loop_var: dw_user
    label: "{{ dw_user.name }}"
  when: hardware_profiles[hardware_profile].pipx_packages | default([]) | length > 0

# ---- Private Internet Access VPN ----
# The installer runs as root and PIA publishes no checksum or signature for it
# (catalog#171). The role installs the build pinned in pia_installer_build,
# verified against pia_installer_<arch>_sha256 through verified-download.yml,
# and refuses to run anything else. PIA's download page is read only to warn
# that a newer build exists (docs/pia-vpn-and-wifi.md#updating-the-pinned-installer).

- name: Resolve the pinned PIA Linux installer for the target architecture
  ansible.builtin.set_fact:
    _pia_installer_file: >-
      pia-linux-{{ 'arm64-' if ansible_architecture == 'aarch64' else '' }}{{ pia_installer_build }}.run
    _pia_installer_sha256: >-
      {{ (pia_installer_aarch64_sha256 if ansible_architecture == 'aarch64'
          else pia_installer_x86_64_sha256 if ansible_architecture == 'x86_64'
          else '') | trim | lower }}
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Require a pinned PIA installer build and SHA-256
  ansible.builtin.assert:
    that:
      - pia_installer_build is match('^[0-9]+([.][0-9]+)*-[0-9]+$')
      - _pia_installer_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      PIA is enabled (pia_vpn) but no installer is pinned for
      {{ ansible_architecture }}: pia_installer_build must be a build such as
      3.8-08539 (got {{ pia_installer_build | to_json }}) and
      pia_installer_{{ ansible_architecture }}_sha256 its SHA-256. PIA publishes
      no checksum, so the role will not run an unpinned installer as root
      (docs/pia-vpn-and-wifi.md#updating-the-pinned-installer).
    quiet: true
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Download and verify the pinned PIA installer
  ansible.builtin.include_tasks:
    file: verified-download.yml
  vars:
    verified_download_name: "{{ _pia_installer_file }}"
    verified_download_url: "https://installers.privateinternetaccess.com/download/{{ _pia_installer_file }}"
    verified_download_sha256: "{{ _pia_installer_sha256 }}"
    verified_download_mode: "0755"
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Read the SHA-256 of the PIA installer that last ran
  ansible.builtin.slurp:
    src: "{{ pia_installer_state_file }}"
  register: _pia_installer_state
  failed_when: >-
    _pia_installer_state is failed
    and 'file not found' not in (_pia_installer_state.msg | default('') | lower)
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Install or update PIA VPN from the verified installer
  ansible.builtin.command: "{{ verified_download_path }}"
  when:
    - hardware_profiles[hardware_profile].pia_vpn | default(false)
    - (_pia_installer_state.content | default('') | b64decode | trim) != _pia_installer_sha256
  changed_when: true

- name: Ensure the PIA installer state directory exists
  ansible.builtin.file:
    path: "{{ pia_installer_state_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Record the PIA installer that ran
  ansible.builtin.copy:
    content: "{{ _pia_installer_sha256 }}\n"
    dest: "{{ pia_installer_state_file }}"
    owner: root
    group: root
    mode: "0644"
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Read PIA's download page for a newer installer
  ansible.builtin.uri:
    url: https://www.privateinternetaccess.com/download
    return_content: true
  register: _pia_download_page
  changed_when: false
  failed_when: false
  check_mode: false
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Warn when PIA's download page cannot be read
  ansible.builtin.debug:
    msg: >-
      Could not read https://www.privateinternetaccess.com/download
      ({{ _pia_download_page.status | default('no response') }}:
      {{ _pia_download_page.msg | default('') }}), so whether PIA has published
      a newer installer than {{ pia_installer_build }} is unknown. The pinned,
      verified build was used.
  when:
    - hardware_profiles[hardware_profile].pia_vpn | default(false)
    - (_pia_download_page.status | default(0)) != 200

- name: Warn when PIA publishes a different installer than the pinned one
  ansible.builtin.debug:
    msg: >-
      PIA's download page names {{ _pia_published | join(', ') }}, not the pinned
      {{ _pia_installer_file }}. The pinned build stays installed until
      pia_installer_build and its SHA-256 are updated
      (docs/pia-vpn-and-wifi.md#updating-the-pinned-installer).
  vars:
    _pia_published: >-
      {{ _pia_download_page.content | default('')
         | regex_findall('pia-linux-' ~ ('arm64-' if ansible_architecture == 'aarch64' else '') ~ '[0-9][0-9.]*-[0-9]+[.]run')
         | unique | list }}
  when:
    - hardware_profiles[hardware_profile].pia_vpn | default(false)
    - (_pia_download_page.status | default(0)) == 200
    - _pia_published | length > 0
    - _pia_installer_file not in _pia_published

- name: Enable PIA VPN daemon
  ansible.builtin.systemd:
    name: piavpn
    enabled: true
    state: started
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Converge PIA VPN daemon settings
  ansible.builtin.include_tasks: pia-vpn.yml
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)
