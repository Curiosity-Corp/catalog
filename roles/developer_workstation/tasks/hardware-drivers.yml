---
# =============================================================================
# Hardware-Specific Drivers and Packages
# =============================================================================
# Installs packages, udev rules, and userspace tools based on hardware_profile.
# Profiles defined in defaults/main.yml. Select via -e hardware_profile=z590
# =============================================================================

- name: "Show hardware profile: {{ hardware_profile }}"
  ansible.builtin.debug:
    msg: "Hardware profile: {{ hardware_profile }} — {{ hardware_profiles[hardware_profile].description }}"

- name: Install hardware-specific packages ({{ hardware_profile }})
  ansible.builtin.apt:
    name: "{{ hardware_profiles[hardware_profile].packages }}"
    state: present
  when: hardware_profiles[hardware_profile].packages | length > 0

- name: Enable hardware-specific services ({{ hardware_profile }})
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ hardware_profiles[hardware_profile].services }}"
  when: hardware_profiles[hardware_profile].services | length > 0

# ---- udev rules ----

- name: Install hardware-specific udev rules ({{ hardware_profile }})
  ansible.builtin.copy:
    dest: "/etc/udev/rules.d/{{ item.name }}.rules"
    content: "{{ item.content }}"
    mode: "0644"
  loop: "{{ hardware_profiles[hardware_profile].udev_rules | default([]) }}"
  register: _udev_rules_result

- name: Reload udev rules  # noqa: no-handler
  ansible.builtin.command: udevadm control --reload-rules
  when: _udev_rules_result is changed
  changed_when: true

# ---- pipx packages (installed as dev_user) ----

- name: Install hardware-specific pipx packages ({{ hardware_profile }})
  community.general.pipx:
    name: "{{ item }}"
    state: latest
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  loop: "{{ hardware_profiles[hardware_profile].pipx_packages | default([]) }}"
  failed_when: false

# ---- Private Internet Access VPN ----
# PIA publishes versioned installers from its download page, so resolve the
# current URL there instead of embedding a release number in the catalog.

- name: Query latest PIA Linux installer page
  ansible.builtin.uri:
    url: https://www.privateinternetaccess.com/download
    return_content: true
  register: _pia_download_page
  changed_when: false
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Select latest PIA Linux installer for the target architecture
  ansible.builtin.set_fact:
    _pia_latest_installers: >-
      {{
        _pia_download_page.content
        | regex_findall('https://installers\\.privateinternetaccess\\.com/download/pia-linux-[^" ]+\\.run')
      }}

- name: Choose latest PIA Linux installer for the target architecture
  ansible.builtin.set_fact:
    _pia_latest_installer_url: >-
      {{
        (
          _pia_latest_installers
          | select('search', 'pia-linux-arm64-')
          | first
        )
        if ansible_architecture == 'aarch64'
        else (
          _pia_latest_installers
          | reject('search', 'pia-linux-arm')
          | first
        )
      }}
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Require a current PIA Linux installer
  ansible.builtin.assert:
    that: _pia_latest_installer_url | default('') | length > 0
    fail_msg: "PIA did not publish a current installer for {{ ansible_architecture }}"
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Ensure PIA installer cache directory exists
  ansible.builtin.file:
    path: /var/cache/curiosity
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Download latest PIA VPN installer
  ansible.builtin.get_url:
    url: "{{ _pia_latest_installer_url }}"
    dest: "/var/cache/curiosity/{{ _pia_latest_installer_url | basename }}"
    mode: "0755"
    force: false
  register: _pia_installer_download
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)

- name: Install or update PIA VPN
  ansible.builtin.command: "/var/cache/curiosity/{{ _pia_latest_installer_url | basename }}"
  when:
    - hardware_profiles[hardware_profile].pia_vpn | default(false)
    - _pia_installer_download.changed
  changed_when: true

- name: Enable PIA VPN daemon
  ansible.builtin.systemd:
    name: piavpn
    enabled: true
    state: started
  when: hardware_profiles[hardware_profile].pia_vpn | default(false)
