---
# =============================================================================
# Crash diagnostics: turn silent hard freezes into a logged panic and a reboot
# =============================================================================
# deskmeet1 (i7-14700) froze hard seven times between 2026-10-10 and 2026-10-31.
# Each time the journal simply stopped, nothing was left to read, and the box
# sat frozen until someone pressed the power button. kdump cannot help there:
# the root file system is LUKS, so the crash kernel would stop at a passphrase
# prompt. This task group (opt-in, hardware-profile key `crash_diagnostics`)
# installs the cheaper layers that work without the root disk:
#
#   1. Lockup panics (sysctl): the NMI watchdog turns a hard lockup, and the
#      soft-lockup detector a CPU stuck in the kernel, into a panic with a
#      backtrace of every CPU, and the kernel reboots `panic_reboot_seconds`
#      later instead of hanging. A kernel Oops is NOT made fatal: on this host
#      it was followed by hours of normal use (2026-10-25).
#   2. pstore: on a panic the kernel writes the tail of its log into EFI
#      variables (efi_pstore); systemd-pstore copies it to
#      /var/lib/systemd/pstore at the next boot. Nothing to configure beyond
#      keeping systemd-pstore enabled.
#   3. Hardware watchdog (optional `watchdog_module`, e.g. iTCO_wdt for the
#      Intel PCH TCO timer): systemd pings the board watchdog; if PID 1 cannot
#      run for `watchdog_seconds` the board resets itself. This is the last
#      resort for a wedge where even the NMI handler never runs. The stock
#      Ubuntu kernel blacklists watchdog drivers against alias autoloading;
#      loading by name through modules-load.d is not affected by that.
#   4. journald syncs every `journal_sync_seconds` (default 5 min), so the
#      minutes before a freeze reach the disk.
#
# Removing the profile key removes every file again; the running sysctl values
# and the watchdog setting return to the kernel/systemd defaults.
# =============================================================================

- name: Validate the crash diagnostics settings
  ansible.builtin.assert:
    that:
      - developer_workstation_crash_diagnostics is mapping
      - (developer_workstation_crash_diagnostics.panic_reboot_seconds | default(30) | string) is match('^[1-9][0-9]{0,3}$')
      - (developer_workstation_crash_diagnostics.watchdog_seconds | default(120) | string) is match('^[1-9][0-9]{1,2}$')
      - (developer_workstation_crash_diagnostics.journal_sync_seconds | default(15) | string) is match('^[1-9][0-9]{0,2}$')
      - (developer_workstation_crash_diagnostics.watchdog_module | default('') | string) is match('^[A-Za-z0-9_]*$')
    fail_msg: >-
      crash_diagnostics must be a mapping (empty = off) with optional
      panic_reboot_seconds (1-9999), watchdog_seconds (10-999),
      journal_sync_seconds (1-999) and watchdog_module (a module name), got
      '{{ developer_workstation_crash_diagnostics }}'.

- name: Install crash diagnostics
  when: developer_workstation_crash_diagnostics | length > 0
  vars:
    _crash_watchdog_module: "{{ developer_workstation_crash_diagnostics.watchdog_module | default('') }}"
    _crash_watchdog_seconds: "{{ developer_workstation_crash_diagnostics.watchdog_seconds | default(120) | int }}"
  block:
    - name: Ensure the systemd drop-in directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/systemd/journald.conf.d
        - /etc/systemd/system.conf.d

    - name: Install the lockup panic sysctls
      ansible.builtin.template:
        src: curiosity-crash-diagnostics-sysctl.conf.j2
        dest: /etc/sysctl.d/60-curiosity-crash-diagnostics.conf
        owner: root
        group: root
        mode: "0644"
      register: _crash_sysctl

    - name: Apply the lockup panic sysctls  # noqa: no-handler
      ansible.builtin.command: sysctl --system
      changed_when: true
      when: _crash_sysctl.changed

    - name: Keep systemd-pstore enabled (archives panic logs from EFI pstore)
      ansible.builtin.systemd:
        name: systemd-pstore.service
        enabled: true

    - name: Install the journald sync interval
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/60-curiosity-crash-diagnostics.conf
        content: |
          # Managed by the curiosity workstation role (tasks/crash-diagnostics.yml).
          # Sync often so the minutes before a hard freeze reach the disk.
          [Journal]
          SyncIntervalSec={{ developer_workstation_crash_diagnostics.journal_sync_seconds | default(15) | int }}s
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-journald

    - name: Load the hardware watchdog driver at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/curiosity-watchdog.conf
        content: |
          # Managed by the curiosity workstation role (tasks/crash-diagnostics.yml).
          # Ubuntu blacklists watchdog drivers against alias autoloading only.
          {{ _crash_watchdog_module }}
        owner: root
        group: root
        mode: "0644"
      when: _crash_watchdog_module | length > 0

    - name: Load the hardware watchdog driver now
      community.general.modprobe:
        name: "{{ _crash_watchdog_module }}"
        state: present
      when: _crash_watchdog_module | length > 0

    - name: Look for the hardware watchdog device
      ansible.builtin.stat:
        path: /dev/watchdog0
      register: _crash_watchdog_dev
      when: _crash_watchdog_module | length > 0

    - name: Configure the systemd hardware watchdog for the next boot
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/60-curiosity-watchdog.conf
        content: |
          # Managed by the curiosity workstation role (tasks/crash-diagnostics.yml).
          # PID 1 pings the board watchdog ({{ _crash_watchdog_module }}); if it
          # cannot run for {{ _crash_watchdog_seconds }}s, the board resets.
          [Manager]
          RuntimeWatchdogSec={{ _crash_watchdog_seconds }}s
          RebootWatchdogSec=10min
        owner: root
        group: root
        mode: "0644"
      when:
        - _crash_watchdog_module | length > 0
        - _crash_watchdog_dev.stat.exists | default(false)

    - name: Read the running systemd hardware watchdog timeout
      ansible.builtin.command: >-
        busctl get-property org.freedesktop.systemd1 /org/freedesktop/systemd1
        org.freedesktop.systemd1.Manager RuntimeWatchdogUSec
      register: _crash_watchdog_running
      changed_when: false
      when:
        - _crash_watchdog_module | length > 0
        - _crash_watchdog_dev.stat.exists | default(false)

    # The Manager property is writable over D-Bus, so the watchdog starts now
    # without re-executing PID 1. busctl prints it as `t <microseconds>`.
    - name: Arm the systemd hardware watchdog now
      ansible.builtin.command: >-
        busctl set-property org.freedesktop.systemd1 /org/freedesktop/systemd1
        org.freedesktop.systemd1.Manager RuntimeWatchdogUSec t {{ (_crash_watchdog_seconds | int) * 1000000 }}
      changed_when: true
      when:
        - _crash_watchdog_module | length > 0
        - _crash_watchdog_dev.stat.exists | default(false)
        - _crash_watchdog_running.stdout | default('') | trim != 't ' ~ ((_crash_watchdog_seconds | int) * 1000000)

    - name: Report a configured watchdog driver that created no device
      ansible.builtin.debug:
        msg: >-
          ATTENTION: crash_diagnostics.watchdog_module {{ _crash_watchdog_module }}
          loaded but /dev/watchdog0 does not exist; the systemd hardware
          watchdog is not configured on this host.
      when:
        - _crash_watchdog_module | length > 0
        - not (_crash_watchdog_dev.stat.exists | default(false))

- name: Remove crash diagnostics when they are not configured
  when: developer_workstation_crash_diagnostics | length == 0
  block:
    - name: Look for a previously installed watchdog setting
      ansible.builtin.stat:
        path: /etc/systemd/system.conf.d/60-curiosity-watchdog.conf
      register: _crash_watchdog_conf

    - name: Disarm the systemd hardware watchdog
      ansible.builtin.command: >-
        busctl set-property org.freedesktop.systemd1 /org/freedesktop/systemd1
        org.freedesktop.systemd1.Manager RuntimeWatchdogUSec t 0
      changed_when: true
      when: _crash_watchdog_conf.stat.exists

    - name: Remove the crash diagnostics files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system.conf.d/60-curiosity-watchdog.conf
        - /etc/modules-load.d/curiosity-watchdog.conf
        - /etc/sysctl.d/60-curiosity-crash-diagnostics.conf
      register: _crash_removed

    - name: Remove the journald sync interval
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d/60-curiosity-crash-diagnostics.conf
        state: absent
      notify: Restart systemd-journald

    # The kernel keeps a removed sysctl's value until reboot; put the
    # defaults back now so "off" means off.
    - name: Restore the kernel's lockup defaults  # noqa: no-handler
      ansible.builtin.command: >-
        sysctl -w kernel.softlockup_panic=0 kernel.hardlockup_panic=0
        kernel.softlockup_all_cpu_backtrace=0 kernel.hardlockup_all_cpu_backtrace=0 kernel.panic=0
      changed_when: true
      when: _crash_removed.results | selectattr('item', 'equalto', '/etc/sysctl.d/60-curiosity-crash-diagnostics.conf') | selectattr('changed') | list | length > 0
