---
# =============================================================================
# System Tuning
# =============================================================================
# Memory management, swap sizing, and OOM protection for developer workstations.
# Prevents hard freezes under heavy multi-terminal / Electron app workloads.
# =============================================================================

# =============================================================================
# Swap Configuration
# =============================================================================
# Ensures swap file exists at the configured size. Resizes if needed.
# Default 16G provides headroom for 16GB+ RAM machines running heavy
# terminal workloads alongside Electron apps (browsers, chat clients, IDEs).
# =============================================================================

- name: Check current swap file
  ansible.builtin.stat:
    path: /swap.img
  register: _swap_file

- name: Get current swap size in bytes
  ansible.builtin.set_fact:
    _current_swap_bytes: "{{ _swap_file.stat.size | default(0) }}"
  when: _swap_file.stat.exists | default(false)

- name: Calculate desired swap size in bytes
  ansible.builtin.set_fact:
    _desired_swap_bytes: "{{ swap_size_gb | int * 1073741824 }}"

- name: Resize swap file
  when: >
    not (_swap_file.stat.exists | default(false)) or
    (_current_swap_bytes | default(0) | int) != (_desired_swap_bytes | int)
  block:
    - name: Disable current swap
      ansible.builtin.command: swapoff /swap.img
      failed_when: false
      changed_when: true

    - name: Allocate swap file
      ansible.builtin.command: fallocate -l {{ swap_size_gb }}G /swap.img
      changed_when: true

    - name: Set swap file permissions
      ansible.builtin.file:
        path: /swap.img
        mode: "0600"

    - name: Format swap file
      ansible.builtin.command: mkswap /swap.img
      changed_when: true

    - name: Enable swap file
      ansible.builtin.command: swapon /swap.img
      changed_when: true

- name: Ensure swap is in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '/swap\.img'
    line: '/swap.img none swap sw 0 0'
    state: present

# =============================================================================
# VM Swappiness
# =============================================================================
# Lower swappiness keeps more in RAM instead of aggressively filling swap
# while RAM still has room. Default 10 is good for workstations.
# =============================================================================

- name: Set vm.swappiness
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — developer-workstation role
      vm.swappiness={{ vm_swappiness }}
    dest: /etc/sysctl.d/99-workstation-tuning.conf
    owner: root
    group: root
    mode: "0644"
  register: _sysctl_conf

- name: Apply sysctl settings  # noqa: no-handler
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: _sysctl_conf.changed

# =============================================================================
# earlyoom — Userspace OOM Killer
# =============================================================================
# Kills the biggest memory hog before the system freezes. The kernel OOM
# killer triggers too late (after the system is already thrashing). earlyoom
# watches memory pressure and sends SIGTERM/SIGKILL before it's unrecoverable.
#
# Thresholds: SIGTERM at mem<=5% AND swap<=50%, SIGKILL at mem<=2.5% AND swap<=25%
# Reports every 60s to journal for monitoring.
# =============================================================================

- name: Install earlyoom
  ansible.builtin.apt:
    name: earlyoom
    state: present

- name: Configure earlyoom thresholds
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — developer-workstation role
      # Report every 60s, SIGTERM at 5% mem + 50% swap, SIGKILL at 2.5% mem + 25% swap
      EARLYOOM_ARGS="-r 60 -m 5 -s 50"
    dest: /etc/default/earlyoom
    owner: root
    group: root
    mode: "0644"
  notify: Restart earlyoom

- name: Ensure earlyoom is enabled and running
  ansible.builtin.systemd:
    name: earlyoom
    enabled: true
    state: started

# =============================================================================
# fstrim — SSD/NVMe TRIM
# =============================================================================
# Ships with util-linux; the unit just needs enabling.
# =============================================================================

- name: Ensure fstrim.timer is enabled and running
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started

# =============================================================================
# TLP — laptop power management (skipped on desktops/VMs)
# =============================================================================
# DMI chassis_type 8/9/10/14/31/32 cover laptop/notebook/sub-notebook/
# convertible/detachable form factors. See:
# https://www.dmtf.org/sites/default/files/standards/documents/DSP0134_3.2.0.pdf
# =============================================================================

- name: Read DMI chassis type
  ansible.builtin.slurp:
    src: /sys/class/dmi/id/chassis_type
  register: _chassis_type_raw
  failed_when: false

- name: Determine if this is laptop hardware
  ansible.builtin.set_fact:
    _is_laptop: "{{ (_chassis_type_raw.content | default('') | b64decode | trim) in ['8', '9', '10', '14', '31', '32'] }}"

- name: Install and enable TLP (laptops only)
  when: _is_laptop
  block:
    - name: Install tlp
      ansible.builtin.apt:
        name: tlp
        state: present

    - name: Ensure tlp is enabled and running
      ansible.builtin.systemd:
        name: tlp
        enabled: true
        state: started

- name: Configure laptop performance policy
  ansible.builtin.copy:
    dest: /etc/tlp.d/30-curiosity-laptop-performance.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — developer-workstation role.
      # Keep the admin laptop at full performance on AC while retaining a
      # performance-balanced policy on battery.
      CPU_SCALING_GOVERNOR_ON_AC=performance
      CPU_ENERGY_PERF_POLICY_ON_AC=performance
      CPU_SCALING_GOVERNOR_ON_BAT=powersave
      CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
  when:
    - _is_laptop
    - hardware_profiles[hardware_profile].performance_mode | default(false) | bool
  notify: Apply TLP power policy

# =============================================================================
# Laptop no-sleep policy
# =============================================================================
# Admin laptops remain available for SSH/Ziti access when the lid is closed or
# the desktop is idle.  Masking the targets also blocks explicit suspend and
# hibernate requests from desktop helpers and login sessions.
# =============================================================================

- name: Deploy optional wired Netplan policy for the T460
  ansible.builtin.copy:
    src: 99-curiosity-laptop-wired-optional.yaml
    dest: /etc/netplan/99-curiosity-laptop-wired-optional.yaml
    owner: root
    group: root
    mode: "0600"
  register: _laptop_netplan_optional
  when:
    - hardware_profile == 'x86-byod-laptop'

- name: Regenerate Netplan after laptop wired-link policy changes
  ansible.builtin.command: netplan generate
  changed_when: true
  when: _laptop_netplan_optional.changed | default(false)

- name: Reload systemd-networkd after laptop Netplan policy changes
  ansible.builtin.command: networkctl reload
  changed_when: true
  when: _laptop_netplan_optional.changed | default(false)

- name: Ensure laptop no-sleep logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - _is_laptop
    - hardware_profiles[hardware_profile].disable_sleep | default(false) | bool

- name: Deploy laptop no-sleep policy
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/20-curiosity-laptop-nosleep.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — developer-workstation role.
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
      HandleSuspendKey=ignore
      HandleHibernateKey=ignore
      HandlePowerKey=poweroff
      IdleAction=ignore
      IdleActionSec=0
  when:
    - _is_laptop
    - hardware_profiles[hardware_profile].disable_sleep | default(false) | bool
  notify: Reload systemd-logind

- name: Mask laptop sleep and hibernate targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    enabled: false
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
  when:
    - _is_laptop
    - hardware_profiles[hardware_profile].disable_sleep | default(false) | bool
  failed_when: false
