---
# =============================================================================
# System Tuning
# =============================================================================
# Memory management, swap sizing, and OOM protection for developer workstations.
# Prevents hard freezes under heavy multi-terminal / Electron app workloads.
# =============================================================================

# =============================================================================
# Swap Configuration
# =============================================================================
# Ensures swap file exists at the configured size. Resizes if needed.
# Default 16G provides headroom for 16GB+ RAM machines running heavy
# terminal workloads alongside Electron apps (browsers, chat clients, IDEs).
# =============================================================================

- name: Check current swap file
  ansible.builtin.stat:
    path: /swap.img
  register: _swap_file

- name: Get current swap size in bytes
  ansible.builtin.set_fact:
    _current_swap_bytes: "{{ _swap_file.stat.size | default(0) }}"
  when: _swap_file.stat.exists | default(false)

- name: Calculate desired swap size in bytes
  ansible.builtin.set_fact:
    _desired_swap_bytes: "{{ swap_size_gb | int * 1073741824 }}"

- name: Resize swap file
  when: >
    not (_swap_file.stat.exists | default(false)) or
    (_current_swap_bytes | default(0) | int) != (_desired_swap_bytes | int)
  block:
    - name: Disable current swap
      ansible.builtin.command: swapoff /swap.img
      failed_when: false
      changed_when: true

    - name: Allocate swap file
      ansible.builtin.command: fallocate -l {{ swap_size_gb }}G /swap.img
      changed_when: true

    - name: Set swap file permissions
      ansible.builtin.file:
        path: /swap.img
        mode: "0600"

    - name: Format swap file
      ansible.builtin.command: mkswap /swap.img
      changed_when: true

    - name: Enable swap file
      ansible.builtin.command: swapon /swap.img
      changed_when: true

- name: Ensure swap is in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '/swap\.img'
    line: '/swap.img none swap sw 0 0'
    state: present

# =============================================================================
# zram swap (opt-in: zram_swap_enabled)
# =============================================================================
# A compressed swap device in RAM, used before the swap file. Nothing is moved
# or stopped while the device holds pages: a new size waits for the next boot.
# Disabled leaves any existing zram set-up alone.
# =============================================================================

- name: Configure zram swap
  when: zram_swap_enabled | bool
  block:
    - name: Install the zram generator
      ansible.builtin.apt:
        name: systemd-zram-generator
        state: present

    - name: Write the zram generator config
      ansible.builtin.template:
        src: zram-generator.conf.j2
        dest: /etc/systemd/zram-generator.conf
        owner: root
        group: root
        mode: "0644"

    - name: Read the active swap devices
      ansible.builtin.command:
        argv: [swapon, "--show=NAME", --noheadings]
      register: _zram_swaps
      changed_when: false
      check_mode: false

    - name: Start zram swap now (adds a swap device; nothing is moved or stopped)
      ansible.builtin.systemd_service:
        name: dev-zram0.swap
        state: started
        daemon_reload: true
      when: "'/dev/zram0' not in _zram_swaps.stdout_lines"
      # In check mode the generator config was not written, so the unit is absent.
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Converge the zram device size
      ansible.builtin.script:
        cmd: "curiosity-zram-converge {{ zram_swap_size_expression | quote }}"
        executable: /usr/bin/python3
      register: _zram_converge
      changed_when: _zram_converge.stdout is search('^resized')
      when: not ansible_check_mode

# =============================================================================
# VM Swappiness and swap readahead
# =============================================================================
# Lower swappiness keeps more in RAM instead of aggressively filling swap
# while RAM still has room: 10 with only a disk swap file. With zram, 100
# (compressed RAM is cheap to swap to) and page-cluster 0 (no readahead).
# =============================================================================

- name: Set vm.swappiness and vm.page-cluster
  ansible.builtin.template:
    src: workstation-tuning-sysctl.conf.j2
    dest: /etc/sysctl.d/99-workstation-tuning.conf
    owner: root
    group: root
    mode: "0644"
  register: _sysctl_conf

- name: Apply sysctl settings  # noqa: no-handler
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: _sysctl_conf.changed

# =============================================================================
# earlyoom — Userspace OOM Killer
# =============================================================================
# Kills the biggest memory hog before the system freezes. The kernel OOM
# killer triggers too late (after the system is already thrashing). earlyoom
# watches memory pressure and sends SIGTERM/SIGKILL before it's unrecoverable.
#
# Thresholds and prefer/avoid regexes are role variables (earlyoom_*); the
# defaults (8,4 / 15,8, browsers preferred, sessions and media avoided) and
# why are in docs/memory-resilience.md. A changed setting restarts earlyoom
# and nothing else.
# =============================================================================

- name: Install earlyoom
  ansible.builtin.apt:
    name: earlyoom
    state: present

- name: Configure earlyoom thresholds
  ansible.builtin.template:
    src: earlyoom.default.j2
    dest: /etc/default/earlyoom
    owner: root
    group: root
    mode: "0644"
  notify: Restart earlyoom

- name: Ensure earlyoom is enabled and running
  ansible.builtin.systemd:
    name: earlyoom
    enabled: true
    state: started

# =============================================================================
# Memory-capped browser launcher (opt-in: browser_memory_cap_enabled)
# =============================================================================

- name: Include the memory-capped browser launcher
  ansible.builtin.include_tasks:
    file: browser-memory-cap.yml
    apply:
      tags: [tuning, system, browser-memory-cap]
  tags: [tuning, system, browser-memory-cap]

# =============================================================================
# fstrim — SSD/NVMe TRIM
# =============================================================================
# Ships with util-linux; the unit just needs enabling.
# =============================================================================

- name: Ensure fstrim.timer is enabled and running
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started

# =============================================================================
# TLP — laptop power management (skipped on desktops/VMs)
# =============================================================================
# DMI chassis_type 8/9/10/14/31/32 cover laptop/notebook/sub-notebook/
# convertible/detachable form factors. See:
# https://www.dmtf.org/sites/default/files/standards/documents/DSP0134_3.2.0.pdf
# =============================================================================

- name: Read DMI chassis type
  ansible.builtin.slurp:
    src: /sys/class/dmi/id/chassis_type
  register: _chassis_type_raw
  failed_when: false

- name: Determine if this is laptop hardware
  ansible.builtin.set_fact:
    _is_laptop: "{{ (_chassis_type_raw.content | default('') | b64decode | trim) in ['8', '9', '10', '14', '31', '32'] }}"

- name: Install and enable TLP (laptops only)
  when: _is_laptop
  block:
    - name: Install tlp
      ansible.builtin.apt:
        name: tlp
        state: present

    - name: Ensure tlp is enabled and running
      ansible.builtin.systemd:
        name: tlp
        enabled: true
        state: started

- name: Configure laptop performance policy
  ansible.builtin.copy:
    dest: /etc/tlp.d/30-curiosity-laptop-performance.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — developer-workstation role.
      # Keep the admin laptop at full performance on AC while retaining a
      # performance-balanced policy on battery.
      CPU_SCALING_GOVERNOR_ON_AC=performance
      CPU_ENERGY_PERF_POLICY_ON_AC=performance
      CPU_SCALING_GOVERNOR_ON_BAT=powersave
      CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
  when:
    - _is_laptop
    - hardware_profiles[hardware_profile].performance_mode | default(false) | bool
  notify: Apply TLP power policy

# Desktops (no TLP) get the same intent through power-profiles-daemon: the
# "performance" profile sets intel_pstate's energy/performance preference to
# performance, and the daemon keeps the choice across reboots.
- name: Install and enable power-profiles-daemon (desktops)
  when:
    - not _is_laptop
    - hardware_profiles[hardware_profile].performance_mode | default(false) | bool
  block:
    - name: Install power-profiles-daemon
      ansible.builtin.apt:
        name: power-profiles-daemon
        state: present

    - name: Ensure power-profiles-daemon is enabled and running
      ansible.builtin.systemd:
        name: power-profiles-daemon
        enabled: true
        state: started

    - name: Read the active power profile
      ansible.builtin.command:
        argv: [powerprofilesctl, get]
      register: _power_profile
      changed_when: false

    - name: Select the performance power profile
      ansible.builtin.command:
        argv: [powerprofilesctl, set, performance]
      changed_when: true
      when: _power_profile.stdout | trim != 'performance'

# =============================================================================
# No-sleep policy
# =============================================================================
# Admin laptops and always-on desktops stay available for SSH/Ziti access when
# the lid is closed or the desktop is idle.  Masking the targets also blocks
# explicit suspend and hibernate requests from desktop helpers and login
# sessions.  Applies to any chassis whose hardware profile sets disable_sleep.
# =============================================================================

- name: Deploy optional wired Netplan policy for admin laptops
  ansible.builtin.copy:
    src: 99-curiosity-laptop-wired-optional.yaml
    dest: /etc/netplan/99-curiosity-laptop-wired-optional.yaml
    owner: root
    group: root
    mode: "0600"
  register: _laptop_netplan_optional
  notify: Regenerate Netplan after laptop wired-link policy changes
  when:
    - hardware_profile in ['t460', 'x86-byod-laptop']

- name: Ensure no-sleep logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - hardware_profiles[hardware_profile].disable_sleep | default(false) | bool

- name: Deploy no-sleep policy
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/20-curiosity-laptop-nosleep.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — developer-workstation role.
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
      HandleSuspendKey=ignore
      HandleHibernateKey=ignore
      HandlePowerKey=poweroff
      IdleAction=ignore
      IdleActionSec=0
  when:
    - hardware_profiles[hardware_profile].disable_sleep | default(false) | bool
  notify: Reload systemd-logind

- name: Mask sleep and hibernate targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    enabled: false
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
    - suspend-then-hibernate.target
  when:
    - hardware_profiles[hardware_profile].disable_sleep | default(false) | bool
  failed_when: false
