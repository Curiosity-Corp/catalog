---
# =============================================================================
# Node.js Global Packages
# =============================================================================
# User-facing Node.js CLIs belong to dev_user's npm prefix. Running npm as root
# creates a second, invisible installation under /usr and makes the nightly
# run appear healthy while the user's shell keeps executing an older binary.
#
# Every ansible-pull asks npm to refresh each package from the registry's latest
# dist-tag. There is no compatibility-pin escape hatch in the lab profile.
# =============================================================================

- name: Ensure user npm global prefix exists
  ansible.builtin.file:
    path: "{{ npm_global_prefix }}"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Remove unsupported user-scoped npm self-install
  community.general.npm:
    name: npm
    global: true
    state: absent
    executable: "{{ npm_global_executable }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

- name: Remove stale user-prefix npm launchers and package tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ npm_global_prefix }}/bin/npm"
    - "{{ npm_global_prefix }}/bin/npx"
    - "{{ npm_global_prefix }}/lib/node_modules/npm"

- name: Update user-scoped npm global packages to latest
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: "{{ npm_global_executable }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    NPM_CONFIG_PREFIX: "{{ npm_global_prefix }}"
    PATH: "{{ npm_global_prefix }}/bin:{{ dev_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  loop: "{{ npm_global_packages }}"
  register: _npm_latest_result
  failed_when: _npm_latest_result is failed

- name: Remove obsolete root-scoped copies of catalog-managed npm apps
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: absent
    executable: "{{ npm_global_executable }}"
  environment:
    HOME: /root
    NPM_CONFIG_PREFIX: /usr
    PATH: "/usr/local/bin:/usr/bin:/bin"
  loop: >-
    {{ (npm_global_packages | reject('equalto', 'npm') | list)
       + ai_assistant_packages + m365_cli_packages + ['playwright'] }}
  register: _npm_root_cleanup_result
  failed_when: _npm_root_cleanup_result is failed
