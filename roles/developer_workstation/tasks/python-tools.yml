---
# =============================================================================
# Python Tools
# =============================================================================
# Uses pipx for isolated Python tool installs and uv as fast pip replacement.
# Python and the baseline pipx package are installed via APT (packages.yml),
# but the APT pipx version can lag the minimum supported by
# community.general.pipx. Use the distro package when it already meets the
# minimum; only overlay pipx from PyPI when needed, and expose that launcher
# for interactive use.
# =============================================================================

- name: Check whether pip is importable in Ansible's Python environment
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - pip
      - --version
  register: _ansible_python_pip
  changed_when: false
  failed_when: false

- name: Bootstrap pip in Ansible's Python environment when absent
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - ensurepip
      - --upgrade
      - --default-pip
  when: _ansible_python_pip.rc != 0
  changed_when: true
  become: true

- name: Check pipx in Ansible's Python environment
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - pipx
      - --version
  register: _ansible_python_pipx
  changed_when: false
  failed_when: false

- name: Install a current pipx into Ansible's Python environment when needed
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - pip
      - install
      - --upgrade
      # Ubuntu 26.04 marks the system interpreter as externally managed
      # (PEP 668). This package is deliberately installed into the
      # interpreter used by Ansible, so opt into that managed location
      # explicitly rather than failing before the pipx tasks can run.
      - --break-system-packages
      # Ubuntu's APT pipx package has no RECORD file. If an older distro
      # package must be overlaid, do not ask pip to uninstall that package.
      - --ignore-installed
      - "pipx>=1.7.0"
  register: _pipx_bootstrap
  changed_when: >-
    (_pipx_bootstrap.stdout | default('') is search('Successfully installed|Successfully uninstalled'))
    or (_pipx_bootstrap.stdout | default('') is search('Installing collected packages'))
  become: true
  when:
    - _ansible_python_pipx.rc != 0 or
      (_ansible_python_pipx.stdout | trim is version('1.7.0', '<'))

- name: Expose the catalog-managed pipx launcher
  ansible.builtin.file:
    src: "{{ ansible_playbook_python | dirname }}/pipx"
    dest: /usr/local/bin/pipx
    state: link
    force: true
  become: true

- name: Ensure the user pipx binary directory exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.local/bin"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0750"
  become: true

- name: Install or update uv from PyPI in the user's pipx scope
  community.general.pipx:
    name: uv
    state: latest
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "/usr/local/bin:{{ dev_user_home }}/.local/bin:/usr/bin:/bin"

- name: Install Python tools via pipx
  community.general.pipx:
    name: "{{ item }}"
    state: latest
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    PATH: "/usr/local/bin:{{ dev_user_home }}/.local/bin:/usr/bin:/bin"
  loop:
    - ruff
    - poetry
    - pre-commit
    - jupyterlab
    - ipython
  register: _pipx_result
  failed_when:
    - _pipx_result is failed
    - "'already' not in (_pipx_result.msg | default(''))"
