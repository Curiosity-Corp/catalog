---
# =============================================================================
# Chezmoi dotfiles bootstrap
# =============================================================================
# Installs chezmoi and applies the dotfiles repo configured via
# `user_dotfiles_repo`. Skipped entirely when the variable is empty.
#
# System state (this role) owns packages, system config, and /etc/*.
# User state ($HOME/.*) is delegated to chezmoi.
# Zero-PII: no identity values are baked into this role — each user
# supplies their own fork URL via group_vars/host_vars or `-e`.
# =============================================================================

- name: Validate the dotfiles apply mode
  ansible.builtin.assert:
    that:
      - user_dotfiles_apply in ['force', 'review']
      - >-
        user_dotfiles_apply != 'review'
        or (user_dotfiles_review_argv | length > 0
            and user_dotfiles_review_argv[0] is match('^/'))
    fail_msg: >-
      user_dotfiles_apply must be force or review; review needs
      user_dotfiles_review_argv, the repo's own gate as an argv list starting
      with an absolute path (for example ["{{ dev_user_home }}/.local/bin/dotfiles-review", "sync"]).
    quiet: true
  when: user_dotfiles_repo | default('') | length > 0

- name: Resolve verified chezmoi .deb asset
  ansible.builtin.set_fact:
    _chezmoi_deb_asset: >-
      {{ latest_github_releases.chezmoi.assets
         | selectattr('name', 'match', '^chezmoi_.*_linux_amd64[.]deb$') | first }}
  when: user_dotfiles_repo | default('') | length > 0

- name: Require a verified chezmoi .deb asset
  ansible.builtin.assert:
    that:
      - _chezmoi_deb_asset | default({}) | length > 0
      - _chezmoi_deb_asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')
  when: user_dotfiles_repo | default('') | length > 0

- name: Download verified chezmoi .deb
  ansible.builtin.get_url:
    url: "{{ _chezmoi_deb_asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/chezmoi-{{ _chezmoi_deb_asset.digest | regex_replace('^sha256:', '') }}.deb"
    checksum: "{{ _chezmoi_deb_asset.digest }}"
    mode: "0644"
    force: false
  when: user_dotfiles_repo | default('') | length > 0

- name: Install chezmoi from upstream .deb
  ansible.builtin.apt:
    deb: "{{ workstation_update_artifact_cache_dir }}/chezmoi-{{ _chezmoi_deb_asset.digest | regex_replace('^sha256:', '') }}.deb"
    state: present
  when: user_dotfiles_repo | default('') | length > 0

- name: Check whether chezmoi source-state is already initialized for dev_user
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.local/share/chezmoi/.git"
  register: _chezmoi_src
  when: user_dotfiles_repo | default('') | length > 0

- name: Initialize chezmoi against the user's dotfiles repo
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - "120"
      - /tmp/.chezmoi-sync.lock
      - chezmoi
      - init
      - --apply
      - --force
      - "{{ user_dotfiles_repo }}"
  become: true
  become_user: "{{ dev_user }}"
  environment: &dotfiles_chezmoi_env
    HOME: "{{ dev_user_home }}"
    # Non-interactive init — env vars feed the .chezmoi.toml.tmpl prompts.
    # Set these in host_vars / group_vars. Empty strings keep the role
    # PII-free; per-user values live only on the target machine.
    CHEZMOI_NAME: "{{ chezmoi_user_name | default('') }}"
    CHEZMOI_EMAIL: "{{ chezmoi_user_email | default('') }}"
    CHEZMOI_PROFILE: "{{ workstation_profile }}"
    CHEZMOI_EDITOR: >-
      {{
        chezmoi_editor
        | default(
            ('nvim' if workstation_profile in ['workspace', 'thin-client']
             else preferred_editor),
            true
          )
      }}
  when:
    - user_dotfiles_repo | default('') | length > 0
    - user_dotfiles_apply == 'force'
    - not _chezmoi_src.stat.exists
  changed_when: true

# Review mode (catalog#151): the repo's own gate owns $HOME. catalog only
# clones a missing source, without applying it, and then runs the gate, which
# applies what cannot overwrite an owner edit and reports the rest. Nothing
# here runs chezmoi --force.
- name: Clone the user's dotfiles source for the review gate
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - "120"
      - /tmp/.chezmoi-sync.lock
      - chezmoi
      - init
      - "{{ user_dotfiles_repo }}"
  become: true
  become_user: "{{ dev_user }}"
  environment: *dotfiles_chezmoi_env
  when:
    - user_dotfiles_repo | default('') | length > 0
    - user_dotfiles_apply == 'review'
    - not _chezmoi_src.stat.exists
  changed_when: true

- name: Run the dotfiles repo's own review gate
  ansible.builtin.command:
    argv: "{{ user_dotfiles_review_argv }}"
  become: true
  become_user: "{{ dev_user }}"
  environment: *dotfiles_chezmoi_env
  when:
    - user_dotfiles_repo | default('') | length > 0
    - user_dotfiles_apply == 'review'
  changed_when: true

- name: Update chezmoi source state for existing dotfiles checkout
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - "120"
      - /tmp/.chezmoi-sync.lock
      - chezmoi
      - update
      - --force
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    CHEZMOI_NAME: "{{ chezmoi_user_name | default('') }}"
    CHEZMOI_EMAIL: "{{ chezmoi_user_email | default('') }}"
    CHEZMOI_PROFILE: "{{ workstation_profile }}"
    CHEZMOI_EDITOR: >-
      {{
        chezmoi_editor
        | default(
            ('nvim' if workstation_profile in ['workspace', 'thin-client']
             else preferred_editor),
            true
          )
      }}
  when:
    - user_dotfiles_repo | default('') | length > 0
    - user_dotfiles_apply == 'force'
    - _chezmoi_src.stat.exists
  changed_when: true

- name: Apply chezmoi state to $HOME
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - "120"
      - /tmp/.chezmoi-sync.lock
      - chezmoi
      - apply
      - --force
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    CHEZMOI_NAME: "{{ chezmoi_user_name | default('') }}"
    CHEZMOI_EMAIL: "{{ chezmoi_user_email | default('') }}"
    CHEZMOI_PROFILE: "{{ workstation_profile }}"
    CHEZMOI_EDITOR: >-
      {{
        chezmoi_editor
        | default(
            ('nvim' if workstation_profile in ['workspace', 'thin-client']
             else preferred_editor),
            true
          )
      }}
  when:
    - user_dotfiles_repo | default('') | length > 0
    - user_dotfiles_apply == 'force'
  changed_when: true

- name: Guard the optional Rust environment after chezmoi applies workspace dotfiles
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.profile"
    regexp: '^\s*\.\s+"\$HOME/\.cargo/env"\s*$'
    line: '[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"'
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
  become: true
  become_user: "{{ dev_user }}"
  when:
    - workstation_profile == 'workspace'
    - user_dotfiles_repo | default('') | length > 0
    # In review mode .profile belongs to the repo's gate, like every file in $HOME.
    - user_dotfiles_apply == 'force'
