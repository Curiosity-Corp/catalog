---
# =============================================================================
# APT Package Installation (Workspace Profile)
# =============================================================================
# Container-safe package set for Coder workspaces.
# Avoids desktop/browser/systemd-host dependencies.
# =============================================================================

- name: Install workspace APT packages  # noqa: args
  ansible.builtin.apt:
    name:
      # --- Build tools ---
      - build-essential
      - gcc
      - g++
      - clang
      - make
      - cmake
      - meson
      - ninja-build
      - pkg-config
      - autoconf
      - automake
      - libtool
      # --- Python ---
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - pipx
      # --- Node.js ---
      - nodejs
      # --- Java ---
      # The newest available OpenJDK package is selected below.
      # --- Ruby ---
      - ruby
      - ruby-dev
      # --- Git ---
      - git
      - git-lfs
      - tig
      - gh
      # --- gh keyring + dbus prerequisites (gh v2.45+ migrates oauth_token to
      # the system keyring on first run; without dbus-launch + libsecret it
      # aborts with "couldn't find oauth token for github.com"). Workspaces
      # are headless so we ship the runtime instead of suppressing the migration.
      - dbus-x11
      - libsecret-1-0
      # --- File transfer / sync (used by laptop-side credential bootstrap
      # and chezmoi `chezmoi cd` round-trips between machines) ---
      - rsync
      # --- Google Cloud CLI ---
      - google-cloud-cli
      # --- Kubernetes ---
      # kubectl — installed via direct download in kubernetes.yml
      # - kubectl
      # --- HashiCorp ---
      # terraform, packer, vault — installed via direct download in devops.yml
      # - terraform
      # - packer
      # - vault
      # --- Ansible ---
      - ansible
      - ansible-lint
      # --- JSON/YAML ---
      - jq
      # --- Modern search/file tools ---
      - ripgrep
      - fd-find
      - bat
      - eza
      - fzf
      # --- Terminal multiplexers/shells ---
      - tmux
      - tmate
      - zsh
      - screen
      # --- Editors ---
      - neovim
      - vim
      - nano
      # --- Environment ---
      - direnv
      # --- Linting ---
      - shellcheck
      # --- HTTP client ---
      - httpie
      # --- File utilities ---
      - tree
      - ncdu
      - tealdeer
      # tokei - installed via cargo, not available in apt
      # --- Archive tools ---
      - unzip
      - zip
      - p7zip-full
      - zstd
      - pigz
      # --- Network diagnostics ---
      - nmap
      - dnsutils
      - mtr-tiny
      - traceroute
      - whois
      - ipcalc
      # --- Network monitoring ---
      - tcpdump
      - iperf3
      - iftop
      # --- System debugging ---
      - strace
      - ltrace
      - sysstat
      - iotop
      - lsof
      - psmisc
      # --- FUSE ---
      - libfuse2
      # --- System essentials ---
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      # --- Databases (clients) ---
      - sqlite3
      - libsqlite3-dev
      - redis-tools
      - postgresql-client
      - default-mysql-client
      - mongodb-mongosh
      # --- Networking tools ---
      - socat
      - netcat-openbsd
      # --- SSH ---
      - openssh-client
      # sshpass is used only for controlled bootstrap/legacy endpoints; prefer
      # SSH keys for all durable access.
      - sshpass
      - sshfs
      - mosh
      # --- Misc utilities ---
      - entr
      - pv
      - bc
      - dos2unix
      - rename
      - expect
      - parallel
      - rsync
      - wget
      - curl
      - btop
      - skopeo
      # --- PHP ---
      - php-cli
      - php-curl
      - php-mbstring
      - php-xml
      - php-zip
      # --- .NET ---
      # The newest available .NET SDK package is selected below.
      # --- Document conversion ---
      - pandoc
      - graphviz
      - ffmpeg
      - imagemagick
      - poppler-utils
      - texlive-base
      - texlive-latex-extra
      - protobuf-compiler
      # --- Debugger ---
      - gdb
      - lldb
      - valgrind
      - cppcheck
      - xvfb
      # --- Containers (daemonless, no background daemon) ---
      - podman
      - buildah
      # --- pyenv build dependencies ---
      - libssl-dev
      - libbz2-dev
      - libreadline-dev
      - libffi-dev
      - liblzma-dev
      - zlib1g-dev
      # --- Scientific Python system dependencies ---
      - libhdf5-dev
      - libegl1
    state: present
    update_cache: true

- name: Discover newest OpenJDK package in configured repositories  # noqa: command-instead-of-shell risky-shell-pipe
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt-cache pkgnames \
        | awk '/^openjdk-[0-9]+-jdk$/' \
        | sort -V \
        | tail -n 1
    executable: /bin/bash
  register: _latest_openjdk_package
  changed_when: false

- name: Install newest OpenJDK package  # noqa: package-latest
  ansible.builtin.apt:
    name: "{{ _latest_openjdk_package.stdout | trim }}"
    state: latest
  when: _latest_openjdk_package.stdout | trim | length > 0

- name: Discover newest .NET SDK package in configured repositories  # noqa: command-instead-of-shell risky-shell-pipe
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      apt-cache pkgnames \
        | awk '/^dotnet-sdk-[0-9]+\\.0$/' \
        | sort -V \
        | tail -n 1
    executable: /bin/bash
  register: _latest_dotnet_sdk_package
  changed_when: false

- name: Install newest .NET SDK package  # noqa: package-latest
  ansible.builtin.apt:
    name: "{{ _latest_dotnet_sdk_package.stdout | trim }}"
    state: latest
  when: _latest_dotnet_sdk_package.stdout | trim | length > 0

- name: Remove unwanted packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - docker-buildx-plugin
      - rancher
      - cloudflared
      - tailscale
      # Removed apt-managed tools — now direct-download managed
      - kubectl
      - terraform
      - packer
      - vault
    state: absent
    purge: true
