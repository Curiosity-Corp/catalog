---
# Included once per item of dev_users with loop_var dw_user (see main.yml).
- name: Ensure the managed user owns their home directory
  ansible.builtin.file:
    path: "{{ dw_user.home }}"
    owner: "{{ dw_user.name }}"
    group: "{{ dw_user.name }}"
    state: directory
    mode: "0750"
    recurse: false
