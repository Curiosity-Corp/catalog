---
# =============================================================================
# UFW Firewall Configuration
# =============================================================================
# Default deny incoming, allow outgoing. Everything arriving on ziti0
# (OpenZiti tunnel) is allowed; VNC (5900/tcp) is reachable only there.
#
# SSH is open on every interface unless firewall_ssh_interfaces (host var) or
# the hardware profile's firewall_ssh_interfaces names the trusted
# interfaces, in which case SSH (and mosh, when firewall_mosh is set) is
# allowed only on those and the any-interface SSH rule is removed. Hosts on a
# shared or otherwise untrusted LAN (hardware profile untrusted_lan: true)
# additionally stop announcing themselves over mDNS and keep the local MTA on
# loopback, so nothing on the LAN learns about or reaches local services.
#
# Ziti-hosted services (deskmeet1-ssh, *-mosh) terminate on localhost and
# loopback is never filtered, so the overlay path is unaffected.
# =============================================================================

- name: Resolve firewall posture
  ansible.builtin.set_fact:
    _firewall_ssh_interfaces: >-
      {{ firewall_ssh_interfaces | default([], true)
         or hardware_profiles[hardware_profile].firewall_ssh_interfaces | default([]) }}
    _firewall_mosh: >-
      {{ (firewall_mosh | default(false) | bool)
         or (hardware_profiles[hardware_profile].firewall_mosh | default(false) | bool) }}
    _firewall_untrusted_lan: >-
      {{ hardware_profiles[hardware_profile].untrusted_lan | default(false) | bool }}

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH on all interfaces
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: SSH
  when: _firewall_ssh_interfaces | length == 0

- name: Remove any-interface SSH rule when SSH is limited to trusted interfaces
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: true
  when: _firewall_ssh_interfaces | length > 0

- name: Allow SSH on trusted interfaces only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    interface: "{{ item }}"
    direction: in
    comment: "SSH on {{ item }}"
  loop: "{{ _firewall_ssh_interfaces }}"

- name: Allow mosh on trusted interfaces only
  community.general.ufw:
    rule: allow
    port: "60000:61000"
    proto: udp
    interface: "{{ item }}"
    direction: in
    comment: "mosh on {{ item }}"
  loop: "{{ _firewall_ssh_interfaces }}"
  when: _firewall_mosh | bool

- name: Allow VNC on ziti0 only
  community.general.ufw:
    rule: allow
    port: "5900"
    proto: tcp
    interface: ziti0
    direction: in
    comment: x11vnc via OpenZiti

- name: Allow all OpenZiti traffic on ziti0
  community.general.ufw:
    rule: allow
    interface: ziti0
    direction: in
    comment: OpenZiti tunnel traffic

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ---------------------------------------------------------------------------
# Untrusted LAN: no service discovery announcements, loopback-only MTA.
# ufw's stock before.rules accept inbound mDNS (224.0.0.251:5353), so the
# firewall alone does not stop avahi from answering; turn publishing off
# (browsing .local names keeps working).
# ---------------------------------------------------------------------------

- name: Check for avahi-daemon configuration
  ansible.builtin.stat:
    path: /etc/avahi/avahi-daemon.conf
  register: _firewall_avahi_conf
  when: _firewall_untrusted_lan | bool

- name: Stop avahi publishing this host on an untrusted LAN
  community.general.ini_file:
    path: /etc/avahi/avahi-daemon.conf
    section: publish
    option: disable-publishing
    value: "yes"
    no_extra_spaces: true
    mode: "0644"
  when:
    - _firewall_untrusted_lan | bool
    - _firewall_avahi_conf.stat.exists | default(false)
  notify: Restart avahi-daemon

- name: Check for Postfix configuration
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: _firewall_postfix_conf
  when: _firewall_untrusted_lan | bool

- name: Keep Postfix on loopback on an untrusted LAN
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^\s*inet_interfaces\s*='
    line: "inet_interfaces = loopback-only"
  when:
    - _firewall_untrusted_lan | bool
    - _firewall_postfix_conf.stat.exists | default(false)
  notify: Restart postfix
