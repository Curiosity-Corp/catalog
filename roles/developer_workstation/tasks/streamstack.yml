---
# =============================================================================
# StreamStack: call and stream studio (Teams, Zoom, streams)
# =============================================================================
# One repeatable rig for DSLR + capture card + USB microphone workstations:
#
#   Canon (USB live view) --streamstack-canon--> /dev/video42 "Canon EOS 50D"
#   Elgato Cam Link 4K (UVC) ------------------> /dev/streamstack/camlink
#   both --> StreamStack's native video engine (grade, framing, blur on the GPU,
#            hosted by the Console) --> /dev/video43 "StreamStack Camera"
#   Elgato Wave (or any mic) --> StreamStack's PipeWire voice chain --> "StreamStack Mic"
#
# Teams and Zoom then pick "StreamStack Camera" and "StreamStack Mic". Both
# loopback nodes use exclusive_caps=1, which Chromium-based browsers (Teams
# web) require before they list a virtual camera.
#
# The application (CLI, Console, native engine, voice chain, panel menu, auto
# mode, presets) is the StreamStack project, vendored at files/streamstack as a
# squashed git subtree of a release tag; this file wires it into the host:
# packages, the loopback cameras, udev, the settings file, the install under
# /usr/local and the user services. There is no OBS Studio and no Easy Effects
# any more; a host that still has them gets them removed.
#
# Included only when `streamstack_enabled` is true (the hardware profile's
# `streamstack` flag, or a host-local override). Per-user defaults are seeded
# once and never overwritten; `streamstack setup --force` restores them on
# request. See docs/streamstack.md.
# =============================================================================

- name: Validate the StreamStack settings
  ansible.builtin.assert:
    that:
      - streamstack_camera_video_nr | int >= 0
      - streamstack_program_video_nr | int >= 0
      - streamstack_camera_video_nr | int != streamstack_program_video_nr | int
      - streamstack_camera_label | length > 0
      - streamstack_program_label | length > 0
      - streamstack_camera_label is not search('[,"\n]')
      - streamstack_program_label is not search('[,"\n]')
      - streamstack_width | string is match('^[0-9]+$')
      - streamstack_height | string is match('^[0-9]+$')
      - streamstack_fps | string is match('^[0-9]+$')
      - streamstack_width | int % 4 == 0
      - streamstack_height | int % 4 == 0
      - streamstack_canon_bridge in ['gphoto2', 'command', 'none']
      - streamstack_canon_bridge != 'command' or streamstack_canon_bridge_command | length > 0
      - streamstack_canon_bridge_command is not search("['\n]")
      - streamstack_auto_backend in ['claude-cli', 'api', 'local']
      - streamstack_auto_model is match('^[A-Za-z0-9._:-]*$')
      - streamstack_microphone is not search("['\n]")
      - streamstack_auto_interval | int >= 5
      - streamstack_auto_ai_interval | int >= 60
      - streamstack_camlink_usb_ids | select('match', '^[0-9a-f]{4}:[0-9a-f]{4}$') | list | length == streamstack_camlink_usb_ids | length
      - streamstack_property is not search("['\n]")
      - (streamstack_latitude | string | length == 0) == (streamstack_longitude | string | length == 0)
      - streamstack_latitude | string | length == 0 or (streamstack_latitude | string is match('^-?[0-9]+(\.[0-9]+)?$') and streamstack_latitude | float >= -90 and streamstack_latitude | float <= 90)
      - streamstack_longitude | string | length == 0 or (streamstack_longitude | string is match('^-?[0-9]+(\.[0-9]+)?$') and streamstack_longitude | float >= -180 and streamstack_longitude | float <= 180)
    fail_msg: >-
      StreamStack needs two different loopback device numbers, labels without
      commas or quotes, a width/height divisible by 4, a numeric frame rate,
      a bridge of gphoto2, command (with streamstack_canon_bridge_command)
      or none, and an auto backend of claude-cli, api or local with a local
      interval of at least 5 s and a Claude interval of at least 60 s. A
      property location needs both a decimal latitude (-90 to 90) and
      longitude (-180 to 180), or neither.

- name: Install the StreamStack studio packages
  ansible.builtin.apt:
    name: "{{ streamstack_packages }}"
    state: present

# StreamStack makes the program camera and the microphone itself (native video
# engine, PipeWire voice chain). Packages only: users' own OBS and Easy Effects
# settings stay in their homes, and `streamstack setup` has already imported the
# Easy Effects voice presets once.
- name: Remove OBS Studio, Easy Effects and the OBS background plugin
  ansible.builtin.apt:
    name: "{{ streamstack_retired_packages }}"
    state: absent

- name: Remove the OBS background plugin links and the Easy Effects autostart
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/lib/x86_64-linux-gnu/obs-plugins/obs-backgroundremoval.so
    - /usr/share/obs/obs-plugins/obs-backgroundremoval
    - /usr/local/lib/obs-plugins/obs-backgroundremoval.so
    - /usr/local/share/obs/obs-plugins/obs-backgroundremoval
    - /etc/xdg/autostart/streamstack-easyeffects.desktop

- name: Check for the v4l2loopback kernel module
  ansible.builtin.command: modinfo -n v4l2loopback
  register: _streamstack_v4l2loopback_modinfo
  changed_when: false
  failed_when: false

# Prefer the prebuilt, signed module packages and fall back to DKMS where the
# archive has none. The flavour metapackage follows the newest installed
# kernel only, so a host still running an older kernel (updates installed,
# not yet rebooted) also needs that kernel's own package.
- name: Install the v4l2loopback kernel module
  when: _streamstack_v4l2loopback_modinfo.rc != 0
  block:
    - name: Install the prebuilt v4l2loopback module package
      ansible.builtin.apt:
        name:
          - linux-modules-v4l2loopback-generic
          - "linux-main-modules-v4l2loopback-{{ ansible_facts['kernel'] }}"
        state: present
  rescue:
    - name: Install v4l2loopback through DKMS
      ansible.builtin.apt:
        name: v4l2loopback-dkms
        state: present

- name: Ensure /etc/streamstack exists
  ansible.builtin.file:
    path: /etc/streamstack
    state: directory
    owner: root
    group: root
    mode: "0755"

# With streamstack_camera_external another tool on the host (for example a
# camera fleet service) owns the module options and feeds the camera node;
# StreamStack then only adds its program node next to it.
- name: Configure the StreamStack loopback cameras
  ansible.builtin.copy:
    dest: /etc/modprobe.d/curiosity-streamstack-v4l2loopback.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the curiosity workstation role (streamstack task group).
      # video{{ streamstack_camera_video_nr }}: camera bridge, video{{ streamstack_program_video_nr }}: program camera (the native engine).
      options v4l2loopback devices=2 video_nr={{ streamstack_camera_video_nr }},{{ streamstack_program_video_nr }} card_label="{{ streamstack_camera_label }},{{ streamstack_program_label }}" exclusive_caps=1,1 max_buffers=2
  when: not (streamstack_camera_external | bool)

- name: Leave the loopback options to the tool that owns the camera
  ansible.builtin.file:
    path: /etc/modprobe.d/curiosity-streamstack-v4l2loopback.conf
    state: absent
  when: streamstack_camera_external | bool

- name: Load v4l2loopback at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/curiosity-streamstack.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the curiosity workstation role (streamstack task group).
      v4l2loopback

# Earlier catalog releases configured a single loopback camera from the
# deskmeet-b760 hardware profile; StreamStack owns both nodes now.
- name: Remove the superseded single-camera loopback options
  ansible.builtin.file:
    path: /etc/modprobe.d/curiosity-v4l2loopback.conf
    state: absent

- name: Find other v4l2loopback options on this host
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      grep -lE '^[[:space:]]*options[[:space:]]+v4l2loopback' /etc/modprobe.d/*.conf
      | grep -vx /etc/modprobe.d/curiosity-streamstack-v4l2loopback.conf || true
    executable: /bin/bash
  register: _streamstack_foreign_loopback
  changed_when: false
  when: not (streamstack_camera_external | bool)

- name: Warn about v4l2loopback options StreamStack does not own
  ansible.builtin.debug:
    msg: >-
      {{ _streamstack_foreign_loopback.stdout_lines | join(', ') }} also set
      v4l2loopback options, and modprobe applies the last one it reads. Remove
      them (and any service feeding their device) so the StreamStack cameras
      come up as video{{ streamstack_camera_video_nr }}/video{{ streamstack_program_video_nr }},
      or set streamstack_camera_external to adopt that camera instead.
  when:
    - not (streamstack_camera_external | bool)
    - _streamstack_foreign_loopback.stdout_lines | length > 0

- name: Grant the console user the StreamStack cameras
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-curiosity-streamstack.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the curiosity workstation role (streamstack task group).
      # Loopback nodes: match on KERNEL only, ATTR{name} is not populated yet
      # when the add event is processed.
      SUBSYSTEM=="video4linux", KERNEL=="video{{ streamstack_camera_video_nr }}", GROUP="video", MODE="0660", TAG+="uaccess"
      SUBSYSTEM=="video4linux", KERNEL=="video{{ streamstack_program_video_nr }}", GROUP="video", MODE="0660", TAG+="uaccess"
      # Stable capture-card path for the native engine: /dev/streamstack/camlink
      {% for usb_id in streamstack_camlink_usb_ids %}
      SUBSYSTEM=="video4linux", ATTRS{idVendor}=="{{ usb_id.split(':')[0] }}", ATTRS{idProduct}=="{{ usb_id.split(':')[1] }}", ATTR{index}=="0", SYMLINK+="streamstack/camlink"
      {% endfor %}
  register: _streamstack_udev

# The nodes are root:video 0660; the uaccess ACL only reaches the seat's user,
# so call users on remote or headless sessions need the group itself. Accounts
# are looked up first: ansible.builtin.user would otherwise create a missing one.
- name: Look up the accounts on this host
  ansible.builtin.getent:
    database: passwd
  changed_when: false

- name: Let the call users open the StreamStack cameras
  ansible.builtin.user:
    name: "{{ item }}"
    groups: video
    append: true
  loop: "{{ streamstack_video_group_users | select('in', getent_passwd.keys()) | list }}"

- name: Reload udev rules for StreamStack  # noqa: no-handler
  ansible.builtin.command: udevadm control --reload
  when: _streamstack_udev is changed
  changed_when: true

- name: Re-apply udev rules to present video devices  # noqa: no-handler
  ansible.builtin.command: udevadm trigger --subsystem-match=video4linux
  when: _streamstack_udev is changed
  changed_when: true

- name: Render the StreamStack settings
  ansible.builtin.copy:
    dest: /etc/streamstack/streamstack.env
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the curiosity workstation role (streamstack task group).
      STREAMSTACK_CAMERA_DEVICE=/dev/video{{ streamstack_camera_video_nr | int }}
      STREAMSTACK_CAMERA_LABEL={{ streamstack_camera_label | quote }}
      STREAMSTACK_PROGRAM_DEVICE=/dev/video{{ streamstack_program_video_nr | int }}
      STREAMSTACK_PROGRAM_LABEL={{ streamstack_program_label | quote }}
      STREAMSTACK_WIDTH={{ streamstack_width | int }}
      STREAMSTACK_HEIGHT={{ streamstack_height | int }}
      STREAMSTACK_FPS={{ streamstack_fps | int }}
      STREAMSTACK_CAMERA_EXTERNAL={{ streamstack_camera_external | bool | lower }}
      STREAMSTACK_CANON_BRIDGE={{ 'none' if streamstack_camera_external | bool else streamstack_canon_bridge }}
      STREAMSTACK_CANON_COMMAND='{{ streamstack_canon_bridge_command }}'
      STREAMSTACK_VOICE_PRESET={{ streamstack_voice_preset | quote }}
      STREAMSTACK_MICROPHONE='{{ streamstack_microphone }}'
      STREAMSTACK_AUTO_BACKEND={{ streamstack_auto_backend }}
      STREAMSTACK_AUTO_MODEL={{ streamstack_auto_model | quote }}
      STREAMSTACK_AUTO_INTERVAL={{ streamstack_auto_interval | int }}
      STREAMSTACK_AUTO_AI_INTERVAL={{ streamstack_auto_ai_interval | int }}
      STREAMSTACK_AUTO_VIDEO={{ streamstack_auto_video | bool | lower }}
      STREAMSTACK_AUTO_AUDIO={{ streamstack_auto_audio | bool | lower }}
      STREAMSTACK_AUTO_NOTIFY={{ streamstack_auto_notify | bool | lower }}
      STREAMSTACK_PROPERTY='{{ streamstack_property }}'
      STREAMSTACK_LATITUDE={{ streamstack_latitude }}
      STREAMSTACK_LONGITUDE={{ streamstack_longitude }}

- name: Install the StreamStack loopback bring-up
  ansible.builtin.copy:
    src: curiosity-streamstack-loopback
    dest: /usr/local/sbin/curiosity-streamstack-loopback
    owner: root
    group: root
    mode: "0755"

# At boot the module may come up from another tool's options (external mode)
# or before an added node exists; the oneshot adds the missing nodes.
- name: Install the StreamStack loopback boot service
  ansible.builtin.copy:
    src: curiosity-streamstack-loopback.service
    dest: /etc/systemd/system/curiosity-streamstack-loopback.service
    owner: root
    group: root
    mode: "0644"
  register: _streamstack_loopback_unit

- name: Enable the StreamStack loopback boot service
  ansible.builtin.systemd_service:
    name: curiosity-streamstack-loopback.service
    enabled: true
    daemon_reload: "{{ _streamstack_loopback_unit is changed }}"

# Reload only an idle module that StreamStack configures: an open camera (a
# call, the Console, the bridge) holds a reference. Otherwise add the missing nodes
# next to the open ones, and leave a misnamed node for the next boot.
- name: Bring up the StreamStack loopback cameras
  ansible.builtin.command: /usr/local/sbin/curiosity-streamstack-loopback
  register: _streamstack_loopback
  changed_when: _streamstack_loopback.stdout in ['reloaded', 'added']

- name: Report a loopback camera change that waits for a reboot
  ansible.builtin.debug:
    msg: >-
      v4l2loopback is in use and one of its nodes has another name, so the
      StreamStack cameras appear after the next reboot (or after closing every
      camera app and running `sudo modprobe -r v4l2loopback && sudo
      /usr/local/sbin/curiosity-streamstack-loopback`).
  when: _streamstack_loopback.stdout == 'busy'

# Self-contained install: the package under /usr/local/lib/streamstack and
# isolated-mode launchers on PATH, so nothing touches the system Python.
- name: Read the vendored StreamStack version
  ansible.builtin.set_fact:
    _streamstack_version: >-
      {{ lookup('ansible.builtin.file', 'streamstack/src/streamstack/__init__.py')
         | regex_search('__version__ = "([^"]+)"', '\1') | first }}

- name: Read the installed StreamStack version
  ansible.builtin.slurp:
    src: /usr/local/lib/streamstack/streamstack/__init__.py
  register: _streamstack_installed
  failed_when: false

# copy never deletes, so a module dropped upstream would linger; start clean
# whenever the version changes.
- name: Remove a StreamStack package of another version
  register: _streamstack_package_replaced
  ansible.builtin.file:
    path: /usr/local/lib/streamstack/streamstack
    state: absent
  when: >-
    _streamstack_installed.content is not defined
    or ('__version__ = "' ~ _streamstack_version ~ '"') not in (_streamstack_installed.content | b64decode)

- name: Install the StreamStack package
  ansible.builtin.copy:
    src: streamstack/src/streamstack/
    dest: /usr/local/lib/streamstack/streamstack/
    owner: root
    group: root
    mode: u=rwX,go=rX
    directory_mode: "0755"

- name: Install the StreamStack commands
  ansible.builtin.copy:
    src: "streamstack/packaging/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [streamstack, streamstack-auto, streamstack-console, streamstack-tray]

- name: Create the local hicolor icon directories
  ansible.builtin.file:
    path: "/usr/local/share/icons/hicolor/scalable/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [apps, status]

- name: Install the StreamStack icons in the hicolor theme
  ansible.builtin.copy:
    src: "streamstack/src/streamstack/data/icons/{{ item.src }}.svg"
    dest: "/usr/local/share/icons/hicolor/scalable/{{ item.dest }}.svg"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: streamstack-live, dest: apps/streamstack}
    - {src: streamstack-live, dest: status/streamstack-live}
    - {src: streamstack-raw, dest: status/streamstack-raw}
    - {src: streamstack-warn, dest: status/streamstack-warn}
    - {src: streamstack-off, dest: status/streamstack-off}
  loop_control:
    label: "{{ item.dest }}"

- name: List StreamStack in the application menu
  ansible.builtin.copy:
    src: streamstack/packaging/applications/streamstack.desktop
    dest: /usr/share/applications/streamstack.desktop
    owner: root
    group: root
    mode: "0644"

- name: Decide whether the Canon bridge starts at login
  ansible.builtin.set_fact:
    _streamstack_bridge_autostart: >-
      {{ streamstack_canon_bridge_autostart | bool and streamstack_canon_bridge != 'none'
         and not (streamstack_camera_external | bool) }}

# StreamStack ships WirePlumber drop-ins (for example the Wave XLR capture hold)
# that `make install` puts in /etc/wireplumber/wireplumber.conf.d. Install whatever
# the vendored release ships, so a new drop-in needs no catalog change. WirePlumber
# reads them at its next start; this role never restarts it (that drops every
# audio stream, so it never happens during a call).
- name: Find the WirePlumber drop-ins the vendored StreamStack ships
  ansible.builtin.stat:
    path: "{{ role_path }}/files/streamstack/packaging/wireplumber/wireplumber.conf.d"
  delegate_to: localhost
  become: false
  register: _streamstack_wireplumber_dropins

- name: Install the StreamStack WirePlumber drop-ins
  ansible.builtin.copy:
    src: streamstack/packaging/wireplumber/wireplumber.conf.d/
    dest: /etc/wireplumber/wireplumber.conf.d/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  when: _streamstack_wireplumber_dropins.stat.isdir | default(false)

- name: Install the Canon bridge user service
  ansible.builtin.copy:
    src: streamstack/packaging/systemd/user/streamstack-canon.service
    dest: /etc/systemd/user/streamstack-canon.service
    owner: root
    group: root
    mode: "0644"

- name: Ensure the global user default.target.wants directory exists
  ansible.builtin.file:
    path: /etc/systemd/user/default.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: _streamstack_bridge_autostart | bool

- name: Start the Canon bridge at login for every desktop user
  ansible.builtin.file:
    path: /etc/systemd/user/default.target.wants/streamstack-canon.service
    src: /etc/systemd/user/streamstack-canon.service
    state: link
    owner: root
    group: root
    force: true
  when: _streamstack_bridge_autostart | bool

- name: Leave the Canon bridge to `streamstack studio`
  ansible.builtin.file:
    path: /etc/systemd/user/default.target.wants/streamstack-canon.service
    state: absent
  when: not (_streamstack_bridge_autostart | bool)

# The voice chain host runs under the Console (it starts it by itself); this unit
# is installed for a host that wants the voice chain without the Console
# (`systemctl --user enable --now streamstack-audio-chain`) and is not enabled
# here, so two supervisors never fight over the same PipeWire host. The deck
# unit needs the `deck` extra and is enabled per user by `streamstack deck enable`.
- name: Install the StreamStack voice chain and deck user services
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', 'streamstack/packaging/systemd/user/' ~ item ~ '.service') | replace('ExecStart=streamstack ', 'ExecStart=/usr/local/bin/streamstack ') }}\n"
    dest: "/etc/systemd/user/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: [streamstack-audio-chain, streamstack-deck]

- name: Install the StreamStack auto mode user service
  ansible.builtin.copy:
    src: streamstack/packaging/systemd/user/streamstack-auto.service
    dest: /etc/systemd/user/streamstack-auto.service
    owner: root
    group: root
    mode: "0644"

- name: Ensure the global user graphical-session.target.wants directory exists
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: (streamstack_auto_autostart | bool) or (streamstack_lights_autostart | bool)

# Off by default: auto mode sends a camera still to Claude every few minutes,
# so each person turns it on (`streamstack auto on`, or the panel menu).
- name: Start StreamStack auto mode at login for every desktop user
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants/streamstack-auto.service
    src: /etc/systemd/user/streamstack-auto.service
    state: link
    owner: root
    group: root
    force: true
  when: streamstack_auto_autostart | bool

- name: Leave StreamStack auto mode to `streamstack auto on`
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants/streamstack-auto.service
    state: absent
  when: not (streamstack_auto_autostart | bool)

# The packaged unit names the launcher as @STREAMSTACK@ (`streamstack lights
# enable` fills it in per user); the system-wide copy points at /usr/local/bin.
- name: Install the StreamStack lights user service
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', 'streamstack/src/streamstack/data/systemd/streamstack-lights.service') | replace('@STREAMSTACK@', '/usr/local/bin/streamstack') }}\n"
    dest: /etc/systemd/user/streamstack-lights.service
    owner: root
    group: root
    mode: "0644"

- name: Start StreamStack camera follow and the light schedule at login
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants/streamstack-lights.service
    src: /etc/systemd/user/streamstack-lights.service
    state: link
    owner: root
    group: root
    force: true
  when: streamstack_lights_autostart | bool

- name: Leave StreamStack camera follow to `streamstack lights enable`
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants/streamstack-lights.service
    state: absent
  when: not (streamstack_lights_autostart | bool)

# The Console hosts the native video engine, which is the only writer of the
# program camera, and starts the voice chain. Headless (no window) it runs for
# as long as the session does; `ConditionUser` keeps it to the configured
# accounts, so a second logged-in user never fights for /dev/video43.
- name: Install the StreamStack Console user service
  ansible.builtin.template:
    src: streamstack-console.service.j2
    dest: /etc/systemd/user/streamstack-console.service
    owner: root
    group: root
    mode: "0644"

- name: Ensure the global user graphical-session.target.wants directory exists for the Console
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: streamstack_console_users | length > 0

- name: Start the StreamStack Console (video engine and voice chain) at login
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants/streamstack-console.service
    src: /etc/systemd/user/streamstack-console.service
    state: link
    owner: root
    group: root
    force: true
  when: streamstack_console_users | length > 0

- name: Leave the StreamStack Console to `streamstack console`
  ansible.builtin.file:
    path: /etc/systemd/user/graphical-session.target.wants/streamstack-console.service
    state: absent
  when: streamstack_console_users | length == 0

- name: Start the StreamStack panel icon at login
  ansible.builtin.copy:
    src: streamstack/packaging/applications/streamstack-tray.desktop
    dest: /etc/xdg/autostart/streamstack-tray.desktop
    owner: root
    group: root
    mode: "0644"
  when: streamstack_tray_autostart | bool

- name: Leave the StreamStack panel icon to the application menu
  ansible.builtin.file:
    path: /etc/xdg/autostart/streamstack-tray.desktop
    state: absent
  when: not (streamstack_tray_autostart | bool)

- name: Check managed user homes for StreamStack defaults
  ansible.builtin.stat:
    path: "{{ item.home }}"
  loop: "{{ dev_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: _streamstack_homes

# Seeds only missing files (and imports old Easy Effects voice presets once), so
# a user's own voice tweaks survive every ansible-pull.
- name: Seed StreamStack defaults for each user
  ansible.builtin.command:
    argv: [/usr/local/bin/streamstack, setup, --quiet]
  become: true
  become_user: "{{ item.item.name }}"
  environment:
    HOME: "{{ item.item.home }}"
  loop: "{{ _streamstack_homes.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.isdir | default(false)
  changed_when: false

# The user manager of each Console account starts the Console now, so the
# program camera and StreamStack Mic exist without a new login. The unit only
# runs where its ConditionUser matches. A Console from an older StreamStack is
# restarted once, when this run replaced the package. A user without a running
# manager (not logged in, no linger) picks the unit up at the next login.
- name: Check which Console accounts have a running user manager
  ansible.builtin.stat:
    path: "/run/user/{{ getent_passwd[item][1] }}/bus"
  loop: "{{ streamstack_console_users | select('in', getent_passwd.keys()) | list }}"
  register: _streamstack_console_managers

- name: Reload the user units and start the StreamStack Console
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ item.item }}"
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ getent_passwd[item.item][1] }}"
      - systemctl
      - --user
      - "{{ 'restart' if _streamstack_package_replaced is changed else 'start' }}"
      - streamstack-console.service
  loop: "{{ _streamstack_console_managers.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | default(false)
  changed_when: true

# StreamStack never touches the default source (docs/audio-chain.md): the host
# makes the processed voice the default so an app that records from "default"
# (Teams, Zoom) gets it. Persisted by WirePlumber per user; the sink is left
# alone. Waits for the source to exist: the Console starts the chain.
- name: Make StreamStack Mic the default microphone for each Console account
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for _ in $(seq 1 30); do
        pactl list short sources | cut -f2 | grep -qx streamstack_mic && break
        sleep 2
      done
      pactl list short sources | cut -f2 | grep -qx streamstack_mic || { echo "streamstack_mic absent"; exit 3; }
      if [ "$(pactl get-default-source)" = streamstack_mic ]; then echo unchanged; else
        pactl set-default-source streamstack_mic && echo changed; fi
    executable: /bin/bash
  become: true
  become_user: "{{ item.item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[item.item][1] }}"
  loop: "{{ _streamstack_console_managers.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | default(false)
  register: _streamstack_default_source
  changed_when: "'changed' in _streamstack_default_source.stdout"
  failed_when: false

- name: Report a Console account whose StreamStack Mic did not appear
  ansible.builtin.debug:
    msg: >-
      {{ item.item.item }}: StreamStack Mic is not available yet
      ({{ item.stdout | default('') }}{{ item.stderr | default('') }}); run
      `streamstack doctor` and `streamstack chain status` as that user. The
      default microphone is unchanged.
  loop: "{{ _streamstack_default_source.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item | default('') }}"
  when: item.rc is defined and item.rc != 0

# Last, once the voice chain carries the microphone: a running Easy Effects would
# keep publishing "Easy Effects Source" until it exits.
- name: Stop Easy Effects processes that outlive the package
  ansible.builtin.command: pkill -x easyeffects
  register: _streamstack_easyeffects_stop
  changed_when: _streamstack_easyeffects_stop.rc == 0
  failed_when: _streamstack_easyeffects_stop.rc not in [0, 1]
