---
# =============================================================================
# APT Repository Setup
# =============================================================================
# Vendor GPG keys are converged on every run by apt-keyring.yml (avoids
# deprecated apt_key; never `creates:`-guarded, so key rotations propagate)
# Uses apt_repository for source lists
# =============================================================================

# --- Remove Cloudflare APT repo before any apt cache refresh ---
# Cloudflare can lag the host's Ubuntu release, causing apt update to fail.
# The stale repo must be removed before the first apt operation to prevent the
# nightly ansible-pull from deadlocking.
- name: Remove stale Cloudflare APT repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
  notify: Update apt cache

# --- Retired Claude Desktop repository ---
- name: Remove retired Claude Desktop repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/claude-desktop.list
    state: absent
  notify: Update apt cache

- name: Remove retired Claude Desktop archive keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/claude-desktop-archive-keyring.gpg
    state: absent
  notify: Update apt cache

# --- GitHub CLI ---
- name: Converge github-cli APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: github-cli
    apt_keyring_url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
    apt_keyring_dest: /usr/share/keyrings/githubcli-archive-keyring.gpg

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  notify: Update apt cache

# --- VS Code (Microsoft) ---
# VS Code's own installer creates vscode.sources with a different signed-by path,
# which conflicts with our managed vscode.list. Remove it to avoid apt conflicts.
- name: Remove conflicting VS Code repo config (from VS Code installer)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.sources
    state: absent
  notify: Update apt cache

- name: Converge microsoft APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: microsoft
    apt_keyring_url: "https://packages.microsoft.com/keys/microsoft.asc"
    apt_keyring_dest: /usr/share/keyrings/microsoft-archive-keyring.gpg

- name: Add VS Code repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
    state: present
  notify: Update apt cache

# --- .NET SDK (Microsoft) ---
# Uses same GPG key as VS Code (packages.microsoft.com)
- name: Add Microsoft .NET SDK repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/ubuntu/24.04/prod {{ apt_fallback_release }} main"
    filename: microsoft-dotnet
    state: present
  notify: Update apt cache

# --- Azure CLI ---
- name: Add Microsoft Azure CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/azure-cli/ {{ apt_fallback_release }} main"
    filename: azure-cli
    state: present
  notify: Update apt cache

# --- Google Cloud CLI ---
- name: Converge google-cloud APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: google-cloud
    apt_keyring_url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
    apt_keyring_dest: /usr/share/keyrings/cloud-google-archive-keyring.gpg

- name: Add Google Cloud CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/cloud-google-archive-keyring.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
    filename: google-cloud-sdk
    state: present
  notify: Update apt cache

# --- MongoDB (mongosh) ---
- name: Discover newest MongoDB APT channel
  ansible.builtin.uri:
    url: >-
      https://s3.amazonaws.com/repo.mongodb.org?list-type=2&prefix=apt/ubuntu/dists/{{ apt_fallback_release }}/mongodb-org/&delimiter=/
    return_content: true
  register: _mongodb_repo_index
  changed_when: false

- name: Set newest MongoDB APT channel
  # Keep the channel as a dotted string (for example 8.3) instead of coercing
  # it through Jinja's float filter. The bucket also exposes a 9.x channel,
  # but current MongoDB Ubuntu guidance and the server-8.0 signing key cover
  # the stable 8.x family; do not silently select an incompatible development
  # channel.
  ansible.builtin.set_fact:
    latest_mongodb_channel: >-
      {{
        _mongodb_repo_index.content
        | regex_findall('mongodb-org/(8[.][0-9]+)/</Prefix>')
        | sort
        | last
        | default('', true)
      }}

- name: Set MongoDB signing-key version for the newest channel
  ansible.builtin.set_fact:
    # MongoDB 9.x packages are currently signed by the 8.0 repository key;
    # there is no server-9.0.asc endpoint. Keep the key selection explicit.
    latest_mongodb_key_url: "https://pgp.mongodb.com/server-8.0.asc"
    latest_mongodb_key_fingerprint: "4B0752C1BCA238C0B4EE14DC41DE058A4E7DCA05"

- name: Require a MongoDB APT channel
  ansible.builtin.assert:
    that: latest_mongodb_channel | default('') | string | length > 0
    fail_msg: "MongoDB did not publish a current APT channel"

- name: Converge mongodb APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: mongodb
    apt_keyring_url: "{{ latest_mongodb_key_url }}"
    apt_keyring_dest: /usr/share/keyrings/mongodb-archive-keyring.gpg
    apt_keyring_fingerprint: "{{ latest_mongodb_key_fingerprint }}"

- name: Find legacy MongoDB repository definitions
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - mongodb-org*.list
      - mongodb-org*.sources
    file_type: file
  register: _mongodb_legacy_repo_files

- name: Remove legacy MongoDB repository definitions before writing the current channel
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _mongodb_legacy_repo_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Update apt cache

- name: Add MongoDB repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/mongodb-archive-keyring.gpg] https://repo.mongodb.org/apt/ubuntu {{ apt_fallback_release }}/mongodb-org/{{ latest_mongodb_channel }} multiverse"
    filename: mongodb-org
    state: present
  notify: Update apt cache

# --- Google Chrome ---
# Chrome's installer appends an unsigned deb line to google-chrome.list,
# causing duplicate warnings. Remove the file so apt_repository recreates
# it cleanly with only the signed entry.
- name: Remove Chrome installer repo config (conflicting unsigned entry)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/google-chrome.list
    state: absent
  notify: Update apt cache

- name: Converge google-chrome APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: google-chrome
    apt_keyring_url: "https://dl.google.com/linux/linux_signing_key.pub"
    apt_keyring_dest: /usr/share/keyrings/google-chrome-archive-keyring.gpg

- name: Add Google Chrome repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/google-chrome-archive-keyring.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present
  notify: Update apt cache

# --- 1Password CLI ---
- name: Converge 1password APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: 1password
    apt_keyring_url: "https://downloads.1password.com/linux/keys/1password.asc"
    apt_keyring_dest: /usr/share/keyrings/1password-archive-keyring.gpg

- name: Add 1Password CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/{{ ansible_architecture | replace('x86_64', 'amd64') }} stable main"
    filename: 1password-cli
    state: present
  notify: Update apt cache

# --- Brave Browser ---
- name: Remove conflicting Brave repo config (from Brave installer)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/brave-browser-release.sources
    state: absent
  notify: Update apt cache

- name: Converge brave-browser APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: brave-browser
    apt_keyring_url: "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg"
    apt_keyring_dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg

- name: Add Brave Browser repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
    filename: brave-browser
    state: present
  notify: Update apt cache

# --- Node.js (NodeSource) ---
- name: Converge nodesource APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: nodesource
    apt_keyring_url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    apt_keyring_dest: /etc/apt/keyrings/nodesource.gpg
    apt_keyring_fingerprint: "{{ nodesource_key_fingerprint }}"

- name: Add NodeSource Node.js 24 repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main"
    filename: nodesource
    state: present
  notify: Update apt cache

# --- OpenZiti (ziti-edge-tunnel) ---
- name: Remove pre-existing OpenZiti repo config (conflicting signed-by)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/openziti-release.list
    state: absent
  notify: Update apt cache

- name: Converge openziti APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: openziti
    apt_keyring_url: "https://get.openziti.io/tun/package-repos.gpg"
    apt_keyring_dest: /usr/share/keyrings/openziti-archive-keyring.gpg
    apt_keyring_fingerprint: "{{ openziti_key_fingerprint }}"

- name: Add OpenZiti repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/openziti-archive-keyring.gpg] https://packages.openziti.org/zitipax-openziti-deb-stable debian main"
    filename: openziti
    state: present
  notify: Update apt cache

# --- Mozilla Firefox (non-snap, required for OpenZiti tun compatibility) ---
# Snap Firefox sandbox blocks tun device traffic (ziti0), breaking access
# to all Ziti-intercepted services. The Mozilla PPA provides a native .deb.
- name: Converge mozilla APT keyring
  ansible.builtin.include_tasks: apt-keyring.yml
  vars:
    apt_keyring_name: mozilla
    apt_keyring_url: "https://packages.mozilla.org/apt/repo-signing-key.gpg"
    apt_keyring_dest: /etc/apt/keyrings/packages.mozilla.org.asc

- name: Add Mozilla APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main"
    filename: mozilla
    state: present
  notify: Update apt cache

- name: Pin Mozilla Firefox over Ubuntu snap stub
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: firefox*
      Pin: origin packages.mozilla.org
      Pin-Priority: 1001
    mode: "0644"

- name: Remove snap Firefox if present
  community.general.snap:
    name: firefox
    state: absent
  failed_when: false

# --- Flush handlers to update apt cache before package installation ---
- name: Flush handlers to update apt cache
  ansible.builtin.meta: flush_handlers
