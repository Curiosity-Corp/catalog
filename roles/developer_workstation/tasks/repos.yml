---
# =============================================================================
# APT Repository Setup
# =============================================================================
# Uses shell+creates for GPG keys (idempotent, avoids deprecated apt_key)
# Uses apt_repository for source lists
# =============================================================================

# --- Remove Cloudflare APT repo before any apt cache refresh ---
# Cloudflare does not publish packages for Ubuntu 25.10 ("questing"), causing
# apt update to fail. The stale repo must be removed before the first apt
# operation to prevent the nightly ansible-pull from deadlocking.
- name: Remove stale Cloudflare APT repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
  notify: Update apt cache

# --- Retired Claude Desktop repository ---
- name: Remove retired Claude Desktop repository before any apt cache refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/claude-desktop.list
    state: absent
  notify: Update apt cache

- name: Remove retired Claude Desktop archive keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/claude-desktop-archive-keyring.gpg
    state: absent
  notify: Update apt cache

# --- GitHub CLI ---
- name: Download GitHub CLI GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/githubcli-archive-keyring.gpg

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  notify: Update apt cache

# --- VS Code (Microsoft) ---
# VS Code's own installer creates vscode.sources with a different signed-by path,
# which conflicts with our managed vscode.list. Remove it to avoid apt conflicts.
- name: Remove conflicting VS Code repo config (from VS Code installer)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.sources
    state: absent
  notify: Update apt cache

- name: Download Microsoft GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
        | gpg --dearmor -o /usr/share/keyrings/microsoft-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/microsoft-archive-keyring.gpg

- name: Add VS Code repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
    state: present
  notify: Update apt cache

# --- .NET SDK (Microsoft) ---
# Uses same GPG key as VS Code (packages.microsoft.com)
- name: Add Microsoft .NET SDK repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/ubuntu/24.04/prod {{ apt_fallback_release }} main"
    filename: microsoft-dotnet
    state: present
  notify: Update apt cache

# --- Azure CLI ---
- name: Add Microsoft Azure CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/azure-cli/ {{ apt_fallback_release }} main"
    filename: azure-cli
    state: present
  notify: Update apt cache

# --- Google Cloud CLI ---
- name: Download Google Cloud GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
        | gpg --dearmor -o /usr/share/keyrings/cloud-google-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/cloud-google-archive-keyring.gpg

- name: Add Google Cloud CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/cloud-google-archive-keyring.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
    filename: google-cloud-sdk
    state: present
  notify: Update apt cache

# --- MongoDB (mongosh) ---
- name: Discover newest MongoDB APT channel
  ansible.builtin.uri:
    url: >-
      https://s3.amazonaws.com/repo.mongodb.org?list-type=2&prefix=apt/ubuntu/dists/{{ apt_fallback_release }}/mongodb-org/&delimiter=/
    return_content: true
    timeout: 30
    status_code: 200
  register: _mongodb_repo_index
  changed_when: false
  retries: 3
  delay: 5
  until: _mongodb_repo_index.status | default(0) == 200

- name: Set newest MongoDB APT channel
  # `| last` on an empty match list returns a lazy Undefined ("No last item,
  # sequence was empty.") that blows up when set_fact finalizes this string —
  # before the "Require a MongoDB APT channel" assert below ever gets a
  # chance to run. `| default('', true)` collapses that Undefined to an empty
  # string so the assert (which already handles the empty case) is reachable
  # instead of hard-failing the whole play on every S3 listing hiccup.
  ansible.builtin.set_fact:
    latest_mongodb_channel: "{{ _mongodb_repo_index.content | regex_findall('<Prefix>apt/ubuntu/dists/' ~ apt_fallback_release ~ '/mongodb-org/([0-9]+\\.[0-9]+)/</Prefix>') | map('float') | sort | last | default('', true) }}"

- name: Set MongoDB signing-key version for the newest channel
  ansible.builtin.set_fact:
    latest_mongodb_key_version: "{{ latest_mongodb_channel.split('.')[0] }}.0"

- name: Require a MongoDB APT channel
  ansible.builtin.assert:
    that: latest_mongodb_channel | default('') | string | length > 0
    fail_msg: "MongoDB did not publish a current APT channel"

- name: Download MongoDB GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://pgp.mongodb.com/server-{{ latest_mongodb_key_version }}.asc \
        | gpg --dearmor --yes -o /usr/share/keyrings/mongodb-archive-keyring.gpg
    executable: /bin/bash
  changed_when: false

- name: Add MongoDB repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/mongodb-archive-keyring.gpg] https://repo.mongodb.org/apt/ubuntu {{ apt_fallback_release }}/mongodb-org/{{ latest_mongodb_channel }} multiverse"
    filename: mongodb-org
    state: present
  notify: Update apt cache

# --- Google Chrome ---
# Chrome's installer appends an unsigned deb line to google-chrome.list,
# causing duplicate warnings. Remove the file so apt_repository recreates
# it cleanly with only the signed entry.
- name: Remove Chrome installer repo config (conflicting unsigned entry)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/google-chrome.list
    state: absent
  notify: Update apt cache

- name: Download Google Chrome GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
        | gpg --dearmor -o /usr/share/keyrings/google-chrome-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/google-chrome-archive-keyring.gpg

- name: Add Google Chrome repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/google-chrome-archive-keyring.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present
  notify: Update apt cache

# --- 1Password CLI ---
- name: Download 1Password GPG key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://downloads.1password.com/linux/keys/1password.asc \
        | gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/1password-archive-keyring.gpg

- name: Add 1Password CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/{{ ansible_architecture | replace('x86_64', 'amd64') }} stable main"
    filename: 1password-cli
    state: present
  notify: Update apt cache

# --- Brave Browser ---
- name: Remove conflicting Brave repo config (from Brave installer)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/brave-browser-release.sources
    state: absent
  notify: Update apt cache

- name: Download Brave Browser GPG key
  ansible.builtin.get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    mode: "0644"

- name: Add Brave Browser repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
    filename: brave-browser
    state: present
  notify: Update apt cache

# --- Node.js (NodeSource) ---
- name: Download NodeSource repository key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg.key
    mode: "0644"
  register: _nodesource_key_download

- name: Verify NodeSource repository key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - /tmp/nodesource-repo.gpg.key
  register: _nodesource_key_info
  changed_when: false
  failed_when: >-
    nodesource_key_fingerprint not in (_nodesource_key_info.stdout | default(''))

- name: Install NodeSource repository keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - -o
      - /etc/apt/keyrings/nodesource.gpg
      - /tmp/nodesource-repo.gpg.key
  changed_when: _nodesource_key_download.changed
  notify: Update apt cache

- name: Add NodeSource current repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_current.x nodistro main"
    filename: nodesource
    state: present
  notify: Update apt cache

# --- OpenZiti (ziti-edge-tunnel) ---
- name: Remove pre-existing OpenZiti repo config (conflicting signed-by)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/openziti-release.list
    state: absent
  notify: Update apt cache

- name: Download OpenZiti GPG key
  ansible.builtin.get_url:
    url: https://get.openziti.io/tun/package-repos.gpg
    dest: /tmp/openziti-package-repos.gpg
    mode: "0644"
  register: _openziti_key_download

- name: Verify OpenZiti repository key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - /tmp/openziti-package-repos.gpg
  register: _openziti_key_info
  changed_when: false
  failed_when: openziti_key_fingerprint not in (_openziti_key_info.stdout | default(''))

- name: Check OpenZiti keyring presence
  ansible.builtin.stat:
    path: /usr/share/keyrings/openziti-archive-keyring.gpg
  register: _openziti_keyring

- name: Install OpenZiti repository keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /usr/share/keyrings/openziti-archive-keyring.gpg
      - /tmp/openziti-package-repos.gpg
  changed_when: _openziti_key_download.changed or not _openziti_keyring.stat.exists
  when: _openziti_key_download.changed or not _openziti_keyring.stat.exists

- name: Add OpenZiti repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/openziti-archive-keyring.gpg] https://packages.openziti.org/zitipax-openziti-deb-stable debian main"
    filename: openziti
    state: present
  notify: Update apt cache

# --- Mozilla Firefox (non-snap, required for OpenZiti tun compatibility) ---
# Snap Firefox sandbox blocks tun device traffic (ziti0), breaking access
# to all Ziti-intercepted services. The Mozilla PPA provides a native .deb.
- name: Download Mozilla APT signing key  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      wget -qO- https://packages.mozilla.org/apt/repo-signing-key.gpg \
        | tee /etc/apt/keyrings/packages.mozilla.org.asc >/dev/null
    executable: /bin/bash
    creates: /etc/apt/keyrings/packages.mozilla.org.asc

- name: Add Mozilla APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main"
    filename: mozilla
    state: present
  notify: Update apt cache

- name: Pin Mozilla Firefox over Ubuntu snap stub
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: firefox*
      Pin: origin packages.mozilla.org
      Pin-Priority: 1001
    mode: "0644"

- name: Remove snap Firefox if present
  community.general.snap:
    name: firefox
    state: absent
  failed_when: false

# --- Flush handlers to update apt cache before package installation ---
- name: Flush handlers to update apt cache
  ansible.builtin.meta: flush_handlers
