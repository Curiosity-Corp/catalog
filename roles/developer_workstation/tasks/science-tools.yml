---
# =============================================================================
# Scientific Python & Data Science Tools
# =============================================================================
# Installs the scientific stack (science_python_packages) into a dedicated
# virtual environment, science_python_venv (default /opt/science-venv), so the
# tools are available from:
# - terminal workflows (venv bin is on PATH via /etc/profile.d)
# - notebooks (JupyterLab kernel registered as "Python 3 (Science)")
#
# This avoids PEP 668 --break-system-packages, which can corrupt system Python
# and caused OOM crashes when compiling C extensions on constrained machines.
# See docs/python-research-profile.md for the variables and the small profile.
# =============================================================================

- name: Build the science venv and install the declared packages
  ansible.builtin.include_tasks:
    file: science-venv.yml

- name: Add science-venv bin to PATH for all interactive shells
  ansible.builtin.copy:
    dest: /etc/profile.d/science-venv.sh
    mode: "0644"
    content: |
      # Added by developer-workstation role — science-tools
      if [ -d {{ science_python_venv }}/bin ]; then
        export PATH="{{ science_python_venv }}/bin:$PATH"
      fi

- name: Symlink jupyter into /usr/local/bin for non-login shells
  ansible.builtin.file:
    src: "{{ science_python_venv }}/bin/jupyter"
    dest: /usr/local/bin/jupyter
    state: link
    force: true

- name: Symlink ipython into /usr/local/bin for non-login shells
  ansible.builtin.file:
    src: "{{ science_python_venv }}/bin/ipython"
    dest: /usr/local/bin/ipython
    state: link
    force: true

- name: Register venv Python as a Jupyter kernel
  ansible.builtin.command:
    argv:
      - "{{ science_python_venv }}/bin/python"
      - -m
      - ipykernel
      - install
      - --name
      - science
      - --display-name
      - Python 3 (Science)
      - --prefix
      - /usr/local
    creates: /usr/local/share/jupyter/kernels/science/kernel.json

# --- Check for outdated packages (non-blocking diagnostic) ---
- name: Show outdated pip packages in science-venv
  ansible.builtin.command:
    argv:
      - "{{ science_python_venv }}/bin/pip"
      - list
      - --outdated
      - --format=columns
  register: pip_outdated
  changed_when: false
  failed_when: false

- name: Report outdated pip packages
  ansible.builtin.debug:
    msg: |
      Outdated pip packages in {{ science_python_venv }}:
      {{ pip_outdated.stdout_lines | default([]) | join('\n') }}
  when: pip_outdated.stdout_lines | default([]) | length > 1
