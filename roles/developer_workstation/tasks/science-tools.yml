---
# =============================================================================
# Scientific Python & Data Science Tools
# =============================================================================
# Installs a broad scientific stack into a dedicated virtual environment at
# /opt/science-venv so tools are available from:
# - terminal workflows (venv bin is on PATH via /etc/profile.d)
# - notebooks (JupyterLab kernel registered as "Python 3 (Science)")
#
# This avoids PEP 668 --break-system-packages, which can corrupt system Python
# and caused OOM crashes when compiling C extensions on constrained machines.
# =============================================================================

- name: Create /opt/science-venv virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /opt/science-venv
    creates: /opt/science-venv/bin/activate

- name: Install/upgrade scientific Python packages into venv  # noqa: args package-latest
  ansible.builtin.pip:
    name:
      # --- Core data science ---
      - numpy
      - scipy
      - pandas
      - matplotlib
      - sympy
      - scikit-learn
      - seaborn
      # --- Common utilities ---
      - requests
      - httpx
      - pytest
      - boto3
      - openpyxl
      - Pillow
      # --- Jupyter interactivity ---
      - ipykernel
      - ipywidgets
      - ipympl
      - plotly
      # --- Physics simulation ---
      - vpython
      - pymunk
      - pybullet
      # --- 3D visualization ---
      - pyvista
      - trame
      - k3d
      # --- Domain-specific ---
      - h5py
      - qutip
      - astropy
    virtualenv: /opt/science-venv
    state: latest

- name: Add science-venv bin to PATH for all interactive shells
  ansible.builtin.copy:
    dest: /etc/profile.d/science-venv.sh
    mode: "0644"
    content: |
      # Added by developer-workstation role — science-tools
      if [ -d /opt/science-venv/bin ]; then
        export PATH="/opt/science-venv/bin:$PATH"
      fi

- name: Symlink jupyter into /usr/local/bin for non-login shells
  ansible.builtin.file:
    src: /opt/science-venv/bin/jupyter
    dest: /usr/local/bin/jupyter
    state: link
    force: true

- name: Symlink ipython into /usr/local/bin for non-login shells
  ansible.builtin.file:
    src: /opt/science-venv/bin/ipython
    dest: /usr/local/bin/ipython
    state: link
    force: true

- name: Register venv Python as a Jupyter kernel
  ansible.builtin.command:
    cmd: >-
      /opt/science-venv/bin/python -m ipykernel install
      --name science
      --display-name "Python 3 (Science)"
      --prefix /usr/local
    creates: /usr/local/share/jupyter/kernels/science/kernel.json

# --- Periodic upgrade of key packages ---
# Runs on every ansible-pull to keep core packages current beyond the declared
# list. This catches transitive dependencies and new additions to the
# scientific ecosystem.
- name: Upgrade all pip packages in science-venv (periodic)  # noqa: package-latest
  ansible.builtin.pip:
    name:
      # Core data-science stack — upgrade all declared packages
      - numpy
      - scipy
      - pandas
      - matplotlib
      - sympy
      - scikit-learn
      - seaborn
      - requests
      - httpx
      - pytest
      - boto3
      - Pillow
      - ipykernel
      - ipywidgets
      - ipympl
      - plotly
      - h5py
    virtualenv: /opt/science-venv
    state: latest

# --- Check for outdated packages (non-blocking diagnostic) ---
- name: Show outdated pip packages in science-venv
  ansible.builtin.command:
    cmd: /opt/science-venv/bin/pip list --outdated --format=columns
  register: pip_outdated
  changed_when: false
  failed_when: false

- name: Report outdated pip packages
  ansible.builtin.debug:
    msg: |
      Outdated pip packages in /opt/science-venv:
      {{ pip_outdated.stdout_lines | default([]) | join('\n') }}
  when: pip_outdated.stdout_lines | length > 1
