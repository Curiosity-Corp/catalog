  - "{{ npm_global_prefix }}/bin/tsx"
  - "{{ npm_global_prefix }}/bin/turbo"
  - "{{ npm_global_prefix }}/bin/eslint"
  - "{{ npm_global_prefix }}/bin/prettier"
  - "{{ npm_global_prefix }}/bin/mmdc"
  - "{{ npm_global_prefix }}/bin/playwright"
  - "{{ npm_global_prefix }}/bin/gemini"
  - "{{ npm_global_prefix }}/bin/qwen"
  - "{{ npm_global_prefix }}/bin/codewhale"
workstation_update_non_removable_paths:
  # These are package-owned files. Removing a newly-created binary on
  # rollback would leave dpkg's ownership database inconsistent.
  - /usr/bin/sunshine
  - /usr/bin/bitwarden

# Fail-closed is available as soon as the catalog signing key is provisioned.
# Current public history is not uniformly signed, so warn is the safe bootstrap
# default; set `catalog_integrity_mode: enforce` on signed installations.
catalog_integrity_mode: warn
catalog_signing_key_fingerprint: ""

# Interpreter used to rebuild pipx virtualenvs whose base Python was removed
# (distro upgrade or a home copied from another host).
pipx_repair_python: /usr/bin/python3

# npm globals are user-facing applications. They always follow the registry's
# latest dist-tag; there is deliberately no compatibility-pin mode.
npm_global_prefix: "{{ dev_user_home }}/.npm-global"
npm_global_executable: "/usr/bin/npm"
npm_global_packages:
  - npm
  - pnpm
  - yarn
  - typescript
  - ts-node
  - tsx
  - turbo
  - eslint
  - prettier
  - "@mermaid-js/mermaid-cli"
  - codewhale

# Some npm releases copy package-manager launchers into a custom global prefix
# instead of linking them. Those copies resolve their package-relative imports
# from the prefix's bin directory and fail at runtime. Recreate the canonical
# links after every package refresh so user commands resolve from their actual
# package roots.
npm_global_command_links:
  - {package: npm, command: npm, relative_path: bin/npm-cli.js}
  - {package: npm, command: npx, relative_path: bin/npx-cli.js}
  - {package: pnpm, command: pnpm, relative_path: bin/pnpm.mjs}
  - {package: pnpm, command: pnpx, relative_path: bin/pnpx.mjs}
  - {package: pnpm, command: pn, relative_path: bin/pnpm.mjs}
  - {package: pnpm, command: pnx, relative_path: bin/pnpx.mjs}

# AI coding assistants are also user-scoped and refreshed nightly. Keep the
# package list in defaults so every workstation profile gets the same policy.
# Codex and Claude Code are deliberately excluded: their official native
# installers own ~/.local/bin/codex and ~/.local/bin/claude (see
# codex_standalone_* and claude_native_* below). A nightly npm copy created a
# second command whose PATH order decided which install ran, and Claude Code
# reported the pair as a duplicate installation on every launch.
ai_assistant_packages:
  - "@google/gemini-cli"
  - "@qwen-code/qwen-code"

# npm considers an already-installed package current even when an interrupted
# image build left its global command shim absent. Keep the command contract
# explicit so the Ansible run repairs the user-facing launchers idempotently.
ai_assistant_command_links:
  - {package: "@google/gemini-cli", command: gemini, relative_path: bundle/gemini.js}
  - {package: "@qwen-code/qwen-code", command: qwen, relative_path: cli-entry.js}

# Standalone Codex CLI. The role ensures the official standalone binary is
# present at the user-scoped launcher path and migrates machines away from the
# legacy npm-managed install. A user-level auto-update timer (codex-auto-update)
# keeps the release current between ansible-pull runs.
codex_standalone_enabled: true
codex_standalone_installer_url: "https://chatgpt.com/codex/install.sh"
codex_standalone_release: latest
codex_standalone_install_dir: "{{ dev_user_home }}/.local/bin"
codex_standalone_home_dir: "{{ dev_user_home }}/.codex"

# Native Claude Code, for every dev_users account. The official installer owns
# ~/.local/bin/claude (a link into ~/.local/share/claude/versions). Every run
# removes the npm package and any other launcher, moves the native install to
# claude_native_channel ("latest" or "stable", matching Claude Code's
# autoUpdatesChannel), and fails if more than one `claude` remains on the
# user's PATH.
claude_native_enabled: true
claude_native_installer_url: "https://claude.ai/install.sh"
# Decided 2026-10-23 (decision log D910, instarlab/connections): workstations
# follow the "latest" channel under the standing rule of always running the
# latest versions. tests/test_update_policy.py fails on any other value.
claude_native_channel: latest
# Launchers left by earlier install methods, relative to each dev_users
# home: the npm global shim and the retired ~/.claude/local "local" install.
# Root-prefix npm copies are removed by node-packages.yml.
claude_retired_user_launchers:
  - .npm-global/bin/claude
  - .claude/local
claude_retired_system_launchers:
  - /usr/local/bin/claude

# Microsoft 365 CLI is kept in its own user-scoped package list (installed by
# tasks/m365-cli.yml, tag: m365) rather than folded into npm_global_packages,
# so a capability-gated consumer can opt it in on the `m365` Ansible tag
# instead of getting it unconditionally with every other npm global.
m365_cli_packages:
  - "@pnp/cli-microsoft365"

# The published tarball ships these entry points as 0644 and npm 12.2 installs
# them unchanged, so the role restores the execute bit (see m365-cli.yml).
m365_cli_command_links:
  - {package: "@pnp/cli-microsoft365", command: m365, relative_path: dist/index.js}
  - {package: "@pnp/cli-microsoft365", command: m365_comp, relative_path: dist/autocomplete.js}
  - {package: "@pnp/cli-microsoft365", command: m365_chili, relative_path: dist/chili/index.js}
  - {package: "@pnp/cli-microsoft365", command: microsoft365, relative_path: dist/index.js}

# User-scoped npm applications are refreshed before binary installers. If a
# later binary installer fails, rollback must not restore an older npm CLI over
# the successful registry refresh.
workstation_update_rollback_excluded_paths:
  - "{{ npm_global_prefix }}/bin/npm"
  - "{{ npm_global_prefix }}/bin/m365"
  - "{{ dev_user_home }}/.local/bin/codex"
  - "{{ dev_user_home }}/.local/bin/claude"
  - "{{ npm_global_prefix }}/bin/pnpm"
  - "{{ npm_global_prefix }}/bin/yarn"
  - "{{ npm_global_prefix }}/bin/tsc"
  - "{{ npm_global_prefix }}/bin/ts-node"
  - "{{ npm_global_prefix }}/bin/tsx"
  - "{{ npm_global_prefix }}/bin/turbo"
  - "{{ npm_global_prefix }}/bin/eslint"
  - "{{ npm_global_prefix }}/bin/prettier"
  - "{{ npm_global_prefix }}/bin/mmdc"
  - "{{ npm_global_prefix }}/bin/playwright"
  - "{{ npm_global_prefix }}/bin/gemini"
  - "{{ npm_global_prefix }}/bin/qwen"
  - "{{ npm_global_prefix }}/bin/codewhale"

# Optional provider configuration. The role never embeds a lab's secret-store
# name or API key lookup. Set the command in protected host/group variables if
# a local provider should be configured.
qwen_provider_enabled: false
qwen_provider_secret_command: ""
qwen_provider_base_url: "https://integrate.api.nvidia.com/v1"
qwen_provider_model: "qwen/qwen3.5-397b-a17b"

# Package-manager updates are enabled by default for every profile. This is a
# safe APT upgrade (no removals); reboot-sensitive changes remain pending until
# the user reboots.
apt_upgrade_enabled: true
# NodeSource repository trust anchor. This authenticates the repository key,
# not an application release, so it does not constrain bleeding-edge versions.
nodesource_key_fingerprint: "6F71F525282841EEDAF851B42F59B5F99B1BE0B4"
openziti_key_fingerprint: "34CBCF18427D8814B5BDBB0DDE3623EF08C996E5"
# Vendor APT signing keys are re-downloaded here on every run and installed to
# their signed-by path only when the vendor content differs (apt-keyring.yml).
apt_keyring_staging_dir: /var/lib/curiosity/apt-keyrings
# Fallback release for third-party APT repos that don't support bleeding-edge Ubuntu
# (e.g., Cloudflare, HashiCorp don't have 25.10/questing packages yet)
apt_fallback_release: "noble"
# Chezmoi dotfiles (per-user, zero-PII bootstrap)
# Set `user_dotfiles_repo` to the user's fork URL to enable; empty = skip.
# Keep private repositories and personal identity values in host/group vars,
# Ansible Vault, or another secret store; never commit them here.
#
# Values for chezmoi_user_name / chezmoi_user_email MUST be set in
# host_vars or group_vars per engineer — NEVER committed to this repo.
user_dotfiles_repo: ""
chezmoi_user_name: ""
chezmoi_user_email: ""
chezmoi_editor: ""

# ansible-pull settings
ansible_pull_repo: "https://github.com/Curiosity-Corp/catalog.git"
ansible_pull_branch: "main"
ansible_pull_playbook: "playbooks/site.yml"
ansible_pull_dir: "/opt/curiosity-catalog"
ansible_pull_extra_vars: ""
# Some managed hosts carry a reviewed local compatibility commit while the
# public catalog catches up. Those hosts may still run that known-good checkout
# when ansible-pull cannot update it; leave this disabled by default.
ansible_pull_force_on_update_failure: false
ansible_pull_verify_commit: "{{ catalog_integrity_mode == 'enforce' }}"
# Soft memory limit for ansible-pull.service. Above it the kernel reclaims the
# run's page cache (update snapshots, downloads) instead of letting it press on
# the rest of the host; there is deliberately no MemoryMax, so a run is never
# OOM-killed by its own cgroup. Any systemd size value, or "infinity".
workstation_ansible_pull_memory_high: 8G
authd_archive_distribution: "{{ ansible_distribution_release }}"
authd_archive_key_fingerprint: "155D766F2E771AED"
authd_archive_key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ authd_archive_key_fingerprint }}"
authd_archive_key_asc_path: "/etc/apt/keyrings/ubuntu-enterprise-desktop-authd.asc"
authd_archive_keyring_path: "/etc/apt/keyrings/ubuntu-enterprise-desktop-authd.gpg"
authd_archive_repo_url: "https://ppa.launchpadcontent.net/ubuntu-enterprise-desktop/authd/ubuntu"

# Log rotation hardening
logrotate_maxsize: "100M"
logrotate_rotate_count: 7
logrotate_ziti_maxsize: "50M"
rsyslog_ratelimit_interval: 5
rsyslog_ratelimit_burst: 1000

# WeeChat TUI chat client (wee-slack + wee-most plugins)
weechat_enabled: false
weechat_teams_enabled: false
weechat_teams_client_id: ""

# System tuning (swap, swappiness, earlyoom OOM protection)
system_tuning_enabled: true
swap_size_gb: 16
vm_swappiness: 10

# Entra ID SSO — SUNSET, replaced by Keycloak SSO
entra_id_enabled: false

# Keycloak SSO (authd + authd-oidc broker). Configure these in host/group
# variables for a research lab's own identity provider.
keycloak_sso_enabled: false
keycloak_host: ""
keycloak_realm: ""
keycloak_desktop_client_id: ""
keycloak_allowed_users: "ALL"

# OpenZiti ZTNA (ziti-edge-tunnel + OIDC session hooks)
ziti_enabled: false
ziti_install_script_url: "https://get.openziti.io/tun/scripts/install-ubuntu.bash"
ziti_service_name: "ziti-edge-tunnel.service"
ziti_manage_service: true
ziti_oidc_provider: ""

# Ziti-only hostnames pinned in /etc/hosts.
#
# Each name is resolved against Ziti's internal DNS at 100.64.0.2 and pinned
# to its assigned intercept IP. Names are supplied by the operator because
# private service topology is different for every lab.
#
# Override or extend in group_vars / host_vars / -e to add machine-local
# pins (e.g. lab-only services). To disable entirely on a host, set this
# to an empty list.
ziti_etc_hosts_pins: []
ziti_intercept_domains: []

# Tunnel health check (curiosity-ziti-health.service + timer, root).
#
# After a crash ziti-edge-tunnel can restart with an identity Active but not
# Loaded, which silently kills ziti0 DNS until the unit is restarted by hand.
# The timer restarts ziti_service_name when a watched identity stays
# Active-but-not-Loaded for ziti_health_check_grace seconds, or when the tunnel
# has a Loaded identity yet a probe host does not resolve. At most one restart
# per ziti_health_check_min_interval seconds. It queries only the system
# tunnel's default IPC socket and never touches a hand-started tunneler that
# uses its own IPC prefix.
ziti_health_check_enabled: true
ziti_health_check_interval: "2min"
# Identity names to watch; empty watches every identity the system tunnel reports.
ziti_health_check_identities: []
# Hostnames that must resolve while an identity is loaded; empty disables the
# probe. The public role knows no private service names, so set this per host
# (host_vars) to a name the host's identity can reach.
ziti_health_check_probe_hosts: []
ziti_health_check_grace: 60
ziti_health_check_min_interval: 600
ziti_health_check_timeout: 15
ziti_health_check_script_path: /usr/local/sbin/curiosity-ziti-health

# Optional certificates for private lab services. `src` is read from the
# Ansible controller, which is also the target when using ansible-pull.
# Example (keep the source outside this repository):
# custom_ca_certificates:
#   - name: lab-registry
#     src: /etc/ansible/private/lab-registry.crt
#     nss_name: Lab registry
custom_ca_certificates: []
custom_ca_bundle_path: /etc/ssl/certs/ca-certificates.crt

# Generic GitLab/Coder workspace settings. Point these at a lab's own service
# in host/group vars instead of baking an organization into the role.
workspace_gitlab_host: gitlab.com
workspace_gitlab_external_auth_provider: gitlab

# Display configuration (GDM auto-login, x11vnc, dconf no-lock)
# Enable on iGPU passthrough VMs that need physical display + VNC
display_config_enabled: false

# Lenovo T460 raw-console support. The status command is a harmless diagnostic
# for the two T460 hardware profiles. The horizontal fbcon mode remains
# explicitly disabled: it requires a separately built/signed kernel containing
# the experimental patch documented in the T460 image repository.
t460_console_diagnostics_enabled: true
t460_console_status_path: /usr/local/bin/curiosity-t460-console-status
t460_fbcon_horizontal_enabled: false
t460_fbcon_kernel_parameter: drm_kms_helper.fbdev_layout_horizontal=1
t460_fbcon_video_args: []
t460_fbcon_cmdline_path: /etc/curiosity/t460-fbcon-horizontal.cmdline

# Console tuning (tasks/console-tuning.yml, tags console/display). OPT-IN: off
# by default, so unrelated machines are unchanged. For Linux text consoles
# (fbcon on KMS, e.g. i915) on large/HiDPI or mixed-size displays:
#   - grow the console to the whole framebuffer (the kernel otherwise sizes it
#     to the SMALLEST active display and leaves the rest of a big monitor black);
#   - load a readable PSF bitmap font;
#   - soften the default VT text colours.
# A root-owned helper plus a systemd oneshot and udev triggers re-apply the
# settings at boot and on display hotplug. Nothing here edits GRUB, installs a
# kernel, or reboots; see docs/console-tuning.md for the documented-only
# kernel-command-line alternative. Skipped on workspace/kiosk profiles, in
# containers, and on hosts without /dev/fb0 (the helper exits 0 with a message).
# A hardware profile opts in with a `console_tuning` mapping (font, ttys,
# manage_console_setup; see the deskmeet-b760 profile); a host can still set
# console_tuning_enabled directly. Every other profile stays off.
console_tuning_enabled: "{{ ((hardware_profiles.get(hardware_profile, {})).get('console_tuning', {})) | length > 0 }}"
# Grow fb0's visible size to its virtual size (fixes the cropped console).
console_tuning_fill_framebuffer: true
# PSF font FILE NAME from /usr/share/consolefonts (with extension), or an
# absolute path. Empty leaves the console font alone. The kernel accepts only
# 256- or 512-glyph PSF fonts; the cell size changes the VT grid. Examples:
#   Uni3-Terminus20x10.psf.gz   (10x20, ships with console-setup; a good
#                                in-between size for a 55-inch 4K)
#   Uni3-Terminus16.psf.gz      (8x16)
#   spleen-12x24.psfu.gz        (needs console_tuning_extra_packages:
#                                [fonts-spleen]; also 5x8, 6x12, 8x16, 16x32, 32x64)
console_tuning_font: "{{ (hardware_profiles.get(hardware_profile, {})).get('console_tuning', {}).get('font', '') }}"
# VT palette overrides, index (0-15) -> rrggbb. Empty leaves colours alone.
# Index 7 is the default foreground and 15 bright/bold white. Example soft
# greys (quote the values): {7: "857f7a", 15: "b4afaa"}. The palette is per-VT and lost on reboot, so
# the same oneshot re-applies it.
console_tuning_palette: {}
# Virtual terminals that receive the font and palette.
console_tuning_ttys: "{{ (hardware_profiles.get(hardware_profile, {})).get('console_tuning', {}).get('ttys', [1, 2, 3, 4, 5, 6]) }}"
# Upper bound (seconds) to wait for the early firmware framebuffer to be
# replaced by the KMS driver, and a short settle delay before reading fb0.
console_tuning_wait_seconds: 15
console_tuning_settle_seconds: 2
# Also write FONT= into /etc/default/console-setup (when that file exists) so
# console-setup loads the same font; the helper still re-applies afterwards.
console_tuning_manage_console_setup: "{{ (hardware_profiles.get(hardware_profile, {})).get('console_tuning', {}).get('manage_console_setup', false) | bool }}"
# Debian/Ubuntu packages providing setfont, setupcon and the interpreter.
console_tuning_install_packages: true
console_tuning_packages:
  - kbd
  - console-setup
  - python3
# Extra packages, e.g. [fonts-spleen] for the Spleen PSF fonts.
console_tuning_extra_packages: []
# Run the helper immediately when its files change (it is otherwise run at
# boot and by udev). It defers the framebuffer step while a graphical session
# owns the active VT.
console_tuning_apply_now: true
console_tuning_script_path: /usr/local/sbin/curiosity-console-tuning
console_tuning_status_path: /usr/local/bin/curiosity-console-status
console_tuning_config_path: /etc/curiosity/console-tuning.conf

# /tmp hygiene (opt-in): declarative age-based cleanup of /tmp plus an hourly
# pressure relief for tmpfs /tmp. A drop-in in /etc/tmpfiles.d gives /tmp an
# age so the native systemd-tmpfiles-clean.timer does the daily cleaning; the
# curiosity-tmp-pressure timer runs the same cleanup early when /tmp is nearly
# full. Nothing is deleted by name pattern and live-session paths (X11, tmux,
# ssh-agent, systemd private directories, snap, AppImage mounts) are excluded.
# Skipped on workspace profiles and in containers. See docs/tmp-hygiene.md.
tmp_hygiene_enabled: false
# Delete /tmp entries not accessed or modified for this long (systemd time
# span: a number plus m, h, d or w).
tmp_hygiene_max_age: 3d
# Hourly pressure check. Set tmp_hygiene_pressure_enabled false to keep only
# the daily age-based cleanup.
tmp_hygiene_pressure_enabled: true
# Act when the filesystem holding /tmp is at or above this percentage of its
# blocks, or at or above tmp_hygiene_pressure_inode_threshold percent of its
# inodes (a tmpfs full of tiny files runs out of inodes first).
tmp_hygiene_pressure_threshold: 85
tmp_hygiene_pressure_inode_threshold: 85
# When the standard pass leaves /tmp at or above the threshold, run one more
# pass with this shorter age. Empty disables the second pass (warn only).
tmp_hygiene_pressure_age: 1d
tmp_hygiene_pressure_interval: 1h
# Paths excluded from age-based cleanup, as tmpfiles.d x/X lines (X also
# excludes the contents of a directory). The pressure pass additionally merges
# every x/X rule under /tmp shipped by installed packages at run time.
tmp_hygiene_exclusions:
  - X /tmp/.X11-unix
  - X /tmp/.ICE-unix
  - X /tmp/.XIM-unix
  - X /tmp/.font-unix
  - X /tmp/.X[0-9]*-lock
  - X /tmp/systemd-private-%b-*
  - X /tmp/tmux-*
  - X /tmp/ssh-*
  - X /tmp/snap-private-tmp
  - X /tmp/.org.chromium.*
  - X /tmp/org.chromium.*
  - X /tmp/.com.google.Chrome.*
  - X /tmp/com.google.Chrome.*
  - X /tmp/.mount_*
  - X /tmp/tsx-*
  - X /tmp/claude-*
  # ziti-edge-tunnel IPC and event sockets live here for the process lifetime.
  - X /tmp/.ziti
# Host-specific additions without replacing the list above.
tmp_hygiene_extra_exclusions: []
tmp_hygiene_tmpfiles_path: /etc/tmpfiles.d/00-curiosity-tmp.conf
tmp_hygiene_pressure_script_path: /usr/local/sbin/curiosity-tmp-pressure
tmp_hygiene_pressure_config_path: /etc/curiosity/tmp-pressure-tmpfiles.conf
# Inode cap for the tmpfs /tmp (systemd's tmp.mount defaults to nr_inodes=1m).
# `auto` is the tmpfs size (size=50% of RAM) divided by 4 KiB, that is
# ansible_memtotal_mb * 128 inodes (the kernel's own tmpfs default), rounded
# to whole k, never below the 1m default (no drop-in is installed then) and
# never above 16m. An explicit value such as 4m or 2048k overrides auto; empty
# leaves the systemd default. Applied with a drop-in derived from the unit that
# defines tmp.mount, plus a live remount. See docs/tmp-hygiene.md.
tmp_hygiene_nr_inodes: auto
tmp_hygiene_nr_inodes_dropin_path: /etc/systemd/system/tmp.mount.d/50-curiosity-inodes.conf

# Minimal desktop (Openbox + LightDM + Firefox)
# Lightweight GUI for machines that only need a browser and terminal.
# Mutually exclusive with display_config_enabled (GDM/GNOME).
minimal_desktop_enabled: false
minimal_desktop_autologin: true
minimal_desktop_firefox_tweaks: true
# Derived from the hardware profile's optional `idle_lock_minutes` (default 10).
minimal_desktop_idle_lock_minutes: "{{ (hardware_profiles.get(hardware_profile, {})).get('idle_lock_minutes', 10) | int }}"

# LightDM. The greeter is `gtk` (lightdm-gtk-greeter) or `slick`
# (slick-greeter). Graphical sessions start no earlier than
# minimal_desktop_lightdm_minimum_vt, which leaves lower VTs for text consoles
# and pinned per-user sessions. The vtswitch wrapper strips -novtswitch from
# LightDM's X server command line so Ctrl+Alt+Fn keeps switching VTs. Names in
# minimal_desktop_lightdm_remove_dropins are deleted from
# /etc/lightdm/lightdm.conf.d (file names only).
minimal_desktop_greeter: gtk
# The hardware profile's optional `greeter` (gtk or slick) wins over
# minimal_desktop_greeter, including a host-local /etc/ansible/local-vars.yml
# value: deskmeet-b760 pins `gtk` because slick-greeter's 7680x4320 background
# renders end in an Xorg SIGBUS there (catalog#122).
minimal_desktop_greeter_effective: "{{ (hardware_profiles.get(hardware_profile, {})).get('greeter', minimal_desktop_greeter) }}"
# The hardware profile's optional `xorg_accel_method` (`none` or `glamor`) sets
# the modesetting driver's AccelMethod for every X server on the machine,
# LightDM's greeter included. Empty (the default) leaves the driver's own
# choice and removes the drop-in. deskmeet-b760 sets `none`: with glamor the
# greeter's first XRender paint at 7680x4320 ends in an Xorg SIGBUS in
# ValidatePicture/CompositeRects, with either greeter (catalog#122).
minimal_desktop_xorg_accel_method: "{{ (hardware_profiles.get(hardware_profile, {})).get('xorg_accel_method', '') }}"
# The hardware profile's optional `xorg_auto_add_gpu` (true/false) sets the X
# server flag AutoAddGPU. false keeps X on the GPU that owns the boot display
# and stops it adding the iGPU as a second (PRIME) GPU. Empty (the default)
# leaves X's own behaviour and removes the drop-in (catalog#122).
minimal_desktop_xorg_auto_add_gpu: "{{ (hardware_profiles.get(hardware_profile, {})).get('xorg_auto_add_gpu', '') }}"
# The hardware profile's optional `xorg_preferred_modes` maps a connector to the
# mode X starts it in (`PreferredMode` in a Monitor section, e.g. DP-3:
# 3840x2160). Empty (the default) writes nothing and removes the drop-in.
minimal_desktop_xorg_preferred_modes: "{{ (hardware_profiles.get(hardware_profile, {})).get('xorg_preferred_modes', {}) }}"
# The hardware profile's optional `xorg_gdb_trace` (default false) starts
# LightDM's X server under a gdb sidecar that logs the faulting instructions,
# registers and stack of a crash to /var/log/lightdm/xorg-gdb.log. A diagnostic
# for catalog#122; remove the profile key once the crash is understood.
minimal_desktop_xorg_gdb_trace: "{{ (hardware_profiles.get(hardware_profile, {})).get('xorg_gdb_trace', false) | bool }}"
# Display package integrity guard (catalog#122): a timer re-checks these
# packages against dpkg's md5sums and reinstalls one whose installed files no
# longer match. On deskmeet1 (no ECC) bit flips in the page-cache copy of
# /usr/lib/xorg/Xorg crash-looped X while the disk copy stayed correct; the
# reinstall gives the next X start a fresh, clean inode. Conffiles are skipped.
minimal_desktop_integrity_enabled: true
minimal_desktop_integrity_interval: 10min
minimal_desktop_integrity_packages:
  - xserver-xorg-core
  - xserver-common
  - libpixman-1-0
  - libdrm2
  - libxfont2
  - lightdm
  - lightdm-gtk-greeter
  - slick-greeter
minimal_desktop_lightdm_minimum_vt: 8
minimal_desktop_lightdm_vtswitch_wrapper: false
minimal_desktop_lightdm_remove_dropins: []
# lightdm.service ships Restart=always with no delay, so an X server that dies
# at start (SIGBUS in the greeter's first paint, deskmeet1 2026-10-29) was
# relaunched every ~3 s: ~20 logind greeter sessions and PAM stacks a minute,
# a modeset of the real display each time, and the system bus pushed to its
# match-rule limit. The drop-in waits restart_sec between attempts and gives up
# after start_limit_burst failures inside start_limit_interval_sec; the next
# pull (`state: started`) or a reboot tries again.
minimal_desktop_lightdm_restart_sec: 10
minimal_desktop_lightdm_start_limit_interval_sec: 600
minimal_desktop_lightdm_start_limit_burst: 10

# Per-user graphical sessions pinned to a virtual terminal below
# minimal_desktop_lightdm_minimum_vt. Each item is {user, vt}. The user must be
# listed in dev_users. The VT's getty prefills the user name (the password is
# still required) and the login shell starts X on that VT.
minimal_desktop_pinned_vt_sessions: []

# Display layout helper (curiosity-display-setup). When enabled, the first
# connected output named in minimal_desktop_display_outputs (otherwise the first
# connected output) is set to its largest mode at the highest refresh rate and
# made primary. Other outputs are turned off only when a listed output matched.
minimal_desktop_display_setup_enabled: false
minimal_desktop_display_outputs: []
# minimal_desktop_display_broadcast_rgb (derived from the hardware profile
# further down) sets the output's xrandr `Broadcast RGB` property: Full,
# Limited 16:235 or Automatic; empty leaves the driver's choice.

# tint2 panel layout deployed to ~/.config/tint2/tint2rc for each dev_users
# entry: `bottom` (dark 32px bottom bar with taskbar, tray and clock) or `top`
# (36px top bar with launcher, multi-desktop taskbar, tray, PulseAudio volume
# and clock). A dev_users item may set `tint2_layout` to override this default.
minimal_desktop_tint2_layout: bottom

# XDG autostart ids (basename of /etc/xdg/autostart/<id>.desktop) that each
# dev_users entry hides with a managed ~/.config/autostart/<id>.desktop
# (Hidden=true). openbox-xdg-autostart runs every other entry, so this lists the
# applets the Openbox autostart already starts itself (nm-applet, blueman,
# pasystray, picom) and screen lockers that would compete with XScreenSaver.
# Extend it per host; the list is replaced, not merged, when overridden.
minimal_desktop_xdg_autostart_hidden:
  - nm-applet
  - blueman
  - pasystray
  - picom
  - light-locker
  - xfce4-screensaver

# Optional FocusPass-branded XScreenSaver package. The package keeps the
# role's local PAM contract; it does not connect to a network identity
# provider. Supply the artifact URL and its trusted SHA-256 in host/group
# variables when opting in. Kiosk profiles never use this integration.
focuspass_screenlock_enabled: false
focuspass_screenlock_install_url: ""
focuspass_screenlock_install_sha256: ""

# Sunshine remote streaming (Moonlight-compatible, KMS capture + VAAPI encode)
# Disabled until the operator explicitly chooses to expose a streaming
# service. Never use a shared/default password; provide credentials from Vault
# or configure Sunshine interactively.
sunshine_enabled: false
sunshine_default_user: ""
sunshine_default_pass: ""

# VS Code extensions (pre-installed baseline matching installed runtimes/tools)
# Override in extra-vars to customize per-machine
vscode_extensions:
  # Language support (matches installed runtimes)
  - ms-python.python
  - ms-python.vscode-pylance
  - golang.go
  - rust-lang.rust-analyzer
  - denoland.vscode-deno
  - ms-dotnettools.csharp
  - bmewburn.vscode-intelephense-client
  - redhat.java
  # Formatting and linting
  - esbenp.prettier-vscode
  - dbaeumer.vscode-eslint
  # Git
  - eamodio.gitlens
  # Infrastructure (matches installed CLIs)
  - hashicorp.terraform
  - ms-kubernetes-tools.vscode-kubernetes-tools
  - redhat.vscode-yaml
  - redhat.ansible
  # Editor productivity
  - editorconfig.editorconfig
  - yzhang.markdown-all-in-one
  - ms-vscode-remote.remote-ssh

# Kiosk session (byod-kiosk profile)
# Target URL for the full-screen kiosk browser session.
kiosk_target_url: "https://example.org"
# UFW firewall (default deny inbound, VNC restricted to ziti0). A hardware
# profile can turn it on with `firewall: true`.
firewall_enabled: false
# Interfaces SSH is allowed on; empty means every interface. A non-empty
# hardware profile firewall_ssh_interfaces applies when this is empty.
firewall_ssh_interfaces: []
# Also allow mosh (UDP 60000-61000) on the SSH interfaces.
firewall_mosh: false
# Links that resolve only over TLS on an untrusted LAN; empty means the
# hardware profile's dns_over_tls_interfaces. Set it per host when the Wi-Fi
# interface name differs from the profile's (PCIe slot order varies by board).
dns_over_tls_interfaces: []
# DNS-over-TLS resolvers (IP#SNI) for a hardware profile's
# dns_over_tls_interfaces on an untrusted LAN.
dns_over_tls_servers:
  - 1.1.1.1#cloudflare-dns.com
  - 1.0.0.1#cloudflare-dns.com

# Profile cleanup (Shared PC mode equivalent)
profile_cleanup_enabled: false
profile_cleanup_days: 60

# =============================================================================
# Free/Open-Source Maintenance & Security Hardening Stack
# =============================================================================
# See maintenance.yml, self-healing.yml, and the "Secure"/"Optimized" sections
# of security.yml / system-tuning.yml.

# Ubuntu Pro token — empty by default, so ESM/Livepatch attach is skipped
# entirely. Canonical's free tier covers ESM + Livepatch for up to 5 machines
# for individuals; set this in host_vars/group_vars, NEVER commit a real token.
ubuntu_pro_token: ""

# fwupd refreshes metadata weekly regardless; auto-*applying* firmware
# unattended can brick hardware, so this stays opt-in.
fwupd_auto_apply: false

# Incoming-webhook URL (Mattermost/Slack/Teams/generic) for the hourly
# systemctl --failed sweep. Empty by default — the sweep always logs to
# syslog regardless; this just adds a push alert on top. Set in
# host_vars/group_vars, never commit a real URL.
failed_sweep_webhook_url: ""

# =============================================================================
# Free Ubuntu-Pro equivalents (pro-free-mimic plane, tasks/pro-mimic.yml)
# =============================================================================
# Ubuntu 26.04 LTS carries standard support to ~2031, so a Pro subscription
# buys this fleet almost nothing today (partial Universe SLA, Livepatch
# convenience, compliance content). This plane converges the free equivalents
# instead: explicit security origins, automatic service restarts, hardened
# SSH, MOTD visibility, ESM-status reporting, GA kernel pinning, pull-status
# records, and display-manager mode control.
#
# Explicit NON-GOALS (do not add these here):
#   - No kpatch/livepatch DIY. Rebootless kernel patching without Canonical's
#     signed livepatch payloads is out of scope; pending reboots are surfaced
#     via MOTD and the pull-status record instead. The fleet never reboots
#     itself (Unattended-Upgrade::Automatic-Reboot stays "false").
#   - No CIS auto-remediation. pro_mimic_cis_remediate stays false; flipping it
#     in the future requires an explicit per-profile allowlist of rule IDs in
#     host/group vars — never a blanket --remediate run.
# No token work: ubuntu_pro_token above stays "" and its existing attach gate
# in maintenance.yml is untouched.
pro_mimic_needrestart_auto: true
# Perl regex sources (without delimiters) for services needrestart must never
# restart automatically, e.g. ['^docker$', '^libvirtd$']. Empty by default.
pro_mimic_needrestart_blacklist: []
# SSH stays hardened by default. Set true ONLY on hosts where an operator has
# explicitly accepted password authentication (the drop-in is then removed).
pro_mimic_ssh_password_auth: false
# CIS content remains scan/report-only (see security.yml). Documented
# allowlist approach only — see NON-GOALS above.
pro_mimic_cis_remediate: false
# Display-manager mode: always (leave the display stack alone), ondemand
# (disable lightdm + multi-user.target so the GUI starts only on request), or
# disabled (mask lightdm + multi-user.target). Fleet T460 laptops run
# ondemand via /etc/ansible/local-vars.yml to match their hand-applied
# posture; the public default stays always (no behavior change).
display_manager_mode: always
# MOTD news stays off by default (phoning home to Canonical's news feed on
# every login is not fleet behavior). Set true to re-enable motd-news.
pro_mimic_motd_news_enabled: false

# =============================================================================
# Hardware Profiles
# =============================================================================
# Select via: -e hardware_profile=z590
# Each profile defines packages and config specific to that hardware class.
# Optional keys (all default to empty when absent): services, pipx_packages,
# udev_rules ({name, content} -> /etc/udev/rules.d/<name>.rules; keep names
# numbered 70 or lower so uaccess ACLs apply before 73-seat-late),
# modprobe_options ({name, content} -> /etc/modprobe.d/<name>.conf) and
# kernel_modules (loaded now and at boot via /etc/modules-load.d), and
# litra_cli (boolean, default false: install the Litra CLI to
# /usr/local/bin/litra via the latest-release contract; see litra_cli_enabled),
# i915_pcon_frl_444 (boolean, default false: build the patched i915 that keeps
# RGB 4:4:4 behind a DP -> HDMI 2.1 PCON; see i915_pcon_frl_444_enabled),
# console_video (string, default unset: `<connector>:<W>x<H>@<Hz>` appended to
# the kernel command line as video=...; see console_video and
# tasks/console-video.yml), console_tuning (mapping, default unset: font, ttys
# and manage_console_setup for the opt-in console tuning task group),
# display_scale (number from 1 to 4 in steps of 0.25, default 1: desktop scale
# for a high-DPI display; see minimal_desktop_display_scale) and broadcast_rgb
# (Full, Limited 16:235 or Automatic, default unset: the output's xrandr
# `Broadcast RGB` property; see minimal_desktop_display_broadcast_rgb),
# display_outputs (list of xrandr output names, default empty: tried before the
# host's own list; see minimal_desktop_display_outputs_preferred),
# logitech_g604 (boolean, default false: install the Logitech G604 button
# profile; see logitech_g604_enabled) and double_click_ms (integer, default
# 500: Openbox and GTK double-click interval; see minimal_desktop_double_click_ms)
# and samsung_tv_cli (boolean, default false: install the curiosity-tv Samsung
# TV remote-control CLI; see samsung_tv_cli_enabled)
# and idle_lock_minutes (integer, default 10: XScreenSaver blank/lock timeout),
# compositor_enabled (boolean, default true: false keeps picom from starting in
# the Openbox session; see minimal_desktop_compositor_enabled) and
# pointer_accel_speed (number from -1 to 1, default unset: libinput `Accel Speed`
# applied to the Logitech G604; see logitech_g604_accel_speed).
# =============================================================================
hardware_profile: generic

# =============================================================================
# hhtest: unprivileged test-bed account (tasks/hhtest.yml, docs/hhtest.md)
# =============================================================================
# A dedicated, resource-capped account for running a project's local test
# suites on a production host without any chance of touching the real users'
# sessions: its own uid (own /tmp/tmux-<uid>, own `systemd --user`, no signal
# rights over other users' processes), no sudo and no privileged groups.
# Opt-in per machine through the hardware profile's `hhtest_host` key, the
# hostname the account may be created on. The task file also checks the live
# hostname, so selecting the profile on another machine does nothing.
hhtest_required_hostname: "{{ (hardware_profiles.get(hardware_profile, {})).get('hhtest_host', '') }}"
hhtest_enabled: "{{ hhtest_required_hostname | length > 0 }}"
hhtest_user: hhtest
# Fixed uid so the user-<uid>.slice drop-in can be written before the account
# has ever logged in. Must be unused; the task asserts that.
hhtest_uid: 1500
hhtest_home: /home/hhtest
# Public SSH keys (full authorized_keys lines) allowed to log in. Public keys
# only; never private keys. Profiles may set `hhtest_authorized_keys`.
hhtest_authorized_keys: "{{ (hardware_profiles.get(hardware_profile, {})).get('hhtest_authorized_keys', []) }}"
# user-<uid>.slice resource caps, so a runaway test shard cannot pressure the
# production sessions that share the machine.
hhtest_memory_max: 16G
hhtest_memory_high: 14G
hhtest_cpu_quota: 1200%
hhtest_tasks_max: 4096
# Nightly cleanup: files under ~/work and /tmp owned by the account and older
# than this many days are removed by a timer that runs AS the account.
hhtest_cleanup_age_days: 3
# tmux is built from the pinned upstream release into hhtest_tools_dir so the
# distribution tmux (and every other user's tmux) is never replaced.
hhtest_tools_dir: /opt/hhtest
# Deliberate pin (not an application default): the test bed must run the same
# tmux as the fleet it protects (3.7b), so a test result is comparable.
hhtest_tmux_release: 3.7b
hhtest_tmux_sha256: 87f2e99e3b685973f2ca002ffd6ed7e51a5744f7009daae5a15670b6d532db96
# Playwright browsers live where the CI image keeps them.
hhtest_playwright_browsers_path: "{{ hhtest_home }}/.cache/ms-playwright"

# Logitech Litra CLI (timrogers/litra-rs, installed to /usr/local/bin/litra).
# Derived from the selected hardware profile's optional `litra_cli` flag, so
# only profiles that opt in (and hosts that override this variable) download or
# install it. Referenced by the litra contract's `enabled_when`.
litra_cli_enabled: "{{ (hardware_profiles.get(hardware_profile, {})).get('litra_cli', false) | bool }}"

# Logitech G604 button profile (tasks/logitech-g604.yml). Derived from the
# selected hardware profile's optional `logitech_g604` flag. The mapping is
# applied by /usr/local/bin/curiosity-g604, which detects the mouse at run
# time and only binds the buttons while a G604 is attached. Copy/paste buttons
# are X button numbers: 6/7 are the wheel tilt left/right. Copy and paste use
# Ctrl+Insert / Shift+Insert so they also work in terminals. The thumb buttons
# 1-3 on the top of the side are key presses (keycodes 10, 11, 12) from the
# mouse's own keyboard device; the lightbar runs on thumb button 3 (keycode 12).
logitech_g604_enabled: "{{ (hardware_profiles.get(hardware_profile, {})).get('logitech_g604', false) | bool }}"
logitech_g604_copy_button: 6
logitech_g604_paste_button: 7
logitech_g604_lightbar_keycode: 12
# The two buttons on top by the left click (DPI up/down in the stock profile)
# are reassigned in the mouse's onboard profile to F13/F14 (X keycodes 191/192)
# and rotate through the Openbox desktops (curiosity-desktop prev/next).
logitech_g604_desktop_prev_keycode: 191
logitech_g604_desktop_next_keycode: 192
# Browser back/forward on two thumb buttons: thumb button 1 (keycode 10) is
# forward; the lower thumb button the onboard profile sets to KEY_6 (keycode 15)
# is back. Both send Alt+Left / Alt+Right.
logitech_g604_back_keycode: 15
logitech_g604_forward_keycode: 10
# Lower right thumb button (onboard KEY_4, keycode 13): toggle the microphone.
# The button that sends KEY_5 (keycode 14): snap the focused window to the
# middle `browser` zone and, pressed again, put it back where it was.
# Write the button macros (F13/F14/KEY_4/KEY_5/KEY_6) into the mouse. Set
# false on a host without an X11 Openbox session (e.g. GNOME on Wayland),
# where the launcher cannot consume them and the thumb buttons would type
# digits; the pointer speed below still applies.
logitech_g604_onboard_buttons: true
# Pointer speed of the mouse, one of its onboard resolutions (400, 800, 1600, 3200).
logitech_g604_dpi: 3200
logitech_g604_mic_keycode: 13
logitech_g604_zone_keycode: 14
# Thumb button 2 (keycode 11): interactive screenshot with flameshot.
logitech_g604_screenshot_keycode: 11
logitech_g604_screenshot_command: flameshot gui
logitech_g604_lightbar_command: litra toggle

# Samsung TV remote-control CLI (tasks/samsung-tv-cli.yml). Derived from the
# selected hardware profile's optional `samsung_tv_cli` flag. Installs
# /usr/local/bin/curiosity-tv, which drives the TV the workstation uses as its
# monitor (REST, WebSocket remote, UPnP, Wake-on-LAN). The TV's address and MAC
# are the defaults baked into the tool; CURIOSITY_TV_HOST / CURIOSITY_TV_MAC
# override them per user. The pairing token is never stored by the role: it
# comes from $CURIOSITY_TV_TOKEN, the user's 0600 cache or Azure Key Vault.
samsung_tv_cli_enabled: "{{ (hardware_profiles.get(hardware_profile, {})).get('samsung_tv_cli', false) | bool }}"
# Azure Key Vault holding the TV pairing token (the secret's value is never in
# this repository). Set samsung_tv_key_vault in the inventory; when non-empty
# the role renders /etc/curiosity/samsung-tv.env so `curiosity-tv` can fetch the
# token with `az` when it has no cached copy.
samsung_tv_key_vault: ""
samsung_tv_key_vault_secret: deskmeet-samsung-tv-ws-token

# Double-click interval in milliseconds for Openbox (rc.xml) and GTK apps.
# Derived from the hardware profile's optional `double_click_ms`; a shorter
# interval makes a double-click more deliberate (DeskMeet1's G604 chatters).
minimal_desktop_double_click_ms: "{{ (hardware_profiles.get(hardware_profile, {})).get('double_click_ms', 500) | int }}"

# Patched i915 module (RGB 4:4:4 over a DP -> HDMI 2.1 PCON), rebuilt for every
# installed kernel by tasks/i915-pcon-frl-444.yml. Derived from the selected
# hardware profile's optional `i915_pcon_frl_444` flag; only deskmeet-b760 opts
# in. A reboot activates a newly built module; the role never reloads i915.
i915_pcon_frl_444_enabled: "{{ (hardware_profiles.get(hardware_profile, {})).get('i915_pcon_frl_444', false) | bool }}"

# Kernel video= argument that makes every VT (fbcon, boot console, X) come up at
# the display's own EDID/CTA mode so switching VTs causes no modeset. Derived
# from the hardware profile's optional `console_video`; empty (the default)
# installs nothing and removes a previously installed drop-in. Format
# `<connector>:<W>x<H>@<Hz>`, validated by tasks/console-video.yml. Only EDID
# modes: never reduced blanking or custom timings (the 8K TV rejects them).
console_video: "{{ (hardware_profiles.get(hardware_profile, {})).get('console_video', '') }}"
console_video_dropin_path: /etc/default/grub.d/92-curiosity-console-video.cfg

# Whether the Openbox session starts the picom compositor, from the hardware
# profile's optional `compositor_enabled` (default true, so every other machine
# is unchanged). false makes tasks/minimal-desktop-picom.yml leave the marker
# ~/.config/picom/compositor-disabled, which the Openbox autostart checks before
# launching picom, so the session runs uncomposited (no picom process at all).
minimal_desktop_compositor_enabled: "{{ (hardware_profiles.get(hardware_profile, {})).get('compositor_enabled', true) | bool }}"

# libinput pointer speed (`Accel Speed`, -1 to 1) for the Logitech G604, from the
# hardware profile's optional `pointer_accel_speed`. Empty (profile key unset)
# leaves the device alone. curiosity-g604 applies it with xinput each time the
# mouse appears on the X display (requires logitech_g604_enabled).
logitech_g604_accel_speed: "{{ (hardware_profiles.get(hardware_profile, {})).get('pointer_accel_speed', '') }}"

# Desktop scale of the minimal desktop, from the hardware profile's
# `display_scale`: a number from 1 to 4 in steps of 0.25 (1, 1.25, 1.5, ...),
# validated by tasks/minimal-desktop-display-scale.yml. 1 leaves every user's X
# resources and tint2 panel alone. Above 1 the role renders ~/.Xresources with
# Xft.dpi = 96 x scale and Xcursor.size = 24 x scale (whole numbers at every
# 0.25 step) and multiplies the tint2 panel height and launcher icon size by the
# scale, rounded to whole pixels: 2 gives Xft.dpi 192, Xcursor.size 48 and a
# 72px top bar with 50px icons; 2.25 gives 216, 54, 81px and 56px.
minimal_desktop_display_scale: "{{ (hardware_profiles.get(hardware_profile, {})).get('display_scale', 1) }}"

# xrandr `Broadcast RGB` value that curiosity-display-setup applies to its
# output when the output has that property (Intel i915). Empty leaves the
# driver's automatic choice, which is limited range for HDMI/CEA modes. Derived
# from the hardware profile's `broadcast_rgb`.
minimal_desktop_display_broadcast_rgb: "{{ (hardware_profiles.get(hardware_profile, {})).get('broadcast_rgb', '') }}"

# xrandr output names the hardware itself prefers, from the hardware profile's
# `display_outputs` (default empty). They are written to
# /etc/curiosity/display-outputs ahead of minimal_desktop_display_outputs (host
# or local vars), which keep their own order after them, so a profile can make
# one connector win on that hardware without touching other hosts' lists.
minimal_desktop_display_outputs_preferred: "{{ (hardware_profiles.get(hardware_profile, {})).get('display_outputs', []) }}"

# curiosity-display-guard (derived from the hardware profile's `display_guard`
# mapping: output, mode, rate and optional lane_count and tv_host). Empty (the
# default) installs nothing. When set, /etc/curiosity/display-guard.conf pins
# that output to exactly that mode: curiosity-display-setup never applies a
# lower one, and the guard (udev hotplug, resume hook, wake detector and
# watchdog) re-applies it after TV standby/wake, suspend, DPMS, link loss and
# VT switches. Needs minimal_desktop_display_setup_enabled.
minimal_desktop_display_guard: "{{ (hardware_profiles.get(hardware_profile, {})).get('display_guard', {}) }}"
minimal_desktop_display_guard_enabled: "{{ (minimal_desktop_display_setup_enabled | bool) and (minimal_desktop_display_guard | length > 0) }}"

# StreamStack call/stream studio (tasks/streamstack.yml, docs/streamstack.md).
# Derived from the selected hardware profile's optional `streamstack` flag; set
# `streamstack_enabled: true` in /etc/ansible/local-vars.yml on any desktop that
# runs Teams/Zoom calls or streams with a DSLR, capture card or USB microphone.
# Installs the vendored StreamStack release (its own native video engine, which
# grades the camera on the GPU and writes the "StreamStack Camera" loopback
# node, and its PipeWire voice chain "StreamStack Mic"), the camera and audio
# tools, creates two exclusive_caps loopback cameras (the camera bridge and the
# program camera), and runs the Console headless at login for the call users.
# OBS Studio and Easy Effects are not used by StreamStack any more and the role
# removes them. Per-user defaults are seeded once and never overwritten.
streamstack_enabled: "{{ (hardware_profiles.get(hardware_profile, {})).get('streamstack', false) | bool }}"
streamstack_camera_video_nr: 42
streamstack_camera_label: Canon EOS 50D
# Adopt a camera node another tool on the host already owns and feeds (its own
# v4l2loopback options and service): set streamstack_camera_video_nr/_label to
# that node. StreamStack then writes no module options, runs no bridge, and only
# adds its program node next to it at run time and at boot.
streamstack_camera_external: false
streamstack_program_video_nr: 43
streamstack_program_label: StreamStack Camera
# Program camera size and rate (the native engine's canvas) and Canon bridge frame. Teams sends at most 1080p30 and
# Zoom at most 1080p30 (HD on), so higher rates only cost CPU.
streamstack_width: 1920
streamstack_height: 1080
streamstack_fps: 30
# gphoto2: Canon live view through `gphoto2 --capture-movie | ffmpeg` (works for
# EOS bodies gphoto2 supports). command: run streamstack_canon_bridge_command
# instead, with STREAMSTACK_CAMERA_DEVICE set (for example a PTP tool with
# exposure control). none: no bridge (HDMI cameras through the Cam Link only).
streamstack_canon_bridge: gphoto2
streamstack_canon_bridge_command: ""
# Start the Canon bridge at login. Off by default: `streamstack studio` starts
# it on demand, so an unplugged camera never leaves a restarting unit behind.
streamstack_canon_bridge_autostart: false
# Run the StreamStack Console headless (`streamstack console --no-window`) in
# the graphical session of these accounts. The Console hosts the native video
# engine (the only writer of the program camera /dev/video43) and starts the
# voice chain "StreamStack Mic", so calls have both without anyone opening a
# window; opening the Console later attaches to the same process. Only one
# account at a time may feed the camera: list the person who sits at the studio,
# not every call user. Empty runs no Console at login (`streamstack console`
# on demand).
streamstack_console_users:
  - mrh
streamstack_voice_preset: StreamStack Voice
# Part of the call microphone's PipeWire name or description (auto mode levels
# it, mic-check records it). Empty picks an Elgato Wave, then the default input;
# a configured microphone that is unplugged is never replaced by a guess.
streamstack_microphone: ""
# Auto mode (`streamstack auto on|off`, or the panel menu): local loops keep
# exposure and microphone gain right every streamstack_auto_interval seconds,
# and every streamstack_auto_ai_interval seconds one camera still (never audio)
# and the measured statistics go to Claude, whose bounded changes (contrast,
# saturation, warmth, LUT, sharpening, voice preset) are ramped in. Backends:
# claude-cli (the signed-in Claude Code CLI, i.e. the user's subscription),
# api (ANTHROPIC_API_KEY from ~/.config/streamstack/auto.env) or local.
streamstack_auto_backend: claude-cli
streamstack_auto_model: ""
streamstack_auto_interval: 15
streamstack_auto_ai_interval: 300
streamstack_auto_video: true
streamstack_auto_audio: true
streamstack_auto_notify: true
streamstack_auto_autostart: false
# Camera follow and the daylight schedule for Litra lights (StreamStack
# docs/lighting.md): the lights come on while any app uses the camera and go
# off after the grace period. Started at login for every desktop user; only
# the person at the active seat can reach the light (uaccess on its hidraw
# node), so users on other VTs never fight over it. Settings stay per user in
# ~/.config/streamstack/lighting-automation.json.
streamstack_lights_autostart: true
# Where this property is, for the daylight light schedule and the AI Director's
# time-of-day moods (sunrise and sunset are computed offline from these). Set
# per host (host_vars or a host-local override): these desktops keep their
# clock on UTC, so leaving them empty schedules the lights for Greenwich.
# Latitude and longitude are decimal degrees (north and east positive), set
# together or not at all; each person can still override them on the
# Console's Auto page.
streamstack_property: ""
streamstack_latitude: ""
streamstack_longitude: ""
# The StreamStack menu (start/stop the studio, voice presets, every camera and
# mode to preview, mic check, the doctor) is always in the application menu as
# `streamstack-tray --menu`, for a panel button or hotkey. This also starts it
# as a system tray icon at login; off by default because some tint2 builds
# crash when a GTK status icon docks.
streamstack_tray_autostart: false
# USB vendor:product ids that get the /dev/streamstack/camlink symlink.
# Accounts that take calls on the studio host. They join the `video` group so
# apps can open /dev/video43 "StreamStack Camera" and the Cam Link even without
# a logind seat (remote or headless sessions get no uaccess ACL). Names without
# an account on the host are skipped, never created. Takes effect at the user's
# next login.
streamstack_video_group_users:
  - mrh
  - seantech
streamstack_camlink_usb_ids:
  - "0fd9:0066"  # Elgato Cam Link 4K
# Low-latency audio/video tuning and current Intel media drivers
# (tasks/streamstack-low-latency.yml, docs/streamstack.md "Low latency"). Runs
# on StreamStack hosts only and is hardware-gated: every rule matches by USB
# id or PipeWire node name, so a property with a Scarlett 2i2 instead of the
# Wave XLR (or without an Intel GPU) simply gets the rules that apply to it.
streamstack_low_latency: true
# PipeWire graph clock. 48 kHz is what every StreamStack device runs natively
# (no resampling). Quantum 256 = 5.3 ms per graph cycle, down from 21 ms: USB
# audio moves in 1 ms (full-speed) or 125 us (high-speed) packets and the
# two-period ALSA buffer needs a few packets of slack to stay free of xruns,
# while the voice chain's RNNoise works on 10 ms (480 sample) frames and adds its
# own buffering below that size whatever the quantum. 128 (2.7 ms) stays
# allowed for a client that asks (PIPEWIRE_QUANTUM=128/48000); the maximum
# drops from 2048 to 1024 so one greedy client cannot pull the whole graph
# back to 43 ms.
streamstack_audio_rate: 48000
streamstack_audio_quantum: 256
streamstack_audio_min_quantum: 128
streamstack_audio_max_quantum: 1024
# WirePlumber ALSA rules for the audio interface (anchored regexes on the
# PipeWire node name). Idle interfaces are never suspended (suspending a USB
# interface mid-call is audible as a dropout while it wakes), and the ALSA
# period/headroom are pinned in frames. Write a literal dot as `[.]`, never
# `\\.`: the patterns are rendered into a WirePlumber SPA-JSON string, where a
# backslash escape is a parse error that makes WirePlumber drop the whole file
# (incident 2026-10-27). tests/test_streamstack_low_latency.py rejects it.
streamstack_audio_node_patterns:
  - "alsa_(input|output)[.]usb-Focusrite_.*"
  - "alsa_(input|output)[.]usb-Elgato_Systems_Elgato_Wave_XLR.*"
# One WirePlumber per studio card. Every logged-in user runs their own
# PipeWire + WirePlumber, and two of them probing the same USB audio card at the
# same time makes the ACP duplex probe fail: the Wave XLR then comes up with
# output profiles only and the call has no microphone (dm313red, 2026-10-27).
# WirePlumber 0.5 has no seat/logind switch for the ALSA monitor (only bluez has
# one), so the role installs ~/.config/wireplumber/wireplumber.conf.d/
# 50-curiosity-streamstack-exclusive-audio.conf for every dev_users account that
# is NOT in streamstack_audio_owner_users; it sets `device.disabled = true` on
# the cards matched by streamstack_audio_card_patterns (anchored regexes on the
# PipeWire device name, `[.]` for a dot). Takes effect at that user's next
# WirePlumber start (next login). Nothing is applied when no owner exists on the
# host, so an unexpected owner name can never silence every user. false removes
# the drop-ins again.
streamstack_audio_exclusive: true
streamstack_audio_owner_users:
  - mrh
streamstack_audio_card_patterns:
  - "alsa_card[.]usb-Focusrite_.*"
  - "alsa_card[.]usb-Elgato_.*"
streamstack_audio_period_size: 128
streamstack_audio_headroom: 64
# Restart policy drop-in for a user's canonctl-ptp-webcam.service (the Canon
# PTP bridge from the canonctl repo), written only for users who have that unit:
# no start limit, exponential backoff capped at 60 s. Without it three boot-time
# failures inside 120 s left the bridge dead for 2.5 days (2026-10-24).
streamstack_canonctl_webcam_unit: canonctl-ptp-webcam.service
streamstack_canonctl_webcam_resilience: true
# Realtime scheduling for the audio group (PipeWire's own @pipewire group is
# already covered by the pipewire package's limits.d file).
streamstack_realtime_group: audio
streamstack_realtime_rtprio: 95
# USB devices that never autosuspend. "vendor:product", product may be "*".
streamstack_usb_no_autosuspend_ids:
  - "1235:*"       # Focusrite (Scarlett, Clarett)
  - "0fd9:007d"    # Elgato Wave XLR
  - "0fd9:0066"    # Elgato Cam Link 4K
  - "04a9:*"       # Canon cameras
# Intel media stack. latest follows the Ubuntu archive; present never upgrades.
streamstack_media_package_state: latest
# The -non-free iHD build adds HEVC encode and VC-1 decode; it replaces the
# free build, needs multiverse, and changes nothing for H.264/AV1 calls.
streamstack_intel_media_non_free: false
streamstack_intel_media_packages:
  - linux-firmware
  - libvpl2
  - libmfx-gen1.2
  - vainfo
  - intel-gpu-tools
  - intel-opencl-icd
  - libze-intel-gpu1
# Extra kernel command-line arguments appended through
# /etc/default/grub.d/93-curiosity-streamstack.cfg (empty: no drop-in). The
# stock Ubuntu kernel is PREEMPT_DYNAMIC with PREEMPT_LAZY, HZ=1000 and
# NO_HZ_FULL, which is already low-latency; opt in with for example
# ["threadirqs", "preempt=full"] and reboot.
streamstack_kernel_args: []
# StreamStack AI dependencies (tasks/streamstack-framing.yml and
# tasks/streamstack-deepfilter.yml). Each group is optional and degrades by
# itself: without the framing packages the Console shows Auto-framing disabled,
# without the DeepFilterNet plugin the voice chain falls back to RNNoise or no
# neural denoise. Background blur runs inside the native engine on the Intel
# Arc through OpenVINO (the framing group installs it); nothing is restarted.
streamstack_framing_enabled: true
streamstack_deepfilter_enabled: true

# DeepFilterNet LADSPA plugin (Rikorose/DeepFilterNet, MIT or Apache-2.0, at
# your option): the library StreamStack's voice chain loads for its neural
# denoise stage (docs/voice-denoise.md upstream; catalog#102). The
# release's x86_64 glibc build is a single ELF shared object (exports
# ladspa_descriptor), pinned by version and sha256 (checked by downloading the
# asset). The install never replaces a newer or unrecorded library. Variables
# are named *_release because the update policy reserves *_version. Bump
# release, URL and checksum together.
streamstack_deepfilter_release: "0.5.6"
streamstack_deepfilter_sha256: "2ca3205c2911d389604a826a240e745597d50252b5cab81c8248252b335e2236"
streamstack_deepfilter_url: >-
  https://github.com/Rikorose/DeepFilterNet/releases/download/v{{ streamstack_deepfilter_release }}/libdeep_filter_ladspa-{{ streamstack_deepfilter_release }}-x86_64-unknown-linux-gnu.so
streamstack_deepfilter_dest: /usr/local/lib/ladspa/libdeep_filter_ladspa.so
streamstack_deepfilter_marker: /usr/local/share/streamstack/libdeep_filter_ladspa.release

# Auto-framing (StreamStack docs/auto-framing.md). The `streamstack` launcher
# runs /usr/bin/python3 -I and only adds /usr/local/lib/streamstack to
# sys.path, so OpenVINO (no Ubuntu 26.04 package; PEP 668 blocks system pip)
# is installed from pinned, checksummed wheels with `pip --target` into that
# directory, which a StreamStack upgrade never wipes. The wheel is tied to the
# system Python (cp314 on Ubuntu 26.04); another interpreter skips the install
# and StreamStack falls back to OpenCV's DNN on the CPU.
streamstack_framing_packages:
  - python3-pip
  - python3-numpy
  - python3-opencv
  - python3-packaging
streamstack_openvino_release: "2026.4.1"
streamstack_openvino_python_tag: cp314
streamstack_openvino_wheel: "openvino-2026.4.1-22982-cp314-cp314-manylinux_2_28_x86_64.whl"
streamstack_openvino_wheel_url: >-
  https://files.pythonhosted.org/packages/77/cf/830aff97404d73b8ada3ba3f02a626089a384299322cb94b52c37eaebd18/openvino-2026.4.1-22982-cp314-cp314-manylinux_2_28_x86_64.whl
streamstack_openvino_wheel_sha256: "3631dd889dccf3d5087775948590a6609a662f90c24a9cf85bb4dfa0cdd7fd2f"
# OpenVINO imports openvino-telemetry; the pure-Python wheel is pinned too.
streamstack_openvino_telemetry_release: "2025.2.0"
streamstack_openvino_telemetry_wheel: "openvino_telemetry-2025.2.0-py3-none-any.whl"
streamstack_openvino_telemetry_wheel_url: >-
  https://files.pythonhosted.org/packages/3b/ac/5ab0ca0aa269ad3c73f7bfc3801b10e5f56f75a31bf68c1ae8bd51cf70a4/openvino_telemetry-2025.2.0-py3-none-any.whl
streamstack_openvino_telemetry_wheel_sha256: "bcb667e83a44f202ecf4cfa49281715c6d7e21499daec04ff853b7f964833599"
streamstack_openvino_target: /usr/local/lib/streamstack
# Intel GPU compute runtime (OpenCL / Level Zero) so OpenVINO lists GPU.0.
# Installed only when an Intel GPU is present; hosts without one run on the CPU.
streamstack_compute_runtime_packages:
  - intel-opencl-icd
  - libze-intel-gpu1
  - libze1
  - libigdgmm12
  - ocl-icd-libopencl1
# YuNet face model (OpenCV Zoo, MIT), pinned to the commit and checksum that
# StreamStack's own `streamstack framing --fetch` verifies. The role places it
# where StreamStack looks (~/.local/share/streamstack/models) for each user in
# dev_users, so it works with any StreamStack release.
streamstack_framing_model_file: face_detection_yunet_2023mar.onnx
streamstack_framing_model_url: >-
  https://github.com/opencv/opencv_zoo/raw/f12e12798e8314f7c074a6656816c048dcc95b7a/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
streamstack_framing_model_sha256: "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
streamstack_packages:
  # ZamGate, ZamDynamicEQ, ZamComp and ZaMaximX2: the gate, de-esser, compressor
  # and limiter of StreamStack's voice chain (docs/audio-chain.md upstream).
  - zam-plugins
  - qpwgraph
  - pavucontrol
  - pulseaudio-utils
  - v4l-utils
  - qv4l2
  - guvcview
  - v4l2loopback-utils
  - gphoto2
  - ffmpeg
  - python3-gi
  - gir1.2-gtk-3.0
  - gir1.2-ayatanaappindicator3-0.1
  - libnotify-bin
# What StreamStack used before its native engine and voice chain, removed from
# every StreamStack host (packages only; users' own OBS and Easy Effects
# settings stay in their homes). obs-backgroundremoval was a plugin of OBS.
streamstack_retired_packages:
  - obs-studio
  - easyeffects
  - obs-backgroundremoval

hardware_profiles:
  generic:
    description: "Generic developer workstation (no hardware-specific drivers)"
    packages: []
    services: []
    pia_vpn: false

  arm-thin-client:
    description: "ARM thin client"
    packages: []
    services: []
    pia_vpn: false

  x86-byod-laptop:
    description: "x86_64 BYOD laptop (Lenovo T460 and similar)"
    packages:
      # ThinkPad power management and fan control
      - acpi
      - acpid
      - tlp
      - tlp-rdw
      # Intel graphics firmware and video acceleration
      - intel-media-va-driver
      - i965-va-driver
      # Suspend/resume reliability
      - pm-utils
    # Keep admin laptops available for remote work and never enter a sleep or
    # hibernate state.  AC uses the performance CPU policy; battery remains
    # performance-balanced so the machine stays usable away from the charger.
    disable_sleep: true
    performance_mode: true
    services:
      - acpid
      - tlp
    pia_vpn: false
    console_diagnostics: true

  z590:
    description: "ASUS TUF Gaming Z590 — iGPU passthrough VM host"
    packages:
      # Logitech device management (Unifying/Bolt/Lightspeed receivers)
      - solaar
      # Bluetooth stack
      - bluez
      - bluez-tools
      # Intel iGPU video acceleration
      - intel-media-va-driver
      - intel-gpu-tools
      # Firmware blobs (Intel BT/WiFi, GPU, etc.)
      - linux-firmware
      # Elgato Stream Deck HID access
      - libhidapi-libusb0
      # Focusrite Scarlett 2i2 mixer/routing control (equivalent to Focusrite Control)
      - alsa-scarlett-gui
      # Canon camera tethered shooting and file transfer
      - gphoto2
      # Network diagnostics for Realtek USB 2.5G LAN driver verification
      - ethtool
    services:
      - bluetooth
    # pipx packages (installed as user)
    pipx_packages:
      - streamdeck-linux-gui
    # udev rules for hardware access
    udev_rules:
      - name: 70-streamdeck
        content: |
          # Elgato Stream Deck — allow non-root access
          SUBSYSTEM=="usb", ATTRS{idVendor}=="0fd9", TAG+="uaccess"
      - name: 50-usb-realtek-net
        content: |
          # Force r8152 driver for Realtek RTL8156 2.5GbE USB adapters
          # Prevents cdc_ncm from binding (causes ~750Mbps cap and high latency)
          ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="0b05", ATTR{idProduct}=="1976", RUN+="/sbin/modprobe r8152"
    # Private Internet Access VPN
    pia_vpn: true

  deskmeet-b760:
    description: "ASRock DeskMeet B760 — Intel Arc A380 + desk USB hub peripherals"
    # Unprivileged, resource-capped test-bed account for local test suites (see
    # the hhtest_* variables). Only converges on this hostname.
    hhtest_host: deskmeet1
    hhtest_authorized_keys:
      # Operator agent key (public half only).
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJKeZmld6PEcb2qywt5Q7/4iwNTgfNhwn2Rthznfoj8O mrh@mrh-ThinkPad-T560"
    # Sits on a shared-house Wi-Fi: deny inbound from the LAN. Remote access
    # is Ziti (deskmeet1-ssh/-mosh, terminating on localhost) or the direct
    # cable on the onboard Ethernet port; no mDNS announcements, MTA on
    # loopback only, DNS-over-TLS on Wi-Fi.
    firewall: true
    firewall_ssh_interfaces:
      - enp0s31f6
    firewall_mosh: true
    untrusted_lan: true
    # The shared Wi-Fi link resolves only over TLS.
    dns_over_tls_interfaces:
      - wlp8s0
    packages:
      # Logitech device management (Unifying/Bolt/Lightspeed receivers)
      - solaar
      # Bluetooth stack
      - bluez
      - bluez-tools
      # Firmware blobs (Intel BT/WiFi, Arc GPU GuC/HuC, etc.)
      - linux-firmware
      # Intel Arc A380 VA-API video acceleration and diagnostics
      - intel-media-va-driver
      - intel-gpu-tools
      - vainfo
      # Arc A380 compute (OpenCL, Level Zero) and Quick Sync (oneVPL GPU
      # runtime), used by OBS/ffmpeg QSV encoding and checked with clinfo
      - intel-opencl-icd
      - libze1
      - libze-intel-gpu1
      - libvpl2
      - libmfx-gen1.2
      - clinfo
      # Elgato Stream Deck HID access
      - libhidapi-libusb0
      # Focusrite Scarlett 2i2 mixer/routing control
      - alsa-scarlett-gui
      # Canon camera tethered shooting and file transfer
      - gphoto2
      - entangle
      # Headers for Python gphoto2 bindings (canonctl webcam venv rebuilds)
      - libgphoto2-dev
      # Virtual camera device for the tethered camera feed
      - linux-modules-v4l2loopback-generic
      - v4l2loopback-utils
    services:
      - bluetooth
    # Always-available desk workstation: never sleep, performance CPU policy.
    disable_sleep: true
    performance_mode: true
    # Litra Beam lightbar (046d:c901): install the `litra` CLI; the hidraw
    # access it needs is granted by the 60-logitech-litra udev rule below
    # (Glow, Beam and Beam LX).
    litra_cli: true
    # Logitech G604 mouse: wheel tilt = copy/paste, a thumb button toggles the
    # Litra lightbar (see logitech_g604_* variables).
    logitech_g604: true
    # Samsung QN55QN700B TV: install the curiosity-tv remote-control CLI.
    samsung_tv_cli: true
    # Canon EOS 50D + Cam Link + Wave desk studio: StreamStack owns the
    # loopback cameras (video42 "Canon EOS 50D" and video43 "StreamStack
    # Camera") and their udev access.
    streamstack: true
    # The G604's left switch chatters (spurious double-clicks): require a
    # quick, deliberate double-click instead of the 500 ms default.
    double_click_ms: 200
    # Lock after 60 idle minutes instead of the 10 minute default.
    idle_lock_minutes: 60
    # Samsung 8K TV, two DP -> HDMI 2.1 cables from the Arc A380 (2026-10-27):
    # - Primary: A380 DP-4 (kernel card2-DP-4) at 7680x4320@60 with DSC
    #   (10 bpp compressed, RGB 4:4:4, 12 bpc uncompressed, no dithering) and
    #   Broadcast RGB Full; stable, no kernel errors.
    # - Fallback: A380 DP-3 over the StarTech (VL605 PCON) cable, 8K30 only;
    #   left connected but switched off while DP-4 is connected.
    # The i915_pcon_frl_444 patch and the modprobe option below were made for
    # the VL605 path on DP-3: there, stock i915 sends 8K30 RGB at 6 bpc with
    # dithering (HBR3, no DSC); the patched module sends RGB 4:4:4 at 8 bpc
    # (DSC 14 bpp over HBR2, decompressed by the PCON). Built but defaulted off
    # by the curiosity-i915-pcon-frl-444 modprobe option (the TV drops that
    # signal).
    i915_pcon_frl_444: true
    # curiosity-display-setup tries DP-4 before the host's own list
    # (/etc/ansible/local-vars.yml: DP-1, DP-2, DP-3, DP-4), so the 8K60 output
    # wins whenever it is connected and DP-3 (8K30) is the fallback.
    display_outputs:
      - DP-4
    # Every VT comes up at the TV's own CTA 8K60 mode (VIC 199, from the EDID,
    # 2376 MHz) on DP-4 so VT switches never modeset; X runs that mode. Never
    # use reduced blanking or custom timings here: the TV answers "mode not
    # supported". The DP-3 fallback cable only offers 8K30 (VIC 194-196).
    console_video: "DP-4:7680x4320@60"
    # Keeps DP-4 at exactly this mode through TV standby/wake, suspend, DPMS,
    # link loss and VT switches (curiosity-display-guard). tv_host is the TV's
    # LAN address: its PowerState off -> on edge is the wake signal, because
    # the active cable keeps the DP link trained while the TV sleeps and the
    # kernel logs nothing when it wakes. Keep in step with console_video.
    display_guard:
      output: DP-4
      mode: 7680x4320
      rate: 60
      lane_count: 4
      # The TV left 192.168.1.250 for .5 on a DHCP lease change, which blinded
      # the wake detector: the guard finds it by MAC and uses tv_host as fallback.
      tv_host: 192.168.1.5
      tv_mac: "70:09:71:93:5A:20"
    # Readable fbcon at 8K: 16x32 Terminus (Uni3, 512 glyphs) on VT1-9 (so the
    # higher VTs match), also persisted for early boot through console-setup.
    console_tuning:
      font: Uni3-Terminus32x16.psf.gz
      ttys: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      manage_console_setup: true
    # PC/desktop use wants full-range RGB, not the limited range i915 picks
    # automatically for HDMI/CEA modes.
    broadcast_rgb: Full
    # Windows-style 225% scaling for the 8K panel (Xft.dpi 216, Xcursor.size
    # 54): chosen by the CEO on 2026-10-27 as slightly larger than 200%.
    display_scale: 2.25
    # No compositor on the 8K TV: picom composites the full 7680x4320 frame with
    # vsync plus fading/opacity, which made the pointer and dense-text areas
    # laggy on the Arc A380 (stopping picom fixed it, confirmed 2026-10-27).
    compositor_enabled: false
    # slick-greeter's 8K background renders crash Xorg on the Arc A380 (catalog#122).
    greeter: gtk
    # The GTK greeter crashes Xorg the same way on the glamor render path
    # (ValidatePicture/CompositeRects SIGBUS every ~70 s, catalog#122), so the
    # modesetting driver runs without glamor acceleration.
    xorg_accel_method: none
    # Glamor off did not stop the SIGBUS either; X also drove the iGPU as a
    # second GPU (modeset(G0)) that has no display attached.
    xorg_auto_add_gpu: false
    # Diagnostic for the Xorg SIGBUS (catalog#122): off again after lightdm ran
    # 60 min (restart counter 0) with X under the gdb sidecar. Turning it off tests
    # whether the crash returns without it; set true to trace again.
    xorg_gdb_trace: false
    # Experiment (catalog#122): with DP-4 8K60 down the TV runs the DP-3 fallback
    # and X paints at 7680x4320 in the greeter's first frame, where it crashes.
    # Start DP-3 at 4K; the 8K60 pin is applied by curiosity-display-setup once
    # DP-4 is back.
    xorg_preferred_modes:
      DP-3: 3840x2160
    # libinput pointer speed for the G604 (confirmed by the CEO on the 8K TV).
    pointer_accel_speed: 0.6
    pipx_packages:
      - streamdeck-linux-gui
    # Rule names must sort before 73-seat-late so uaccess ACLs are applied;
    # keep them numbered 70 or lower.
    udev_rules:
      - name: 60-streamdeck
        content: |
          # Elgato Stream Deck — allow console-user and plugdev access
          SUBSYSTEM=="usb", ATTR{idVendor}=="0fd9", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="0fd9", TAG+="uaccess", GROUP="plugdev", MODE="0660"
      - name: 60-logitech-litra
        content: |
          # Logitech Litra lights (timrogers/litra-rs ids, same set as StreamStack's
          # 60-streamstack-litra.rules): Glow c900, Beam c901 and b901, Beam LX c903.
          # Matched by exact product id; other Logitech devices (the Lightspeed
          # receiver 046d:c539, the G604) are never touched.
          SUBSYSTEM=="usb", ATTR{idVendor}=="046d", ATTR{idProduct}=="c900", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="usb", ATTR{idVendor}=="046d", ATTR{idProduct}=="c901", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="usb", ATTR{idVendor}=="046d", ATTR{idProduct}=="b901", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="usb", ATTR{idVendor}=="046d", ATTR{idProduct}=="c903", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="046d", ATTRS{idProduct}=="c900", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="046d", ATTRS{idProduct}=="c901", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="046d", ATTRS{idProduct}=="b901", TAG+="uaccess", GROUP="plugdev", MODE="0660"
          SUBSYSTEM=="hidraw", ATTRS{idVendor}=="046d", ATTRS{idProduct}=="c903", TAG+="uaccess", GROUP="plugdev", MODE="0660"
      - name: 60-canon-eos-50d
        content: |
          # Canon EOS 50D (04a9:319b) — gphoto2 access; keep udisks from mounting it
          SUBSYSTEM=="usb", ATTR{idVendor}=="04a9", ATTR{idProduct}=="319b", MODE="0660", GROUP="plugdev", TAG+="uaccess", ENV{UDISKS_IGNORE}="1"
    # /etc/modprobe.d/<name>.conf files
    modprobe_options:
      # These parameters were tuned for the DP-3 fallback (StarTech/VL605 PCON,
      # 8K30). The primary DP-4 8K60 DSC path was verified stable with them
      # exactly as below, so they stay unchanged (2026-10-27).
      # The patched i915 stays built, but its 4:4:4 path is off by default:
      # with it on (8K30 RGB 8 bpc, DSC 14 bpp over HBR2) the TV dropped the
      # signal about once a minute while the PCON still reported the link up
      # with zero FRL errors (2026-10-14). Off, i915 sends 8K30 the stock way
      # (RGB 6 bpc dithered, HBR3, no DSC), the path that ran without drops
      # before the patch.
      # pcon_max_frl_gbps=32 caps the HDMI FRL rate (#88): both paths trained
      # the VL605 PCON at FRL 40G (the TV's EDID max), and the TV still blanked
      # about every 20 minutes on the stock path. 8K30 HDMI is 8 bpc RGB
      # (~28.5 Gbps incl. blanking, ~23.9 Gbps active), which fits FRL 32G
      # (8G x 4 lanes) with more per-lane margin. Unverified: the running VL605
      # echoes the requested rate in DPCD 0x3036 but keeps the TV at 40G (TV
      # SCDC 0x31 = 0x35); check SCDC 0x31 = 0x34 after a reboot.
      # To try 4:4:4 again (certified 48G cable, Input Signal Plus), set
      # pcon_frl_444=1 and reboot, or write 1 to
      # /sys/module/i915/parameters/pcon_frl_444 and modeset. Both parameters
      # are read at the next modeset/FRL training; a changed file needs a
      # reboot (or i915-reload).
      - name: curiosity-i915-pcon-frl-444
        content: |
          options i915 pcon_frl_444=0 pcon_max_frl_gbps=32
    # Loaded now and at boot via /etc/modules-load.d/curiosity-hardware.conf
    kernel_modules:
      - v4l2loopback
    pia_vpn: false

  t460:
    description: "Lenovo ThinkPad T460/T560— Intel HD 520 (Skylake GT2) + Validity VFS5011 fingerprint"
    packages:
      # Intel iGPU video acceleration (Skylake GT2 / HD Graphics 520)
      - intel-media-va-driver
      - intel-gpu-tools
      # Logitech Unifying receiver management (wireless mouse)
      - solaar
      # Firmware blobs (Intel WiFi, GPU microcode, ThinkPad ACPI)
      - linux-firmware
      # Fingerprint scanner (Validity VFS5011 138a:0017)
      - fprintd
      - libpam-fprintd
      - libfprint-2-tod1
    # Same always-available posture as x86-byod-laptop: the fleet runs
    # hardware_profile=t460, so these flags must be present here or the
    # TLP/no-sleep/netplan tasks in system-tuning.yml never fire.
    disable_sleep: true
    performance_mode: true
    services: []
    pipx_packages: []
    udev_rules: []
    pia_vpn: false
    console_diagnostics: true

# -----------------------------------------------------------------------------
# GRUB autoboot
# -----------------------------------------------------------------------------
# Boot the default GRUB entry without waiting at the menu. Ubuntu keeps the menu
# open after a boot it considers failed because GRUB_RECORDFAIL_TIMEOUT is
# unset. Installs a drop-in under /etc/default/grub.d (never edits
# /etc/default/grub) and runs update-grub when it changes. x86_64 Linux only,
# skipped in containers and on hosts without /etc/default/grub.
grub_autoboot_enabled: true
grub_autoboot_dropin_path: /etc/default/grub.d/90-curiosity-autoboot.cfg

# =============================================================================
# PIA VPN daemon settings (applied when the hardware profile sets pia_vpn: true)
# =============================================================================
# Only the listed executables are routed through the VPN (PIA "include" split
# tunnel); everything else on the host stays on the normal link. See
# docs/pia-vpn-and-wifi.md.
pia_split_tunnel_apps:
  - /opt/brave.com/brave/brave
# Keep the PIA DNS override for the tunnelled apps only, so Ziti/internal names
# still resolve for the rest of the host.
pia_split_tunnel_dns: true
# "auto" blocks tunnelled apps when the VPN drops and never blocks the host.
pia_killswitch: auto
# Keep the daemon (and killswitch) active when the GUI client is not running.
pia_persist_daemon: true
# Reconnect the VPN whenever piavpn.service (re)starts, e.g. after an OOM kill,
# instead of waiting for the GUI client that may be dead too.
pia_autoconnect_on_daemon_start: true
# Negative values make the OOM killer pick other processes first.
pia_daemon_oom_score_adjust: -900
# Root-only (0600) two-line file (username, password) provisioned outside git
# from the ACTIVE Bitwarden item "Privateinternetaccess / p1793859". Empty or
# missing skips `piactl login`; the daemon keeps any existing login.
pia_login_file: ""

# =============================================================================
# Managed WiFi profile (netplan, NetworkManager renderer)
# =============================================================================
# Empty wifi_ssid leaves netplan untouched. Supply wifi_psk from extra-vars or a
# vault, never from the repo. The match is interface-agnostic (wl*) so a card
# that moves to another PCI slot (wlp6s0 -> wlp8s0) keeps its profile.
