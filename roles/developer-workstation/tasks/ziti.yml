---
# =============================================================================
# OpenZiti Edge Tunnel + OIDC Session Hooks
# =============================================================================
# Installs ziti-edge-tunnel, deploys OIDC login/logout/reactivation scripts,
# wires up GNOME screensaver lock/unlock hooks, and adds a profile.d hook
# so OIDC identities authenticate automatically on graphical login.
# =============================================================================

# -----------------------------------------------------------------------------
# Install / Update ziti-edge-tunnel
# -----------------------------------------------------------------------------
- name: Set ziti-edge-tunnel apt distribution
  ansible.builtin.set_fact:
    _ziti_tunnel_apt_distribution: >-
      {{
        {
          'bionic': 'bionic',
          'cosmic': 'bionic',
          'disco': 'bionic',
          'eoan': 'bionic',
          'focal': 'focal',
          'groovy': 'focal',
          'hirsute': 'focal',
          'impish': 'focal',
          'jammy': 'jammy',
          'kinetic': 'jammy',
          'lunar': 'jammy',
          'mantic': 'jammy',
          'noble': 'jammy',
          'oracular': 'jammy',
          'plucky': 'jammy',
          'questing': 'jammy'
        }.get(ansible_distribution_release, 'jammy')
      }}

- name: Configure ziti-edge-tunnel repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/usr/share/keyrings/openziti-archive-keyring.gpg]
      https://packages.openziti.org/zitipax-openziti-deb-stable
      {{ _ziti_tunnel_apt_distribution }}
      main
    filename: openziti-edge-tunnel
    state: present
    update_cache: true

- name: Install or update ziti-edge-tunnel package  # noqa: package-latest
  ansible.builtin.apt:
    name: ziti-edge-tunnel
    state: latest
    update_cache: true

# -----------------------------------------------------------------------------
# OIDC Login Script
# -----------------------------------------------------------------------------
- name: Deploy OIDC login script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-login.sh
    mode: "0755"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-login.sh — authenticate all OIDC identities via ext-jwt-login
      set -euo pipefail

      IDENTITY_DIR="/opt/openziti/etc/identities"
      PROVIDER="keycloak-omlabs"

      shopt -s nullglob
      identities=("${IDENTITY_DIR}"/*-oidc.json)
      shopt -u nullglob

      if [[ -z "${identities[*]:-}" ]]; then
        logger -t ziti-oidc "No OIDC identity files found in ${IDENTITY_DIR}"
        exit 0
      fi

      for id_file in "${identities[@]}"; do
        logger -t ziti-oidc "Starting ext-jwt-login for ${id_file}"
        output=$(ziti-edge-tunnel ext-jwt-login -i "${id_file}" -p "${PROVIDER}" 2>&1) || true

        auth_url=$(echo "${output}" | grep -oP 'https://\S+' | head -n1) || true

        if [[ -n "${auth_url}" ]]; then
          logger -t ziti-oidc "Opening auth URL for ${id_file}"
          DISPLAY=:0 xdg-open "${auth_url}" 2>/dev/null || true
        else
          logger -t ziti-oidc "No auth URL extracted for ${id_file} — output: ${output}"
        fi
      done

# -----------------------------------------------------------------------------
# OIDC Logout Script
# -----------------------------------------------------------------------------
- name: Deploy OIDC logout script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-logout.sh
    mode: "0755"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-logout.sh — deactivate all OIDC identities on screen lock
      set -euo pipefail

      IDENTITY_DIR="/opt/openziti/etc/identities"

      shopt -s nullglob
      identities=("${IDENTITY_DIR}"/*-oidc.json)
      shopt -u nullglob

      for id_file in "${identities[@]}"; do
        id_name=$(basename "${id_file}" .json)
        logger -t ziti-oidc "Deactivating OIDC identity: ${id_name}"
        ziti-edge-tunnel on_off -o off -i "${id_name}" 2>&1 | logger -t ziti-oidc || true
      done

# -----------------------------------------------------------------------------
# OIDC Reactivation Script
# -----------------------------------------------------------------------------
- name: Deploy OIDC reactivation script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-reactivate.sh
    mode: "0755"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-reactivate.sh — reactivate OIDC identities on screen unlock
      set -euo pipefail

      IDENTITY_DIR="/opt/openziti/etc/identities"

      shopt -s nullglob
      identities=("${IDENTITY_DIR}"/*-oidc.json)
      shopt -u nullglob

      for id_file in "${identities[@]}"; do
        id_name=$(basename "${id_file}" .json)
        logger -t ziti-oidc "Reactivating OIDC identity: ${id_name}"
        if ! ziti-edge-tunnel on_off -o on -i "${id_name}" 2>&1 | logger -t ziti-oidc; then
          logger -t ziti-oidc "Reactivation failed for ${id_name}, triggering login flow"
          /usr/local/bin/ziti-oidc-login.sh
        fi
      done

# -----------------------------------------------------------------------------
# Profile.d Hook (graphical session auto-login)
# -----------------------------------------------------------------------------
- name: Deploy profile.d OIDC session hook
  ansible.builtin.copy:
    dest: /etc/profile.d/ziti-oidc-session.sh
    mode: "0644"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-session.sh — trigger OIDC login on graphical session start
      if [[ -n "${DISPLAY:-}" || -n "${WAYLAND_DISPLAY:-}" ]]; then
        ( sleep 5 && /usr/local/bin/ziti-oidc-login.sh ) &
        disown
      fi

# -----------------------------------------------------------------------------
# GNOME Screensaver Monitor (lock/unlock hooks)
# -----------------------------------------------------------------------------
- name: Deploy screensaver monitor script
  ansible.builtin.copy:
    dest: /usr/local/bin/ziti-oidc-screensaver-monitor.sh
    mode: "0755"
    owner: root
    group: root
    content: !unsafe |
      #!/usr/bin/env bash
      # ziti-oidc-screensaver-monitor.sh — watch GNOME screensaver lock/unlock
      set -euo pipefail

      dbus-monitor --session "type='signal',interface='org.gnome.ScreenSaver'" | \
        while read -r line; do
          case "${line}" in
            *"boolean true"*)
              logger -t ziti-oidc "Screen locked — deactivating OIDC identities"
              /usr/local/bin/ziti-oidc-logout.sh
              ;;
            *"boolean false"*)
              logger -t ziti-oidc "Screen unlocked — reactivating OIDC identities"
              /usr/local/bin/ziti-oidc-reactivate.sh
              ;;
          esac
        done

- name: Deploy screensaver monitor systemd user service
  ansible.builtin.copy:
    dest: /etc/systemd/user/ziti-oidc-screensaver-monitor.service
    mode: "0644"
    owner: root
    group: root
    content: !unsafe |
      [Unit]
      Description=Ziti OIDC screensaver lock/unlock monitor
      After=graphical-session.target
      PartOf=graphical-session.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/ziti-oidc-screensaver-monitor.sh
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=graphical-session.target

- name: Enable screensaver monitor for all desktop users  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl --global enable ziti-oidc-screensaver-monitor.service
  register: _screensaver_monitor_enable
  changed_when: "'Created symlink' in _screensaver_monitor_enable.stdout or 'Created symlink' in _screensaver_monitor_enable.stderr"
  failed_when: _screensaver_monitor_enable.rc != 0

# -----------------------------------------------------------------------------
# Sudoers Rule (password-less OIDC script execution)
# -----------------------------------------------------------------------------
- name: Deploy sudoers rule for OIDC scripts
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ziti-oidc
    mode: "0440"
    owner: root
    group: root
    content: !unsafe |
      # Allow any user to run Ziti OIDC scripts as root without password
      ALL ALL=(root) NOPASSWD: /usr/local/bin/ziti-oidc-login.sh
      ALL ALL=(root) NOPASSWD: /usr/local/bin/ziti-oidc-logout.sh
      ALL ALL=(root) NOPASSWD: /usr/local/bin/ziti-oidc-reactivate.sh
    validate: "visudo -cf %s"

# -----------------------------------------------------------------------------
# Identity directory and file permissions
# -----------------------------------------------------------------------------
# The ziti-edge-tunnel package installs /opt/openziti/etc/identities as
# 0700 root:ziti on some builds, which prevents the ziti service user from
# listing or reading identity files. Ensure 0750 so the ziti group can access.
- name: Ensure ziti identities directory is group-accessible
  ansible.builtin.file:
    path: /opt/openziti/etc/identities
    state: directory
    owner: root
    group: ziti
    mode: "0750"

# Identity files created by the firstboot enroll_ziti() function are written
# as root:root 0600. The ziti service runs as user=ziti and cannot renew certs
# on files it cannot write. Fix ownership so the ziti service can manage them.
- name: Fix ownership of existing ziti identity files to root:ziti
  ansible.builtin.shell: |
    find /opt/openziti/etc/identities/ -maxdepth 1 -name '*.json' \
      -exec chown root:ziti {} \; \
      -exec chmod 0640 {} \;
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

# -----------------------------------------------------------------------------
# Enable ziti-edge-tunnel service
# -----------------------------------------------------------------------------
# Some operators intentionally mask this unit (e.g. a cert-based always-on
# tunnel identity owns the TUN device instead — see
# FocusApiary/infrastructure's ziti_tunneler role, ADR-0004). systemd refuses
# to enable/start a masked unit, which previously made this task fail and
# abort every later task in this file (including the /etc/hosts pin refresh
# below) on any host where edge-tunnel is masked. Query state first and skip
# gracefully rather than fighting a deliberate mask.
- name: Check ziti-edge-tunnel.service mask state  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl is-enabled ziti-edge-tunnel.service
  register: _ziti_edge_tunnel_enabled_state
  changed_when: false
  failed_when: false

- name: Enable ziti-edge-tunnel service
  ansible.builtin.systemd:
    name: ziti-edge-tunnel.service
    enabled: true
    state: started
  when: _ziti_edge_tunnel_enabled_state.stdout | default('') != 'masked'

# -----------------------------------------------------------------------------
# /etc/hosts pins for Ziti-only hostnames
# -----------------------------------------------------------------------------
# Many internal services exist only as Ziti intercepts (e.g. chat.focusbuzz.org,
# coder.developerdojo.org). Their hostnames either return NXDOMAIN from public
# DNS, or worse, resolve via the apex's Cloudflare wildcard and 404 at the
# edge. systemd-resolved does not deterministically prefer the ziti0 link, and
# Firefox DoH bypasses the system resolver entirely. nsswitch hits /etc/hosts
# BEFORE any resolver path (DoH-enabled browser included), so an /etc/hosts
# pin is the most reliable workaround until persistent routing-domain
# ownership lands on ziti0.
#
# Each pinned hostname is resolved against Ziti's internal resolver
# (100.64.0.2) and written into an ansible-managed block in /etc/hosts.
# Re-running the task refreshes IPs (Ziti assigns intercepts dynamically per
# host); removing a hostname from the list drops its line on the next run.
#
# First-run note: if the OIDC identity has not yet authenticated, Ziti's
# resolver returns no answer for service hostnames and no pins are written
# this run. The task is safe to re-run after login completes.
#
# The default `ziti_etc_hosts_pins` list (see defaults/main.yml) ships the
# canonical set of internal hostnames across the FocusApiary / DroidOps /
# DreamLimited / HardMagic ecosystem. Names absent from a given operator's
# Ziti policy resolve to nothing and are skipped — safe to ship a superset.
# Override in group_vars / host_vars / -e to add machine-local pins or set
# to [] to disable entirely.

- name: Ensure dig is available for Ziti DNS lookups
  ansible.builtin.apt:
    name: dnsutils
    state: present
  when: ziti_etc_hosts_pins | default([]) | length > 0

- name: Resolve Ziti intercept IP for each pinned hostname
  ansible.builtin.command:
    cmd: "dig +short +time=2 +tries=1 {{ item }} @100.64.0.2"
  register: _ziti_pin_lookup
  loop: "{{ ziti_etc_hosts_pins | default([]) }}"
  changed_when: false
  failed_when: false
  when: ziti_etc_hosts_pins | default([]) | length > 0

- name: Build /etc/hosts pin block for resolved Ziti hostnames
  ansible.builtin.set_fact:
    _ziti_etc_hosts_block: |-
      {% for r in _ziti_pin_lookup.results | default([]) -%}
      {% set ip = r.stdout | default('') | trim -%}
      {% if r.rc == 0 and ip is match('^100\.64\.') -%}
      {{ ip }}  {{ r.item }}
      {% endif -%}
      {% endfor %}
  when: ziti_etc_hosts_pins | default([]) | length > 0

- name: Pin Ziti-only hostnames in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Ziti DNS pins"
    block: "{{ _ziti_etc_hosts_block | trim }}"
    create: false
  when:
    - ziti_etc_hosts_pins | default([]) | length > 0
    - _ziti_etc_hosts_block | default('') | trim | length > 0
