---
# =============================================================================
# Pre-flight Validation
# =============================================================================
- name: Verify running as root
  ansible.builtin.assert:
    that:
      - ansible_user_id == 'root'
    fail_msg: "This role must run as root (use --become or run with sudo)"

- name: Verify target user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ dev_user }}"

- name: Verify dev_user home directory exists
  ansible.builtin.stat:
    path: "{{ dev_user_home }}"
  register: _dev_user_home_stat

- name: Fail if dev_user home directory missing
  ansible.builtin.assert:
    that:
      - _dev_user_home_stat.stat.exists
      - _dev_user_home_stat.stat.isdir
    fail_msg: "Home directory {{ dev_user_home }} does not exist for user {{ dev_user }}"

# =============================================================================
# Task Includes
# =============================================================================
- name: Include APT repository setup
  ansible.builtin.include_tasks: repos.yml
  tags: [repos]

- name: Include APT package installation
  ansible.builtin.include_tasks: packages.yml
  tags: [packages]

- name: Include cloud CLI installation
  ansible.builtin.include_tasks: cloud-clis.yml
  tags: [cloud]

- name: Include Kubernetes tools
  ansible.builtin.include_tasks: kubernetes.yml
  tags: [kubernetes]

- name: Include security tools
  ansible.builtin.include_tasks: security.yml
  tags: [security]

- name: Include DevOps utilities
  ansible.builtin.include_tasks: devops.yml
  tags: [devops]

- name: Include language runtimes
  ansible.builtin.include_tasks: languages.yml
  tags: [languages]

- name: Include Node.js packages
  ansible.builtin.include_tasks: node-packages.yml
  tags: [node]

- name: Include Python tools
  ansible.builtin.include_tasks: python-tools.yml
  tags: [python]

- name: Include modern CLI tools
  ansible.builtin.include_tasks: cli-tools.yml
  tags: [cli]

- name: Include testing frameworks
  ansible.builtin.include_tasks: testing.yml
  tags: [testing]

- name: Include AI coding assistants
  ansible.builtin.include_tasks: ai-assistants.yml
  tags: [ai]

- name: Include VS Code extensions
  ansible.builtin.include_tasks: vscode-extensions.yml
  tags: [vscode, extensions]

- name: Include collaboration tools (Mattermost, Firefox extensions)
  ansible.builtin.include_tasks: collaboration.yml
  tags: [collaboration]

- name: Include Git configuration
  ansible.builtin.include_tasks: git-config.yml
  tags: [git]

- name: Include user environment
  ansible.builtin.include_tasks: user-env.yml
  tags: [user]

- name: Include display configuration (GDM, VNC, GNOME)
  ansible.builtin.include_tasks: display-config.yml
  tags: [display]
  when: display_config_enabled | default(false)

- name: Include Sunshine remote streaming
  ansible.builtin.include_tasks: streaming.yml
  tags: [streaming, sunshine]
  when: sunshine_enabled | default(false)

- name: Include firewall (UFW)
  ansible.builtin.include_tasks: firewall.yml
  tags: [firewall]
  when: firewall_enabled | default(false)

- name: Include Entra ID SSO (authd)
  ansible.builtin.include_tasks: entra-id.yml
  tags: [entra-id, sso]
  when: entra_id_enabled | default(false)

- name: Include profile cleanup timer
  ansible.builtin.include_tasks: profile-cleanup.yml
  tags: [profile-cleanup]
  when: profile_cleanup_enabled | default(false)

- name: Include hardware-specific drivers
  ansible.builtin.include_tasks: hardware-drivers.yml
  tags: [hardware]

- name: Include fonts
  ansible.builtin.include_tasks: fonts.yml
  tags: [fonts]

- name: Include ansible-pull timer
  ansible.builtin.include_tasks: ansible-pull-timer.yml
  tags: [ansible-pull]
