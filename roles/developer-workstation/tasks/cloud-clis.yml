---
# =============================================================================
# Cloud CLI Installation
# =============================================================================
# CLIs not available via APT repositories
# =============================================================================

# --- Azure CLI ---
- name: Install Azure CLI  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -sL https://aka.ms/InstallAzureCLIDeb | bash
    executable: /bin/bash
    creates: /usr/bin/az

# --- AWS CLI v2 ---
- name: Check if AWS CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: aws_cli_installed

- name: Download AWS CLI v2
  ansible.builtin.unarchive:
    src: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp
    remote_src: true
  when: not aws_cli_installed.stat.exists

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install
    creates: /usr/local/bin/aws
  when: not aws_cli_installed.stat.exists

- name: Clean up AWS CLI installer
  ansible.builtin.file:
    path: /tmp/aws
    state: absent
  when: not aws_cli_installed.stat.exists

# --- GitLab CLI (glab) ---
- name: Check installed glab version
  ansible.builtin.shell: glab version 2>&1 || echo MISSING
  register: glab_current
  changed_when: false
  failed_when: false

- name: Install/upgrade glab {{ glab_version }}
  when: "glab_version not in glab_current.stdout"
  block:
    - name: Download glab {{ glab_version }}
      ansible.builtin.unarchive:
        src: "https://gitlab.com/gitlab-org/cli/-/releases/v{{ glab_version }}/downloads/glab_{{ glab_version }}_linux_amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Move glab binary to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/bin/glab"
        dest: /usr/local/bin/glab
        mode: "0755"
        remote_src: true

    - name: Clean up glab temp files
      ansible.builtin.file:
        path: /tmp/bin/glab
        state: absent
