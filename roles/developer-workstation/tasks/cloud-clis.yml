---
# =============================================================================
# Cloud CLI Installation
# =============================================================================
# CLIs not available via APT repositories
# =============================================================================

# --- Azure CLI ---
- name: Install Azure CLI
  ansible.builtin.shell:
    cmd: curl -sL https://aka.ms/InstallAzureCLIDeb | bash
    creates: /usr/bin/az

# --- AWS CLI v2 ---
- name: Check if AWS CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: aws_cli_installed

- name: Download AWS CLI v2
  ansible.builtin.unarchive:
    src: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp
    remote_src: true
  when: not aws_cli_installed.stat.exists

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install
    creates: /usr/local/bin/aws
  when: not aws_cli_installed.stat.exists

- name: Clean up AWS CLI installer
  ansible.builtin.file:
    path: /tmp/aws
    state: absent
  when: not aws_cli_installed.stat.exists

# --- Coder CLI ---
- name: Check if Coder CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/coder
  register: coder_cli_installed

- name: Get installed Coder CLI version
  ansible.builtin.command:
    cmd: /usr/local/bin/coder version --output json
  register: coder_cli_version_json
  changed_when: false
  failed_when: false
  when: coder_cli_installed.stat.exists

- name: Set installed Coder CLI version
  ansible.builtin.set_fact:
    coder_cli_current_version: >-
      {{
        ((((coder_cli_version_json.stdout | default('{}')) | from_json).version | default(''))
        | regex_replace('^v', ''))
      }}
  when: coder_cli_installed.stat.exists

- name: Set Coder CLI needs upgrade flag
  ansible.builtin.set_fact:
    coder_cli_needs_upgrade: >-
      {{
        (not coder_cli_installed.stat.exists) or
        ((coder_cli_current_version | default('')) == '') or
        ((coder_cli_current_version | default('0.0.0')) is version(coder_cli_version, '!='))
      }}

- name: Download Coder CLI installer
  ansible.builtin.get_url:
    url: "{{ coder_cli_install_script_url }}"
    dest: /tmp/install-coder.sh
    mode: "0755"
    force: true
  when: coder_cli_needs_upgrade

- name: Install Coder CLI
  ansible.builtin.command:
    cmd: /bin/sh /tmp/install-coder.sh --version {{ coder_cli_version }} --method standalone
  register: coder_cli_install_result
  changed_when: coder_cli_install_result.rc == 0
  when: coder_cli_needs_upgrade

- name: Clean up Coder CLI installer
  ansible.builtin.file:
    path: /tmp/install-coder.sh
    state: absent
  when: coder_cli_needs_upgrade

# --- GitLab CLI (glab) ---
- name: Check if glab is installed
  ansible.builtin.stat:
    path: /usr/local/bin/glab
  register: glab_installed

- name: Get glab latest version from GitLab API
  ansible.builtin.uri:
    url: https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest
    return_content: true
  register: glab_release
  when: not glab_installed.stat.exists

- name: Install glab
  ansible.builtin.unarchive:
    src: "https://gitlab.com/gitlab-org/cli/-/releases/{{ glab_release.json.tag_name }}/downloads/glab_{{ glab_release.json.tag_name | regex_replace('^v', '') }}_linux_amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not glab_installed.stat.exists

- name: Move glab binary to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/bin/glab"
    dest: /usr/local/bin/glab
    mode: "0755"
    remote_src: true
  when: not glab_installed.stat.exists

- name: Clean up glab temp files
  ansible.builtin.file:
    path: /tmp/bin/glab
    state: absent
  when: not glab_installed.stat.exists
