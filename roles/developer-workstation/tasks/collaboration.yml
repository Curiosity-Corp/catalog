---
# =============================================================================
# Collaboration Tools
# =============================================================================
# Mattermost Desktop, Firefox extensions, and browser policies
# =============================================================================

# =============================================================================
# Mattermost Desktop
# =============================================================================
# Installs from GitHub release tarball to /opt/mattermost-desktop with a
# symlink to /usr/local/bin. No .deb available since v6.x.
# =============================================================================

- name: Check if Mattermost Desktop is installed
  ansible.builtin.stat:
    path: /opt/mattermost-desktop/mattermost-desktop
  register: mattermost_desktop_installed

- name: Get Mattermost Desktop latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/mattermost/desktop/releases/latest
    return_content: true
  register: mattermost_desktop_release
  when: not mattermost_desktop_installed.stat.exists

- name: Download and extract Mattermost Desktop
  ansible.builtin.unarchive:
    src: "https://github.com/mattermost/desktop/releases/download/{{ mattermost_desktop_release.json.tag_name }}/mattermost-desktop-{{ mattermost_desktop_release.json.tag_name | regex_replace('^v', '') }}-linux-x64.tar.gz"
    dest: /opt
    remote_src: true
  when: not mattermost_desktop_installed.stat.exists

- name: Rename Mattermost Desktop directory
  ansible.builtin.command:
    cmd: "mv /opt/mattermost-desktop-{{ mattermost_desktop_release.json.tag_name | regex_replace('^v', '') }}-linux-x64 /opt/mattermost-desktop"
    creates: /opt/mattermost-desktop
  when: not mattermost_desktop_installed.stat.exists

- name: Symlink Mattermost Desktop to PATH
  ansible.builtin.file:
    src: /opt/mattermost-desktop/mattermost-desktop
    dest: /usr/local/bin/mattermost-desktop
    state: link
    force: true

- name: Create Mattermost Desktop .desktop entry
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Name=Mattermost
      Comment=Mattermost Desktop Application
      Exec=env NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/harbor-internal-ca.crt /opt/mattermost-desktop/mattermost-desktop %U
      Icon=/opt/mattermost-desktop/app_icon.png
      Terminal=false
      Type=Application
      Categories=Network;InstantMessaging;
      StartupWMClass=Mattermost
    dest: /usr/share/applications/mattermost-desktop.desktop
    mode: "0644"

# =============================================================================
# Firefox Enterprise Policies — Bitwarden Extension + Internal CA Trust
# =============================================================================
# Force-installs the Bitwarden password manager extension for all Firefox users.
# Enables ImportEnterpriseRoots so Firefox trusts the system CA store
# (required for Harbor Internal CA on Ziti-only services).
# =============================================================================

- name: Ensure Firefox policy directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/firefox/policies
    - /usr/lib/firefox/distribution

- name: Deploy Firefox enterprise policies
  ansible.builtin.copy:
    content: |
      {
        "policies": {
          "ExtensionSettings": {
            "{446900e4-71c2-419f-a6a7-df9c091e268b}": {
              "installation_mode": "force_installed",
              "install_url": "https://addons.mozilla.org/firefox/downloads/latest/bitwarden-password-manager/latest.xpi"
            }
          },
          "Certificates": {
            "ImportEnterpriseRoots": true
          }
        }
      }
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/firefox/policies/policies.json
    - /usr/lib/firefox/distribution/policies.json

# =============================================================================
# Snap Firefox — Harbor Internal CA Trust
# =============================================================================
# Snap Firefox is sandboxed and doesn't read /etc/firefox/policies or the
# system CA store. Add Harbor CA directly to each snap Firefox NSS profile.
# =============================================================================

- name: Find snap Firefox NSS databases
  ansible.builtin.find:
    paths: "{{ dev_user_home }}/snap/firefox/common/.mozilla/firefox"
    patterns: "cert9.db"
    recurse: true
  register: _snap_firefox_nssdb

- name: Add Harbor Internal CA to snap Firefox profiles
  ansible.builtin.command:
    cmd: >-
      certutil -d sql:{{ item.path | dirname }}
      -A -t "CT,C,C" -n "Harbor Internal CA"
      -i /usr/local/share/ca-certificates/harbor-internal-ca.crt
  become_user: "{{ dev_user }}"
  loop: "{{ _snap_firefox_nssdb.files }}"
  loop_control:
    label: "{{ item.path | dirname | basename }}"
  register: _snap_ff_ca
  changed_when: _snap_ff_ca.rc == 0
  failed_when: false

# =============================================================================
# Snap Mattermost Desktop — NODE_EXTRA_CA_CERTS override
# =============================================================================
# If Mattermost was installed via snap instead of tarball, create a user-local
# .desktop override that sets NODE_EXTRA_CA_CERTS for Harbor CA trust.
# =============================================================================

- name: Check if Mattermost snap is installed
  ansible.builtin.stat:
    path: /snap/bin/mattermost-desktop
  register: _mattermost_snap

- name: Create snap Mattermost .desktop override with CA trust
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      X-SnapInstanceName=mattermost-desktop
      Name=Mattermost
      Exec=env NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/harbor-internal-ca.crt /snap/bin/mattermost-desktop %U
      Terminal=false
      Type=Application
      Icon=/snap/mattermost-desktop/current/meta/gui/icon.png
      StartupWMClass=Mattermost
      Comment=Mattermost
      MimeType=x-scheme-handler/mattermost;
      Categories=Network;InstantMessaging;
    dest: "{{ dev_user_home }}/.local/share/applications/mattermost-desktop_mattermost-desktop.desktop"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
  when: _mattermost_snap.stat.exists
