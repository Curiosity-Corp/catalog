---
# =============================================================================
# Security Tools
# =============================================================================
# Container security, secrets management, and certificate tools
# =============================================================================

- name: Include internal CA trust
  ansible.builtin.include_tasks: internal-cas.yml

# --- Trivy ---
- name: Check installed trivy version
  ansible.builtin.shell: trivy --version 2>&1 || echo MISSING
  register: trivy_current
  changed_when: false
  failed_when: false

- name: Install/upgrade trivy {{ trivy_version }}
  when: "trivy_version not in trivy_current.stdout"
  block:
    - name: Install Trivy v{{ trivy_version }}  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v{{ trivy_version }}
        executable: /bin/bash
      changed_when: true

# --- kubeseal (Sealed Secrets) ---
- name: Check installed kubeseal version
  ansible.builtin.shell: kubeseal --version 2>&1 || echo MISSING
  register: kubeseal_current
  changed_when: false
  failed_when: false

- name: Install/upgrade kubeseal {{ kubeseal_version }}
  when: "kubeseal_version not in kubeseal_current.stdout"
  block:
    - name: Download kubeseal {{ kubeseal_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [kubeseal]

# =============================================================================
# Post-Quantum age + SOPS
# =============================================================================
# age v1.3.1+ is required for PQ hybrid keys (ML-KEM-768 + X25519).
# SOPS must be built from main to embed filippo.io/age v1.3.1.
# The standard APT age and GitHub release SOPS do NOT support PQ keys.
# =============================================================================

# --- age v1.3.1 (PQ support) ---
- name: Check age version
  ansible.builtin.command: age --version
  register: age_version_check
  changed_when: false
  failed_when: false

- name: Install age v1.3.1 (PQ hybrid key support)
  when: age_version_check.rc != 0 or 'v1.3.1' not in (age_version_check.stdout | default(''))
  block:
    - name: Download age v1.3.1
      ansible.builtin.unarchive:
        src: https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install age and age-keygen
      ansible.builtin.copy:
        src: "/tmp/age/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - age
        - age-keygen

    - name: Clean up age temp files
      ansible.builtin.file:
        path: /tmp/age
        state: absent

# --- SOPS v3 (version-checked, direct download, PQ support) ---
# Downloads the GitHub release binary. Compares installed version and removes
# any ~/go/bin/sops shadow to ensure the catalog-managed version is used.
- name: Check installed sops version
  ansible.builtin.shell: sops --version 2>&1 | head -1 || echo MISSING
  register: sops_current
  changed_when: false
  failed_when: false

- name: Install/upgrade sops {{ sops_version }}
  when: "'sops ' ~ sops_version not in sops_current.stdout"
  block:
    - name: Download sops {{ sops_version }}
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
        dest: /usr/local/bin/sops
        mode: "0755"

    - name: Remove ~/go/bin/sops shadow (outdated catalog-managed alternative)
      ansible.builtin.file:
        path: "{{ dev_user_home }}/go/bin/sops"
        state: absent

# --- PQ age keypair generation (per-user, idempotent) ---
# Uses ~/.keys/age.key (org convention). Skips if any age key already exists.
- name: Check if age key already exists
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.keys/age.key"
  register: age_key_check

- name: Ensure user .keys directory exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.keys"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"
  when: not age_key_check.stat.exists

- name: Generate PQ age keypair (one-time)
  ansible.builtin.command:
    cmd: age-keygen -o {{ dev_user_home }}/.keys/age.key
    creates: "{{ dev_user_home }}/.keys/age.key"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

- name: Set age key file permissions
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.keys/age.key"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when: not age_key_check.stat.exists

- name: Extract and display age public key (first run only)
  when: not age_key_check.stat.exists
  block:
    - name: Extract age public key
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep 'public key' {{ dev_user_home }}/.keys/age.key | cut -d' ' -f4
        executable: /bin/bash
      register: age_public_key
      changed_when: false

    - name: Write public key to ~/.keys/age.pub
      ansible.builtin.copy:
        content: "{{ age_public_key.stdout }}\n"
        dest: "{{ dev_user_home }}/.keys/age.pub"
        owner: "{{ dev_user }}"
        group: "{{ dev_user }}"
        mode: "0644"

    - name: Display age public key
      ansible.builtin.debug:
        msg: >-
          PQ age public key for {{ dev_user }}:
          {{ age_public_key.stdout }}
          — Send this to the infrastructure admin to be added as a SOPS recipient.

# --- cosign ---
- name: Check installed cosign version
  ansible.builtin.shell: cosign version 2>&1 || echo MISSING
  register: cosign_current
  changed_when: false
  failed_when: false

- name: Install/upgrade cosign {{ cosign_version }}
  when: "cosign_version not in cosign_current.stdout"
  block:
    - name: Download cosign {{ cosign_version }}
      ansible.builtin.get_url:
        url: "https://github.com/sigstore/cosign/releases/download/v{{ cosign_version }}/cosign-linux-amd64"
        dest: /usr/local/bin/cosign
        mode: "0755"

# --- step-cli ---
- name: Check installed step version
  ansible.builtin.shell: step version 2>&1 || echo MISSING
  register: step_current
  changed_when: false
  failed_when: false

- name: Install/upgrade step {{ step_version }}
  when: "step_version not in step_current.stdout"
  block:
    - name: Download step {{ step_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/smallstep/cli/releases/download/v{{ step_version }}/step_linux_{{ step_version }}_amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Move step binary to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/step_{{ step_version }}/bin/step"
        dest: /usr/local/bin/step
        mode: "0755"
        remote_src: true

    - name: Clean up step temp files
      ansible.builtin.file:
        path: "/tmp/step_{{ step_version }}"
        state: absent

# --- mkcert ---
- name: Check installed mkcert version
  ansible.builtin.shell: mkcert --version 2>&1 || echo MISSING
  register: mkcert_current
  changed_when: false
  failed_when: false

- name: Install/upgrade mkcert {{ mkcert_version }}
  when: "mkcert_version not in mkcert_current.stdout"
  block:
    - name: Download mkcert {{ mkcert_version }}
      ansible.builtin.get_url:
        url: "https://github.com/FiloSottile/mkcert/releases/download/v{{ mkcert_version }}/mkcert-v{{ mkcert_version }}-linux-amd64"
        dest: /usr/local/bin/mkcert
        mode: "0755"
