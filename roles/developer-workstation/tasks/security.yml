---
# =============================================================================
# Security Tools
# =============================================================================
# Container security, secrets management, and certificate tools
# =============================================================================

- name: Include internal CA trust
  ansible.builtin.include_tasks: internal-cas.yml

# --- Trivy ---
- name: Check installed trivy version
  ansible.builtin.shell: trivy --version 2>&1 || echo MISSING
  register: trivy_current
  changed_when: false
  failed_when: false

- name: Install/upgrade trivy {{ trivy_version }}
  when: "trivy_version not in trivy_current.stdout"
  block:
    - name: Install Trivy v{{ trivy_version }}  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v{{ trivy_version }}
        executable: /bin/bash
      changed_when: true

# --- kubeseal (Sealed Secrets) ---
- name: Check installed kubeseal version
  ansible.builtin.shell: kubeseal --version 2>&1 || echo MISSING
  register: kubeseal_current
  changed_when: false
  failed_when: false

- name: Install/upgrade kubeseal {{ kubeseal_version }}
  when: "kubeseal_version not in kubeseal_current.stdout"
  block:
    - name: Download kubeseal {{ kubeseal_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [kubeseal]

# =============================================================================
# Post-Quantum age + SOPS
# =============================================================================
# age v1.3.1+ is required for PQ hybrid keys (ML-KEM-768 + X25519).
# SOPS must be built from main to embed filippo.io/age v1.3.1.
# The standard APT age and GitHub release SOPS do NOT support PQ keys.
# =============================================================================

# --- age v1.3.1 (PQ support) ---
- name: Check age version
  ansible.builtin.command: age --version
  register: age_version_check
  changed_when: false
  failed_when: false

- name: Install age v1.3.1 (PQ hybrid key support)
  when: age_version_check.rc != 0 or 'v1.3.1' not in (age_version_check.stdout | default(''))
  block:
    - name: Download age v1.3.1
      ansible.builtin.unarchive:
        src: https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install age and age-keygen
      ansible.builtin.copy:
        src: "/tmp/age/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - age
        - age-keygen

    - name: Clean up age temp files
      ansible.builtin.file:
        path: /tmp/age
        state: absent

# --- SOPS v3 (version-checked, direct download, PQ support) ---
# Downloads the GitHub release binary. Compares installed version and removes
# any ~/go/bin/sops shadow to ensure the catalog-managed version is used.
- name: Check installed sops version  # noqa: risky-shell-pipe
  ansible.builtin.shell: sops --version 2>&1 | head -1 || echo MISSING
  register: sops_current
  changed_when: false
  failed_when: false

- name: Install/upgrade sops {{ sops_version }}
  when: "'sops ' ~ sops_version not in sops_current.stdout"
  block:
    - name: Download sops {{ sops_version }}
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
        dest: /usr/local/bin/sops
        mode: "0755"

    - name: Remove ~/go/bin/sops shadow (outdated catalog-managed alternative)
      ansible.builtin.file:
        path: "{{ dev_user_home }}/go/bin/sops"
        state: absent

# --- PQ age keypair generation (per-user, idempotent) ---
# Uses ~/.keys/age.key (org convention). Skips if any age key already exists.
- name: Check if age key already exists
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.keys/age.key"
  register: age_key_check

- name: Ensure user .keys directory exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.keys"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"
  when: not age_key_check.stat.exists

- name: Generate PQ age keypair (one-time)
  ansible.builtin.command:
    cmd: age-keygen -o {{ dev_user_home }}/.keys/age.key
    creates: "{{ dev_user_home }}/.keys/age.key"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

- name: Set age key file permissions
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.keys/age.key"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when: not age_key_check.stat.exists

- name: Extract and display age public key (first run only)
  when: not age_key_check.stat.exists
  block:
    - name: Extract age public key
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep 'public key' {{ dev_user_home }}/.keys/age.key | cut -d' ' -f4
        executable: /bin/bash
      register: age_public_key
      changed_when: false

    - name: Write public key to ~/.keys/age.pub
      ansible.builtin.copy:
        content: "{{ age_public_key.stdout }}\n"
        dest: "{{ dev_user_home }}/.keys/age.pub"
        owner: "{{ dev_user }}"
        group: "{{ dev_user }}"
        mode: "0644"

    - name: Display age public key
      ansible.builtin.debug:
        msg: >-
          PQ age public key for {{ dev_user }}:
          {{ age_public_key.stdout }}
          — Send this to the infrastructure admin to be added as a SOPS recipient.

# --- cosign ---
- name: Check installed cosign version
  ansible.builtin.shell: cosign version 2>&1 || echo MISSING
  register: cosign_current
  changed_when: false
  failed_when: false

- name: Install/upgrade cosign {{ cosign_version }}
  when: "cosign_version not in cosign_current.stdout"
  block:
    - name: Download cosign {{ cosign_version }}
      ansible.builtin.get_url:
        url: "https://github.com/sigstore/cosign/releases/download/v{{ cosign_version }}/cosign-linux-amd64"
        dest: /usr/local/bin/cosign
        mode: "0755"

# --- step-cli ---
- name: Check installed step version
  ansible.builtin.shell: step version 2>&1 || echo MISSING
  register: step_current
  changed_when: false
  failed_when: false

- name: Install/upgrade step {{ step_version }}
  when: "step_version not in step_current.stdout"
  block:
    - name: Download step {{ step_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/smallstep/cli/releases/download/v{{ step_version }}/step_linux_{{ step_version }}_amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Move step binary to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/step_{{ step_version }}/bin/step"
        dest: /usr/local/bin/step
        mode: "0755"
        remote_src: true

    - name: Clean up step temp files
      ansible.builtin.file:
        path: "/tmp/step_{{ step_version }}"
        state: absent

# --- mkcert ---
- name: Check installed mkcert version
  ansible.builtin.shell: mkcert --version 2>&1 || echo MISSING
  register: mkcert_current
  changed_when: false
  failed_when: false

- name: Install/upgrade mkcert {{ mkcert_version }}
  when: "mkcert_version not in mkcert_current.stdout"
  block:
    - name: Download mkcert {{ mkcert_version }}
      ansible.builtin.get_url:
        url: "https://github.com/FiloSottile/mkcert/releases/download/v{{ mkcert_version }}/mkcert-v{{ mkcert_version }}-linux-amd64"
        dest: /usr/local/bin/mkcert
        mode: "0755"

# =============================================================================
# Free/Open-Source Security Hardening Stack
# =============================================================================
# All packaged/free — no Canonical Pro account needed. CIS content is
# scan-only here: openscap can auto-remediate, but doing that unattended on a
# workstation risks disabling services or changing permissions in ways nobody
# reviewed. We install the scanner + content and generate a report; applying
# remediation is a separate, human-reviewed step.
# =============================================================================

- name: Install needrestart (auto-restart services after lib upgrades)
  ansible.builtin.apt:
    name: needrestart
    state: present

- name: Install debsecan (Debian/Ubuntu vulnerability scanner)
  ansible.builtin.apt:
    name: debsecan
    state: present

- name: Install AIDE (file integrity monitoring)
  ansible.builtin.apt:
    name:
      - aide
      - aide-common
    state: present

- name: Check if AIDE database is initialized
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db
  register: _aide_db

- name: Initialize AIDE database (first run only — can take a while)
  ansible.builtin.command: aideinit -y -f
  when: not _aide_db.stat.exists
  changed_when: true

- name: Install auditd (audit daemon)
  ansible.builtin.apt:
    name: auditd
    state: present

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

- name: Install rkhunter (rootkit hunter)
  ansible.builtin.apt:
    name: rkhunter
    state: present

- name: Update rkhunter file properties baseline (first run only)
  ansible.builtin.command: rkhunter --propupd
  args:
    creates: /var/lib/rkhunter/db/rkhunter.dat

- name: Install fail2ban (paired with ufw — see firewall.yml)
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure fail2ban sshd jail (ships with nothing enabled by default)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — developer-workstation role
      [sshd]
      enabled = true
      backend = systemd
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Install canonical/sec-cvescan (Ubuntu Security Notices CVE scanner)
  community.general.pipx:
    name: cvescan
    state: present
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  failed_when: false

# --- CIS hardening content — scan/report only, no auto-remediation ---
- name: Install OpenSCAP scanner and Debian-derived CIS content
  ansible.builtin.apt:
    name:
      - openscap-scanner
      - ssg-debderived
    state: present

- name: Ensure OpenSCAP report directory exists
  ansible.builtin.file:
    path: /var/log/openscap
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Find installed SCAP Security Guide datastream for this distro
  ansible.builtin.find:
    paths: /usr/share/xml/scap/ssg/content
    patterns: "ssg-{{ ansible_distribution | lower }}-ds.xml"
  register: _ssg_datastream

- name: Create weekly CIS/OpenSCAP evaluation script (report only, no --remediate)
  ansible.builtin.copy:
    dest: /usr/local/bin/openscap-weekly-eval.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Managed by Ansible — developer-workstation role
      # Report-only: generates findings for human review. Does NOT remediate —
      # unattended CIS remediation can disable services this workstation needs.
      set -uo pipefail
      DATASTREAM="{{ _ssg_datastream.files[0].path | default('') }}"
      if [ -z "$DATASTREAM" ]; then
        logger -t openscap-weekly "No SCAP datastream found for {{ ansible_distribution }} — skipping"
        exit 0
      fi
      oscap xccdf eval \
        --profile xccdf_org.ssgproject.content_profile_cis_level1_workstation \
        --results /var/log/openscap/results-$(date +%Y%m%d).xml \
        --report /var/log/openscap/report-$(date +%Y%m%d).html \
        "$DATASTREAM" || true
      logger -t openscap-weekly "CIS evaluation complete — see /var/log/openscap/report-$(date +%Y%m%d).html"

- name: Create weekly OpenSCAP eval systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/openscap-weekly-eval.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly CIS/OpenSCAP evaluation (report only)

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/openscap-weekly-eval.sh
  notify: Reload systemd

- name: Create weekly OpenSCAP eval timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/openscap-weekly-eval.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly CIS/OpenSCAP evaluation

      [Timer]
      OnCalendar=Sun *-*-* 05:00:00
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Enable weekly OpenSCAP eval timer
  ansible.builtin.systemd:
    name: openscap-weekly-eval.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Create weekly debsecan + rkhunter scan script
  ansible.builtin.copy:
    dest: /usr/local/bin/vuln-scan-weekly.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Managed by Ansible — developer-workstation role
      set -uo pipefail
      debsecan --suppress-msg --format summary 2>/dev/null | logger -t debsecan-weekly || true
      rkhunter --check --sk --nocolors 2>/dev/null | logger -t rkhunter-weekly || true

- name: Create weekly vuln-scan systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/vuln-scan-weekly.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly debsecan + rkhunter scan

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/vuln-scan-weekly.sh
  notify: Reload systemd

- name: Create weekly vuln-scan timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/vuln-scan-weekly.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly debsecan + rkhunter scan

      [Timer]
      OnCalendar=Wed *-*-* 05:00:00
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Enable weekly vuln-scan timer
  ansible.builtin.systemd:
    name: vuln-scan-weekly.timer
    enabled: true
    state: started
    daemon_reload: true
