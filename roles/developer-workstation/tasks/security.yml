---
# =============================================================================
# Security Tools
# =============================================================================
# Container security, secrets management, and certificate tools
# =============================================================================

# =============================================================================
# Internal CA Trust
# =============================================================================
# Harbor Internal CA — used for TLS on Ziti-only internal services
# (Keycloak, Harbor registry, etc.) instead of Let's Encrypt.
# =============================================================================

- name: Install Harbor Internal CA certificate
  ansible.builtin.copy:
    src: harbor-internal-ca.crt
    dest: /usr/local/share/ca-certificates/harbor-internal-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: _harbor_ca_installed

- name: Install Ziti Controller Root CA certificate
  ansible.builtin.copy:
    src: ziti-controller-root-ca.crt
    dest: /usr/local/share/ca-certificates/ziti-controller-root-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: _ziti_ca_installed

- name: Update system CA trust store
  ansible.builtin.command: update-ca-certificates
  when: _harbor_ca_installed.changed or _ziti_ca_installed.changed

# NSS database — Chromium/Electron apps (Mattermost, Chrome, VS Code)
# use ~/.pki/nssdb instead of the system CA store.
- name: Ensure user NSS database directory exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.pki/nssdb"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"

- name: Check if Harbor CA is in user NSS database
  ansible.builtin.command:
    cmd: certutil -d sql:{{ dev_user_home }}/.pki/nssdb -L -n "Harbor Internal CA"
  register: _nss_harbor_ca
  changed_when: false
  failed_when: false
  become_user: "{{ dev_user }}"

- name: Add Harbor Internal CA to user NSS database
  ansible.builtin.command:
    cmd: >-
      certutil -d sql:{{ dev_user_home }}/.pki/nssdb
      -A -t "CT,C,C" -n "Harbor Internal CA"
      -i /usr/local/share/ca-certificates/harbor-internal-ca.crt
  become_user: "{{ dev_user }}"
  when: _nss_harbor_ca.rc != 0

- name: Check if Ziti CA is in user NSS database
  ansible.builtin.command:
    cmd: certutil -d sql:{{ dev_user_home }}/.pki/nssdb -L -n "Ziti Controller Root CA"
  register: _nss_ziti_ca
  changed_when: false
  failed_when: false
  become_user: "{{ dev_user }}"

- name: Add Ziti Controller Root CA to user NSS database
  ansible.builtin.command:
    cmd: >-
      certutil -d sql:{{ dev_user_home }}/.pki/nssdb
      -A -t "CT,C,C" -n "Ziti Controller Root CA"
      -i /usr/local/share/ca-certificates/ziti-controller-root-ca.crt
  become_user: "{{ dev_user }}"
  when: _nss_ziti_ca.rc != 0

# --- Trivy ---
- name: Install Trivy
  ansible.builtin.shell:
    cmd: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    creates: /usr/local/bin/trivy

# --- kubeseal (Sealed Secrets) ---
- name: Check if kubeseal is installed
  ansible.builtin.stat:
    path: /usr/local/bin/kubeseal
  register: kubeseal_installed

- name: Get kubeseal latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/bitnami-labs/sealed-secrets/releases/latest
    return_content: true
  register: kubeseal_release
  when: not kubeseal_installed.stat.exists

- name: Install kubeseal
  ansible.builtin.get_url:
    url: "https://github.com/bitnami-labs/sealed-secrets/releases/download/{{ kubeseal_release.json.tag_name }}/kubeseal-{{ kubeseal_release.json.tag_name | regex_replace('^v', '') }}-linux-amd64.tar.gz"
    dest: /tmp/kubeseal.tar.gz
    mode: "0644"
  when: not kubeseal_installed.stat.exists

- name: Extract kubeseal
  ansible.builtin.unarchive:
    src: /tmp/kubeseal.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [kubeseal]
  when: not kubeseal_installed.stat.exists

- name: Clean up kubeseal tarball
  ansible.builtin.file:
    path: /tmp/kubeseal.tar.gz
    state: absent
  when: not kubeseal_installed.stat.exists

# =============================================================================
# Post-Quantum age + SOPS
# =============================================================================
# age v1.3.1+ is required for PQ hybrid keys (ML-KEM-768 + X25519).
# SOPS must be built from main to embed filippo.io/age v1.3.1.
# The standard APT age and GitHub release SOPS do NOT support PQ keys.
# =============================================================================

# --- age v1.3.1 (PQ support) ---
- name: Check age version
  ansible.builtin.command: age --version
  register: age_version_check
  changed_when: false
  failed_when: false

- name: Install age v1.3.1 (PQ hybrid key support)
  when: age_version_check.rc != 0 or 'v1.3.1' not in (age_version_check.stdout | default(''))
  block:
    - name: Download age v1.3.1
      ansible.builtin.unarchive:
        src: https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install age and age-keygen
      ansible.builtin.copy:
        src: "/tmp/age/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - age
        - age-keygen

    - name: Clean up age temp files
      ansible.builtin.file:
        path: /tmp/age
        state: absent

# --- SOPS (PQ-capable, built from main) ---
# Only install if sops is not already in PATH. Existing PQ-capable
# installs (e.g. ~/go/bin/sops) are left untouched.
- name: Check if sops is available
  ansible.builtin.command: which sops
  register: sops_which_check
  changed_when: false
  failed_when: false

- name: Build and install SOPS from main (PQ support)
  when: sops_which_check.rc != 0
  block:
    - name: Check Go is available for SOPS build
      ansible.builtin.command: go version
      register: go_check
      changed_when: false
      failed_when: false

    - name: Build SOPS from main via go install
      ansible.builtin.shell:
        cmd: go install github.com/getsops/sops/v3/cmd/sops@main
      environment:
        HOME: /root
        GOPATH: /root/go
        GOBIN: /root/go/bin
      when: go_check.rc == 0

    - name: Install SOPS binary to /usr/local/bin
      ansible.builtin.copy:
        src: /root/go/bin/sops
        dest: /usr/local/bin/sops
        mode: "0755"
        remote_src: true
      when: go_check.rc == 0

# --- PQ age keypair generation (per-user, idempotent) ---
# Uses ~/.keys/age.key (org convention). Skips if any age key already exists.
- name: Check if age key already exists
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.keys/age.key"
  register: age_key_check

- name: Ensure user .keys directory exists
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.keys"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0700"
  when: not age_key_check.stat.exists

- name: Generate PQ age keypair (one-time)
  ansible.builtin.command:
    cmd: age-keygen -o {{ dev_user_home }}/.keys/age.key
    creates: "{{ dev_user_home }}/.keys/age.key"
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

- name: Set age key file permissions
  ansible.builtin.file:
    path: "{{ dev_user_home }}/.keys/age.key"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"
  when: not age_key_check.stat.exists

- name: Extract and display age public key (first run only)
  when: not age_key_check.stat.exists
  block:
    - name: Extract age public key
      ansible.builtin.shell:
        cmd: grep 'public key' {{ dev_user_home }}/.keys/age.key | cut -d' ' -f4
      register: age_public_key
      changed_when: false

    - name: Write public key to ~/.keys/age.pub
      ansible.builtin.copy:
        content: "{{ age_public_key.stdout }}\n"
        dest: "{{ dev_user_home }}/.keys/age.pub"
        owner: "{{ dev_user }}"
        group: "{{ dev_user }}"
        mode: "0644"

    - name: Display age public key
      ansible.builtin.debug:
        msg: >-
          PQ age public key for {{ dev_user }}:
          {{ age_public_key.stdout }}
          — Send this to the infrastructure admin to be added as a SOPS recipient.

# --- cosign ---
- name: Check if cosign is installed
  ansible.builtin.stat:
    path: /usr/local/bin/cosign
  register: cosign_installed

- name: Get cosign latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/sigstore/cosign/releases/latest
    return_content: true
  register: cosign_release
  when: not cosign_installed.stat.exists

- name: Install cosign
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/{{ cosign_release.json.tag_name }}/cosign-linux-amd64"
    dest: /usr/local/bin/cosign
    mode: "0755"
  when: not cosign_installed.stat.exists

# --- step-cli ---
- name: Check if step is installed
  ansible.builtin.stat:
    path: /usr/local/bin/step
  register: step_installed

- name: Get step-cli latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/smallstep/cli/releases/latest
    return_content: true
  register: step_release
  when: not step_installed.stat.exists

- name: Install step-cli
  ansible.builtin.unarchive:
    src: "https://github.com/smallstep/cli/releases/download/{{ step_release.json.tag_name }}/step_linux_{{ step_release.json.tag_name | regex_replace('^v', '') }}_amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not step_installed.stat.exists

- name: Move step binary to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/step_{{ step_release.json.tag_name | regex_replace('^v', '') }}/bin/step"
    dest: /usr/local/bin/step
    mode: "0755"
    remote_src: true
  when: not step_installed.stat.exists

- name: Clean up step-cli temp files
  ansible.builtin.file:
    path: "/tmp/step_{{ step_release.json.tag_name | regex_replace('^v', '') }}"
    state: absent
  when: not step_installed.stat.exists

# --- mkcert ---
- name: Check if mkcert is installed
  ansible.builtin.stat:
    path: /usr/local/bin/mkcert
  register: mkcert_installed

- name: Get mkcert latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/FiloSottile/mkcert/releases/latest
    return_content: true
  register: mkcert_release
  when: not mkcert_installed.stat.exists

- name: Install mkcert
  ansible.builtin.get_url:
    url: "https://github.com/FiloSottile/mkcert/releases/download/{{ mkcert_release.json.tag_name }}/mkcert-{{ mkcert_release.json.tag_name }}-linux-amd64"
    dest: /usr/local/bin/mkcert
    mode: "0755"
  when: not mkcert_installed.stat.exists
