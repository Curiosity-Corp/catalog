---
# =============================================================================
# APT Repository Setup
# =============================================================================
# Uses shell+creates for GPG keys (idempotent, avoids deprecated apt_key)
# Uses apt_repository for source lists
# =============================================================================

# --- GitHub CLI ---
- name: Download GitHub CLI GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
    creates: /usr/share/keyrings/githubcli-archive-keyring.gpg

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  notify: Update apt cache

# --- VS Code (Microsoft) ---
# VS Code's own installer creates vscode.sources with a different signed-by path,
# which conflicts with our managed vscode.list. Remove it to avoid apt conflicts.
- name: Remove conflicting VS Code repo config (from VS Code installer)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.sources
    state: absent
  notify: Update apt cache

- name: Download Microsoft GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-archive-keyring.gpg
    creates: /usr/share/keyrings/microsoft-archive-keyring.gpg

- name: Add VS Code repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
    state: present
  notify: Update apt cache

# --- .NET SDK (Microsoft) ---
# Uses same GPG key as VS Code (packages.microsoft.com)
- name: Add Microsoft .NET SDK repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/ubuntu/24.04/prod {{ apt_fallback_release }} main"
    filename: microsoft-dotnet
    state: present
  notify: Update apt cache

# --- Google Cloud CLI ---
- name: Download Google Cloud GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud-google-archive-keyring.gpg
    creates: /usr/share/keyrings/cloud-google-archive-keyring.gpg

- name: Add Google Cloud CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/cloud-google-archive-keyring.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
    filename: google-cloud-sdk
    state: present
  notify: Update apt cache

# --- Kubernetes (kubectl) ---
- name: Download Kubernetes GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key | gpg --dearmor -o /usr/share/keyrings/kubernetes-archive-keyring.gpg
    creates: /usr/share/keyrings/kubernetes-archive-keyring.gpg

- name: Add Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
    filename: kubernetes
    state: present
  notify: Update apt cache

# --- HashiCorp (terraform, packer, vault) ---
- name: Download HashiCorp GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

- name: Add HashiCorp repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ apt_fallback_release }} main"
    filename: hashicorp
    state: present
  notify: Update apt cache

# --- Google Chrome ---
# Chrome's installer appends an unsigned deb line to google-chrome.list,
# causing duplicate warnings. Remove the file so apt_repository recreates
# it cleanly with only the signed entry.
- name: Remove Chrome installer repo config (conflicting unsigned entry)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/google-chrome.list
    state: absent
  notify: Update apt cache

- name: Download Google Chrome GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome-archive-keyring.gpg
    creates: /usr/share/keyrings/google-chrome-archive-keyring.gpg

- name: Add Google Chrome repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/google-chrome-archive-keyring.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present
  notify: Update apt cache

# --- 1Password CLI ---
- name: Download 1Password GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg
    creates: /usr/share/keyrings/1password-archive-keyring.gpg

- name: Add 1Password CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/{{ ansible_architecture | replace('x86_64', 'amd64') }} stable main"
    filename: 1password-cli
    state: present
  notify: Update apt cache

# --- Brave Browser ---
- name: Remove conflicting Brave repo config (from Brave installer)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/brave-browser-release.sources
    state: absent
  notify: Update apt cache

- name: Download Brave Browser GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg -o /usr/share/keyrings/brave-browser-archive-keyring.gpg
    creates: /usr/share/keyrings/brave-browser-archive-keyring.gpg

- name: Add Brave Browser repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
    filename: brave-browser
    state: present
  notify: Update apt cache

# --- Node.js (NodeSource) ---
# NodeSource requires their setup script for proper configuration
- name: Install Node.js repository via NodeSource setup script
  ansible.builtin.shell:
    cmd: "curl -fsSL https://deb.nodesource.com/setup_{{ node_major_version }}.x | bash -"
    creates: /etc/apt/sources.list.d/nodesource.list
  notify: Update apt cache

# --- OpenZiti (ziti-edge-tunnel) ---
- name: Remove pre-existing OpenZiti repo config (conflicting signed-by)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/openziti-release.list
    state: absent
  notify: Update apt cache

- name: Download OpenZiti GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://get.openziti.io/tun/package-repos.gpg | gpg --dearmor -o /usr/share/keyrings/openziti-archive-keyring.gpg
    creates: /usr/share/keyrings/openziti-archive-keyring.gpg

- name: Add OpenZiti repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/openziti-archive-keyring.gpg] https://packages.openziti.org/zitipax-openziti-deb-stable debian main"
    filename: openziti
    state: present
  notify: Update apt cache

# --- Flush handlers to update apt cache before package installation ---
- name: Flush handlers to update apt cache
  ansible.builtin.meta: flush_handlers
