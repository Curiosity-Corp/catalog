---
# =============================================================================
# Modern CLI Tools (GitHub Binary Downloads)
# =============================================================================
# Uses stat + uri + unarchive/get_url pattern for idempotent installs.
# Each tool is only downloaded if not already present.
# =============================================================================

# --- lazygit ---
- name: Check if lazygit is installed
  ansible.builtin.stat:
    path: /usr/local/bin/lazygit
  register: lazygit_installed

- name: Get lazygit latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
    return_content: true
  register: lazygit_release
  when: not lazygit_installed.stat.exists

- name: Install lazygit
  ansible.builtin.unarchive:
    src: "https://github.com/jesseduffield/lazygit/releases/download/{{ lazygit_release.json.tag_name }}/lazygit_{{ lazygit_release.json.tag_name | regex_replace('^v', '') }}_Linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [lazygit]
  when: not lazygit_installed.stat.exists

# --- yq ---
- name: Check if yq is installed
  ansible.builtin.stat:
    path: /usr/local/bin/yq
  register: yq_installed

- name: Get yq latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/mikefarah/yq/releases/latest
    return_content: true
  register: yq_release
  when: not yq_installed.stat.exists

- name: Install yq
  ansible.builtin.get_url:
    url: "https://github.com/mikefarah/yq/releases/download/{{ yq_release.json.tag_name }}/yq_linux_amd64"
    dest: /usr/local/bin/yq
    mode: '0755'
  when: not yq_installed.stat.exists

# --- delta ---
- name: Check if delta is installed
  ansible.builtin.stat:
    path: /usr/local/bin/delta
  register: delta_installed

- name: Get delta latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/dandavison/delta/releases/latest
    return_content: true
  register: delta_release
  when: not delta_installed.stat.exists

- name: Install delta
  ansible.builtin.unarchive:
    src: "https://github.com/dandavison/delta/releases/download/{{ delta_release.json.tag_name }}/delta-{{ delta_release.json.tag_name | regex_replace('^v', '') }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: ["delta-{{ delta_release.json.tag_name | regex_replace('^v', '') }}-x86_64-unknown-linux-gnu/delta"]
    extra_opts:
      - --strip-components=1
  when: not delta_installed.stat.exists

# --- zoxide ---
- name: Check if zoxide is installed
  ansible.builtin.stat:
    path: /usr/local/bin/zoxide
  register: zoxide_installed

- name: Install zoxide
  ansible.builtin.shell:
    cmd: curl -fsSL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | bash
    creates: /usr/local/bin/zoxide
  environment:
    BIN_DIR: /usr/local/bin

