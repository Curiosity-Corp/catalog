---
# =============================================================================
# Modern CLI Tools (GitHub Binary Downloads)
# =============================================================================
# Uses stat + uri + unarchive/get_url pattern for idempotent installs.
# Each tool is only downloaded if not already present.
# =============================================================================

# --- lazygit ---
- name: Check installed lazygit version
  ansible.builtin.shell: lazygit --version 2>&1 || echo MISSING
  register: lazygit_current
  changed_when: false
  failed_when: false

- name: Install/upgrade lazygit {{ lazygit_version }}
  when: "lazygit_version not in lazygit_current.stdout"
  block:
    - name: Download lazygit {{ lazygit_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [lazygit]

# --- yq ---
- name: Check installed yq version
  ansible.builtin.shell: yq --version 2>&1 || echo MISSING
  register: yq_current
  changed_when: false
  failed_when: false

- name: Install/upgrade yq {{ yq_version }}
  when: "yq_version not in yq_current.stdout"
  block:
    - name: Download yq {{ yq_version }}
      ansible.builtin.get_url:
        url: "https://github.com/mikefarah/yq/releases/download/v{{ yq_version }}/yq_linux_amd64"
        dest: /usr/local/bin/yq
        mode: '0755'

# --- delta ---
- name: Check installed delta version
  ansible.builtin.shell: delta --version 2>&1 || echo MISSING
  register: delta_current
  changed_when: false
  failed_when: false

- name: Install/upgrade delta {{ delta_version }}
  when: "delta_version not in delta_current.stdout"
  block:
    - name: Download delta {{ delta_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/dandavison/delta/releases/download/{{ delta_version }}/delta-{{ delta_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: ["delta-{{ delta_version }}-x86_64-unknown-linux-gnu/delta"]
        extra_opts:
          - --strip-components=1

# --- zoxide ---
- name: Check installed zoxide version
  ansible.builtin.shell: zoxide --version 2>&1 || echo MISSING
  register: zoxide_current
  changed_when: false
  failed_when: false

- name: Install/upgrade zoxide {{ zoxide_version }}
  when: "zoxide_version not in zoxide_current.stdout"
  block:
    - name: Download zoxide {{ zoxide_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/ajeetdsouza/zoxide/releases/download/v{{ zoxide_version }}/zoxide-{{ zoxide_version }}-x86_64-unknown-linux-musl.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [zoxide]

# --- dust ---
- name: Check if dust is installed
  ansible.builtin.stat:
    path: /usr/local/bin/dust
  register: dust_installed

- name: Get dust latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/bootandy/dust/releases/latest
    return_content: true
  register: dust_release
  when: not dust_installed.stat.exists

- name: Install dust
  ansible.builtin.unarchive:
    src: "https://github.com/bootandy/dust/releases/download/{{ dust_release.json.tag_name }}/dust-{{ dust_release.json.tag_name }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: ["dust-{{ dust_release.json.tag_name }}-x86_64-unknown-linux-gnu/dust"]
    extra_opts:
      - --strip-components=1
  when: not dust_installed.stat.exists

# --- duf ---
- name: Check if duf is installed
  ansible.builtin.stat:
    path: /usr/local/bin/duf
  register: duf_installed

- name: Get duf latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/muesli/duf/releases/latest
    return_content: true
  register: duf_release
  when: not duf_installed.stat.exists

- name: Install duf
  ansible.builtin.unarchive:
    src: "https://github.com/muesli/duf/releases/download/{{ duf_release.json.tag_name }}/duf_{{ duf_release.json.tag_name | regex_replace('^v', '') }}_linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [duf]
  when: not duf_installed.stat.exists

# --- glow ---
- name: Check if glow is installed
  ansible.builtin.stat:
    path: /usr/local/bin/glow
  register: glow_installed

- name: Get glow latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/charmbracelet/glow/releases/latest
    return_content: true
  register: glow_release
  when: not glow_installed.stat.exists

- name: Install glow
  ansible.builtin.unarchive:
    src: "https://github.com/charmbracelet/glow/releases/download/{{ glow_release.json.tag_name }}/glow_{{ glow_release.json.tag_name | regex_replace('^v', '') }}_Linux_x86_64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not glow_installed.stat.exists

- name: Move glow binary to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/glow_{{ glow_release.json.tag_name | regex_replace('^v', '') }}_Linux_x86_64/glow"
    dest: /usr/local/bin/glow
    mode: '0755'
    remote_src: true
  when: not glow_installed.stat.exists

- name: Clean up glow temp files
  ansible.builtin.file:
    path: "/tmp/glow_{{ glow_release.json.tag_name | regex_replace('^v', '') }}_Linux_x86_64"
    state: absent
  when: not glow_installed.stat.exists

# --- just ---
- name: Check if just is installed
  ansible.builtin.stat:
    path: /usr/local/bin/just
  register: just_installed

- name: Get just latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/casey/just/releases/latest
    return_content: true
  register: just_release
  when: not just_installed.stat.exists

- name: Install just
  ansible.builtin.unarchive:
    src: "https://github.com/casey/just/releases/download/{{ just_release.json.tag_name }}/just-{{ just_release.json.tag_name }}-x86_64-unknown-linux-musl.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [just]
  when: not just_installed.stat.exists

# --- watchexec ---
- name: Check if watchexec is installed
  ansible.builtin.stat:
    path: /usr/local/bin/watchexec
  register: watchexec_installed

- name: Get watchexec latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/watchexec/watchexec/releases/latest
    return_content: true
  register: watchexec_release
  when: not watchexec_installed.stat.exists

- name: Install watchexec
  ansible.builtin.unarchive:
    src: "https://github.com/watchexec/watchexec/releases/download/{{ watchexec_release.json.tag_name }}/watchexec-{{ watchexec_release.json.tag_name | regex_replace('^v', '') }}-x86_64-unknown-linux-gnu.tar.xz"
    dest: /usr/local/bin
    remote_src: true
    include: ["watchexec-{{ watchexec_release.json.tag_name | regex_replace('^v', '') }}-x86_64-unknown-linux-gnu/watchexec"]
    extra_opts:
      - --strip-components=1
  when: not watchexec_installed.stat.exists

# --- tokei (installed via apt in packages.yml) ---
# Note: tokei GitHub releases have no binaries since v13. Using apt package instead.

# --- hyperfine ---
- name: Check if hyperfine is installed
  ansible.builtin.stat:
    path: /usr/local/bin/hyperfine
  register: hyperfine_installed

- name: Get hyperfine latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/sharkdp/hyperfine/releases/latest
    return_content: true
  register: hyperfine_release
  when: not hyperfine_installed.stat.exists

- name: Install hyperfine
  ansible.builtin.unarchive:
    src: "https://github.com/sharkdp/hyperfine/releases/download/{{ hyperfine_release.json.tag_name }}/hyperfine-{{ hyperfine_release.json.tag_name }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: ["hyperfine-{{ hyperfine_release.json.tag_name }}-x86_64-unknown-linux-gnu/hyperfine"]
    extra_opts:
      - --strip-components=1
  when: not hyperfine_installed.stat.exists

# --- chezmoi ---
- name: Check if chezmoi is installed
  ansible.builtin.stat:
    path: /usr/local/bin/chezmoi
  register: chezmoi_installed

- name: Install chezmoi  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
    creates: /usr/local/bin/chezmoi

# --- starship ---
- name: Install starship  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -sS https://starship.rs/install.sh | sh -s -- -y
    executable: /bin/bash
    creates: /usr/local/bin/starship

# --- filebrowser (workspace profile) ---
- name: Check if filebrowser is installed
  ansible.builtin.stat:
    path: /usr/local/bin/filebrowser
  register: filebrowser_installed
  when: workstation_profile == 'workspace'

- name: Get filebrowser latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/filebrowser/filebrowser/releases/latest
    return_content: true
  register: filebrowser_release
  when:
    - workstation_profile == 'workspace'
    - not filebrowser_installed.stat.exists

- name: Install filebrowser
  ansible.builtin.unarchive:
    src: "https://github.com/filebrowser/filebrowser/releases/download/{{ filebrowser_release.json.tag_name }}/linux-amd64-filebrowser.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [filebrowser]
  when:
    - workstation_profile == 'workspace'
    - not filebrowser_installed.stat.exists
