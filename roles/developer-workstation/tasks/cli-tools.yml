---
# =============================================================================
# Modern CLI Tools (GitHub Binary Downloads)
# =============================================================================
# Uses stat + uri + unarchive/get_url pattern for idempotent installs.
# Each tool is only downloaded if not already present.
# =============================================================================

# --- lazygit ---
- name: Check installed lazygit version
  ansible.builtin.shell: lazygit --version 2>&1 || echo MISSING
  register: lazygit_current
  changed_when: false
  failed_when: false

- name: Install/upgrade lazygit {{ lazygit_version }}
  when: "lazygit_version not in lazygit_current.stdout"
  block:
    - name: Download lazygit {{ lazygit_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [lazygit]

# --- yq ---
- name: Check installed yq version
  ansible.builtin.shell: yq --version 2>&1 || echo MISSING
  register: yq_current
  changed_when: false
  failed_when: false

- name: Install/upgrade yq {{ yq_version }}
  when: "yq_version not in yq_current.stdout"
  block:
    - name: Download yq {{ yq_version }}
      ansible.builtin.get_url:
        url: "https://github.com/mikefarah/yq/releases/download/v{{ yq_version }}/yq_linux_amd64"
        dest: /usr/local/bin/yq
        mode: '0755'

# --- delta ---
- name: Check installed delta version
  ansible.builtin.shell: delta --version 2>&1 || echo MISSING
  register: delta_current
  changed_when: false
  failed_when: false

- name: Install/upgrade delta {{ delta_version }}
  when: "delta_version not in delta_current.stdout"
  block:
    - name: Download delta {{ delta_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/dandavison/delta/releases/download/{{ delta_version }}/delta-{{ delta_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: ["delta-{{ delta_version }}-x86_64-unknown-linux-gnu/delta"]
        extra_opts:
          - --strip-components=1

