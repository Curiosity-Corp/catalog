# --- glow ---
- name: Check installed glow version
  ansible.builtin.shell: glow --version 2>&1 || echo MISSING
  register: glow_current
  changed_when: false
  failed_when: false

- name: Install/upgrade glow {{ glow_version }}
  when: "glow_version not in glow_current.stdout"
  block:
    - name: Download glow {{ glow_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/charmbracelet/glow/releases/download/v{{ glow_version }}/glow_{{ glow_version }}_Linux_x86_64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Move glow binary to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/glow_{{ glow_version }}_Linux_x86_64/glow"
        dest: /usr/local/bin/glow
        mode: '0755'
        remote_src: true

    - name: Clean up glow temp files
      ansible.builtin.file:
        path: "/tmp/glow_{{ glow_version }}_Linux_x86_64"
        state: absent

