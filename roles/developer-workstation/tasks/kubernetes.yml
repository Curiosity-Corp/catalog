---
# =============================================================================
# Kubernetes & GitOps Tools
# =============================================================================
# Binary downloads from GitHub releases and install scripts
# =============================================================================

# --- Helm ---
- name: Check installed helm version
  ansible.builtin.shell: helm version 2>&1 || echo MISSING
  register: helm_current
  changed_when: false
  failed_when: false

- name: Install/upgrade helm {{ helm_version }}
  when: "helm_version not in helm_current.stdout"
  block:
    - name: Install Helm  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
            | bash
        executable: /bin/bash

# --- Kustomize ---
- name: Check installed kustomize version
  ansible.builtin.shell: kustomize version 2>&1 || echo MISSING
  register: kustomize_current
  changed_when: false
  failed_when: false

- name: Install/upgrade kustomize {{ kustomize_version }}
  when: "kustomize_version not in kustomize_current.stdout"
  block:
    - name: Install Kustomize {{ kustomize_version }}  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -fsSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s {{ kustomize_version }}
          mv kustomize /usr/local/bin/kustomize
        executable: /bin/bash

# --- talosctl ---
- name: Check installed talosctl version
  ansible.builtin.shell: talosctl version --client 2>&1 || echo MISSING
  register: talosctl_current
  changed_when: false
  failed_when: false

- name: Install/upgrade talosctl {{ talosctl_version }}
  when: "talosctl_version not in talosctl_current.stdout"
  block:
    - name: Download talosctl {{ talosctl_version }}
      ansible.builtin.get_url:
        url: "https://github.com/siderolabs/talos/releases/download/v{{ talosctl_version }}/talosctl-linux-amd64"
        dest: /usr/local/bin/talosctl
        mode: "0755"

# --- k9s ---
- name: Check installed k9s version
  ansible.builtin.shell: k9s version 2>&1 || echo MISSING
  register: k9s_current
  changed_when: false
  failed_when: false

- name: Install/upgrade k9s {{ k9s_version }}
  when: "k9s_version not in k9s_current.stdout"
  block:
    - name: Download k9s {{ k9s_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Linux_amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [k9s]

# --- kubectx + kubens ---
- name: Check installed kubectx version
  ansible.builtin.shell: kubectx --version 2>&1 || echo MISSING
  register: kubectx_current
  changed_when: false
  failed_when: false

- name: Install/upgrade kubectx + kubens {{ kubectx_version }}
  when: "kubectx_version not in kubectx_current.stdout"
  block:
    - name: Download kubectx {{ kubectx_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/ahmetb/kubectx/releases/download/v{{ kubectx_version }}/kubectx_v{{ kubectx_version }}_linux_x86_64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [kubectx]

    - name: Download kubens {{ kubectx_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/ahmetb/kubectx/releases/download/v{{ kubectx_version }}/kubens_v{{ kubectx_version }}_linux_x86_64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [kubens]

# --- stern ---
- name: Check installed stern version
  ansible.builtin.shell: stern --version 2>&1 || echo MISSING
  register: stern_current
  changed_when: false
  failed_when: false

- name: Install/upgrade stern {{ stern_version }}
  when: "stern_version not in stern_current.stdout"
  block:
    - name: Download stern {{ stern_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/stern/stern/releases/download/v{{ stern_version }}/stern_{{ stern_version }}_linux_amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [stern]

# --- ArgoCD CLI ---
- name: Check installed argocd version
  ansible.builtin.shell: argocd version --client 2>&1 || echo MISSING
  register: argocd_current
  changed_when: false
  failed_when: false

- name: Install/upgrade argocd {{ argocd_version }}
  when: "argocd_version not in argocd_current.stdout"
  block:
    - name: Download argocd {{ argocd_version }}
      ansible.builtin.get_url:
        url: "https://github.com/argoproj/argo-cd/releases/download/v{{ argocd_version }}/argocd-linux-amd64"
        dest: /usr/local/bin/argocd
        mode: "0755"

# --- Flux CLI ---
- name: Check installed flux version
  ansible.builtin.shell: flux version --client 2>&1 || echo MISSING
  register: flux_current
  changed_when: false
  failed_when: false

- name: Install/upgrade flux {{ flux_version }}
  when: "flux_version not in flux_current.stdout"
  block:
    - name: Download flux {{ flux_version }} install script  # noqa: command-instead-of-module
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -fsSL https://fluxcd.io/install.sh | VERSION="{{ flux_version }}" bash
        executable: /bin/bash

# --- Velero CLI ---
- name: Check installed velero version
  ansible.builtin.shell: velero version --client-only 2>&1 || echo MISSING
  register: velero_current
  changed_when: false
  failed_when: false

- name: Install/upgrade velero {{ velero_version }}
  when: "velero_version not in velero_current.stdout"
  block:
    - name: Download Velero {{ velero_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/vmware-tanzu/velero/releases/download/v{{ velero_version }}/velero-v{{ velero_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Move Velero binary to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/velero-v{{ velero_version }}-linux-amd64/velero"
        dest: /usr/local/bin/velero
        mode: "0755"
        remote_src: true

    - name: Clean up Velero temp files
      ansible.builtin.file:
        path: "/tmp/velero-v{{ velero_version }}-linux-amd64"
        state: absent

# --- Krew (kubectl plugin manager) ---
- name: Install Krew
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd "$(mktemp -d)"
      OS="$(uname | tr '[:upper:]' '[:lower:]')"
      ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')"
      KREW="krew-${OS}_${ARCH}"
      curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/${KREW}.tar.gz"
      tar zxvf "${KREW}.tar.gz"
      ./"${KREW}" install krew
    executable: /bin/bash
    creates: "{{ dev_user_home }}/.krew/bin/kubectl-krew"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

# --- kubeconform ---
- name: Check installed kubeconform version
  ansible.builtin.shell: kubeconform -v 2>&1 || echo MISSING
  register: kubeconform_current
  changed_when: false
  failed_when: false

- name: Install/upgrade kubeconform {{ kubeconform_version }}
  when: "kubeconform_version not in kubeconform_current.stdout"
  block:
    - name: Download kubeconform {{ kubeconform_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/yannh/kubeconform/releases/download/v{{ kubeconform_version }}/kubeconform-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [kubeconform]
