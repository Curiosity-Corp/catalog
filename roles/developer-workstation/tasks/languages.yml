---
# =============================================================================
# Language Runtimes (non-APT)
# =============================================================================
# Go: latest from go.dev          | Deno: GitHub release binary
# Rust: via rustup for dev_user   | Bun: GitHub release binary
# nvm: Node version manager       | Composer: PHP package manager
# pyenv: Python version manager   |
# =============================================================================

# --- Go ---
- name: Check if Go is installed
  ansible.builtin.stat:
    path: /usr/local/go/bin/go
  register: go_installed

- name: Get latest Go version
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: go_version
  when: not go_installed.stat.exists

- name: Install Go
  ansible.builtin.unarchive:
    src: "https://go.dev/dl/{{ go_version.content.split('\n')[0] }}.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: true
  when: not go_installed.stat.exists

- name: Set Go PATH
  ansible.builtin.copy:
    content: 'export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin'
    dest: /etc/profile.d/golang.sh
    mode: '0644'

# --- Rust ---
- name: Check if Rust is installed
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.rustup"
  register: rust_installed

- name: Install Rust via rustup  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y
    executable: /bin/bash
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  when: not rust_installed.stat.exists
  changed_when: true

# --- nvm (Node Version Manager) ---
- name: Check if nvm is installed
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.nvm/nvm.sh"
  register: nvm_installed

- name: Install nvm  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh \
        | PROFILE=/dev/null bash
    executable: /bin/bash
    creates: "{{ dev_user_home }}/.nvm/nvm.sh"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

# --- pyenv ---
- name: Check if pyenv is installed
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.pyenv/bin/pyenv"
  register: pyenv_installed

- name: Install pyenv
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "{{ dev_user_home }}/.pyenv"
    depth: 1
    version: master
  become: true
  become_user: "{{ dev_user }}"
  when: not pyenv_installed.stat.exists

# --- Deno ---
- name: Check if Deno is installed
  ansible.builtin.stat:
    path: /usr/local/bin/deno
  register: deno_installed

- name: Get Deno latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/denoland/deno/releases/latest
    return_content: true
  register: deno_release
  when: not deno_installed.stat.exists

- name: Install Deno
  ansible.builtin.unarchive:
    src: "https://github.com/denoland/deno/releases/download/{{ deno_release.json.tag_name }}/deno-x86_64-unknown-linux-gnu.zip"
    dest: /usr/local/bin
    remote_src: true
    include: [deno]
  when: not deno_installed.stat.exists

# --- Bun ---
- name: Check if Bun is installed
  ansible.builtin.stat:
    path: /usr/local/bin/bun
  register: bun_installed

- name: Download Bun
  ansible.builtin.unarchive:
    src: https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip
    dest: /tmp
    remote_src: true
  when: not bun_installed.stat.exists

- name: Install Bun binary
  ansible.builtin.copy:
    src: /tmp/bun-linux-x64/bun
    dest: /usr/local/bin/bun
    mode: "0755"
    remote_src: true
  when: not bun_installed.stat.exists

- name: Clean up Bun temp files
  ansible.builtin.file:
    path: /tmp/bun-linux-x64
    state: absent

# --- PHP Composer ---
- name: Install Composer (PHP package manager)  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -sS https://getcomposer.org/installer \
        | php -- --install-dir=/usr/local/bin --filename=composer
    executable: /bin/bash
    creates: /usr/local/bin/composer

# --- SDKMAN (JVM version manager) ---
- name: Check if SDKMAN is installed
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.sdkman/bin/sdkman-init.sh"
  register: sdkman_installed

- name: Install SDKMAN  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -s "https://get.sdkman.io?rcupdate=false" | bash
    executable: /bin/bash
    creates: "{{ dev_user_home }}/.sdkman/bin/sdkman-init.sh"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

- name: Configure SDKMAN curl timeouts to fail fast when unreachable
  ansible.builtin.lineinfile:
    path: "{{ dev_user_home }}/.sdkman/etc/config"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^sdkman_curl_connect_timeout=', line: 'sdkman_curl_connect_timeout=2' }
    - { regexp: '^sdkman_curl_max_time=', line: 'sdkman_curl_max_time=3' }
  become: true
  become_user: "{{ dev_user }}"
