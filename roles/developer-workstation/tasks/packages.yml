---
# =============================================================================
# APT Package Installation
# =============================================================================
# All packages from configured repositories installed in a single apt task
# for efficiency. Repos must be configured first (repos.yml).
# =============================================================================

- name: Install all APT packages
  ansible.builtin.apt:
    name:
      # --- Build tools ---
      - build-essential
      - gcc
      - g++
      - make
      - cmake
      - pkg-config
      - autoconf
      - automake
      - libtool
      # --- Python ---
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - pipx
      # --- Node.js ---
      - nodejs
      # --- Java ---
      - openjdk-21-jdk
      # --- Ruby ---
      - ruby
      - ruby-dev
      # --- Git ---
      - git
      - git-lfs
      - tig
      # --- GitHub CLI ---
      - gh
      # --- VS Code ---
      - code
      # --- Google Cloud CLI ---
      - google-cloud-cli
      # --- Cloudflare ---
      - cloudflared
      # --- Browser ---
      - google-chrome-stable
      # --- Kubernetes ---
      - kubectl
      # --- HashiCorp ---
      - terraform
      - packer
      - vault
      # --- 1Password ---
      - 1password-cli
      # --- Ansible ---
      - ansible
      - ansible-lint
      # --- JSON/YAML ---
      - jq
      # --- Modern search/file tools ---
      - ripgrep
      - fd-find
      - bat
      - eza
      # --- Fuzzy finder ---
      - fzf
      # --- Terminal multiplexers/shells ---
      - tmux
      - zsh
      - screen
      # --- Editors ---
      - neovim
      - nano
      # --- Environment ---
      - direnv
      # --- Linting ---
      - shellcheck
      # --- HTTP client ---
      - httpie
      # --- File utilities ---
      - tree
      - ncdu
      - tealdeer
      # --- Archive tools ---
      - unzip
      - zip
      - p7zip-full
      - zstd
      - pigz
      # --- Network diagnostics ---
      - nmap
      - dnsutils
      - mtr-tiny
      - traceroute
      - whois
      - ipcalc
      # --- Network monitoring ---
      - tcpdump
      - iperf3
      - iftop
      # --- System debugging ---
      - strace
      - ltrace
      - sysstat
      - iotop
      - lsof
      - psmisc
      # --- FUSE ---
      - libfuse2
      # --- System essentials ---
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      # --- Clipboard ---
      - xclip
      - wl-clipboard
      # --- Databases (clients) ---
      - sqlite3
      - libsqlite3-dev
      - redis-tools
      - postgresql-client
      - default-mysql-client
      # --- Networking tools ---
      - socat
      - netcat-openbsd
      # --- SSH ---
      - openssh-client
      - sshfs
      # --- VPN ---
      - openvpn
      - wireguard-tools
      # --- Remote desktop ---
      - remmina
      - remmina-plugin-rdp
      - remmina-plugin-vnc
      # --- Encryption/secrets ---
      - age
      - pass
      # --- Misc utilities ---
      - entr
      - pv
      - bc
      - dos2unix
      - rename
      - expect
      - parallel
      - wget
      - curl
      - btop
      - skopeo
    state: present
    update_cache: true
