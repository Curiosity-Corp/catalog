---
# =============================================================================
# APT Package Installation
# =============================================================================
# All packages from configured repositories installed in a single apt task
# for efficiency. Repos must be configured first (repos.yml).
# =============================================================================

- name: Install all APT packages
  ansible.builtin.apt:
    name:
      # --- Build tools ---
      - build-essential
      - gcc
      - g++
      - clang
      - make
      - cmake
      - meson
      - ninja-build
      - pkg-config
      - autoconf
      - automake
      - libtool
      # --- Python ---
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - pipx
      # --- Node.js ---
      - nodejs
      # --- Java ---
      - openjdk-21-jdk
      # --- Ruby ---
      - ruby
      - ruby-dev
      # --- Git ---
      - git
      - git-lfs
      - tig
      # --- GitHub CLI ---
      - gh
      # --- VS Code ---
      - code
      # --- Google Cloud CLI ---
      - google-cloud-cli
      # --- Browsers ---
      - google-chrome-stable
      - brave-browser
      - firefox
      # --- Kubernetes ---
      - kubectl
      # --- HashiCorp ---
      - terraform
      - packer
      - vault
      # --- 1Password ---
      - 1password-cli
      # --- Ansible ---
      - ansible
      - ansible-lint
      # --- JSON/YAML ---
      - jq
      # --- Modern search/file tools ---
      - ripgrep
      - fd-find
      - bat
      - eza
      # --- Fuzzy finder ---
      - fzf
      # --- Terminal multiplexers/shells ---
      - tmux
      - tmate
      - zsh
      - screen
      # --- Editors ---
      - neovim
      - vim
      - nano
      # --- Environment ---
      - direnv
      # --- Linting ---
      - shellcheck
      # --- HTTP client ---
      - httpie
      # --- File utilities ---
      - tree
      - ncdu
      - tealdeer
      - tokei
      # --- Archive tools ---
      - unzip
      - zip
      - p7zip-full
      - zstd
      - pigz
      # --- Network diagnostics ---
      - nmap
      - dnsutils
      - mtr-tiny
      - traceroute
      - whois
      - ipcalc
      # --- Network monitoring ---
      - tcpdump
      - iperf3
      - iftop
      # --- System debugging ---
      - strace
      - ltrace
      - sysstat
      - iotop
      - lsof
      - psmisc
      # --- FUSE ---
      - libfuse2
      # --- System essentials ---
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      # --- Clipboard ---
      - xclip
      - wl-clipboard
      # --- Databases (clients) ---
      - sqlite3
      - libsqlite3-dev
      - redis-tools
      - postgresql-client
      - default-mysql-client
      - mongodb-mongosh
      # --- Networking tools ---
      - socat
      - netcat-openbsd
      # --- SSH ---
      - openssh-client
      - sshfs
      # --- VPN / ZTNA ---
      - openvpn
      - wireguard-tools
      - openziti
      # --- Remote desktop ---
      - remmina
      - remmina-plugin-rdp
      - remmina-plugin-vnc
      - x11vnc
      # --- Desktop configuration ---
      - dconf-cli
      # --- Firewall ---
      - ufw
      # --- Encryption/secrets ---
      # age installed separately (v1.3.1+ for PQ support, see security.yml)
      - pass
      # --- Certificate management ---
      - libnss3-tools
      # --- Misc utilities ---
      - entr
      - pv
      - bc
      - dos2unix
      - rename
      - expect
      - parallel
      - rsync
      - wget
      - curl
      - btop
      - skopeo
      # --- PHP ---
      - php-cli
      - php-curl
      - php-mbstring
      - php-xml
      - php-zip
      # --- .NET ---
      - dotnet-sdk-9.0
      # --- Document conversion ---
      - pandoc
      - graphviz
      - ffmpeg
      - imagemagick
      - texlive-base
      - texlive-latex-extra
      - protobuf-compiler
      # --- Debugger ---
      - gdb
      - lldb
      - valgrind
      - cppcheck
      - xvfb
      # --- Claude Desktop (native Linux app with MCP server support) ---
      - claude-desktop
      # --- Containers (daemonless, no background daemon) ---
      - podman
      - buildah
      # --- pyenv build dependencies ---
      - libssl-dev
      - libbz2-dev
      - libreadline-dev
      - libffi-dev
      - liblzma-dev
      - zlib1g-dev
      # --- Scientific Python system dependencies ---
      - libhdf5-dev
      - libegl1
    state: present
    update_cache: true

# --- Ensure unwanted packages are absent ---
- name: Remove unwanted packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - docker-buildx-plugin
      - rancher
      - cloudflared
      - tailscale
    state: absent
    purge: true

- name: Remove Cloudflare APT repo if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
