---
# =============================================================================
# Chezmoi dotfiles bootstrap
# =============================================================================
# Installs chezmoi and applies the dotfiles repo configured via
# `user_dotfiles_repo`. Skipped entirely when the variable is empty.
#
# System state (this role) owns packages, system config, and /etc/*.
# User state ($HOME/.*) is delegated to chezmoi.
# Zero-PII: no identity values are baked into this role — each user
# supplies their own fork URL via group_vars/host_vars or `-e`.
# =============================================================================

- name: Resolve chezmoi download URL
  ansible.builtin.set_fact:
    _chezmoi_release_api: "https://api.github.com/repos/twpayne/chezmoi/releases/latest"
  when: user_dotfiles_repo | default('') | length > 0

- name: Query latest chezmoi release metadata
  ansible.builtin.uri:
    url: "{{ _chezmoi_release_api }}"
    headers:
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
    return_content: true
    status_code: [200]
  register: _chezmoi_release
  retries: 3
  delay: 10
  until:
    - _chezmoi_release.status == 200
    - (_chezmoi_release.json.assets | default([])) | length > 0
  when: user_dotfiles_repo | default('') | length > 0

- name: Select chezmoi .deb asset for current architecture
  ansible.builtin.set_fact:
    _chezmoi_deb_url: "{{ _chezmoi_match[0].browser_download_url }}"
  vars:
    _deb_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    _chezmoi_asset: "chezmoi_{{ _chezmoi_release.json.tag_name | regex_replace('^v', '') }}_linux_{{ _deb_arch }}.deb"
    _chezmoi_match: "{{ _chezmoi_release.json.assets | default([]) | selectattr('name', 'eq', _chezmoi_asset) | list }}"
  when:
    - user_dotfiles_repo | default('') | length > 0
    - _chezmoi_match | length > 0

- name: Fail clearly when chezmoi .deb asset cannot be resolved
  ansible.builtin.fail:
    msg: |-
      Could not locate a chezmoi .deb asset for architecture '{{ _deb_arch }}'
      in release '{{ _chezmoi_release.json.tag_name | default('<unknown>') }}'
      ({{ (_chezmoi_release.json.assets | default([])) | length }} assets returned).
      Expected asset name: chezmoi_<version>_linux_{{ _deb_arch }}.deb
      Check https://github.com/twpayne/chezmoi/releases/latest — if the asset
      naming has changed, update roles/developer-workstation/tasks/dotfiles.yml.
  vars:
    _deb_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
  when:
    - user_dotfiles_repo | default('') | length > 0
    - _chezmoi_deb_url is not defined

- name: Install chezmoi from upstream .deb
  ansible.builtin.apt:
    deb: "{{ _chezmoi_deb_url }}"
    state: present
  when: user_dotfiles_repo | default('') | length > 0

- name: Check whether chezmoi source-state is already initialized for dev_user
  ansible.builtin.stat:
    path: "{{ dev_user_home }}/.local/share/chezmoi/.git"
  register: _chezmoi_src
  when: user_dotfiles_repo | default('') | length > 0

- name: Initialize chezmoi against the user's dotfiles repo
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - "120"
      - /tmp/.chezmoi-sync.lock
      - chezmoi
      - init
      - --apply
      - --force
      - "{{ user_dotfiles_repo }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    # Non-interactive init — env vars feed the .chezmoi.toml.tmpl prompts.
    # Set these in host_vars / group_vars. Empty strings keep the role
    # PII-free; per-user values live only on the target machine.
    CHEZMOI_NAME: "{{ chezmoi_user_name | default('') }}"
    CHEZMOI_EMAIL: "{{ chezmoi_user_email | default('') }}"
    CHEZMOI_PROFILE: "{{ workstation_profile }}"
    CHEZMOI_EDITOR: >-
      {{
        chezmoi_editor
        | default(
            ('nvim' if workstation_profile in ['workspace', 'thin-client']
             else preferred_editor),
            true
          )
      }}
  when:
    - user_dotfiles_repo | default('') | length > 0
    - not _chezmoi_src.stat.exists
  changed_when: true

- name: Update chezmoi source state for existing dotfiles checkout
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - "120"
      - /tmp/.chezmoi-sync.lock
      - chezmoi
      - update
      - --force
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    CHEZMOI_NAME: "{{ chezmoi_user_name | default('') }}"
    CHEZMOI_EMAIL: "{{ chezmoi_user_email | default('') }}"
    CHEZMOI_PROFILE: "{{ workstation_profile }}"
    CHEZMOI_EDITOR: >-
      {{
        chezmoi_editor
        | default(
            ('nvim' if workstation_profile in ['workspace', 'thin-client']
             else preferred_editor),
            true
          )
      }}
  when:
    - user_dotfiles_repo | default('') | length > 0
    - _chezmoi_src.stat.exists
  changed_when: true

- name: Apply chezmoi state to $HOME
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - "120"
      - /tmp/.chezmoi-sync.lock
      - chezmoi
      - apply
      - --force
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
    CHEZMOI_NAME: "{{ chezmoi_user_name | default('') }}"
    CHEZMOI_EMAIL: "{{ chezmoi_user_email | default('') }}"
    CHEZMOI_PROFILE: "{{ workstation_profile }}"
    CHEZMOI_EDITOR: >-
      {{
        chezmoi_editor
        | default(
            ('nvim' if workstation_profile in ['workspace', 'thin-client']
             else preferred_editor),
            true
          )
      }}
  when: user_dotfiles_repo | default('') | length > 0
  changed_when: true
