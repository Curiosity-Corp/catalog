---
# =============================================================================
# Coder CLI
# =============================================================================
# The Coder CLI is required on desktops, Coder workspaces, and thin clients.
# Keep it separate from cloud provider CLIs so access-only machines do not pull
# AWS/Azure/GitLab tooling.
#
# The client must match the deployment's server version exactly (Coder
# refuses `coder ssh` and other RPC-driven commands on a mismatch), so this
# tracks the live server version via /api/v2/buildinfo instead of a static
# pin. If the deployment can't be reached, skip the install/upgrade steps
# entirely rather than falling back to any hardcoded version.
# =============================================================================

- name: Query Coder deployment build info
  ansible.builtin.uri:
    url: "{{ coder_cli_buildinfo_url }}"
    return_content: true
  register: coder_cli_buildinfo
  failed_when: false
  changed_when: false

- name: Set Coder deployment version
  ansible.builtin.set_fact:
    coder_cli_deployment_version: >-
      {{
        ((coder_cli_buildinfo.json.version | default(''))
        | regex_replace('^v', '')
        | regex_replace('\+.*$', ''))
      }}
  when: >-
    (coder_cli_buildinfo.status | default(0)) == 200 and
    (coder_cli_buildinfo.json.version | default('')) != ''

- name: Check if Coder CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/coder
  register: coder_cli_installed

- name: Get installed Coder CLI version
  ansible.builtin.command:
    cmd: /usr/local/bin/coder version --output json
  register: coder_cli_version_json
  changed_when: false
  failed_when: false
  when: coder_cli_installed.stat.exists

- name: Set installed Coder CLI version
  ansible.builtin.set_fact:
    coder_cli_current_version: >-
      {{
        ((((coder_cli_version_json.stdout | default('{}')) | from_json).version
        | default(''))
        | regex_replace('^v', '')
        | regex_replace('\+.*$', ''))
      }}
  when: coder_cli_installed.stat.exists

- name: Set Coder CLI needs upgrade flag
  ansible.builtin.set_fact:
    coder_cli_needs_upgrade: >-
      {{
        (coder_cli_deployment_version | default('')) != '' and
        (
          (not coder_cli_installed.stat.exists) or
          ((coder_cli_current_version | default('')) == '') or
          ((coder_cli_current_version | default('0.0.0'))
          is version(coder_cli_deployment_version, '!='))
        )
      }}

- name: Download Coder CLI installer
  ansible.builtin.get_url:
    url: "{{ coder_cli_install_script_url }}"
    dest: /tmp/install-coder.sh
    mode: "0755"
    force: true
  when: coder_cli_needs_upgrade

- name: Install Coder CLI
  ansible.builtin.command:
    cmd: /bin/sh /tmp/install-coder.sh
  register: coder_cli_install_result
  # This deployment-served install.sh (as opposed to the generic
  # coder.com/install.sh) always downloads the standalone binary matching
  # this Coder server and takes no --method/--version flags; passing either
  # makes it exit 1 with "Unknown flag" before downloading anything. Keep
  # failed_when: false as a safety net for transient download hiccups, since
  # the version check at the top of this task is the authoritative
  # idempotence gate and will simply retry the install on the next run.
  failed_when: false
  changed_when: coder_cli_install_result.rc == 0
  when: coder_cli_needs_upgrade

- name: Clean up Coder CLI installer
  ansible.builtin.file:
    path: /tmp/install-coder.sh
    state: absent
  when: coder_cli_needs_upgrade
