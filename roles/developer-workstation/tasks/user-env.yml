---
# =============================================================================
# User Environment — System-Level Setup
# =============================================================================
# This file handles OS-level plumbing that every developer machine needs
# regardless of dotfiles strategy:
#   - symlinks for renamed Ubuntu packages (fdfind -> fd, batcat -> bat)
#   - Oh My Zsh installation and plugin cloning under ~/.oh-my-zsh
#
# Shell RC content (.bashrc / .zshrc / .bash_aliases) now lives in
# FocusApiary/dotfiles-base and is managed by chezmoi via tasks/dotfiles.yml.
# When user_dotfiles_repo is empty (legacy path), tasks/main.yml also
# includes user-shell-fallback.yml to populate rc files directly.
# =============================================================================

# --- Symlinks for renamed Ubuntu packages ---
- name: Create fd symlink (fdfind -> fd)
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
    force: true

- name: Create bat symlink (batcat -> bat)
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: /usr/local/bin/bat
    state: link
    force: true

# User-scoped npm packages are the canonical owner of Node.js CLI commands.
# Put that bin directory before system-wide shims so every login shell runs the
# copy that the nightly update task actually refreshes.
- name: Put user npm global binaries first in login-shell PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/curiosity-npm-global.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the Curiosity developer-workstation role.
      if [ -d "$HOME/.npm-global/bin" ]; then
        export PATH="$HOME/.npm-global/bin:$PATH"
      fi

# --- Oh My Zsh ---
# Installed in $HOME regardless of dotfiles strategy. chezmoi's .zshrc
# sources $HOME/.oh-my-zsh/oh-my-zsh.sh if present.
- name: Install or update Oh My Zsh from its Git repository
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ dev_user_home }}/.oh-my-zsh"
    depth: 1
    version: master
    force: false
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

- name: Install zsh-autosuggestions plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: "{{ dev_user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    depth: 1
    version: master
  become: true
  become_user: "{{ dev_user }}"

- name: Install zsh-syntax-highlighting plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ dev_user_home }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    depth: 1
    version: master
  become: true
  become_user: "{{ dev_user }}"
