---
# =============================================================================
# UFW Firewall Configuration
# =============================================================================
# Default deny incoming, allow outgoing. SSH open on all interfaces.
# VNC (5900/tcp) restricted to ziti0 (OpenZiti tunnel) only.
# =============================================================================

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH on all interfaces
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: SSH

- name: Allow VNC on ziti0 only
  community.general.ufw:
    rule: allow
    port: "5900"
    proto: tcp
    interface: ziti0
    direction: in
    comment: x11vnc via OpenZiti

- name: Allow all OpenZiti traffic on ziti0
  community.general.ufw:
    rule: allow
    interface: ziti0
    direction: in
    comment: OpenZiti tunnel traffic

- name: Enable UFW
  community.general.ufw:
    state: enabled

# =============================================================================
# fail2ban
# =============================================================================
# Bans repeat SSH auth failures on top of the UFW rules above. Minimal jail
# config — only the sshd jail, since other jails may target services that
# aren't guaranteed to be present on every host.
# =============================================================================

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Deploy fail2ban jail.local (sshd jail)
  ansible.builtin.copy:
    content: |
      [sshd]
      enabled = true
      port = ssh
      maxretry = 5
      bantime = 1h
    dest: /etc/fail2ban/jail.local
    mode: "0644"

- name: Ensure fail2ban is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: restarted
    daemon_reload: true
