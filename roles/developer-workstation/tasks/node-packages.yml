---
# =============================================================================
# Node.js Global Packages
# =============================================================================
# Installed via npm global with version pinning. Node.js itself is installed
# via APT (packages.yml). Each package is checked against its pinned version
# in defaults/main.yml before installing/upgrading.
# =============================================================================

# --- pnpm ---
- name: Check installed pnpm version
  ansible.builtin.shell: npm list -g pnpm --depth=0 2>/dev/null || echo MISSING
  register: pnpm_current
  changed_when: false
  failed_when: false

- name: Install/upgrade pnpm {{ pnpm_version }}
  community.general.npm:
    name: pnpm
    version: "{{ pnpm_version }}"
    global: true
    state: present
  when: "pnpm_version not in pnpm_current.stdout"
  register: _npm_pnpm_result
  failed_when:
    - _npm_pnpm_result is failed
    - "'EACCES' not in (_npm_pnpm_result.msg | default(''))"

