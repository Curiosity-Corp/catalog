---
# =============================================================================
# Python Tools
# =============================================================================
# Uses pipx for isolated Python tool installs and uv as fast pip replacement.
# Python and pipx are installed via APT (packages.yml).
# =============================================================================

- name: Ensure pipx is configured
  ansible.builtin.command: pipx ensurepath
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  changed_when: false

- name: Install uv (fast pip replacement)  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://astral.sh/uv/install.sh | sh
    executable: /bin/bash
    creates: "{{ dev_user_home }}/.local/bin/uv"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

- name: Install Python tools via pipx
  community.general.pipx:
    name: "{{ item }}"
    state: present
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"
  loop:
    - ruff
    - poetry
    - pre-commit
    - jupyterlab
    - ipython
  register: _pipx_result
  failed_when:
    - _pipx_result is failed
    - "'already' not in (_pipx_result.msg | default(''))"
