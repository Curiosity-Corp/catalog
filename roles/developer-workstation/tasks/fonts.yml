---
# =============================================================================
# Font Installation
# =============================================================================
# JetBrains Mono Nerd Font for terminal and editor use
# =============================================================================

- name: Create font directory
  ansible.builtin.file:
    path: /usr/share/fonts/truetype/jetbrains-mono-nerd
    state: directory
    mode: '0755'

- name: Resolve latest JetBrains Mono Nerd Font asset
  ansible.builtin.set_fact:
    _nerd_fonts_asset: >-
      {{ latest_github_releases.nerd_fonts.assets
         | selectattr('name', 'equalto', 'JetBrainsMono.tar.xz') | first }}

- name: Require a verified JetBrains Mono Nerd Font asset
  ansible.builtin.assert:
    that:
      - _nerd_fonts_asset | default({}) | length > 0
      - _nerd_fonts_asset.digest | default('') is match('^sha256:[0-9a-f]{64}$')

- name: Download latest JetBrains Mono Nerd Font
  ansible.builtin.get_url:
    url: "{{ _nerd_fonts_asset.browser_download_url }}"
    dest: "{{ workstation_update_artifact_cache_dir }}/nerd-fonts-{{ _nerd_fonts_asset.digest | regex_replace('^sha256:', '') }}.archive"
    checksum: "{{ _nerd_fonts_asset.digest }}"
    mode: '0644'
    force: false

- name: Install JetBrains Mono Nerd Font
  ansible.builtin.unarchive:
    src: "{{ workstation_update_artifact_cache_dir }}/nerd-fonts-{{ _nerd_fonts_asset.digest | regex_replace('^sha256:', '') }}.archive"
    dest: /usr/share/fonts/truetype/jetbrains-mono-nerd
    remote_src: true
  notify: Update font cache
