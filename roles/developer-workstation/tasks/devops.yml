---
# =============================================================================
# DevOps Utilities
# =============================================================================
# Container, API, and file management tools
# =============================================================================

# --- rclone ---
- name: Check installed rclone version
  ansible.builtin.shell: rclone version 2>&1 || echo MISSING
  register: rclone_current
  changed_when: false
  failed_when: false

- name: Install/upgrade rclone {{ rclone_version }}
  when: "rclone_version not in rclone_current.stdout"
  block:
    - name: Download rclone {{ rclone_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/rclone/rclone/releases/download/v{{ rclone_version }}/rclone-v{{ rclone_version }}-linux-amd64.zip"
        dest: /tmp
        remote_src: true

    - name: Install rclone binary
      ansible.builtin.copy:
        src: "/tmp/rclone-v{{ rclone_version }}-linux-amd64/rclone"
        dest: /usr/local/bin/rclone
        mode: "0755"
        remote_src: true

    - name: Clean up rclone temp files
      ansible.builtin.file:
        path: "/tmp/rclone-v{{ rclone_version }}-linux-amd64"
        state: absent

