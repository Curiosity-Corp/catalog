---
# =============================================================================
# DevOps Utilities
# =============================================================================
# Container, API, and file management tools
# =============================================================================

# --- rclone ---
- name: Install rclone  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://rclone.org/install.sh | bash
    executable: /bin/bash
    creates: /usr/bin/rclone

# --- grpcurl ---
- name: Check if grpcurl is installed
  ansible.builtin.stat:
    path: /usr/local/bin/grpcurl
  register: grpcurl_installed

- name: Get grpcurl latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/fullstorydev/grpcurl/releases/latest
    return_content: true
  register: grpcurl_release
  when: not grpcurl_installed.stat.exists

- name: Install grpcurl
  ansible.builtin.unarchive:
    src: "https://github.com/fullstorydev/grpcurl/releases/download/{{ grpcurl_release.json.tag_name }}/grpcurl_{{ grpcurl_release.json.tag_name | regex_replace('^v', '') }}_linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [grpcurl]
  when: not grpcurl_installed.stat.exists

# --- crane (container registry tool) ---
- name: Check if crane is installed
  ansible.builtin.stat:
    path: /usr/local/bin/crane
  register: crane_installed

- name: Get crane latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/google/go-containerregistry/releases/latest
    return_content: true
  register: crane_release
  when: not crane_installed.stat.exists

- name: Install crane
  ansible.builtin.unarchive:
    src: "https://github.com/google/go-containerregistry/releases/download/{{ crane_release.json.tag_name }}/go-containerregistry_Linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [crane]
  when: not crane_installed.stat.exists

# --- OpenTofu ---
- name: Check if tofu is installed
  ansible.builtin.stat:
    path: /usr/local/bin/tofu
  register: tofu_installed

- name: Get OpenTofu latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/opentofu/opentofu/releases/latest
    return_content: true
  register: tofu_release
  when: not tofu_installed.stat.exists

- name: Install OpenTofu
  ansible.builtin.unarchive:
    src: "https://github.com/opentofu/opentofu/releases/download/{{ tofu_release.json.tag_name }}/tofu_{{ tofu_release.json.tag_name | regex_replace('^v', '') }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    include: [tofu]
  when: not tofu_installed.stat.exists

# --- act (GitHub Actions local runner) ---
- name: Check if act is installed
  ansible.builtin.stat:
    path: /usr/local/bin/act
  register: act_installed

- name: Get act latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/nektos/act/releases/latest
    return_content: true
  register: act_release
  when: not act_installed.stat.exists

- name: Install act
  ansible.builtin.unarchive:
    src: "https://github.com/nektos/act/releases/download/{{ act_release.json.tag_name }}/act_Linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [act]
  when: not act_installed.stat.exists
