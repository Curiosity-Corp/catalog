# Picom config — optimized for Intel integrated graphics / minimal Openbox
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
xrender-sync-fence = true;

# Faster fading (snappy, not sluggish)
fading = true;
fade-in-step = 0.12;
fade-out-step = 0.12;
fade-delta = 8;
no-fading-openclose = false;

# No shadows — saves compositing overhead
shadow = false;

# Opacity — full for active, subtle dim for inactive
inactive-opacity = 0.93;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Blur off — saves GPU cycles on integrated graphics
blur-background = false;

# Detect rounded corners to avoid glitches
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Unredir fullscreen for better Firefox video/game perf
unredir-if-possible = true;

# Window type overrides
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.9; };
    dock = { shadow = false; opacity = 1.0; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; fade = false; };
    dropdown_menu = { opacity = 0.95; fade = false; };
};
