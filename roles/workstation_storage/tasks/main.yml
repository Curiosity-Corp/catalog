---
# Encrypted btrfs /home volume. Before the cutover this role only installs
# packages, scripts, units and configs and stages fstab/crypttab; it never
# touches the live /etc/fstab, /etc/crypttab, any mount or any session. After
# the cutover marker exists it keeps the active entries and the timers in
# place (scrub and trim only: no snapshots, no backups). See docs/storage.md.

- name: Opt-in storage layout
  when: workstation_storage_enabled | bool
  block:
    - name: Validate storage inputs
      ansible.builtin.assert:
        that:
          - workstation_storage_luks_uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - workstation_storage_fs_uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - workstation_storage_mapper is match('^[a-z][a-z0-9_-]*$')
          - workstation_storage_data_mount is match('^/[A-Za-z0-9/_.-]+$')
          - workstation_storage_users | length > 0
          - workstation_storage_users | map(attribute='name') | reject('match', '^[a-z_][a-z0-9_-]*$') | list | length == 0
          - workstation_storage_extra_mounts | map(attribute='subvol') | reject('match', '^@[A-Za-z0-9_-]+$') | list | length == 0
          - workstation_storage_extra_mounts | map(attribute='path') | reject('match', '^/[A-Za-z0-9/_.-]+$') | list | length == 0
        fail_msg: >-
          workstation_storage_* variables are invalid: UUIDs must be lowercase
          hex, users must be a non-empty list of {name: ...}, paths absolute.

    - name: Install storage packages
      ansible.builtin.apt:
        name: [btrfs-progs, cryptsetup, rsync]
        state: present

    - name: Create storage state directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/hh-storage, mode: "0755"}
        - {path: /var/lib/hh-storage, mode: "0700"}
        - {path: /var/lib/hh-storage/staged, mode: "0700"}
        - {path: /var/lib/hh-storage/logs, mode: "0700"}
        - {path: /var/lib/hh-storage/manifests, mode: "0700"}
        - {path: /.snapshots, mode: "0755"}
        - {path: "{{ workstation_storage_data_mount }}", mode: "0755"}

    - name: Install storage scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/sbin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - hh-storage-sync
        - hh-storage-cutover
        - hh-storage-postboot
        - hh-storage-postreboot
        - hh-storage-cutover-fast
        - hh-storage-reclaim
        - hh-storage-provision
        - hh-btrfs-scrub

    - name: Install storage configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: storage.conf.j2, dest: /etc/hh-storage/storage.conf}

    - name: Read the live fstab and crypttab
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/fstab, /etc/crypttab]
      register: workstation_storage_live

    - name: Compute the staged fstab and crypttab bases
      ansible.builtin.set_fact:
        workstation_storage_fstab_base: >-
          {{ (workstation_storage_live.results[0].content | b64decode)
          | regex_replace('(?ms)^# BEGIN workstation_storage\n.*?^# END workstation_storage\n?', '') }}
        workstation_storage_crypttab_base: >-
          {{ (workstation_storage_live.results[1].content | b64decode)
          | regex_replace('(?m)^' ~ workstation_storage_mapper ~ '\\s.*\n?', '') }}

    - name: Stage fstab and crypttab (never the live files)
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/var/lib/hh-storage/staged/{{ item.name }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - {src: staged-fstab.j2, name: fstab}
        - {src: staged-crypttab.j2, name: crypttab}

    - name: Install storage units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - hh-btrfs-scrub.service
        - hh-btrfs-scrub.timer
      notify: Reload systemd for storage units

    # Workstations are disposable: no local snapshots and no backups. Earlier
    # versions of this role installed an hourly btrbk snapshot timer and a
    # nightly restic timer; stop them where they exist, then remove their units
    # and configuration. Existing snapshot and restic data is left in place.
    - name: Look for retired snapshot and backup timers
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hh-btrbk.timer
        - /etc/systemd/system/hh-backup.timer
        - /usr/lib/systemd/system/btrbk.timer
      register: workstation_storage_retired_timers

    - name: Stop and disable retired snapshot and backup timers
      ansible.builtin.systemd:
        name: "{{ item.item | basename }}"
        enabled: false
        state: stopped
      loop: "{{ workstation_storage_retired_timers.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Remove retired snapshot and backup units, scripts and configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/hh-btrbk.timer
        - /etc/systemd/system/hh-btrbk.service
        - /etc/systemd/system/hh-backup.timer
        - /etc/systemd/system/hh-backup.service
        - /usr/local/sbin/hh-backup
        - /etc/btrbk/hh-storage.conf
        - /etc/hh-storage/backup-excludes
      notify: Reload systemd for storage units

    - name: Provision the data volume on a blank device
      ansible.builtin.command:
        cmd: >-
          /usr/local/sbin/hh-storage-provision {{ workstation_storage_device }}
          {{ workstation_storage_luks_size }} {{ workstation_storage_luks_key_file }}
          {{ workstation_storage_tpm2_pcrs }}
        creates: /var/lib/hh-storage/luks-header-hh-data.img
      when:
        - workstation_storage_provision | bool
        - workstation_storage_device | length > 0
        - workstation_storage_luks_key_file | length > 0

    - name: Check for the cutover marker
      ansible.builtin.stat:
        path: /var/lib/hh-storage/cutover-complete
      register: workstation_storage_cutover

    - name: Keep the active mounts and timers after the cutover
      ansible.builtin.include_tasks: after_cutover.yml
      when: workstation_storage_cutover.stat.exists
