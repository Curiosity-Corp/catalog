---
# Runs only once /var/lib/hh-storage/cutover-complete exists.
- name: Keep the data volume in crypttab
  ansible.builtin.lineinfile:
    path: /etc/crypttab
    regexp: "^{{ workstation_storage_mapper }}\\s"
    line: "{{ lookup('ansible.builtin.template', 'crypttab-entry.j2') | trim }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Keep the data volume mounts in fstab
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} workstation_storage"
    block: "{{ lookup('ansible.builtin.template', 'fstab-entries.j2') | trim }}"
  notify: Reload systemd for storage units

- name: Do not start user managers on an unmounted /home
  ansible.builtin.copy:
    dest: /etc/systemd/system/user@.service.d/10-require-home.conf
    content: |
      [Unit]
      RequiresMountsFor=/home
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for storage units

- name: Create the write-heavy path subvolumes on the data volume
  ansible.builtin.command:
    cmd: "btrfs subvolume create {{ workstation_storage_data_mount }}/{{ item.subvol }}"
    creates: "{{ workstation_storage_data_mount }}/{{ item.subvol }}"
  loop: "{{ workstation_storage_hot_paths }}"

- name: Create the hot path mount points
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop: "{{ workstation_storage_hot_paths }}"

- name: Stop and disable retired snapshot and backup timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [hh-btrbk.timer, hh-backup.timer, btrbk.timer]
  failed_when: false

- name: Enable the monthly scrub and the weekly trim
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - hh-btrfs-scrub.timer
    - fstrim.timer
