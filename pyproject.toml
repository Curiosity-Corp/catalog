[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstack"
dynamic = ["version"]
description = "Camera, lighting and voice for Teams, Zoom and streams on Linux, with an optional Claude auto-cinematographer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Runtime pieces come from the distribution: python3-gi (tray), PipeWire with the zam-plugins and DeepFilterNet
# LADSPA plugins (the voice chain), ffmpeg, v4l-utils, pulseaudio-utils, alsa-utils (amixer).
dependencies = []
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.optional-dependencies]
canon = ["gphoto2>=2.5"]
# Elgato Stream Deck keys (`streamstack deck run`); the library also needs the system hidapi (libhidapi-libusb0).
deck = ["streamdeck>=0.9.8", "pillow>=10.1"]
# Background blur on the Arc (streamstack.engine.segment); optional, the Console says why it is unavailable without it.
blur = ["numpy>=1.26", "openvino>=2026.1"]
framing = ["numpy>=1.26", "opencv-python-headless>=4.10", "openvino>=2026.1"]
# tools/bench_ai.py (offline AI benchmark, not shipped in the wheel); the GPU busy figure also needs intel_gpu_top.
bench = ["numpy>=1.26", "opencv-python-headless>=4.10", "openvino>=2026.1", "onnxruntime>=1.20"]
# WHIP publishing (streamstack.stream.whip): aiortc's ICE, DTLS-SRTP and RTP stack, which also brings av and pyOpenSSL.
whip = ["aiortc>=1.15.0"]
# Lossless JPEG XL recompression of camera JPEGs (streamstack.stills): imagecodecs bundles libjxl; without it the
# system libjxl (libjxl0.11) is used when present.
stills = ["imagecodecs>=2024.6"]
# Global hotkeys on Wayland (streamstack.hotkeys_portal): the XDG GlobalShortcuts portal over D-Bus. X11 needs nothing.
shortcuts = ["jeepney>=0.9"]
# WHEP preview of the program picture in the Console (streamstack.console.whep): the same aiortc as WHIP publishing.
whep = ["aiortc>=1.15.0"]
# Calendar-aware setup (streamstack.meetings): the desktop keyring (Secret Service) keeps the Microsoft sign-in and private calendar links.
calendar = ["keyring>=25"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
e2e = ["pytest>=8", "playwright>=1.64", "aiortc>=1.15.0"]  # aiortc: the WebRTC preview test needs it

[project.scripts]
streamstack = "streamstack.cli:main"
streamstack-auto = "streamstack.auto:main"
streamstack-console = "streamstack.console.launcher:main"
streamstack-tray = "streamstack.tray:main"

[tool.setuptools.dynamic]
version = { attr = "streamstack.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamstack = ["data/**/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603", "S607",  # running local tools (ffmpeg, pactl, v4l2-ctl) is the point
    "S108",          # /tmp fallback for XDG_RUNTIME_DIR is intentional
    "S310",          # urllib to the fixed Anthropic API endpoint
    "S606",          # exec of ffplay and the bridge command replaces this process on purpose
    "SIM105",
    "B008",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["streamstack", "support"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
