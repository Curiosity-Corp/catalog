# Licence inventory of the curiosity.workstation collection (catalog#48).
#
# This is the machine-readable twin of THIRD_PARTY.md: every file in the built
# collection must match an annotation here. It follows the REUSE specification
# 3.3 (https://reuse.software/spec-3.3/), so `reuse lint` reads it; the
# Curiosity-* keys are this project's inventory fields and REUSE ignores them.
#
#   Curiosity-Kind          first-party | vendored | derived | patch | key-material
#   Curiosity-Source        where the material comes from
#   Curiosity-Version       release, tag or commit it was taken from
#   Curiosity-Provenance    resolved | needs-review (ships because a role task
#                           needs it; the open question has a follow-up issue)
#   Curiosity-Redistribution  what a redistributor of the built collection must do
#   Curiosity-Follow-Up     the issue that resolves an open question
#
# How the CI check works (the `third_party` job, docs/release-checklist.md):
#
# - First-party annotations match text files by extension and the role scripts
#   by name, with precedence "aggregate". Images, fonts, archives, installers,
#   keys and certificates are never matched by a glob: each one is listed below,
#   so an unlisted one fails `reuse lint` with "no license identifier".
# - Third-party and reviewed files are listed by exact path with precedence
#   "override", so the notice inside them is recorded here, not read from them.
# - A file under a first-party glob that carries its own copyright or licence
#   notice is third-party material nobody listed; the job fails on it.
#
# Annotations are read top to bottom and the last match wins, so keep the broad
# first-party globs first and the exact third-party paths last.
version = 1

