---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: python:3.13-slim

stages:
  - test
  - security
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.venv:
  before_script:
    # The shared runner is non-root: tools go into a disposable virtualenv.
    - python -m venv .ci-venv
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
    - python -m pip install --upgrade pip

lint:
  extends: .venv
  stage: test
  script:
    - python -m pip install "ruff>=0.6"
    - ruff check src tests
    - ruff format --check src tests

test:
  extends: .venv
  stage: test
  parallel:
    matrix:
      - PYTHON_IMAGE: ["python:3.10-slim", "python:3.13-slim"]
  image: $PYTHON_IMAGE
  script:
    - python -m pip install -e ".[dev,auto]"
    - python -m pytest --cov=streamstack --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

audit:
  extends: .venv
  stage: security
  script:
    - python -m pip install pip-audit
    - python -m pip install ".[auto]"
    - pip-audit --skip-editable

package:
  extends: .venv
  stage: package
  script:
    - python -m pip install build
    - python -m build
    - python -m pip install dist/*.whl
    - streamstack --version
    - streamstack call-settings >/dev/null
    - python -c "from streamstack.config import data_dir; assert (data_dir() / 'obs/scenes.json').is_file()"
    - cd dist && sha256sum * | tee SHA256SUMS
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
