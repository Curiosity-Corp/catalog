---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: python:3.13-slim

stages:
  - validate
  - test
  - security
  - package

variables:
  ANSIBLE_FORCE_COLOR: "1"
  ANSIBLE_NOCOLOR: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "0"

.python_setup:
  before_script:
    # The shared Kubernetes runner is intentionally non-root. Keep jobs
    # portable by installing tools into a disposable workspace virtualenv.
    - python -m venv .ci-venv
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
    - python -m pip install --upgrade pip
    - python -m pip install ansible-core ansible-lint yamllint pyyaml pytest
    - ansible-galaxy collection install -r requirements.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

yaml:
  extends: .python_setup
  stage: validate
  script:
    - yamllint -f parsable .github .gitlab docs examples playbooks roles .gitlab-ci.yml galaxy.yml requirements.yml renovate.json

syntax:
  extends: .python_setup
  stage: validate
  script:
    - ANSIBLE_ROLES_PATH=roles ansible-playbook --syntax-check -i localhost, playbooks/site.yml

lint:
  extends: .python_setup
  stage: validate
  script:
    - ANSIBLE_ROLES_PATH=roles ansible-lint playbooks/site.yml roles

policy:
  extends: .python_setup
  stage: test
  script:
    - python tests/test_update_policy.py
    - >-
      python -m pytest -q tests/test_public_contract.py tests/test_console_tuning.py
      tests/test_tmp_hygiene.py tests/test_workstation_posture.py tests/test_hardware_profiles.py
      tests/test_desktop_multiuser.py tests/test_apt_keyring_policy.py
      tests/test_user_systemd_policy.py tests/test_pipx_repair.py
      tests/test_science_venv_repair.py tests/test_m365_cli_entrypoints.py
      tests/test_sunshine_asset_selection.py tests/test_update_rollback_symlinks.py

collection:
  extends: .python_setup
  stage: package
  script:
    - ansible-galaxy collection build --force
    - python scripts/normalize_collection_artifact.py "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
    - test -n "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
  artifacts:
    name: "curiosity-workstation-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "*.tar.gz"
    expire_in: 30 days

sbom:
  extends: .python_setup
  stage: package
  needs:
    - job: collection
      artifacts: true
  script:
    - python scripts/build_collection_sbom.py "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)" collection.cdx.json
  artifacts:
    paths:
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

provenance:
  extends: .python_setup
  stage: package
  needs:
    - job: collection
      artifacts: true
    - job: sbom
      artifacts: true
  script:
    - sha256sum *.tar.gz collection.cdx.json | tee collection.sha256
  artifacts:
    paths:
      - collection.sha256
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

secret_hygiene:
  extends: .python_setup
  stage: security
  script:
    - python -m pytest -q tests/test_public_contract.py -k private_material
