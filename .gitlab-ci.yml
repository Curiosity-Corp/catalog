---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Docker Official Images through AWS ECR Public's anonymous mirror of the Docker
# Library (catalog#97). Docker Hub's anonymous pull limit returned 429 to the
# shared runners, and a job only passed when its node already had the image.
# Same images and tags, no credentials, and Renovate still tracks the tag.
# Each image is also pinned by digest; Renovate proposes digest and tag bumps
# as merge requests (catalog#22, docs/ci-toolchain.md).
image: public.ecr.aws/docker/library/python:3.13-slim@sha256:168d3a5d10f2152f8e8d77b6843ac82c22a846cfefeef7afdf9aa630404e82a7

stages:
  - prepare
  - validate
  - test
  - security
  - package

variables:
  # The Secret-Detection template skips merge request pipelines unless this is
  # "true"; without it secret_detection would never run now that feature
  # branches only get MR pipelines.
  AST_ENABLE_MR_PIPELINES: "true"
  ANSIBLE_FORCE_COLOR: "1"
  ANSIBLE_NOCOLOR: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "0"
  # catalog#182: no job but galaxy-collections reaches galaxy.ansible.com. A
  # live `ansible-galaxy` install anywhere else meets this closed port and
  # fails at once instead of depending on Galaxy; --offline installs and
  # `verify --offline` never use it. galaxy-collections sets the real server.
  ANSIBLE_GALAXY_SERVER: "http://127.0.0.1:9/"

.python_tools:
  before_script: &python_tools
    # The shared Kubernetes runner is intentionally non-root. Keep jobs
    # portable by installing tools into a disposable workspace virtualenv.
    - python -m venv .ci-venv
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
    # Hash-checked lock of the CI tooling (catalog#22, docs/ci-toolchain.md).
    # pip itself comes from the digest-pinned image, so it is not upgraded here.
    - python -m pip install --require-hashes -r ci/requirements.txt

.python_setup:
  before_script:
    - *python_tools
    # Ansible collections (catalog#174, catalog#182). galaxy.ansible.com
    # resets connections in bursts, so only the galaxy-collections job
    # reaches it, with retries; every other job uses its .ci-collections
    # artifact after `verify --offline` finds the pinned versions with every
    # file matching its manifest. A job that `needs` others must list
    # galaxy-collections too (tests/test_galaxy_fetch_isolation.py).
    - export ANSIBLE_COLLECTIONS_PATH="$CI_PROJECT_DIR/.ci-collections:$HOME/.ansible/collections:/usr/share/ansible/collections"
    - |
      if ! ansible-galaxy collection verify --offline -r ci/requirements.yml; then
        echo "No verified .ci-collections from the galaxy-collections job. Jobs never fetch from Galaxy themselves (catalog#182): if this job has needs:, add galaxy-collections with artifacts: true." >&2
        exit 1
      fi

# catalog#182: the one job that reaches galaxy.ansible.com. It fetches the
# pinned collections (.ci-collections, every .python_setup job), the galaxy.yml
# floor (.ci-collections-floor, collection-floor) and requirements.yml as a
# user resolves it (.ci-collections-user, the quickstart jobs), once per
# pipeline, each fetch retried with backoff (scripts/fetch-collections.sh). A
# longer outage fails this job alone, which GitLab retries before anything
# else runs. The cache keeps the two pinned directories between pipelines; a
# cached copy that verifies offline is used without asking Galaxy.
galaxy-collections:
  extends: .python_tools
  stage: prepare
  variables:
    ANSIBLE_GALAXY_SERVER: "https://galaxy.ansible.com/"
  # Worst case: three fetches of five tries, 150 s each, plus backoff.
  timeout: 50m
  retry:
    max: 2
    when:
      - script_failure
      - stuck_or_timeout_failure
      - runner_system_failure
      - api_failure
      - unknown_failure
  cache:
    key:
      prefix: galaxy-collections
      files:
        - ci/requirements.yml
        - galaxy.yml
    paths:
      - .ci-collections/
      - .ci-collections-floor/
  script:
    - scripts/fetch-collections.sh
  artifacts:
    expire_in: 1 day
    paths:
      - .ci-collections/
      - .ci-collections-floor/
      - .ci-collections-user/

# One pipeline per change: merge request pipelines for feature branches, branch
# pipelines only for the default branch. A plain push to a branch that has (or
# will have) a merge request does not start a second, identical pipeline.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/

# Validate/test/security jobs are safe to cancel when a newer commit supersedes
# them; the package jobs below opt out so artifacts are never half-built.
default:
  interruptible: true

# Included template job: set explicitly by name so it stays cancellable even if
# the template changes. Its own rules (MR and branch pipelines) are untouched.
secret_detection:
  interruptible: true

yaml:
  extends: .python_setup
  stage: validate
  script:
    - yamllint -f parsable .github .gitlab ci docs examples playbooks roles tests/config_validation .gitlab-ci.yml galaxy.yml requirements.yml renovate.json

syntax:
  extends: .python_setup
  stage: validate
  script:
    - ANSIBLE_ROLES_PATH=roles ansible-playbook --syntax-check -i localhost, playbooks/site.yml

# Researcher quickstarts: example variables, links, cloud-init and notebook
# posture, tag previews, and the controlled network-failure test.
quickstarts:
  extends: .python_setup
  stage: test
  script:
    - python -m pytest -q tests/test_quickstarts.py tests/test_restricted_network.py

# The cloud-init example must pass cloud-init's own schema check (catalog#30).
# No disposable VM is available to CI, so this is the stand-in until someone
# boots it (docs/quickstarts/cloud-init-libvirt.md#validation-status).
# cloud-init 25.1 and later build only with meson and are not on PyPI, so the
# job runs the pinned, digest-checked release straight from its source tree in
# this throwaway container; the non-root runner cannot apt-get the package.
# Merge requests only: main does not change the example without one.
cloud-init-schema:
  image: public.ecr.aws/docker/library/python:3.13@sha256:f25cbd3f7c73c28bdcab476c93c93a2ec90970a8f5b8a7810533654207822390
  stage: test
  variables:
    CLOUD_INIT_VERSION: "26.2"
    CLOUD_INIT_SHA256: "16274a4102426871cad84ad07db41f82aa8f4d43d95e5947a62e199c2df775c6"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - mkdir -p .ci-cloud-init/src
    - curl -fsSL --retry 3 -o .ci-cloud-init/cloud-init.tar.gz "https://github.com/canonical/cloud-init/archive/refs/tags/${CLOUD_INIT_VERSION}.tar.gz"
    - echo "${CLOUD_INIT_SHA256}  .ci-cloud-init/cloud-init.tar.gz" | sha256sum -c -
    - tar -xzf .ci-cloud-init/cloud-init.tar.gz -C .ci-cloud-init/src --strip-components=1
    - python -m venv .ci-venv
    - .ci-venv/bin/python -m pip install -r .ci-cloud-init/src/requirements.txt
    - PYTHONPATH=.ci-cloud-init/src .ci-venv/bin/python -m cloudinit.cmd.main schema --config-file examples/cloud-init/user-data

# Stand-in evidence for decision record 0004 (resumable downloads, catalog#133).
# The full python image ships curl; the slim one does not, and the shared
# runner is non-root, so it cannot apt-get it.
resume-standin:
  image: public.ecr.aws/docker/library/python:3.13@sha256:f25cbd3f7c73c28bdcab476c93c93a2ec90970a8f5b8a7810533654207822390
  stage: test
  script:
    - python -m venv .ci-venv
    - .ci-venv/bin/python -m pip install -c ci/requirements.txt pytest
    - .ci-venv/bin/python -m pytest -q tests/test_resumable_download_standin.py

# catalog#171: the vendor-verified downloads (verified-download.yml, the signed
# Claude Code manifest, the Codex release digest, the SDKMAN! release commit).
# The full python image ships gpg and git; the slim one does not, and the
# non-root runner cannot apt-get them.
#
# catalog#174: two jobs. verified-downloads has a 15-minute timeout: a few times
# its normal runtime (pipeline 174670: 120 s, setup included), with room for the
# pip setup alone to take 6 minutes, as it did when egress slowed on 2026-11-27.
# verified-downloads-vendors has 45 minutes (catalog#177): its downloads are
# judged by progress, not total time, so a slow runner that is still receiving
# passes (pipeline 175187 failed three such downloads at the old 120 s and
# 180 s budgets), and a stopped vendor still fails its test within minutes.
# verified-downloads runs the fixture tests offline, which shows each path fails
# closed: a proxy on a closed loopback port refuses any request that leaves the
# host, so a test that reaches the internet by mistake fails at once, naming the
# URL. verified-downloads-vendors runs the role's own task slices against
# dl.k8s.io, get.helm.sh, go.dev, GitHub and downloads.claude.ai; every lookup and
# playbook run there is bounded, so a vendor outage fails the named test instead
# of holding the pipeline. -v and --durations show which test took the time.
verified-downloads:
  extends: .python_setup
  stage: test
  image: public.ecr.aws/docker/library/python:3.13@sha256:f25cbd3f7c73c28bdcab476c93c93a2ec90970a8f5b8a7810533654207822390
  timeout: 15m
  script:
    - >-
      HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9
      http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
      NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost
      python -m pytest -v --durations=10 tests/test_verified_download.py

verified-downloads-vendors:
  extends: .python_setup
  stage: test
  image: public.ecr.aws/docker/library/python:3.13@sha256:f25cbd3f7c73c28bdcab476c93c93a2ec90970a8f5b8a7810533654207822390
  timeout: 45m
  script:
    - python -m pytest -v --durations=0 tests/test_verified_download_vendors.py

# catalog#29: the opt-in workspace git credential helper
# (docs/workspace-providers.md). The role's own tasks install it under pytest's
# tmp_path, and real git clones from a loopback server whose stand-in workspace
# service grants or refuses the token; every failure must name its cause and
# never show the token. The full python image ships git and curl; the slim one
# does not, and the non-root runner cannot apt-get them. It never targets a
# real host or inventory.
workspace-helper:
  extends: .python_setup
  stage: test
  image: public.ecr.aws/docker/library/python:3.13@sha256:f25cbd3f7c73c28bdcab476c93c93a2ec90970a8f5b8a7810533654207822390
  script:
    - python -m pytest -q tests/test_workspace_credential_helper.py

# catalog#31: the public configuration check (docs/configuration.md#validation).
# Every example, every hardware and workstation profile pair and the cases in
# tests/config_validation/valid/ must pass; every case in invalid/ must stop
# inside the validation tasks with its expected messages, change nothing and
# print no secret. "localhost" is this throwaway job container; the job never
# targets a real host or inventory.
config-validation:
  extends: .python_setup
  stage: test
  script:
    - scripts/config_validation_check.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - config-validation/report.md
      - config-validation/runs/

# Governance, security-process and identity documents stay true and current.
governance:
  extends: .python_setup
  stage: test
  script:
    - python -m pytest -q tests/test_governance_docs.py tests/test_telemetry_policy.py

# Accessibility defaults and the maintenance summary stay true. The Python
# research profile has its own research-profile job and runs in policy.
accessibility-summary:
  extends: .python_setup
  stage: test
  script:
    - python -m pytest -q tests/test_accessibility_defaults.py tests/test_update_summary.py tests/test_update_interrupted_recovery.py

# catalog#135: follow docs/quickstarts/laptop.md as far as a throwaway,
# non-root Debian 13 container allows: simulate the role's APT steps with
# user-owned apt state, then preview the playbook (--check --diff) with become
# switched off, and keep a per-step report. No root emulation: the runner is
# uid 1000 with no capabilities on purpose. "localhost" is the job container
# itself; this job never targets a real host or inventory and applies nothing.
# python:3.13-slim-trixie is debian:trixie-slim plus an upstream Python, which
# the guide's apt-installed python3 cannot be without root. It runs on merge
# requests that touch the quickstart or this harness, and is a manual button on
# every other merge request. The report feeds
# docs/evidence/2026-11-25-debian13-laptop-quickstart.md.
debian13-quickstart:
  stage: test
  image: public.ecr.aws/docker/library/python:3.13-slim-trixie@sha256:168d3a5d10f2152f8e8d77b6843ac82c22a846cfefeef7afdf9aa630404e82a7
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scripts/debian_quickstart_run.sh
        - scripts/debian_quickstart_apt.py
        - docs/quickstarts/laptop.md
        - examples/laptop.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - scripts/debian_quickstart_run.sh
  artifacts:
    when: always
    name: "debian13-quickstart-${CI_COMMIT_SHORT_SHA}"
    paths:
      - debian-quickstart/
    expire_in: 30 days

# catalog#135: follow docs/quickstarts/laptop.md in a disposable Debian 13
# virtual machine, apply as root included. scripts/debian13_vm_run.sh boots
# Debian's own generic cloud image (checked against SHA512SUMS) under QEMU,
# started as the runner's ordinary uid inside this container, with user-mode
# networking and throwaway qcow2 overlays; the VM and its disks are discarded
# with the job. Without /dev/kvm the guest runs under TCG, so the run takes
# one to three hours. It is a manual button on every merge request, and runs
# on its own in a web or API pipeline started with DEBIAN13_VM_RUN=1 (merge
# request pipelines cancel every job when one fails, which would end a
# three-hour run on any unrelated flake). The report feeds
# docs/evidence/2026-11-27-debian13-laptop-vm-run.md.
debian13-vm-run:
  stage: test
  image: public.ecr.aws/docker/library/python:3.13-trixie@sha256:f25cbd3f7c73c28bdcab476c93c93a2ec90970a8f5b8a7810533654207822390
  tags:
    - cpu-heavy
  # Under TCG the first full apply alone took about two hours (job 3209499).
  timeout: 6h
  # A push must not end a run that takes hours (default interruptible: true).
  interruptible: false
  variables:
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "6Gi"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $DEBIAN13_VM_RUN == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - scripts/debian13_vm_run.sh
  artifacts:
    when: always
    name: "debian13-vm-run-${CI_COMMIT_SHORT_SHA}"
    paths:
      - debian13-vm/
    expire_in: 30 days

# catalog#164: run the laptop quickstart's step 3 preview (--check --diff) in
# this throwaway container, which the role has never run on, and fail if it
# stops before the end of the repos task group or anywhere laptop.md step 3
# does not name. "localhost" is the job container; it previews and applies
# nothing, and never targets a real host or inventory. The full trixie image
# ships gpg, as Ubuntu does; the script adds python3-apt to its venv.
quickstart-check-preview:
  stage: test
  image: public.ecr.aws/docker/library/python:3.13-trixie@sha256:f25cbd3f7c73c28bdcab476c93c93a2ec90970a8f5b8a7810533654207822390
  script:
    - scripts/quickstart_check_preview.sh
  artifacts:
    when: always
    name: "quickstart-check-preview-${CI_COMMIT_SHORT_SHA}"
    paths:
      - quickstart-check-preview/
    expire_in: 30 days

lint:
  extends: .python_setup
  stage: validate
  script:
    # --offline: ansible-lint would otherwise install requirements.yml itself
    # at start; the collections come from galaxy-collections (catalog#182).
    - ANSIBLE_ROLES_PATH=roles ansible-lint --offline playbooks/site.yml playbooks/preview-vars.yml roles

# galaxy.yml lets users resolve any community.general from its floor upward,
# while every other job uses the exact pin in ci/requirements.yml. This job
# checks the floor the galaxy-collections job fetched into
# .ci-collections-floor, alone on the collection path, and fails when a
# community.general module, filter, test or lookup the roles name is missing
# or deprecated there (catalog#171, catalog#182, docs/ci-toolchain.md).
collection-floor:
  extends: .python_setup
  stage: validate
  script:
    - scripts/check-collection-floor.sh "$CI_PROJECT_DIR/.ci-collections-floor"

policy:
  extends: .python_setup
  stage: test
  script:
    - python tests/test_update_policy.py
    - >-
      python -m pytest -q tests/test_public_contract.py tests/test_console_tuning.py
      tests/test_tmp_hygiene.py tests/test_workstation_posture.py tests/test_hardware_profiles.py
      tests/test_desktop_multiuser.py tests/test_apt_keyring_policy.py tests/test_apt_keyring_check_mode.py
      tests/test_user_systemd_policy.py tests/test_system_retirement.py tests/test_pipx_repair.py
      tests/test_science_venv_repair.py tests/test_m365_cli_entrypoints.py tests/test_troubleshooting.py tests/test_glossary.py
      tests/test_sunshine_asset_selection.py tests/test_update_rollback_symlinks.py
      tests/test_healthcheck_disabled_apps.py tests/test_litra_cli.py tests/test_user_dotfiles.py
      tests/test_minimal_desktop_panel.py tests/test_bitwarden_desktop.py tests/test_slack_desktop.py tests/test_jellyfin_desktop.py tests/test_media_folder.py
      tests/test_deskmeet_8k_display.py tests/test_display_guard.py tests/test_display_layout.py tests/test_samsung_tv_cli.py
      tests/test_pro_mimic.py tests/test_firewall_posture.py tests/test_power_policy.py
      tests/test_streamstack.py tests/test_streamstack_low_latency.py tests/test_streamstack_ai_deps.py tests/test_streamstack_apt.py tests/test_hhtest.py tests/test_workstation_storage.py tests/test_cpu_thermal_guard.py
      tests/test_ziti_health.py tests/test_ziti_pins.py tests/test_include_tags_apply.py tests/test_no_conflict_markers.py tests/test_update_snapshot_retention.py
      tests/test_mouse_debounce.py tests/test_fleetd.py tests/test_user_git_timers.py tests/test_claude_native_users.py
      tests/test_python_research.py tests/test_monitor_sleep_pointer.py tests/test_apt_vendor_channels.py tests/test_preflight_tags.py
      tests/test_no_log_policy.py tests/test_argument_specs.py tests/test_ansible_pull_poll.py
      tests/test_agent_cpu_policy.py tests/test_hypersystem_desktop.py
      tests/test_galaxy_fetch_isolation.py tests/test_fetch_collections_retry.py

# catalog#36: install the Python research profile for real, in this throwaway
# container. Applies the role's own science-venv.yml with
# examples/python-research.yml into a temp venv (twice, the second run must be
# a no-op), runs a sample analysis, registers the notebook kernel and runs the
# documented uv project workflow. 3.14 is Ubuntu 26.04's python3, the
# interpreter the role uses; 3.15 is the newest CPython, the next distro's.
research-profile:
  extends: .python_setup
  stage: test
  image: public.ecr.aws/docker/library/python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.14", "3.15"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - ci/**/*
        - requirements.yml
        - roles/developer_workstation/defaults/main.yml
        - roles/developer_workstation/tasks/science-tools.yml
        - roles/developer_workstation/tasks/science-venv.yml
        - examples/python-research.yml
        - docs/python-research-profile.md
        - scripts/validate_python_research.py
        - tests/research_profile/**/*
        - tests/test_python_research.py
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
  script:
    - python scripts/validate_python_research.py --work .research-profile --report research-profile-report.md
  artifacts:
    when: always
    name: "research-profile-py${PYTHON_VERSION}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - research-profile-report.md
      - .research-profile/sample.png
    expire_in: 30 days

# catalog#160: the Rust tool crate (tools/README.md, docs/decisions/0005-rust-tool-crate.md).
# Lints and tests the crate, then fails when docs/reference.md is out of date
# with the role defaults, tasks or docs/reference-annotations.yml. Whatever the
# outcome, the job keeps the generated reference, the lockfile and, when
# formatting is off, a rustfmt patch as artifacts, so a fix never needs a local
# toolchain. Cargo's home and build folder stay inside the checkout because the
# shared runner pods run as a non-root user.
tools:
  stage: validate
  image: public.ecr.aws/docker/library/rust:1-bookworm@sha256:75d26c23c24cc6ea1cdabf0714a6bff8fd7bf3248716043fd7ae86dac7f41b94
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/tools/target"
    CARGO_TERM_COLOR: always
  script:
    - rustup component add rustfmt clippy
    - cargo --version && cargo clippy --version
    - cd tools
    - cargo test --locked
    - cargo run --locked --quiet -- reference --root .. --output ../reference.generated.md
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo fmt --all --check || { cargo fmt --all && git diff -- . > ../tools-fmt.patch; exit 1; }
    - cargo run --locked --quiet -- reference --root .. --check
    - cargo run --locked --quiet -- packages check --root ..
    # A real read (catalog#33): the runner pod sees its node's PCI devices
    # (an Intel iGPU without a driver on 2026-11-27); the fixture tests in
    # tests/gpu_status.rs cover every vendor and state.
    - cargo run --locked --quiet -- gpu-status
    - cargo run --locked --quiet -- gpu-status --json
    # The dependency register (catalog#51, docs/dependency-register.md): fails
    # when a declared dependency is missing from ci/dependency-register.yml or
    # an entry no longer matches its declaration. Alerts print on every
    # pipeline; a release tag (and a scheduled pipeline) fails on an untracked
    # alert or an overdue review.
    - cargo run --locked --quiet -- register check --root ..
    - |
      strict=""
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${CI_PIPELINE_SOURCE}" = "schedule" ]; then strict="--strict"; fi
      cargo run --locked --quiet -- register alerts --root .. $strict
    # A static binary for the platform-packages jobs, which run in plain distro
    # images without a Rust toolchain.
    - rustup target add x86_64-unknown-linux-musl
    - cargo build --locked --release --target x86_64-unknown-linux-musl
    - cp "${CARGO_TARGET_DIR}/x86_64-unknown-linux-musl/release/catalog-tools" ../catalog-tools
  artifacts:
    when: always
    name: "catalog-tools-${CI_COMMIT_SHORT_SHA}"
    paths:
      - reference.generated.md
      - tools-fmt.patch
      - tools/Cargo.lock
      - catalog-tools
    expire_in: 7 days

# Which of the developer_workstation role's apt packages each supported
# platform's archive provides (#14, #15). The probe asks apt inside the stock
# image, with apt's lists in a private directory, so it needs no root.
platform-packages:
  stage: test
  # IMAGE is the platform as the evidence names it; the pull goes through the
  # ECR Public mirror of the Docker Library, never Docker Hub (catalog#97).
  image: public.ecr.aws/docker/library/${IMAGE}
  needs:
    - job: tools
      artifacts: true
  parallel:
    matrix:
      - IMAGE:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
  script:
    - mkdir -p platform-packages
    - ./catalog-tools packages probe --root . --image "$IMAGE" --apt-dir "${CI_PROJECT_DIR}/.apt-probe" --output "platform-packages/$(echo "$IMAGE" | tr ':.' '--').json"
  artifacts:
    paths:
      - platform-packages/
    expire_in: 7 days

# The dated evidence file (docs/platform-differences.md says how to refresh it).
platform-evidence:
  stage: test
  image: public.ecr.aws/docker/library/debian:13-slim@sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0
  needs:
    - job: tools
      artifacts: true
    - job: platform-packages
      artifacts: true
  script:
    - mkdir -p evidence
    - ./catalog-tools packages assemble --root . --output "evidence/platform-packages-$(date -u +%F).json" platform-packages/*.json
    - ./catalog-tools packages check --root . evidence/platform-packages-*.json
  artifacts:
    paths:
      - evidence/
    expire_in: 30 days

collection:
  extends: .python_setup
  stage: package
  interruptible: false
  script:
    - ansible-galaxy collection build --force
    - python scripts/normalize_collection_artifact.py "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
    - test -n "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
  artifacts:
    name: "curiosity-workstation-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "*.tar.gz"
    expire_in: 30 days

third_party:
  extends: .python_setup
  stage: package
  needs:
    - job: galaxy-collections
      artifacts: true
    - job: collection
      artifacts: true
  script:
    # Licence scan of the built artifact, not the checkout (catalog#48,
    # THIRD_PARTY.md): reuse, locked in ci/requirements.txt, against the
    # REUSE.toml inventory that ships inside the tarball.
    - scripts/check-third-party.sh "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"

sbom:
  extends: .python_setup
  stage: package
  interruptible: false
  needs:
    - job: galaxy-collections
      artifacts: true
    - job: collection
      artifacts: true
    - job: tools
      artifacts: true
  # The dependency-complete SBOM (catalog#21, docs/sbom.md): source files,
  # collection dependencies, the locked CI toolchain and the runtime sources of
  # ci/sbom-sources.yml. Generation fails when that inventory and the roles
  # disagree; check-jsonschema validates the result against the vendored
  # CycloneDX 1.6 schema (--base-uri keeps its $refs offline); --check fails
  # when a declared dependency is missing from the file that is published.
  script:
    - archive="$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
    - test -n "$archive"
    - ./catalog-tools sbom --archive "$archive" --output collection.cdx.json
    - check-jsonschema --base-uri "file://${CI_PROJECT_DIR}/ci/schemas/cyclonedx-1.6/bom-1.6.schema.json" --schemafile ci/schemas/cyclonedx-1.6/bom-1.6.schema.json collection.cdx.json
    - ./catalog-tools sbom --archive "$archive" --output collection.cdx.json --check
  artifacts:
    paths:
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

provenance:
  extends: .python_setup
  stage: package
  interruptible: false
  needs:
    - job: galaxy-collections
      artifacts: true
    - job: collection
      artifacts: true
    - job: sbom
      artifacts: true
  script:
    # The toolchain that built and checked this artifact, for release evidence
    # (catalog#22, docs/ci-toolchain.md).
    - |
      {
        echo "image: ${CI_JOB_IMAGE}"
        echo "python: $(python --version 2>&1)"
        echo "lock: ci/requirements.txt sha256 $(sha256sum ci/requirements.txt | cut -d' ' -f1)"
        echo "collections: ci/requirements.yml sha256 $(sha256sum ci/requirements.yml | cut -d' ' -f1)"
        echo "--- pip freeze"
        python -m pip freeze --all
        echo "--- ansible-galaxy collection list"
        ansible-galaxy collection list --format yaml
      } > ci-toolchain.txt
    - cat ci-toolchain.txt
    - sha256sum *.tar.gz collection.cdx.json ci-toolchain.txt | tee collection.sha256
  artifacts:
    paths:
      - collection.sha256
      - ci-toolchain.txt
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

# A release tag keeps the artifact, its SBOM, the toolchain record, the
# checksums and the catalog-tools binary together and never expires them, so
# the release page can link them all (catalog#21, catalog#18,
# docs/release-checklist.md).
release_assets:
  stage: package
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: provenance
      artifacts: true
    # The static catalog-tools binary the role installs for diagnostics
    # (catalog#18, catalog_tools_install_url and _sha256).
    - job: tools
      artifacts: true
  script:
    - sha256sum -c collection.sha256
    - test -x catalog-tools
    - sha256sum catalog-tools | tee catalog-tools.sha256
  artifacts:
    name: "curiosity-workstation-${CI_COMMIT_TAG}"
    paths:
      - collection.sha256
      - ci-toolchain.txt
      - collection.cdx.json
      - "*.tar.gz"
      - catalog-tools
      - catalog-tools.sha256
    expire_in: never

secret_hygiene:
  extends: .python_setup
  stage: security
  script:
    - python -m pytest -q tests/test_public_contract.py -k private_material
