---
include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/pipelines/validate-only.yml'

variables:
  # alpine/k8s ships python3, pip, curl, jq, yq, kubectl, helm.
  # Do NOT set PREFLIGHT_IMAGE to python:slim — pip drops bins to
  # /tmp/.local/bin (not on PATH) and it runs as root (issue #19).
  PREFLIGHT_COMMANDS: >-
    python3 -m venv /tmp/venv &&
    /tmp/venv/bin/pip install --quiet ansible-core ansible-lint pyyaml &&
    /tmp/venv/bin/ansible-galaxy collection install -r requirements.yml
    >/dev/null &&
    ANSIBLE_ROLES_PATH=roles /tmp/venv/bin/ansible-playbook
    --syntax-check playbooks/site.yml &&
    ANSIBLE_ROLES_PATH=roles /tmp/venv/bin/ansible-lint
    playbooks/site.yml roles
  TEST_COMMANDS: >-
    python3 -c "import json, pathlib;
    json.loads(pathlib.Path('renovate.json').read_text());
    print('renovate.json ok')"
