---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: python:3.13-slim

stages:
  - validate
  - test
  - security
  - package

variables:
  # The Secret-Detection template skips merge request pipelines unless this is
  # "true"; without it secret_detection would never run now that feature
  # branches only get MR pipelines.
  AST_ENABLE_MR_PIPELINES: "true"
  ANSIBLE_FORCE_COLOR: "1"
  ANSIBLE_NOCOLOR: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "0"

.python_setup:
  before_script:
    # The shared Kubernetes runner is intentionally non-root. Keep jobs
    # portable by installing tools into a disposable workspace virtualenv.
    - python -m venv .ci-venv
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
    - python -m pip install --upgrade pip
    - python -m pip install ansible-core ansible-lint yamllint pyyaml pytest
    # galaxy.ansible.com occasionally resets the connection mid-download, and a
    # single failed job cancels the rest of the pipeline, so retry a few times.
    - |
      attempt=1
      until ansible-galaxy collection install -r requirements.yml; do
        rc=$?
        if [ "$attempt" -ge 3 ]; then
          echo "ansible-galaxy collection install failed after $attempt attempts (exit $rc)" >&2
          exit "$rc"
        fi
        echo "ansible-galaxy collection install attempt $attempt failed (exit $rc); retrying in 10s" >&2
        attempt=$((attempt + 1))
        sleep 10
      done

# One pipeline per change: merge request pipelines for feature branches, branch
# pipelines only for the default branch. A plain push to a branch that has (or
# will have) a merge request does not start a second, identical pipeline.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/

# Validate/test/security jobs are safe to cancel when a newer commit supersedes
# them; the package jobs below opt out so artifacts are never half-built.
default:
  interruptible: true

# Included template job: set explicitly by name so it stays cancellable even if
# the template changes. Its own rules (MR and branch pipelines) are untouched.
secret_detection:
  interruptible: true

yaml:
  extends: .python_setup
  stage: validate
  script:
    - yamllint -f parsable .github .gitlab docs examples playbooks roles .gitlab-ci.yml galaxy.yml requirements.yml renovate.json

syntax:
  extends: .python_setup
  stage: validate
  script:
    - ANSIBLE_ROLES_PATH=roles ansible-playbook --syntax-check -i localhost, playbooks/site.yml

# Researcher quickstarts: example variables, links, cloud-init and notebook
# posture, tag previews, and the controlled network-failure test.
quickstarts:
  extends: .python_setup
  stage: test
  script:
    - python -m pytest -q tests/test_quickstarts.py tests/test_restricted_network.py

# The cloud-init example must pass cloud-init's own schema check (catalog#30).
# No disposable VM is available to CI, so this is the stand-in until someone
# boots it (docs/quickstarts/cloud-init-libvirt.md#validation-status).
# cloud-init 25.1 and later build only with meson and are not on PyPI, so the
# job runs the pinned, digest-checked release straight from its source tree in
# this throwaway container; the non-root runner cannot apt-get the package.
# Merge requests only: main does not change the example without one.
cloud-init-schema:
  image: python:3.13
  stage: test
  variables:
    CLOUD_INIT_VERSION: "26.2"
    CLOUD_INIT_SHA256: "16274a4102426871cad84ad07db41f82aa8f4d43d95e5947a62e199c2df775c6"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - mkdir -p .ci-cloud-init/src
    - curl -fsSL --retry 3 -o .ci-cloud-init/cloud-init.tar.gz "https://github.com/canonical/cloud-init/archive/refs/tags/${CLOUD_INIT_VERSION}.tar.gz"
    - echo "${CLOUD_INIT_SHA256}  .ci-cloud-init/cloud-init.tar.gz" | sha256sum -c -
    - tar -xzf .ci-cloud-init/cloud-init.tar.gz -C .ci-cloud-init/src --strip-components=1
    - python -m venv .ci-venv
    - .ci-venv/bin/python -m pip install -r .ci-cloud-init/src/requirements.txt
    - PYTHONPATH=.ci-cloud-init/src .ci-venv/bin/python -m cloudinit.cmd.main schema --config-file examples/cloud-init/user-data

# Stand-in evidence for decision record 0004 (resumable downloads, catalog#133).
# The full python image ships curl; the slim one does not, and the shared
# runner is non-root, so it cannot apt-get it.
resume-standin:
  image: python:3.13
  stage: test
  script:
    - python -m venv .ci-venv
    - .ci-venv/bin/python -m pip install pytest
    - .ci-venv/bin/python -m pytest -q tests/test_resumable_download_standin.py

# Governance, security-process and identity documents stay true and current.
governance:
  extends: .python_setup
  stage: test
  script:
    - python -m pytest -q tests/test_governance_docs.py tests/test_telemetry_policy.py

# Accessibility defaults and the maintenance summary stay true. The Python
# research profile has its own research-profile job and runs in policy.
accessibility-summary:
  extends: .python_setup
  stage: test
  script:
    - python -m pytest -q tests/test_accessibility_defaults.py tests/test_update_summary.py tests/test_update_interrupted_recovery.py

# catalog#135: follow docs/quickstarts/laptop.md as far as a throwaway,
# non-root Debian 13 container allows: simulate the role's APT steps with
# user-owned apt state, then preview the playbook (--check --diff) with become
# switched off, and keep a per-step report. No root emulation: the runner is
# uid 1000 with no capabilities on purpose. "localhost" is the job container
# itself; this job never targets a real host or inventory and applies nothing.
# python:3.13-slim-trixie is debian:trixie-slim plus an upstream Python, which
# the guide's apt-installed python3 cannot be without root. It runs on merge
# requests that touch the quickstart or this harness, and is a manual button on
# every other merge request. The report feeds
# docs/evidence/2026-11-25-debian13-laptop-quickstart.md.
debian13-quickstart:
  stage: test
  image: python:3.13-slim-trixie
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scripts/debian_quickstart_run.sh
        - scripts/debian_quickstart_apt.py
        - docs/quickstarts/laptop.md
        - examples/laptop.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - scripts/debian_quickstart_run.sh
  artifacts:
    when: always
    name: "debian13-quickstart-${CI_COMMIT_SHORT_SHA}"
    paths:
      - debian-quickstart/
    expire_in: 30 days

# catalog#164: run the laptop quickstart's step 3 preview (--check --diff) in
# this throwaway container, which the role has never run on, and fail if it
# stops before the end of the repos task group or anywhere laptop.md step 3
# does not name. "localhost" is the job container; it previews and applies
# nothing, and never targets a real host or inventory. The full trixie image
# ships gpg, as Ubuntu does; the script adds python3-apt to its venv.
quickstart-check-preview:
  stage: test
  image: python:3.13-trixie
  script:
    - scripts/quickstart_check_preview.sh
  artifacts:
    when: always
    name: "quickstart-check-preview-${CI_COMMIT_SHORT_SHA}"
    paths:
      - quickstart-check-preview/
    expire_in: 30 days

lint:
  extends: .python_setup
  stage: validate
  script:
    - ANSIBLE_ROLES_PATH=roles ansible-lint playbooks/site.yml roles

policy:
  extends: .python_setup
  stage: test
  script:
    - python tests/test_update_policy.py
    - >-
      python -m pytest -q tests/test_public_contract.py tests/test_console_tuning.py
      tests/test_tmp_hygiene.py tests/test_workstation_posture.py tests/test_hardware_profiles.py
      tests/test_desktop_multiuser.py tests/test_apt_keyring_policy.py tests/test_apt_keyring_check_mode.py
      tests/test_user_systemd_policy.py tests/test_system_retirement.py tests/test_pipx_repair.py
      tests/test_science_venv_repair.py tests/test_m365_cli_entrypoints.py tests/test_troubleshooting.py tests/test_glossary.py
      tests/test_sunshine_asset_selection.py tests/test_update_rollback_symlinks.py
      tests/test_healthcheck_disabled_apps.py tests/test_litra_cli.py
      tests/test_minimal_desktop_panel.py tests/test_bitwarden_desktop.py tests/test_slack_desktop.py tests/test_jellyfin_desktop.py tests/test_media_folder.py
      tests/test_deskmeet_8k_display.py tests/test_display_guard.py tests/test_display_layout.py tests/test_samsung_tv_cli.py
      tests/test_pro_mimic.py tests/test_firewall_posture.py tests/test_power_policy.py
      tests/test_streamstack.py tests/test_streamstack_low_latency.py tests/test_streamstack_ai_deps.py tests/test_hhtest.py tests/test_workstation_storage.py tests/test_cpu_thermal_guard.py
      tests/test_ziti_health.py tests/test_no_conflict_markers.py tests/test_update_snapshot_retention.py
      tests/test_mouse_debounce.py tests/test_fleetd.py tests/test_user_git_timers.py
      tests/test_python_research.py tests/test_monitor_sleep_pointer.py tests/test_apt_vendor_channels.py tests/test_preflight_tags.py

# catalog#36: install the Python research profile for real, in this throwaway
# container. Applies the role's own science-venv.yml with
# examples/python-research.yml into a temp venv (twice, the second run must be
# a no-op), runs a sample analysis, registers the notebook kernel and runs the
# documented uv project workflow. 3.14 is Ubuntu 26.04's python3, the
# interpreter the role uses; 3.15 is the newest CPython, the next distro's.
research-profile:
  extends: .python_setup
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.14", "3.15"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - requirements.yml
        - roles/developer_workstation/defaults/main.yml
        - roles/developer_workstation/tasks/science-tools.yml
        - roles/developer_workstation/tasks/science-venv.yml
        - examples/python-research.yml
        - docs/python-research-profile.md
        - scripts/validate_python_research.py
        - tests/research_profile/**/*
        - tests/test_python_research.py
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
  script:
    - python -m pip install uv
    - python scripts/validate_python_research.py --work .research-profile --report research-profile-report.md
  artifacts:
    when: always
    name: "research-profile-py${PYTHON_VERSION}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - research-profile-report.md
      - .research-profile/sample.png
    expire_in: 30 days

# catalog#160: the Rust tool crate (tools/README.md, docs/adr/0001-rust-tool-crate.md).
# Lints and tests the crate, then fails when docs/reference.md is out of date
# with the role defaults, tasks or docs/reference-annotations.yml. Whatever the
# outcome, the job keeps the generated reference, the lockfile and, when
# formatting is off, a rustfmt patch as artifacts, so a fix never needs a local
# toolchain. Cargo's home and build folder stay inside the checkout because the
# shared runner pods run as a non-root user.
tools:
  stage: validate
  image: rust:1-bookworm
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/tools/target"
    CARGO_TERM_COLOR: always
  script:
    - rustup component add rustfmt clippy
    - cargo --version && cargo clippy --version
    - cd tools
    - cargo test --locked
    - cargo run --locked --quiet -- reference --root .. --output ../reference.generated.md
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo fmt --all --check || { cargo fmt --all && git diff -- . > ../tools-fmt.patch; exit 1; }
    - cargo run --locked --quiet -- reference --root .. --check
  artifacts:
    when: always
    name: "catalog-tools-${CI_COMMIT_SHORT_SHA}"
    paths:
      - reference.generated.md
      - tools-fmt.patch
      - tools/Cargo.lock
    expire_in: 7 days

collection:
  extends: .python_setup
  stage: package
  interruptible: false
  script:
    - ansible-galaxy collection build --force
    - python scripts/normalize_collection_artifact.py "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
    - test -n "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
  artifacts:
    name: "curiosity-workstation-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "*.tar.gz"
    expire_in: 30 days

sbom:
  extends: .python_setup
  stage: package
  interruptible: false
  needs:
    - job: collection
      artifacts: true
  script:
    - python scripts/build_collection_sbom.py "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)" collection.cdx.json
  artifacts:
    paths:
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

provenance:
  extends: .python_setup
  stage: package
  interruptible: false
  needs:
    - job: collection
      artifacts: true
    - job: sbom
      artifacts: true
  script:
    - sha256sum *.tar.gz collection.cdx.json | tee collection.sha256
  artifacts:
    paths:
      - collection.sha256
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

secret_hygiene:
  extends: .python_setup
  stage: security
  script:
    - python -m pytest -q tests/test_public_contract.py -k private_material
