---
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: python:3.15-slim

stages:
  - validate
  - test
  - security
  - package

variables:
  # The Secret-Detection template skips merge request pipelines unless this is
  # "true"; without it secret_detection would never run now that feature
  # branches only get MR pipelines.
  AST_ENABLE_MR_PIPELINES: "true"
  ANSIBLE_FORCE_COLOR: "1"
  ANSIBLE_NOCOLOR: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "0"

.python_setup:
  before_script:
    # The shared Kubernetes runner is intentionally non-root. Keep jobs
    # portable by installing tools into a disposable workspace virtualenv.
    - python -m venv .ci-venv
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
    - python -m pip install --upgrade pip
    - python -m pip install ansible-core ansible-lint yamllint pyyaml pytest
    # galaxy.ansible.com occasionally resets the connection mid-download, and a
    # single failed job cancels the rest of the pipeline, so retry a few times.
    - |
      attempt=1
      until ansible-galaxy collection install -r requirements.yml; do
        rc=$?
        if [ "$attempt" -ge 3 ]; then
          echo "ansible-galaxy collection install failed after $attempt attempts (exit $rc)" >&2
          exit "$rc"
        fi
        echo "ansible-galaxy collection install attempt $attempt failed (exit $rc); retrying in 10s" >&2
        attempt=$((attempt + 1))
        sleep 10
      done

# One pipeline per change: merge request pipelines for feature branches, branch
# pipelines only for the default branch. A plain push to a branch that has (or
# will have) a merge request does not start a second, identical pipeline.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/

# Validate/test/security jobs are safe to cancel when a newer commit supersedes
# them; the package jobs below opt out so artifacts are never half-built.
default:
  interruptible: true

# Included template job: set explicitly by name so it stays cancellable even if
# the template changes. Its own rules (MR and branch pipelines) are untouched.
secret_detection:
  interruptible: true

yaml:
  extends: .python_setup
  stage: validate
  script:
    - yamllint -f parsable .github .gitlab docs examples playbooks roles .gitlab-ci.yml galaxy.yml requirements.yml renovate.json

syntax:
  extends: .python_setup
  stage: validate
  script:
    - ANSIBLE_ROLES_PATH=roles ansible-playbook --syntax-check -i localhost, playbooks/site.yml

lint:
  extends: .python_setup
  stage: validate
  script:
    - ANSIBLE_ROLES_PATH=roles ansible-lint playbooks/site.yml roles

policy:
  extends: .python_setup
  stage: test
  script:
    - python tests/test_update_policy.py
    # Every test file, not a hand-kept list: the lists here and in the Makefile
    # had drifted apart and several test files ran in neither.
    - python -m pytest -q tests

collection:
  extends: .python_setup
  stage: package
  interruptible: false
  script:
    - ansible-galaxy collection build --force
    - python scripts/normalize_collection_artifact.py "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
    - test -n "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
  artifacts:
    name: "curiosity-workstation-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "*.tar.gz"
    expire_in: 30 days

sbom:
  extends: .python_setup
  stage: package
  interruptible: false
  needs:
    - job: collection
      artifacts: true
  script:
    - python scripts/build_collection_sbom.py "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)" collection.cdx.json
  artifacts:
    paths:
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

provenance:
  extends: .python_setup
  stage: package
  interruptible: false
  needs:
    - job: collection
      artifacts: true
    - job: sbom
      artifacts: true
  script:
    - sha256sum *.tar.gz collection.cdx.json | tee collection.sha256
  artifacts:
    paths:
      - collection.sha256
      - collection.cdx.json
      - "*.tar.gz"
    expire_in: 30 days

secret_hygiene:
  extends: .python_setup
  stage: security
  script:
    - python -m pytest -q tests/test_public_contract.py -k private_material
