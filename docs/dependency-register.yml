# Dependency register for the curiosity.workstation collection.
#
# One row per external tool the role installs and one per external host it
# reaches. scripts/check_dependency_register.py compares this file with the
# role (every application contract and every host found by
# scripts/external_sources.py needs a row, and rows for things the role no
# longer uses are errors) and validates the fields. See docs/dependency-lifecycle.md
# for how to review it and what to do about an abandoned or at-risk entry.
#
# installer_types supplies defaults that a tool row inherits when it does not
# set the field itself.
schema: curiosity.workstation.dependency-register/v1
reviewed: '2026-11-04'
installer_types:
  github-archive:
    update_channel: GitHub Releases (latest); SHA-256 asset digest checked
    verification: github-asset-digest
    fallback: Pin the previous release in the role variables, or install from the distro package or source.
    criticality: standard
    status: active
  github-binary:
    update_channel: GitHub Releases (latest); SHA-256 asset digest checked
    verification: github-asset-digest
    fallback: Pin the previous release in the role variables, or install from the distro package or source.
    criticality: standard
    status: active
